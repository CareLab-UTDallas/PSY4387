<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cognitive Vocabulary Builder</title>
<style>
  :root{
    --bg:#faf9f7; --ink:#1f1e1c; --muted:#6b6862; --line:#e7e4de;
    --panel:#ffffff; --panel-shadow:0 1px 2px rgba(28,27,25,.04),0 6px 20px rgba(28,27,25,.05);
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --do-bg:#f3f1ec; --do-ink:#57544e;
    --correct-bg:#eef5ee; --correct-line:#bcd6bd; --correct-ink:#3c6b3e;
    --wrong-bg:#fbecec; --wrong-line:#e3b9b9; --wrong-ink:#a23b34;
    --amber-bg:#fffbef; --amber-line:#e7c98a; --amber-ink:#8a6d2f;
    --focus:#2f6f4f; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 20px 60px;}

  .masthead{padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .masthead h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em;}
  .masthead .sub{margin:6px 0 0;color:var(--ink);font-size:14.5px;max-width:70ch;}

  .progress{display:flex;align-items:center;gap:10px;margin:2px 0 16px;}
  .pbar{flex:1 1 auto;height:6px;border-radius:3px;background:var(--line);overflow:hidden;}
  .pbar span{display:block;height:100%;background:var(--accent);width:0;transition:width .25s;}
  .pcount{font-size:12.5px;color:var(--muted);flex:0 0 auto;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--panel-shadow);padding:22px 24px;}
  .qtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px;}
  .qtop .qn{font-size:13px;color:var(--muted);}
  .qtop .term-tag{font-size:12px;color:var(--muted);background:#eceae4;border-radius:7px;padding:4px 10px;}
  .qprompt{font-size:17px;font-weight:600;margin:2px 0 6px;line-height:1.4;}
  .do{background:var(--do-bg);color:var(--do-ink);border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.5;margin:10px 0 16px;}
  .do b{color:var(--ink);}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;font-size:14.5px;
    line-height:1.5;cursor:pointer;transition:border-color .12s,background .12s;color:var(--ink);}
  .opt:hover:not(:disabled){border-color:#cfc9bf;}
  .opt:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:15px;}
  .opt .mark{flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center;margin-left:auto;}
  .opt:disabled{cursor:default;}
  .opt.correct{background:var(--correct-bg);border-color:var(--correct-line);}
  .opt.correct .k{color:var(--correct-ink);}
  .opt.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .opt.wrong .k{color:var(--wrong-ink);}
  .opt.dim{opacity:.6;}

  .verdict{margin:16px 0 0;font-size:14.5px;font-weight:600;}
  .verdict.ok{color:var(--correct-ink);}
  .verdict.no{color:var(--wrong-ink);}
  .explain{margin:8px 0 0;font-size:14px;color:#44413b;line-height:1.6;}
  .explain .src{color:var(--muted);font-size:12.5px;margin-top:6px;}

  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;}
  .hintbtn{background:none;border:none;color:var(--accent-ink);font:inherit;font-size:13.5px;cursor:pointer;text-decoration:underline;padding:0;}
  .hintbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .hintbox{margin-top:12px;background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);
    border-radius:10px;padding:10px 13px;font-size:13.5px;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;
    border-radius:10px;padding:11px 19px;font-size:14.5px;font-weight:600;cursor:pointer;}
  .btn:hover{filter:brightness(1.05);}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  /* results */
  .results h2{margin:0 0 4px;font-size:20px;}
  .results .score{font-size:16px;margin:0 0 4px;}
  .results .score b{color:var(--accent-ink);}
  .results .breakdown{margin:16px 0 0;border-top:1px solid var(--line);padding-top:14px;}
  .results .brow{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 0;border-bottom:1px solid #f0eee9;}
  .results .brow:last-child{border-bottom:none;}
  .results .bi{flex:0 0 auto;margin-top:1px;}
  .results .bt{flex:1 1 auto;}
  .results .bt .bterm{font-weight:600;}
  .results .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .selfnote{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.55;}

  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Cognitive Vocabulary Builder</h1>
    <p class="sub">Eleven items on the core Module 4 terms, built to move each one from recognition to fluency. Cognitive terms are easy to recognize but hard to produce from memory, which is the gap this builder closes. Pick an answer to see whether it's right and why.</p>
  </div>

  <div class="progress" aria-hidden="true">
    <div class="pbar"><span id="pbarfill"></span></div>
    <div class="pcount" id="pcount"></div>
  </div>

  <section class="panel" id="qpanel" aria-live="polite"></section>

  <section class="panel results hidden" id="resultsPanel"></section>
</div>

<script>
// ===========================================================================
// Cognitive vocabulary builder (Module 4).
// Correct-answer definitions and explanations are drawn from the Module 4
// reading's IN PLAIN LANGUAGE glossary boxes and body text (ug-module-readings.md):
// information processing, automatic/intermediate/core beliefs, cognitive distortion,
// attentional/interpretation bias, cognitive restructuring, behavioral
// experiments, behavioral activation, exposure. Distractors are common
// misconceptions the reading warns against (positive thinking, erasing fear
// memories, "wait to feel like it", replacing thoughts with cheerful ones).
// Self-scored: the score covers only these machine-checkable items. No open
// responses are graded here.
// ===========================================================================

var QUIZ = [
  {
    term: "Information processing",
    prompt: "The 'information processing' view of the mind is best summarized as:",
    options: [
      { id:"a", text:"The mind takes in information, transforms it, stores it, and retrieves it, and this whole chain can become biased in consistent ways" },
      { id:"b", text:"The mind is a blank slate that simply records events as they happen" },
      { id:"c", text:"Thinking positively enough will overwrite any negative input" },
      { id:"d", text:"Emotions, not thoughts, decide what a person notices and remembers" }
    ],
    correct:"a",
    explain:"Information processing is the idea that the mind notices, interprets, stores, and retrieves information, and that this chain can become biased. If someone reliably notices threats, reads uncertainty as bad, and remembers failures, their inner world feels dangerous even when circumstances are ordinary. Because processing can be examined and practiced, it can be changed back.",
    hint:"Think 'takes in, transforms, stores, retrieves', and can go biased.",
    src:"Module 4, Information processing"
  },
  {
    term: "Automatic thought",
    prompt: "Which best describes an automatic thought?",
    options: [
      { id:"a", text:"A deep, absolute conviction about the self formed early in life" },
      { id:"b", text:"A quick, involuntary interpretation that pops up in response to a situation and is often accepted as fact" },
      { id:"c", text:"A deliberate, effortful plan for how to respond to a problem" },
      { id:"d", text:"An if-then rule you use to navigate the world" }
    ],
    correct:"b",
    explain:"Automatic thoughts are the fast, brief, in-the-moment interpretations that arrive on their own ('everyone can tell I'm nervous'). Because they feel like facts, most people never pause to check them, which is exactly why catching and examining them is such a powerful first skill.",
    hint:"Surface layer, fast, feels like a fact.",
    src:"Module 4, Automatic thought"
  },
  {
    term: "Intermediate belief",
    prompt: "Intermediate beliefs most often take which shape?",
    options: [
      { id:"a", text:"Absolute global statements like 'I am unlovable'" },
      { id:"b", text:"Fleeting images with no words attached" },
      { id:"c", text:"'If-then' or 'I must' rules, like 'If I show weakness, people will reject me'" },
      { id:"d", text:"Neutral observations about what is happening right now" }
    ],
    correct:"c",
    explain:"Intermediate beliefs are the rules, attitudes, and assumptions between core beliefs and moment-to-moment thoughts, usually in an if-then or 'I must' shape. They feel like reasonable strategies for staying safe, but they set the traps that automatic thoughts spring.",
    hint:"The middle layer, phrased as a rule.",
    src:"Module 4, Intermediate belief"
  },
  {
    term: "Core belief",
    prompt: "A core belief (schema) is:",
    options: [
      { id:"a", text:"A deep, absolute conviction about the self, others, or the world, treated as simply true" },
      { id:"b", text:"A situation-specific thought that changes day to day" },
      { id:"c", text:"A coping skill taught late in therapy" },
      { id:"d", text:"A temporary mood that passes within minutes" }
    ],
    correct:"a",
    explain:"Core beliefs are the bedrock schemas ('I am defective,' 'others will always let me down') from which intermediate beliefs and automatic thoughts grow. They usually form early, feel like facts, and are stubborn because the person's whole way of noticing and remembering is organized to confirm them. Changing one takes repeated, vivid, contradicting experience.",
    hint:"The bedrock layer, absolute and self-defining.",
    src:"Module 4, Core belief"
  },
  {
    term: "Cognitive distortion",
    prompt: "In careful cognitive work, the goal of naming a distortion is to:",
    options: [
      { id:"a", text:"Prove the person's thinking is irrational and replace it with a cheerful opposite" },
      { id:"b", text:"Label the person's feelings as wrong" },
      { id:"c", text:"Notice a familiar biased shape so the person can pause and ask whether a fairer, more accurate reading is available" },
      { id:"d", text:"Diagnose which disorder the person has" }
    ],
    correct:"c",
    explain:"A cognitive distortion is a habitual, biased way of interpreting events that makes a situation seem worse than the evidence supports. Everyone uses them, especially when tired or stressed. The aim is never to scold thinking as 'wrong' but to help the person notice the shape and reach for a fairer, more accurate reading, which is sometimes still somewhat negative.",
    hint:"The aim is accuracy, not cheerfulness or labeling.",
    src:"Module 4, Cognitive distortion"
  },
  {
    term: "Attentional bias",
    prompt: "A health-anxious person keeps scanning their body for every twinge and notices each one instantly. This is an example of:",
    options: [
      { id:"a", text:"Interpretation bias" },
      { id:"b", text:"Attentional bias" },
      { id:"c", text:"Behavioral activation" },
      { id:"d", text:"A core belief" }
    ],
    correct:"b",
    explain:"An attentional bias is the automatic tendency to notice and focus on certain information more than others, fast and without intention. It quietly controls the evidence a person collects. If attention keeps delivering threats and skipping reassurance, the world feels dangerous no matter how safe it is, and the person honestly believes they are just 'seeing what's there.'",
    hint:"About what the mind selects to notice in the first place.",
    src:"Module 4, Attentional bias"
  },
  {
    term: "Interpretation bias",
    prompt: "An unanswered text is read as 'they're ignoring me' rather than 'they're busy.' This is:",
    options: [
      { id:"a", text:"Interpretation bias, resolving an ambiguous event in a negative direction" },
      { id:"b", text:"Attentional bias, noticing the phone at all" },
      { id:"c", text:"A behavioral experiment" },
      { id:"d", text:"Exposure" }
    ],
    correct:"a",
    explain:"An interpretation bias is the tendency to resolve unclear situations in a consistently negative or threatening direction. The situation is genuinely open to several readings; the bias is the habit of reaching for the alarming one first and treating it as obvious.",
    hint:"About how ambiguous events get resolved.",
    src:"Module 4, Interpretation bias"
  },
  {
    term: "Cognitive restructuring",
    prompt: "Cognitive restructuring is best described as:",
    options: [
      { id:"a", text:"Replacing negative thoughts with positive ones" },
      { id:"b", text:"Identifying a distressing thought, examining the actual evidence for and against it, and building a more balanced and accurate view" },
      { id:"c", text:"Deliberately facing a feared situation until the fear fades" },
      { id:"d", text:"Scheduling rewarding activities before motivation returns" }
    ],
    correct:"b",
    explain:"Cognitive restructuring examines the evidence for and against a distressing thought and works out a fairer, more accurate reading, which sometimes is still somewhat negative but far more realistic and manageable. The person does the examining themselves, guided by the therapist's questions, so they build the skill of doing it alone.",
    hint:"Weigh the evidence, land on a fair thought, not a cheerful one.",
    src:"Module 4, Cognitive restructuring"
  },
  {
    term: "Behavioral experiments",
    prompt: "Why are behavioral experiments often more powerful than talking a belief through?",
    options: [
      { id:"a", text:"They prove the person wrong and force a happy ending" },
      { id:"b", text:"They produce vivid, lived evidence that lands in the emotional part of the mind, not just the reasoning part" },
      { id:"c", text:"They avoid the feared situation, which lowers distress" },
      { id:"d", text:"They replace the need for any relationship with the therapist" }
    ],
    correct:"b",
    explain:"Behavioral experiments are planned real-world tests of a specific prediction. Because the evidence is lived rather than discussed, it is far more convincing and forces new information into the self-perpetuating cycle. The deeper lesson is often 'I can handle it even when something uncomfortable happens,' not 'nothing bad ever happens.'",
    hint:"Lived data beats debate for closing the head-gut gap.",
    src:"Module 4, Behavioral experiments; Closing the Head-Gut Gap"
  },
  {
    term: "Behavioral activation",
    prompt: "The phrase that captures behavioral activation is:",
    options: [
      { id:"a", text:"Wait until you feel like it, then act" },
      { id:"b", text:"Action before motivation" },
      { id:"c", text:"Think your way out of the low mood first" },
      { id:"d", text:"Avoid what feels overwhelming until energy returns" }
    ],
    correct:"b",
    explain:"Behavioral activation helps a depressed person re-engage with rewarding or necessary activities before motivation returns, because motivation tends to follow the behavior. Scheduling small, achievable actions feeds the person the positive experiences depression had starved them of, and the downward spiral starts to run in reverse. It is often gentler to start with than heavy cognitive work.",
    hint:"Act first, and the feeling follows.",
    src:"Module 4, Behavioral activation"
  },
  {
    term: "Exposure",
    prompt: "According to current thinking in the reading, exposure reduces fear mainly by:",
    options: [
      { id:"a", text:"Erasing the original fear memory completely" },
      { id:"b", text:"Letting anxiety 'burn off' because the body cannot stay aroused forever" },
      { id:"c", text:"Building new learning ('I approached this and I was okay') that competes with the old fear memory" },
      { id:"d", text:"Distracting the person until the feared situation ends" }
    ],
    correct:"c",
    explain:"Exposure is deliberately, gradually facing what is feared and staying long enough to learn something new. Current thinking emphasizes new learning that competes with the old fear rather than erasing it, so the most durable exposure maximizes surprise, drops safety crutches, and varies situations so the new learning generalizes.",
    hint:"New competing learning, not erasure or 'burning off.'",
    src:"Module 4, Exposure"
  }
];

var idx = 0;
var answered = [];   // chosen id or null
var hintShown = {};

function el(t,c,h){var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

var CHECK='<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#3c6b3e" stroke-width="1.4"/><path d="M6.4 10.2l2.3 2.3 4.7-4.9" stroke="#3c6b3e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var CROSS='<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#a23b34" stroke-width="1.4"/><path d="M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6" stroke="#a23b34" stroke-width="1.6" stroke-linecap="round"/></svg>';

function init(){ answered = QUIZ.map(function(){return null;}); renderProgress(); renderQuestion(); }

function renderProgress(){
  var pct = (idx) / QUIZ.length * 100;
  document.getElementById("pbarfill").style.width = pct + "%";
  document.getElementById("pcount").textContent = "Question " + Math.min(idx+1,QUIZ.length) + " of " + QUIZ.length;
}

function renderQuestion(){
  renderProgress();
  var q = QUIZ[idx];
  var panel = document.getElementById("qpanel");
  panel.innerHTML = "";
  var chosen = answered[idx];
  var isAnswered = chosen !== null;

  var top = el("div","qtop");
  top.appendChild(el("span","qn","Question " + (idx+1) + " of " + QUIZ.length));
  top.appendChild(el("span","term-tag", esc(q.term)));
  panel.appendChild(top);

  panel.appendChild(el("p","qprompt", esc(q.prompt)));
  panel.appendChild(el("div","do","<b>Do this:</b> Choose the option that reflects the reading's meaning of the term rather than a familiar word. You'll see whether it's right and why before moving on."));

  var opts = el("div","options");
  q.options.forEach(function(o){
    var cls="opt";
    if(isAnswered){
      if(o.id===q.correct) cls+=" correct";
      else if(o.id===chosen) cls+=" wrong";
      else cls+=" dim";
    }
    var b = el("button",cls);
    b.type="button";
    if(isAnswered) b.disabled=true;
    var mark="";
    if(isAnswered && o.id===q.correct) mark=CHECK;
    else if(isAnswered && o.id===chosen) mark=CROSS;
    b.innerHTML='<span class="k">'+o.id.toUpperCase()+'.</span><span class="txt">'+esc(o.text)+'</span><span class="mark">'+mark+'</span>';
    if(!isAnswered) b.addEventListener("click",function(){ choose(o.id); });
    opts.appendChild(b);
  });
  panel.appendChild(opts);

  if(!isAnswered){
    var foot = el("div","foot");
    var hb = el("button","hintbtn", hintShown[idx] ? "Hide hint" : "Show a hint");
    hb.addEventListener("click", function(){ hintShown[idx]=!hintShown[idx]; renderQuestion(); });
    foot.appendChild(hb);
    foot.appendChild(el("span","",""));
    panel.appendChild(foot);
    if(hintShown[idx]) panel.appendChild(el("div","hintbox", esc(q.hint)));
  } else {
    var right = chosen===q.correct;
    panel.appendChild(el("p","verdict "+(right?"ok":"no"), right ? "Correct." : "Not quite."));
    var ex = el("p","explain", esc(q.explain));
    ex.innerHTML += '<div class="src">Reading: ' + esc(q.src) + '</div>';
    panel.appendChild(ex);

    var foot = el("div","foot");
    foot.appendChild(el("span","",""));
    var last = idx===QUIZ.length-1;
    var nb = el("button","btn");
    nb.innerHTML = last ? 'See your results' : 'Next question <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M4 10h11M11 6l4 4-4 4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    nb.addEventListener("click", function(){
      if(last){ finish(); } else { idx++; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
    });
    foot.appendChild(nb);
    panel.appendChild(foot);
  }
}

function choose(id){
  if(answered[idx]!==null) return;
  answered[idx]=id;
  renderQuestion();
}

function finish(){
  document.getElementById("pbarfill").style.width = "100%";
  document.getElementById("pcount").textContent = "Complete";
  document.getElementById("qpanel").classList.add("hidden");
  var correct = answered.filter(function(a,i){return a===QUIZ[i].correct;}).length;

  var rp = document.getElementById("resultsPanel");
  rp.classList.remove("hidden");
  rp.innerHTML="";
  rp.appendChild(el("h2",null,"Your results"));
  rp.appendChild(el("p","score","You answered <b>"+correct+" of "+QUIZ.length+"</b> correctly."));

  var bd = el("div","breakdown");
  QUIZ.forEach(function(q,i){
    var right = answered[i]===q.correct;
    var row = el("div","brow");
    row.innerHTML = '<span class="bi">'+(right?CHECK:CROSS)+'</span>' +
      '<span class="bt"><span class="bterm">'+esc(q.term)+'</span>'+(right?'':' (revisit in the reading: '+esc(q.src)+')')+'</span>';
    bd.appendChild(row);
  });
  rp.appendChild(bd);

  var act = el("div","actions");
  var again = el("button","btn secondary","Build again");
  again.addEventListener("click", function(){ idx=0; answered=QUIZ.map(function(){return null;}); hintShown={};
    document.getElementById("qpanel").classList.remove("hidden"); rp.classList.add("hidden"); renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); });
  act.appendChild(again);
  rp.appendChild(act);

  rp.appendChild(el("p","selfnote","This builder scores only these items, and your score is not saved or sent anywhere. Terms you missed are the ones to produce from memory next time. Recognizing a definition is easier than generating one, and working through these shows you which is which."));
  window.scrollTo({top:0,behavior:"smooth"});
}

init();
</script>
</body>
</html>
