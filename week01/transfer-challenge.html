<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer Challenge — Tracing the Tradition</title>
<style>
  :root{
    --bg:#faf9f7; --ink:#1f1e1c; --muted:#6b6862; --line:#e7e4de; --line2:#eceae4;
    --panel:#ffffff; --panel-shadow:0 1px 2px rgba(28,27,25,.04),0 6px 20px rgba(28,27,25,.05);
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --level-bg:#fbe7e0; --level-ink:#b0472a;
    --do-bg:#f3f1ec; --do-ink:#57544e;
    --correct-bg:#eef5ee; --correct-line:#bcd6bd; --correct-ink:#3c6b3e;
    --wrong-bg:#fbecec; --wrong-line:#e3b9b9; --wrong-ink:#a23b34;
    --sel-line:#c9d3c2;
    --focus:#2f6f4f; --radius:16px; --r-sm:11px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55;}
  .wrap{max-width:920px;margin:0 auto;padding:24px 20px 60px;}

  .head{display:flex;align-items:flex-start;gap:14px;margin-bottom:8px;}
  .back-ic{flex:0 0 auto;margin-top:4px;opacity:.6;}
  .head h1{margin:0;font-size:24px;letter-spacing:-.01em;font-weight:700;}
  .tabrow{display:flex;flex-wrap:wrap;gap:16px;margin:10px 0 22px;padding-left:38px;font-size:14px;}
  .lvl{background:var(--level-bg);color:var(--level-ink);font-weight:700;border-radius:8px;padding:4px 12px;}
  .tabrow .t{color:var(--muted);padding:4px 0;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--panel-shadow);padding:22px 24px;margin-bottom:20px;}
  .panel h2{margin:0 0 14px;font-size:17px;font-weight:700;}
  .panel p{margin:0 0 14px;font-size:15.5px;line-height:1.6;}
  .panel p:last-child{margin-bottom:0;}
  .scenario p.quote{color:#3a3833;}

  .qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;}
  .qhead h2{margin:0;font-size:17px;font-weight:700;}
  .qtype{flex:0 0 auto;font-size:12.5px;color:var(--muted);background:#eceae4;border-radius:7px;padding:5px 10px;}
  .qprompt{font-size:15.5px;margin:0 0 14px;line-height:1.55;}

  .do{background:var(--do-bg);color:var(--do-ink);border-radius:10px;padding:11px 14px;font-size:13.5px;line-height:1.5;margin-bottom:18px;}
  .do b{color:var(--ink);font-weight:700;}

  .options{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    font:inherit;font-size:15px;line-height:1.5;cursor:pointer;transition:border-color .12s,background .12s;color:var(--ink);}
  .opt:hover:not(:disabled){border-color:#cfc9bf;}
  .opt:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:14px;}
  .opt .txt{flex:1 1 auto;}
  .opt .mark{flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center;}
  .opt:disabled{cursor:default;}
  /* answered states */
  .opt.correct{background:var(--correct-bg);border-color:var(--correct-line);}
  .opt.correct .k{color:var(--correct-ink);}
  .opt.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .opt.wrong .k{color:var(--wrong-ink);}
  .opt.dim{opacity:.62;}

  .verdict{margin:16px 0 0;font-size:15px;font-weight:600;}
  .verdict.ok{color:var(--correct-ink);}
  .verdict.no{color:var(--wrong-ink);}
  .explain{margin:8px 0 0;font-size:14.5px;color:#44413b;line-height:1.6;}

  .qfoot{display:flex;justify-content:flex-end;margin-top:20px;}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:#fff;border:none;
    border-radius:10px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;transition:.12s;}
  .btn:hover{filter:brightness(1.05);}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .results h2{display:flex;align-items:center;gap:9px;}
  .results .score{font-size:15.5px;margin:0;}
  .ea-sub{color:var(--muted);font-size:14px;margin:-6px 0 14px;}
  .book{flex:0 0 auto;opacity:.7;}

  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
  @media(max-width:560px){ .wrap{padding:18px 14px 44px;} .tabrow{padding-left:0;} .head h1{font-size:20px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <svg class="back-ic" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12 5l-5 5 5 5" stroke="#1f1e1c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1 id="title"></h1>
  </div>
  <div class="tabrow" id="tabrow"></div>

  <!-- Scenario (persistent) -->
  <section class="panel scenario" id="scenario"></section>

  <!-- Question area -->
  <section class="panel" id="qpanel" aria-live="polite"></section>

  <!-- Results + Expert Analysis (hidden until finished) -->
  <section class="panel results hidden" id="resultsPanel"></section>
  <section class="panel hidden" id="eaPanel"></section>
</div>

<script>
// ===========================================================================
// Transfer Challenge — "Tracing the Tradition"
// Scenario, questions, options, correct answers, and Expert Analysis are
// VERBATIM from the instructor screenshots. Answers are not stored anywhere.
// Verified (for fidelity of reproduced Expert Analysis): object-relations lineage
// through Fairbairn/Winnicott and Bowlby's attachment theory / internal working
// models; behavioral negative-reinforcement account; DBT as evidence-based here.
// ===========================================================================

const CHALLENGE = {
  title: "Tracing the Tradition",
  level: "Level 3: Apply",
  tabs: ["Clinical Reasoning", "Mechanisms of Change", "Treatment Selection"],

  scenario: {
    heading: "Clinical Scenario",
    paras: [
      "During group supervision, Dr. Martinez presents the case of Sofia, a 19-year-old college student, for discussion. Sofia presents with intense fear of abandonment, unstable relationships, and recurrent self-harm whenever she perceives that a significant person is pulling away from her. Dr. Martinez describes his formulation as follows:",
      "'Sofia's difficulties trace to early attachment disruptions — a mother who was emotionally unpredictable and a father whose approval was conditional on achievement. These experiences generated internal working models that represent close relationships as inherently unreliable. Unconsciously, Sofia enters every significant relationship expecting abandonment, and her behavior — the testing, the self-harm at moments of perceived rejection — is organized around forestalling what she believes is inevitable. The self-harm serves a communicative function: it signals distress in a way that historically brought caregivers close. Treatment will use the therapeutic relationship as a corrective emotional experience, making the unconscious relational pattern conscious through here-and-now material from our sessions.'",
      "A second supervisor listening to the presentation offers a different framing: 'What you are describing is a conditioned avoidance pattern. The self-harm is negatively reinforced because it reduces intolerable emotional arousal. Early experiences established the conditioned stimuli. Treatment should focus on extinction and distress-tolerance skills.'"
    ]
  },

  doThis: "Pick the single best option, choosing based on the reasoning it reflects — not just a familiar phrase. After you answer, read whether you were correct and why before advancing.",

  questions: [
    {
      id: "q1",
      prompt: "Dr. Martinez's formulation most clearly reflects which historical theoretical tradition?",
      options: [
        { id: "a", text: "Behavioral tradition — centering conditioning history and reinforcement contingencies" },
        { id: "b", text: "Psychodynamic tradition — centering unconscious processes, internal representations, and early relational experience" },
        { id: "c", text: "Cognitive tradition — centering maladaptive automatic thoughts and schema-driven information processing" },
        { id: "d", text: "Humanistic tradition — centering the self-concept and conditions of worth that block authentic experience" }
      ],
      correct: "b",
      explanation: "Dr. Martinez's formulation centers unconscious processes, internal working models formed in early relational experience, and the use of the therapeutic relationship as a corrective emotional experience — the defining markers of the psychodynamic (object-relations) tradition."
    },
    {
      id: "q2",
      prompt: "According to Dr. Martinez's formulation, what is the PRIMARY vehicle through which therapeutic change is expected to occur?",
      options: [
        { id: "a", text: "Extinction of conditioned emotional responses through non-reinforced exposure to feared relational cues" },
        { id: "b", text: "Modification of Sofia's maladaptive schema about abandonment through Socratic questioning and behavioral experiments" },
        { id: "c", text: "The therapeutic relationship as a corrective emotional experience that provides new relational data contradicting the internal working model" },
        { id: "d", text: "Activation of Sofia's self-actualizing tendency through unconditional positive regard and genuine empathic understanding" }
      ],
      correct: "c",
      explanation: "In Dr. Martinez's psychodynamic formulation, change is expected to occur through the therapeutic relationship functioning as a corrective emotional experience — the therapist behaves differently from the early caregivers, providing new relational data that disconfirms Sofia's unconscious expectation of abandonment."
    },
    {
      id: "q3",
      prompt: "The second supervisor's reframing of Sofia's self-harm as 'negatively reinforced because it reduces intolerable emotional arousal' comes from which tradition, and what does this framing imply about treatment?",
      options: [
        { id: "a", text: "Systemic tradition — it implies treatment must involve Sofia's family to change the interaction patterns that elicit self-harm" },
        { id: "b", text: "Humanistic tradition — it implies treatment must increase Sofia's self-acceptance to reduce the intolerable emotional states that precede self-harm" },
        { id: "c", text: "Behavioral tradition — it implies treatment should target the reinforcement contingency directly, using distress-tolerance skills to interrupt the self-harm–relief cycle" },
        { id: "d", text: "Cognitive tradition — it implies treatment should identify the automatic thoughts that trigger emotional dysregulation before the self-harm episode" }
      ],
      correct: "c",
      explanation: "The second supervisor explains the self-harm by its reinforcement function — negative reinforcement through removal of intolerable arousal — which is the behavioral tradition. The treatment implication is to target that contingency directly with distress-tolerance skills that interrupt the self-harm–relief cycle."
    }
  ],

  expertAnalysis: {
    heading: "Expert Analysis",
    subhead: "Model answer and clinical reasoning walkthrough",
    paras: [
      "This case illustrates how the same clinical presentation generates fundamentally different formulations depending on the theoretical tradition applied — and how those formulations specify entirely different mechanisms and treatment vehicles.",
      "Dr. Martinez's formulation carries the hallmarks of the psychodynamic tradition: (1) explanatory priority is given to unconscious processes and early relational experience; (2) current symptoms are understood as expressions of internalized relational templates (object relations/internal working models) formed in early development; (3) the vehicle for change is the therapeutic relationship itself — the 'corrective emotional experience' in which the therapist behaves differently from the early caregivers, allowing new relational data to disconfirm the patient's unconscious expectations. This is object-relations influenced psychodynamic thinking, which traces directly from Fairbairn, Winnicott, and later Bowlby's attachment theory.",
      "The second supervisor's framing reflects the behavioral tradition: the self-harm is explained by its reinforcement function (negative reinforcement — removal of intolerable arousal), and the treatment implication is to target that contingency rather than its unconscious meaning. DBT, which is the evidence-based treatment for this presentation, integrates behavioral principles (contingency management, skills training) with validation strategies — its treatment mechanism is explicitly behavioral, not relational in the psychodynamic sense.",
      "Students tracing a formulation's theoretical home should identify three markers: (1) what explains the origin of symptoms (conditioning history vs. early relational experience vs. maladaptive cognition vs. organismic need); (2) what maintains them (reinforcement contingency vs. unconscious representation vs. schema-driven processing vs. incongruence); and (3) what produces change (extinction/skill vs. corrective relational experience vs. cognitive modification vs. self-actualization). Matching each of these markers to the formulation identifies the tradition unambiguously."
    ]
  }
};

var idx = 0;            // current question index
var answered = [];      // answered[i] = chosen option id or null
var correctCount = 0;

function el(t,c,h){var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

var CHECK = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#3c6b3e" stroke-width="1.4"/><path d="M6.4 10.2l2.3 2.3 4.7-4.9" stroke="#3c6b3e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var CROSS = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#a23b34" stroke-width="1.4"/><path d="M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6" stroke="#a23b34" stroke-width="1.6" stroke-linecap="round"/></svg>';
var BOOK = '<svg class="book" width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 4.5h5.5c.8 0 1.5.7 1.5 1.5v9c0-.8-.7-1.5-1.5-1.5H3v-9Z" stroke="#6f6c66" stroke-width="1.3"/><path d="M17 4.5h-5.5c-.8 0-1.5.7-1.5 1.5v9c0-.8.7-1.5 1.5-1.5H17v-9Z" stroke="#6f6c66" stroke-width="1.3"/></svg>';

function renderStatic(){
  document.getElementById("title").textContent = CHALLENGE.title;
  var tr = document.getElementById("tabrow");
  tr.appendChild(el("span","lvl", esc(CHALLENGE.level)));
  CHALLENGE.tabs.forEach(function(t){ tr.appendChild(el("span","t", esc(t))); });

  var sc = document.getElementById("scenario");
  sc.appendChild(el("h2",null, esc(CHALLENGE.scenario.heading)));
  CHALLENGE.scenario.paras.forEach(function(p,i){
    sc.appendChild(el("p", i>0?"quote":null, esc(p)));
  });
  answered = CHALLENGE.questions.map(function(){ return null; });
}

function renderQuestion(){
  var q = CHALLENGE.questions[idx];
  var panel = document.getElementById("qpanel");
  panel.innerHTML = "";
  var chosen = answered[idx];
  var isAnswered = chosen !== null;

  var head = el("div","qhead");
  head.appendChild(el("h2",null,"Question " + (idx+1) + " of " + CHALLENGE.questions.length));
  head.appendChild(el("span","qtype","Multiple Choice"));
  panel.appendChild(head);

  panel.appendChild(el("p","qprompt", esc(q.prompt)));
  panel.appendChild(el("div","do","<b>Do this:</b> " + esc(CHALLENGE.doThis)));

  var opts = el("div","options");
  q.options.forEach(function(o){
    var cls = "opt";
    if(isAnswered){
      if(o.id === q.correct) cls += " correct";
      else if(o.id === chosen) cls += " wrong";
      else cls += " dim";
    }
    var btn = el("button", cls);
    btn.type = "button";
    if(isAnswered) btn.disabled = true;
    var mark = "";
    if(isAnswered && o.id === q.correct) mark = CHECK;
    else if(isAnswered && o.id === chosen) mark = CROSS;
    btn.innerHTML = '<span class="k">'+o.id.toUpperCase()+'.</span>' +
                    '<span class="txt">'+esc(o.text)+'</span>' +
                    '<span class="mark">'+mark+'</span>';
    if(!isAnswered){
      btn.addEventListener("click", function(){ choose(o.id); });
    }
    opts.appendChild(btn);
  });
  panel.appendChild(opts);

  if(isAnswered){
    var right = chosen === q.correct;
    if(right){
      panel.appendChild(el("p","verdict ok","Correct!"));
    } else {
      var correctText = "";
      q.options.forEach(function(o){ if(o.id===q.correct) correctText = o.text; });
      panel.appendChild(el("p","verdict no","Incorrect. The correct answer is: " + esc(correctText)));
    }
    panel.appendChild(el("p","explain", esc(q.explanation)));

    var foot = el("div","qfoot");
    var last = idx === CHALLENGE.questions.length - 1;
    var b = el("button","btn");
    if(last){
      b.innerHTML = 'View Expert Analysis ' + BOOK.replace('class="book" ','');
      b.addEventListener("click", finish);
    } else {
      b.innerHTML = 'Next Question <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M4 10h11M11 6l4 4-4 4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      b.addEventListener("click", function(){ idx++; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); });
    }
    foot.appendChild(b);
    panel.appendChild(foot);
  }
}

function choose(optId){
  if(answered[idx] !== null) return;
  answered[idx] = optId;
  if(optId === CHALLENGE.questions[idx].correct) correctCount++;
  renderQuestion();
}

function finish(){
  document.getElementById("qpanel").classList.add("hidden");

  var rp = document.getElementById("resultsPanel");
  rp.classList.remove("hidden");
  rp.innerHTML = "";
  rp.appendChild(el("h2",null, BOOK + "<span>Your Results</span>"));
  rp.appendChild(el("p","score","Multiple Choice: " + correctCount + " / " + CHALLENGE.questions.length + " correct"));

  var ea = document.getElementById("eaPanel");
  ea.classList.remove("hidden");
  ea.innerHTML = "";
  ea.appendChild(el("h2",null, BOOK + "<span>" + esc(CHALLENGE.expertAnalysis.heading) + "</span>"));
  ea.appendChild(el("p","ea-sub", esc(CHALLENGE.expertAnalysis.subhead)));
  CHALLENGE.expertAnalysis.paras.forEach(function(p){ ea.appendChild(el("p",null, esc(p))); });

  window.scrollTo({top:0,behavior:"smooth"});
}

renderStatic();
renderQuestion();
</script>
</body>
</html>
