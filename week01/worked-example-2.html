
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worked Example — Behavioral Activation</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f7f6f4; --ink:#1f1e1c; --muted:#6f6c66;
    --line:#e7e4de; --line2:#eceae4;
    --clinician-bubble:#efe7e0; --patient-bubble:#eceae7;
    --amber-bg:#fffbef; --amber-line:#e7c98a; --amber-ink:#8a6d2f;
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --instr-bg:#eef3fb; --instr-line:#c9d9f0; --instr-ink:#2f4a72;
    --tab-active:#8a5a25;
    --chip-bg:#e9e7e2; --chip-ink:#4a4740;
    --field:#ffffff; --focus:#2f6f4f;
    --ok-bg:#eef5ee; --ok-line:#bcd6bd; --ok-ink:#3c5c3e;
    --radius:16px; --r-sm:11px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:940px;margin:0 auto;padding:22px 18px 60px;}

  /* Stage tabs */
  .stagebar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .stage-tab{display:flex;align-items:center;gap:10px;border:1px solid var(--line);
    background:#fff;color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer;
    font-size:14.5px;transition:.15s;}
  .stage-tab .n{color:var(--muted);}
  .stage-tab[aria-selected="true"]{background:var(--tab-active);border-color:var(--tab-active);color:#fff;}
  .stage-tab[aria-selected="true"] .n{color:#f0dcc6;}
  .stage-tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .arrow{color:var(--muted);}
  .progress{display:flex;gap:5px;margin-left:auto;align-items:center;}
  .pdot{width:26px;height:6px;border-radius:3px;background:var(--line);}
  .pdot.on{background:var(--accent);}

  /* Card shell */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px 24px 26px;}
  h2.sess{margin:0 0 6px;font-size:22px;letter-spacing:-.01em;}
  .sess-blurb{margin:0 0 14px;color:var(--muted);font-size:15px;max-width:70ch;}
  .metarow{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:8px;}
  .metaline{font-size:13.5px;margin:5px 0;padding:6px 10px;border-radius:8px;display:inline-block;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4;}
  .metaline.mech{background:#fdf3e7;color:#8a5a25;}
  .metaline.intv{background:#eaf4ee;color:#3c5c3e;}
  .metaline b{font-weight:700;}
  .adaptbanner{background:#f1ecfa;border:1px solid #d9cdf0;color:#5b3c8a;border-radius:12px;padding:12px 15px;margin:14px 0 4px;font-size:13.5px;line-height:1.5;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .adaptbanner b{font-weight:700;}
  .adaptbanner .back{flex:0 0 auto;background:none;border:none;color:#5b3c8a;text-decoration:underline;cursor:pointer;font:inherit;font-size:13.5px;padding:0;}
  .adaptbanner .back:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .pchip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13px;}
  .pchip b{font-weight:600;}
  .scen{background:var(--chip-bg);color:var(--chip-ink);border-radius:8px;padding:5px 11px;font-size:13px;}
  .recafter{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13.5px;margin:6px 0 2px;}
  .recafter a{color:var(--accent);text-decoration:none;cursor:default;}

  /* Instruction box */
  .instr{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);
    border-radius:12px;padding:14px 16px;margin:16px 0 20px;font-size:14px;line-height:1.55;}
  .instr h3{margin:0 0 6px;font-size:14px;font-weight:700;}
  .instr b{font-weight:700;}
  .instr .done{font-weight:700;}

  /* Chat */
  .chat{display:flex;flex-direction:column;gap:16px;}
  .row{display:flex;gap:12px;}
  .row.cl{flex-direction:row-reverse;}
  .avatar{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#efe7df;
    display:grid;place-items:center;margin-top:20px;}
  .row.pt .avatar{background:#e9e9e6;}
  .stack{max-width:74%;display:flex;flex-direction:column;gap:8px;}
  .who{font-size:12.5px;color:var(--muted);}
  .row.cl .who{text-align:right;}
  .bubble{border-radius:14px;padding:13px 15px;font-size:15px;line-height:1.5;}
  .row.cl .bubble{background:var(--clinician-bubble);border-top-right-radius:5px;text-align:right;}
  .row.pt .bubble{background:var(--patient-bubble);border-top-left-radius:5px;}
  .tech{background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:10px;
    padding:10px 13px;font-size:13px;color:var(--amber-ink);line-height:1.5;text-align:left;}
  .tech b{color:var(--amber-ink);font-weight:700;}

  /* Toggle */
  .toggle{margin-top:24px;border-top:1px solid var(--line);padding-top:18px;}
  .toggle h4{margin:0 0 4px;font-size:15px;}
  .toggle p{margin:0 0 12px;color:var(--muted);font-size:13.5px;max-width:74ch;}
  .toggle-btns{display:flex;flex-wrap:wrap;gap:9px;}
  .tbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 15px;
    cursor:pointer;font-size:13.5px;color:var(--ink);transition:.15s;}
  .tbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
  .tbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .tbtn-link{border:none;background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:13.5px;padding:9px 6px;text-decoration:none;}
  .tbtn-link[aria-pressed="true"]{color:var(--ink);font-weight:600;}
  .tbtn-link:hover{color:var(--ink);}
  .tbtn-link:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  /* Stage 2 gaps */
  .gapwrap{display:flex;flex-direction:column;gap:8px;}
  .gap-ta{width:100%;min-height:82px;resize:vertical;border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;background:var(--field);
    border-top-right-radius:5px;}
  .gap-ta:focus{outline:none;border-color:var(--focus);}
  .gap-ta.locked{background:#f3f1ec;color:#55524c;}
  .submit{align-self:flex-end;background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:10px 18px;font-size:14px;cursor:pointer;}
  .submit:disabled{opacity:.5;cursor:default;}
  .submit:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .compare{display:flex;flex-direction:column;gap:10px;margin-top:2px;}
  .cmp-card{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;text-align:left;}
  .cmp-expert{background:var(--clinician-bubble);}
  .cmp-expert .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);font-weight:700;margin-bottom:4px;}
  .cmp-tech{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);}
  .cmp-tech b{font-weight:700;}
  .cmp-fb{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok-ink);}
  .cmp-fb .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:5px;}
  .cmp-fb p{margin:0 0 7px;}
  .cmp-fb .k{font-weight:700;}

  .status{font-size:13px;color:var(--muted);margin-top:14px;}
  .status b{color:var(--accent-ink);}
  .hidden{display:none !important;}
  .done-banner{margin-top:16px;background:var(--ok-bg);border:1px solid var(--ok-line);
    color:var(--ok-ink);border-radius:12px;padding:14px 16px;font-size:14.5px;}
  .done-banner b{font-weight:700;}

  .bottom-nav{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;justify-content:flex-end;}
  .bottom-nav.back{justify-content:flex-start;}
  .nav-btn{display:inline-flex;align-items:center;gap:9px;border:none;cursor:pointer;
    background:var(--accent);color:#fff;border-radius:10px;padding:12px 20px;font-size:15px;
    font-weight:600;transition:.15s;}
  .nav-btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .nav-btn:hover{filter:brightness(1.05);}
  .nav-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  @media(max-width:560px){
    .stack{max-width:86%;}
    .panel{padding:18px 15px 20px;}
    h2.sess{font-size:19px;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">

  <div class="stagebar">
    <button class="stage-tab" id="tab1" aria-selected="true" onclick="setStage(1)">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10Z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.3" stroke="currentColor" stroke-width="1.5"/></svg>
      <span><span class="n">Stage 1:</span> Learn from the Expert</span>
    </button>
    <span class="arrow">&rarr;</span>
    <button class="stage-tab" id="tab2" aria-selected="false" onclick="setStage(2)">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M4 14.5 13.5 5l2 2L6 16.5 3.5 17l.5-2.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span><span class="n">Stage 2:</span> Fill in the Gaps</span>
    </button>
    <span class="progress" id="progress" aria-hidden="true"><span class="pdot on"></span><span class="pdot" id="pdot2"></span></span>
  </div>

  <div class="panel">
    <h2 class="sess" id="sessTitle"></h2>
    <p class="sess-blurb" id="sessBlurb"></p>
    <div class="metarow">
      <span class="pchip" id="pchip"></span>
      <span class="scen" id="scen"></span>
    </div>
    <div class="metaline mech" id="metaMech"></div>
    <div class="metaline intv" id="metaIntv"></div>
    <div class="recafter" id="recafter"></div>

    <div class="adaptbanner hidden" id="adaptBanner"></div>

    <div class="instr" id="instr"></div>

    <div class="chat" id="chat"></div>

    <!-- Stage 1 patient toggle -->
    <div class="toggle hidden" id="toggle">
      <h4>Explore with a different patient</h4>
      <p>Same clinical situation, different patient. Every score, technique, and recommendation stays identical &mdash; only communication style adapts. Consider what you would change before clicking.</p>
      <div class="toggle-btns" id="toggleBtns"></div>
    </div>

    <div class="done-banner hidden" id="doneBanner"></div>
    <div class="status hidden" id="status"></div>

    <div class="bottom-nav hidden" id="bottomNav"></div>
  </div>
</div>

<script>
// ===========================================================================
// Worked Example 2 — Behavioral Activation for Depression (Activity Scheduling)
// Base transcript, technique annotations, and all three patient adaptations are
// VERBATIM from the instructor PDFs (WorkedExample2, Adolescent2, LowLiteracy2,
// OlderAdult2, Stage2_2). Techniques are held constant across adaptations;
// only communication style adapts (per the purple "AI-adapted for" banner).
// Stage 2 per-gap feedback grounded in the BA evidence base verified earlier
// (Martell/Dimidjian BA model; APA well-established designation; graded task
// assignment; implementation intentions).
// ===========================================================================

const SESSION = {
  title: "Behavioral Activation for Depression — Activity Scheduling",
  tag: "CBT Interventions",
  blurb: "A behavioral activation session targeting inactivity and withdrawal as maintenance mechanisms in major depressive disorder. Demonstrates activity monitoring, values-based scheduling, and graded task assignment.",
  recommendedAfter: ["Evidence-Based Treatments", "Emotional Processes"],
  // Extra header rows shown in this worked example (colored meta lines):
  metaMechanism: "Behavioral withdrawal / reduced positive reinforcement maintaining depressive symptoms",
  metaIntervention: "Behavioral activation with activity scheduling",

  // Gaps fall on these clinician-turn positions (0-based across clinician turns).
  // From Stage2_2.pdf: Identifying exceptions, Outside-in principle,
  // Graded task assignment, Collaborative scheduling.
  gapClinicianIndices: [1, 3, 4, 6],

  patients: {
    baseline: {
      label: "David, 42",
      chip: "Major depressive disorder with significant withdrawal from work, social activities, and self-care over the past four months",
      banner: null
    },
    adolescent: {
      label: "Jordan, 15",
      chip: "Major depressive disorder with significant withdrawal from school, friends, and daily routines over the past four months",
      banner: "Adolescent (14–16)"
    },
    literacy: {
      label: "Marcus, 38",
      chip: "Major depressive disorder with significant withdrawal from work, social activities, and self-care over the past four months",
      banner: "Limited literacy"
    },
    older: {
      label: "Mr. Thompson, 72",
      chip: "Major depressive disorder with significant withdrawal from community, family, and daily routines since retirement",
      banner: "Older adult (70+)"
    }
  },

  turns: [
    // C0 — Activity monitoring review
    { role: "clinician",
      technique: { label: "Activity monitoring review",
        text: "Activity monitoring review: Opens the session by reviewing homework data, reinforcing the behavioral model and collaborative empiricism. Activity monitoring is the foundation of BA — it provides the data that drives intervention." },
      text: {
        baseline:   "David, last week you tracked your daily activities and mood ratings. Let's look at what you found. What patterns did you notice?",
        adolescent: "Hey Jordan, last week you kept track of what you did each day and how you were feeling. Let's check out what you found. Did you notice any patterns or things that stood out to you?",
        literacy:   "Marcus, last week you wrote down what you did each day and how you felt. Can you tell me what you noticed?",
        older:      "Mr. Thompson, last week you kept a record of your daily routines and mood ratings. Let's take a moment to review your findings together. Over your many years, you may have noticed certain patterns in how your days unfold. What stood out to you this past week?"
      }
    },
    // P0
    { role: "patient",
      text: {
        baseline:   "I mostly just stayed in bed or watched TV. The days kind of blurred together. My mood was pretty low the whole time, maybe a 2 or 3 out of 10 most days.",
        adolescent: "I mostly just stayed in my room on my phone or watched videos. The days kind of blurred together. My mood was pretty low the whole time, maybe a 2 or 3 out of 10 most days.",
        literacy:   "I mostly stayed in bed or watched TV. All the days felt the same. My mood was low most days, like a 2 or 3 out of 10.",
        older:      "To be honest, I mostly stayed in bed or watched television. The days seemed to blend into each other. My mood was quite low most of the time, probably around a 2 or 3 out of 10 on most days."
      }
    },
    // C1 — Identifying exceptions  [GAP]
    { role: "clinician",
      technique: { label: "Identifying exceptions",
        text: "Identifying exceptions: Searches for naturally occurring mood lifts tied to activity changes. This is the empirical foundation for BA — demonstrating the activity-mood connection from the patient's own data." },
      text: {
        baseline:   "I appreciate you tracking that honestly. Now here's what I want us to look at together — were there any moments, even brief ones, where your mood bumped up even slightly?",
        adolescent: "Thanks for being real about that. Let's dig a little deeper — were there any times, even if it was just for a little while, when your mood went up, even a bit?",
        literacy:   "Thank you for being honest. Did you have any times, even short ones, when your mood went up a little?",
        older:      "Thank you for tracking that so openly. Now, let's reflect together — were there any times, even brief ones, when your mood lifted, even a little?"
      }
    },
    // P1
    { role: "patient",
      text: {
        baseline:   "Actually, on Wednesday my neighbor asked me to help fix his fence, and I felt a little better while I was doing it. Maybe a 5. But then I went back inside and it dropped again.",
        adolescent: "Actually, on Wednesday my neighbor asked me to help fix his fence, and I felt a little better while I was doing it. Maybe a 5. But then I went back inside and it dropped again.",
        literacy:   "On Wednesday, my neighbor asked me to help fix his fence. I felt better then, maybe a 5. But after I went inside, my mood dropped again.",
        older:      "Actually, on Wednesday, my neighbor asked if I could help repair his fence. While I was helping, I felt a bit better — maybe a 5. But once I returned inside, my mood dropped again."
      }
    },
    // C2 — BA rationale delivery
    { role: "clinician",
      technique: { label: "BA rationale delivery",
        text: "BA rationale delivery: Uses the patient's own data to illustrate the behavioral model of depression. Names the maintenance mechanism explicitly — withdrawal reduces contact with positive reinforcement, which maintains depressive symptoms. The vicious cycle is framed as the treatment target." },
      text: {
        baseline:   "That's a really important observation. When you were active and engaged in something with purpose — helping your neighbor — your mood lifted. When you went back to the low-activity pattern, it dropped. That's the cycle we're working to interrupt. Depression tells you to withdraw, but withdrawal removes you from the things that naturally lift your mood. The less you do, the worse you feel, and the worse you feel, the less you do.",
        adolescent: "That's super important. When you were up and doing something that mattered — like helping your neighbor — your mood improved. But when you went back to doing not much, your mood dipped again. That's the cycle we're trying to break. Depression tries to convince you to pull back, but when you do, you miss out on stuff that could actually help you feel better. The less you do, the worse you feel, and then it just keeps going.",
        literacy:   "That's very important. When you did something with a purpose, like helping your neighbor, your mood got better. When you stopped doing things, your mood got worse. Depression means feeling very sad and wanting to pull away from things. The less you do, the worse you feel, and the worse you feel, the less you do. Can you tell me what you heard me say?",
        older:      "That is a valuable observation. When you were engaged in a purposeful activity — assisting your neighbor — you noticed an improvement in your mood. Once you returned to a more withdrawn routine, your mood declined. This is the cycle we are aiming to interrupt. Depression often encourages withdrawal, but that withdrawal takes you away from experiences that can naturally lift your mood. The less you do, the worse you feel, and the worse you feel, the less you do — it's a difficult cycle, especially in retirement when routines can change significantly."
      }
    },
    // P2
    { role: "patient",
      text: {
        baseline:   "That makes sense when you say it, but in the moment it feels impossible to do anything. I don't have the energy or motivation.",
        adolescent: "That makes sense when you say it, but in the moment it feels impossible to do anything. I don't have the energy or motivation.",
        literacy:   "When I do things, I feel a bit better. When I don't do much, I feel worse.",
        older:      "It makes sense when you explain it, but in the moment, it feels almost impossible to do anything. I just don't have the energy or the drive."
      }
    },
    // C3 — Outside-in principle  [GAP]
    { role: "clinician",
      technique: { label: "Outside-in principle",
        text: "Outside-in principle: Addresses the motivation trap directly. The BA model proposes that behavior change drives mood change, not the reverse. This is a critical psychoeducation moment that reframes the patient's expectation from 'feel better then do more' to 'do more then feel better.'" },
      text: {
        baseline:   "That's one of the trickiest things about depression — it tells you to wait until you feel motivated before you act. But the research on behavioral activation shows it actually works the other way: action comes first, and then motivation and energy follow. We're not going to wait for motivation. We're going to schedule activities and let the mood catch up. What are some activities that used to give you a sense of pleasure or accomplishment?",
        adolescent: "That's one of the hardest parts about depression — it tricks you into thinking you have to wait until you feel motivated before you do anything. But science shows it actually works the other way: you do something first, and then motivation and energy show up after. So we're not going to wait around for motivation. We'll plan some things to do, and let your mood catch up. Can you think of any activities that used to make you feel good or like you accomplished something?",
        literacy:   "Exactly. Depression makes you want to wait until you feel ready to do something. But studies show doing things first helps your mood and energy. Behavioral activation means planning activities to help your mood. 'Behavioral activation' is a way to fight depression by doing things even when you don't feel like it. What are some things you used to enjoy or feel proud of?",
        older:      "That is one of the most challenging aspects of depression — it convinces you to wait for motivation before taking action. However, research on behavioral activation, including studies with older adults, shows that the process actually works in the opposite direction: action comes first, and then motivation and energy follow. We won't wait for motivation. Instead, we'll plan activities, and let your mood catch up. Looking back over your long personal history, what are some activities that used to bring you pleasure or a sense of accomplishment?"
      }
    },
    // P3
    { role: "patient",
      text: {
        baseline:   "I used to go fishing on weekends with my brother. I used to cook dinner for my family most nights. And I was pretty active at my church before all this started.",
        adolescent: "I used to play basketball with my friends after school. I used to draw a lot, like almost every day. And I used to hang out with my cousin most weekends before all this started.",
        literacy:   "I used to go fishing with my brother. I used to cook dinner for my family. I was active at church before all this.",
        older:      "I used to go fishing on weekends with my brother. I used to cook dinner for my family most nights. And I was quite involved with my church before all this started."
      }
    },
    // C4 — Graded task assignment  [GAP]
    { role: "clinician",
      technique: { label: "Graded task assignment",
        text: "Graded task assignment: Introduces scheduling with a graded approach — starting below the patient's pre-depression activity level to maximize success probability. Emphasizes multiple life domains to broaden the reinforcement base." },
      text: {
        baseline:   "Those are great examples spanning different areas of your life — relationships, personal enjoyment, and community. In BA, we want to schedule activities across these domains rather than putting all our eggs in one basket. Let's start small. If we were to schedule just two or three activities this week, what would feel manageable? Not what you used to do, but what you could realistically commit to right now.",
        adolescent: "Those are awesome examples — you've got stuff with family, things you enjoy, and being part of a group. In BA, we want to plan activities from different parts of your life, not just focus on one thing. Let's keep it simple. If you picked just two or three things to try this week, what feels doable? Not what you used to do, but what you could actually see yourself doing right now.",
        literacy:   "Those are good examples from different parts of your life: family, fun, and community. In behavioral activation, we plan activities in different areas, not just one. Let's start small. If you could do two or three things this week, what feels possible? Not what you used to do, but what you can do now.",
        older:      "Those are excellent examples, touching on relationships, personal enjoyment, and community involvement — all important, especially at this stage of life. In behavioral activation, we aim to schedule activities across these different areas, rather than relying on just one. Let's start with small, manageable steps. If we were to choose just two or three activities for this week, what would feel realistic for you now? Not what you did in the past, but what you feel you could commit to at this moment."
      }
    },
    // P4
    { role: "patient",
      text: {
        baseline:   "Maybe I could cook dinner one night instead of ordering takeout. And I could call my brother — I haven't talked to him in weeks. I don't think I'm ready for church yet though.",
        adolescent: "Maybe I could draw something one night instead of just scrolling. And I could text my cousin — I haven't talked to him in weeks. I don't think I'm ready to go back to basketball with everyone yet though.",
        literacy:   "I could cook dinner one night instead of ordering food. I could call my brother. I'm not ready for church yet.",
        older:      "Perhaps I could cook dinner one evening instead of ordering takeout. And I could call my brother — it's been weeks since we talked. I don't think I'm quite ready for church yet, though."
      }
    },
    // C5 — Specificity in scheduling
    { role: "clinician",
      technique: { label: "Specificity in scheduling",
        text: "Specificity in scheduling: Moves from vague intention to concrete commitment by specifying day and time. Research shows that implementation intentions (when-where-what plans) significantly increase follow-through compared to general goals." },
      text: {
        baseline:   "That sounds like a solid plan. Let's get specific so it's more likely to happen. Which night will you cook dinner, and what time will you call your brother?",
        adolescent: "That sounds like a solid plan. Let's make it specific so it's easier to stick to. Which night will you draw, and when will you text your cousin?",
        literacy:   "That's a good plan. Let's make it clear so it's easier to do. Which night will you cook dinner? What time will you call your brother?",
        older:      "That sounds like a solid and thoughtful plan. Let's make it specific, as that increases the likelihood you'll follow through. Which evening will you prepare dinner, and when would you like to call your brother?"
      }
    },
    // P5
    { role: "patient",
      text: {
        baseline:   "I could cook on Thursday. And I'll call my brother Sunday afternoon — he's usually free then.",
        adolescent: "I could draw on Thursday. And I'll text my cousin Sunday afternoon — he's usually around then.",
        literacy:   "I'll cook on Thursday. I'll call my brother Sunday afternoon, he's free then.",
        older:      "I could cook on Thursday. And I'll call my brother Sunday afternoon — that's usually when he's available."
      }
    },
    // C6 — Collaborative scheduling with built-in hypothesis testing  [GAP]
    { role: "clinician",
      technique: { label: "Collaborative scheduling with built-in hypothesis testing",
        text: "Collaborative scheduling with built-in hypothesis testing: Formalizes the schedule and frames the upcoming week as a behavioral experiment. Continuing activity monitoring allows the patient to gather evidence for the BA model, strengthening engagement with treatment. The clinician makes an explicit prediction to test." },
      text: {
        baseline:   "Perfect. Let's write those into your schedule right now. Thursday evening: cook dinner. Sunday afternoon: call your brother. I also want you to continue your activity and mood monitoring so we can see how your mood responds to these scheduled activities. The prediction based on the BA model is that your mood will be higher during and after these activities than during the low-activity periods. We'll check that prediction together next week. Does this plan feel doable?",
        adolescent: "Perfect. Let's put those in your schedule: Thursday night, draw something. Sunday afternoon, text your cousin. I also want you to keep tracking your activities and mood so we can see how these planned things affect how you feel. Based on the BA model, your mood should be higher during and after these activities than when you're not doing much. We'll check that together next week. Does this plan seem like something you can do?",
        literacy:   "Great. Let's write it down: Thursday evening, cook dinner. Sunday afternoon, call your brother. Keep tracking your activities and mood so we can see how you feel after these things. The behavioral activation model says your mood should be higher during and after these activities than when you do less. We'll check this next week. Does this plan sound okay to you?",
        older:      "Excellent. Let's note those in your calendar now: Thursday evening, cook dinner; Sunday afternoon, call your brother. I would also like you to continue monitoring your activities and mood, so we can observe how your mood responds to these scheduled events. According to the behavioral activation model, we would expect your mood to be higher during and after these activities compared to periods of low activity. We'll review your progress together next week. Does this approach feel manageable for you?"
      }
    },
    // P6
    { role: "patient",
      text: {
        baseline:   "Yeah, I think I can handle two things. It's not as overwhelming when it's just two specific activities instead of 'get your life together.'",
        adolescent: "Yeah, I think I can handle two things. It's not as overwhelming when it's just two specific activities instead of 'get your life together.'",
        literacy:   "Yes, I can do two things. It feels easier when it's just two simple activities, not everything at once.",
        older:      "Yes, I think I can manage two things. It doesn't feel so overwhelming when it's just two specific activities, rather than trying to overhaul everything at once."
      }
    }
  ]
};

// Per-gap coaching feedback, keyed by clinician-turn position. Grounded in the BA
// evidence base (Martell/Dimidjian; graded task assignment; implementation intentions).
const GAP_FEEDBACK = {
  1: { // Identifying exceptions
    lookFor: "An affirmation of the patient's honest tracking followed by an open question that searches for brief, naturally occurring mood lifts in their own data.",
    why: "BA is empirical: the activity-mood connection is most persuasive when it comes from the patient's own diary rather than from the clinician asserting it. Asking for exceptions sets up the patient to supply the evidence themselves.",
    watchFor: "Avoid jumping to the BA rationale or prescribing activities before the patient has surfaced their own example of an activity-linked mood lift."
  },
  3: { // Outside-in principle
    lookFor: "A reframe of the motivation trap — action precedes motivation, not the reverse — paired with a question that begins eliciting previously rewarding activities.",
    why: "Depression makes patients wait to feel motivated before acting; naming that trap and stating the outside-in principle ('do more then feel better') is the core psychoeducation that licenses scheduling activity before motivation returns.",
    watchFor: "Don't validate waiting for motivation or agree that activity should follow energy; that concedes the maintaining mechanism."
  },
  4: { // Graded task assignment
    lookFor: "A move toward starting small and graded — two or three manageable activities across different life domains — pegged below the patient's pre-depression level.",
    why: "Grading tasks below prior capacity maximizes the probability of success and early reinforcement, while spanning domains (relationships, enjoyment, community) broadens the reinforcement base rather than betting on a single activity.",
    watchFor: "Don't set the bar at the patient's former activity level or push a single ambitious task; either invites failure and discouragement."
  },
  6: { // Collaborative scheduling with built-in hypothesis testing
    lookFor: "Formalizing the specific plan, continuing activity-and-mood monitoring, and framing the week as a behavioral experiment with an explicit, testable prediction.",
    why: "Turning the plan into a monitored prediction ('mood should be higher during and after these activities') lets the patient gather their own evidence for the BA model, which strengthens engagement and sets up the next session's review.",
    watchFor: "Don't leave the plan vague or skip the monitoring; without the prediction-and-check structure the week is just advice rather than an experiment."
  }
};


// ---- state ----
var stage = 1;
var patientKey = "baseline";
var submitted = {}; // gapIndex -> true

var PATIENT_ORDER = ["adolescent","literacy","older"];
var PATIENT_BTNLABEL = {adolescent:"Adolescent (14–16)", literacy:"Limited literacy", older:"Older adult (70+)"};

function el(tag, cls, html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function clinicianTurnIndices(){
  var out=[]; SESSION.turns.forEach(function(t,i){ if(t.role==="clinician") out.push(i); }); return out;
}
function isGap(turnIdx){
  var cl = clinicianTurnIndices();
  var pos = cl.indexOf(turnIdx);
  return stage===2 && SESSION.gapClinicianIndices.indexOf(pos)!==-1;
}
function clinicianPos(turnIdx){ return clinicianTurnIndices().indexOf(turnIdx); }

function renderHeader(){
  document.getElementById("sessTitle").textContent = SESSION.title;
  document.getElementById("sessBlurb").textContent = SESSION.blurb;
  var p = SESSION.patients[patientKey];
  document.getElementById("pchip").innerHTML = "<b>Patient:</b> " + esc(p.label);
  document.getElementById("scen").textContent = p.chip;

  document.getElementById("metaMech").innerHTML = "<b>Mechanism:</b> " + esc(SESSION.metaMechanism);
  document.getElementById("metaIntv").innerHTML = "<b>Intervention:</b> " + esc(SESSION.metaIntervention);

  var ra = document.getElementById("recafter");
  ra.innerHTML = "";
  var book = '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" style="flex:0 0 auto"><path d="M3 4.5h5.5c.8 0 1.5.7 1.5 1.5v9c0-.8-.7-1.5-1.5-1.5H3v-9Z" stroke="#6f6c66" stroke-width="1.3"/><path d="M17 4.5h-5.5c-.8 0-1.5.7-1.5 1.5v9c0-.8.7-1.5 1.5-1.5H17v-9Z" stroke="#6f6c66" stroke-width="1.3"/></svg>';
  ra.insertAdjacentHTML("beforeend", book + "<span>Recommended after:</span>");
  SESSION.recommendedAfter.forEach(function(r,i){
    ra.insertAdjacentHTML("beforeend", (i?" , ":" ") + '<a>'+esc(r)+'</a>');
  });

  // Purple adaptation banner (Stage 1 only, when a non-baseline patient is active)
  var ab = document.getElementById("adaptBanner");
  if(stage===1 && p.banner){
    ab.classList.remove("hidden");
    ab.innerHTML = '<div><b>AI-adapted for: '+esc(p.banner)+'.</b> All clinical content is unchanged — every score, technique, and recommendation is identical to the expert version. Amber annotations refer to the original phrasing.</div>' +
      '<button class="back" type="button" id="backOrig">Back to original</button>';
    document.getElementById("backOrig").addEventListener("click", function(){
      patientKey = "baseline"; renderHeader(); renderChat(); renderToggle();
    });
  } else {
    ab.classList.add("hidden"); ab.innerHTML = "";
  }
}

function renderInstr(){
  var box = document.getElementById("instr");
  if(stage===1){
    box.innerHTML =
      "<h3>What to do in Stage 1</h3>" +
      "(1) Read the full conversation from top to bottom. " +
      "(2) After each clinician response, read the <b>amber annotation box</b> below it. It explains <i>why</i> the clinician said what they said, not just the technique name. " +
      "(3) When a response surprises you, write one sentence about what you expected and why the expert's choice differs. " +
      "When you have read every exchange and every annotation, select <b>Stage 2: Fill in the Gaps</b>.";
  } else {
    box.innerHTML =
      "<h3>What to do in Stage 2</h3>" +
      "(1) Read the conversation to the first gap. (2) Type what you think the clinician could say. " +
      "(3) Select <b>Submit Response</b> to reveal the expert response and feedback. (4) Read the feedback before moving to the next gap. " +
      "<div class='done'>You are done when every gap has a submitted response and you have read each comparison.</div>";
  }
}

function bubbleRow(turn, turnIdx){
  var role = turn.role;
  var row = el("div","row "+(role==="clinician"?"cl":"pt"));
  var av = el("div","avatar");
  av.innerHTML = role==="clinician"
    ? '<svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M6 3v4a3 3 0 0 0 6 0V3" stroke="#8a5a25" stroke-width="1.4" stroke-linecap="round"/><path d="M9 10v2a4 4 0 0 0 8 0v-1" stroke="#8a5a25" stroke-width="1.4"/><circle cx="17" cy="9.5" r="1.6" stroke="#8a5a25" stroke-width="1.4"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="#6f6c66" stroke-width="1.4"/><path d="M4 16c0-3 2.7-5 6-5s6 2 6 5" stroke="#6f6c66" stroke-width="1.4" stroke-linecap="round"/></svg>';
  var stack = el("div","stack");
  var who = el("div","who", role==="clinician" ? (isGap(turnIdx) ? "Clinician (Your Turn)" : "Clinician") : "Patient");
  stack.appendChild(who);

  if(isGap(turnIdx)){
    stack.appendChild(buildGap(turn, turnIdx));
  } else {
    var b = el("div","bubble", esc(turn.text[patientKey]));
    stack.appendChild(b);
    if(role==="clinician" && turn.technique){
      var tech = el("div","tech","<b>Technique:</b> " + esc(turn.technique.text));
      stack.appendChild(tech);
    }
  }
  row.appendChild(av); row.appendChild(stack);
  return row;
}

function buildGap(turn, turnIdx){
  var wrap = el("div","gapwrap");
  var done = submitted[turnIdx];
  var ta = el("textarea","gap-ta"+(done?" locked":""));
  ta.placeholder = "What would you say to the patient here?";
  ta.setAttribute("aria-label","Your clinician response for this gap");
  if(done){ ta.value = done.text; ta.readOnly = true; }
  wrap.appendChild(ta);

  if(!done){
    var btn = el("button","submit","Submit Response");
    btn.disabled = true;
    ta.addEventListener("input", function(){ btn.disabled = ta.value.trim().length===0; });
    btn.addEventListener("click", function(){
      submitted[turnIdx] = { text: ta.value.trim() };
      renderChat(); updateStatus();
    });
    wrap.appendChild(btn);
  } else {
    wrap.appendChild(buildCompare(turn, turnIdx));
  }
  return wrap;
}

function buildCompare(turn, turnIdx){
  var pos = clinicianPos(turnIdx);
  var fb = GAP_FEEDBACK[pos];
  var box = el("div","compare");
  var exp = el("div","cmp-card cmp-expert");
  exp.innerHTML = "<div class='lab'>Expert Response</div>" + esc(turn.text[patientKey]);
  box.appendChild(exp);
  var tech = el("div","cmp-card cmp-tech","<b>Technique:</b> " + esc(turn.technique.text));
  box.appendChild(tech);
  var f = el("div","cmp-card cmp-fb");
  f.innerHTML = "<div class='lab'>Feedback</div>" +
    "<p><span class='k'>What a strong response includes:</span> " + esc(fb.lookFor) + "</p>" +
    "<p><span class='k'>Why:</span> " + esc(fb.why) + "</p>" +
    "<p><span class='k'>Watch for:</span> " + esc(fb.watchFor) + "</p>";
  box.appendChild(f);
  return box;
}

function renderChat(){
  var chat = document.getElementById("chat");
  chat.innerHTML = "";
  SESSION.turns.forEach(function(t,i){ chat.appendChild(bubbleRow(t,i)); });
}

function updateStatus(){
  var status = document.getElementById("status");
  var banner = document.getElementById("doneBanner");
  if(stage!==2){ status.classList.add("hidden"); banner.classList.add("hidden"); return; }
  var total = SESSION.gapClinicianIndices.length;
  var gapTurnIdxs = clinicianTurnIndices().filter(function(ti){ return isGap(ti); });
  var done = gapTurnIdxs.filter(function(ti){ return submitted[ti]; }).length;
  status.classList.remove("hidden");
  status.innerHTML = "Gaps completed: <b>"+done+" of "+total+"</b>.";
  if(done===total){
    banner.classList.remove("hidden");
    banner.innerHTML = "<b>Stage 2 complete.</b> You've submitted every gap and can compare each of your responses with the expert's. You've now finished both stages of this worked example.";
  } else {
    banner.classList.add("hidden");
  }
}

function renderToggle(){
  var t = document.getElementById("toggle");
  if(stage!==1){ t.classList.add("hidden"); return; }
  t.classList.remove("hidden");
  var box = document.getElementById("toggleBtns");
  box.innerHTML = "";
  var all = PATIENT_ORDER.map(function(k){return [k,PATIENT_BTNLABEL[k]];});
  all.forEach(function(pair){
    var b = el("button","tbtn", pair[1]);
    b.setAttribute("aria-pressed", String(patientKey===pair[0]));
    b.addEventListener("click", function(){
      patientKey = pair[0];
      renderHeader(); renderChat(); renderToggle();
    });
    box.appendChild(b);
  });
  // "Back to original" text link at the end of the toggle row (matches PDF)
  var back = el("button","tbtn-link", "Back to original");
  back.setAttribute("aria-pressed", String(patientKey==="baseline"));
  back.addEventListener("click", function(){
    patientKey = "baseline"; renderHeader(); renderChat(); renderToggle();
  });
  box.appendChild(back);
}

function renderBottomNav(){
  var nav = document.getElementById("bottomNav");
  nav.innerHTML = "";
  nav.classList.remove("hidden","back");
  if(stage===1){
    var b = el("button","nav-btn");
    b.innerHTML = 'Next Stage: Fill in the Gaps ' +
      '<svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M4 10h11M11 6l4 4-4 4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    b.addEventListener("click", function(){ setStage(2); });
    nav.appendChild(b);
  } else {
    nav.classList.add("back");
    var b2 = el("button","nav-btn secondary");
    b2.innerHTML = '<svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M16 10H5M9 6l-4 4 4 4" stroke="#1f1e1c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg> Back to Stage 1';
    b2.addEventListener("click", function(){ setStage(1); });
    nav.appendChild(b2);
  }
}

function setStage(s){
  stage = s;
  document.getElementById("tab1").setAttribute("aria-selected", String(s===1));
  document.getElementById("tab2").setAttribute("aria-selected", String(s===2));
  document.getElementById("pdot2").classList.toggle("on", s===2);
  // Stage 2 always uses baseline patient (variants are a Stage-1-only feature)
  if(s===2){ patientKey = "baseline"; }
  renderHeader(); renderInstr(); renderChat(); renderToggle(); updateStatus(); renderBottomNav();
  window.scrollTo({top:0, behavior:"smooth"});
}

// init
renderHeader(); renderInstr(); renderChat(); renderToggle(); updateStatus(); renderBottomNav();
</script>
</body>
</html>
