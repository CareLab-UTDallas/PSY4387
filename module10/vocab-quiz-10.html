<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 10 Vocabulary: Self-Test</title>
<style>
  :root{
    --bg:#faf9f7; --ink:#1f1e1c; --muted:#6b6862; --line:#e7e4de;
    --panel:#ffffff; --panel-shadow:0 1px 2px rgba(28,27,25,.04),0 6px 20px rgba(28,27,25,.05);
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --do-bg:#f3f1ec; --do-ink:#57544e;
    --correct-bg:#eef5ee; --correct-line:#bcd6bd; --correct-ink:#3c6b3e;
    --wrong-bg:#fbecec; --wrong-line:#e3b9b9; --wrong-ink:#a23b34;
    --amber-bg:#fffbef; --amber-line:#e7c98a; --amber-ink:#8a6d2f;
    --focus:#2f6f4f; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 20px 60px;}

  .masthead{padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .masthead h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em;}
  .masthead .sub{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:70ch;}

  .progress{display:flex;align-items:center;gap:10px;margin:2px 0 16px;}
  .pbar{flex:1 1 auto;height:6px;border-radius:3px;background:var(--line);overflow:hidden;}
  .pbar span{display:block;height:100%;background:var(--accent);width:0;transition:width .25s;}
  .pcount{font-size:12.5px;color:var(--muted);flex:0 0 auto;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--panel-shadow);padding:22px 24px;}
  .qtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px;}
  .qtop .qn{font-size:13px;color:var(--muted);}
  .qtop .term-tag{font-size:12px;color:var(--muted);background:#eceae4;border-radius:7px;padding:4px 10px;}
  .qprompt{font-size:17px;font-weight:600;margin:2px 0 6px;line-height:1.4;}
  .do{background:var(--do-bg);color:var(--do-ink);border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.5;margin:10px 0 16px;}
  .do b{color:var(--ink);}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;font-size:14.5px;
    line-height:1.5;cursor:pointer;transition:border-color .12s,background .12s;color:var(--ink);}
  .opt:hover:not(:disabled){border-color:#cfc9bf;}
  .opt:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:15px;}
  .opt .mark{flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center;margin-left:auto;}
  .opt:disabled{cursor:default;}
  .opt.correct{background:var(--correct-bg);border-color:var(--correct-line);}
  .opt.correct .k{color:var(--correct-ink);}
  .opt.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .opt.wrong .k{color:var(--wrong-ink);}
  .opt.dim{opacity:.6;}

  .verdict{margin:16px 0 0;font-size:14.5px;font-weight:600;}
  .verdict.ok{color:var(--correct-ink);}
  .verdict.no{color:var(--wrong-ink);}
  .explain{margin:8px 0 0;font-size:14px;color:#44413b;line-height:1.6;}
  .explain .src{color:var(--muted);font-size:12.5px;margin-top:6px;}

  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;}
  .hintbtn{background:none;border:none;color:var(--accent-ink);font:inherit;font-size:13.5px;cursor:pointer;text-decoration:underline;padding:0;}
  .hintbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .hintbox{margin-top:12px;background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);
    border-radius:10px;padding:10px 13px;font-size:13.5px;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;
    border-radius:10px;padding:11px 19px;font-size:14.5px;font-weight:600;cursor:pointer;}
  .btn:hover{filter:brightness(1.05);}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  /* results */
  .results h2{margin:0 0 4px;font-size:20px;}
  .results .score{font-size:16px;margin:0 0 4px;}
  .results .score b{color:var(--accent-ink);}
  .results .breakdown{margin:16px 0 0;border-top:1px solid var(--line);padding-top:14px;}
  .results .brow{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 0;border-bottom:1px solid #f0eee9;}
  .results .brow:last-child{border-bottom:none;}
  .results .bi{flex:0 0 auto;margin-top:1px;}
  .results .bt{flex:1 1 auto;}
  .results .bt .bterm{font-weight:600;}
  .results .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .selfnote{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.55;}

  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Trauma, Change, and Safety Vocabulary: Self-Test</h1>
    <p class="sub">Ten questions on the core Module 10 terms. Each question applies a term in a short scenario. Pick an answer to see whether it is right and why.</p>
  </div>

  <div class="progress" aria-hidden="true">
    <div class="pbar"><span id="pbarfill"></span></div>
    <div class="pcount" id="pcount"></div>
  </div>

  <section class="panel" id="qpanel" aria-live="polite"></section>

  <section class="panel results hidden" id="resultsPanel"></section>
</div>

<script>
// Data for this self-test. Items are original, scenario-based, and grounded in the module reading.
var QUIZ = [
 {
  "term": "Emotional processing",
  "prompt": "In his fourth Prolonged Exposure session, Yusuf recounts the memory and can describe it without being flooded. He says, “Remembering it is different from it happening again.” Which process best names this change?",
  "options": [
   {
    "id": "a",
    "text": "Distraction, in which attention shifts away from the memory until it stops pulling on him in daily life"
   },
   {
    "id": "b",
    "text": "Emotional processing, in which distress settles and the meaning updates through staying in contact with the memory"
   },
   {
    "id": "c",
    "text": "Cognitive restructuring, in which he has replaced one stuck belief with a more balanced one after weighing the evidence"
   },
   {
    "id": "d",
    "text": "Habituation to the therapist, in which he has grown used to being listened to and feels safer"
   }
  ],
  "correct": "b",
  "explain": "Emotional processing is the central process in PE. Staying with the memory long enough lets the raw intensity come down and lets the meaning update, so the person learns that remembering is different from reliving. It comes from approaching the memory, which distraction or a change of topic prevents.",
  "hint": "Ask what changed about the memory itself and what he learned about remembering.",
  "src": "Module 10, Prolonged Exposure"
 },
 {
  "term": "Stuck point",
  "prompt": "Which statement is a stuck point, a rigid belief from a trauma that keeps recovery jammed?",
  "options": [
   {
    "id": "a",
    "text": "“My stomach tightens when I drive near that intersection, and the feeling fades after a minute.”"
   },
   {
    "id": "b",
    "text": "“I wish I had taken the other road that morning, and I still think about it sometimes.”"
   },
   {
    "id": "c",
    "text": "“Because I froze that night, I am a coward, and no one should ever trust me with their safety.”"
   },
   {
    "id": "d",
    "text": "“I have been sleeping about five hours a night since the accident, and I wake up tired.”"
   }
  ],
  "correct": "c",
  "explain": "A stuck point is a sweeping conclusion about blame, safety, trust, or self-worth that generates steady shame or fear. A wish about the past, a bodily reaction, and a sleep complaint are real and still need attention, and none of them is a belief that holds recovery in place.",
  "hint": "Look for a conclusion about the self that would keep producing guilt or shame.",
  "src": "Module 10, Cognitive Processing Therapy"
 },
 {
  "term": "Change talk",
  "prompt": "Kofi drinks most nights and is meeting a counselor for the first time. Which of his statements is change talk?",
  "options": [
   {
    "id": "a",
    "text": "“Cutting back wouldn’t change anything for me, so I don’t see why I should see a counselor.”"
   },
   {
    "id": "b",
    "text": "“Everyone I know drinks this much when work gets stressful, so I don’t see the problem.”"
   },
   {
    "id": "c",
    "text": "“I snapped at my kids this morning and I hate that. I want to be a steadier parent for them.”"
   },
   {
    "id": "d",
    "text": "“My sister thinks I drink too much, and I think she is making a big deal out of nothing.”"
   }
  ],
  "correct": "c",
  "explain": "Change talk is the person’s own statement pointing toward change, here a downside of the status quo and a wish for something different. The other three argue for keeping things the same, which is sustain talk.",
  "hint": "Ask whether the statement moves toward change or toward keeping things the same.",
  "src": "Module 10, Motivational Interviewing, Revisited"
 },
 {
  "term": "Distress tolerance",
  "prompt": "In the hour after a trigger, Dalia feels an overwhelming urge to do something harmful to make the feeling stop. Which description fits a distress-tolerance skill?",
  "options": [
   {
    "id": "a",
    "text": "Arguing with herself until the urge no longer seems real, so that the evening can proceed as it would have"
   },
   {
    "id": "b",
    "text": "Getting through the peak without harmful action, so the wave can crest and fall before she decides anything else"
   },
   {
    "id": "c",
    "text": "Waiting for the feeling to go away entirely before she does anything, even if that means staying alone for hours"
   },
   {
    "id": "d",
    "text": "Working out the cause of the feeling in detail, so that the problem can be solved before the feeling reaches its peak"
   }
  ],
  "correct": "b",
  "explain": "Distress tolerance does not try to fix the feeling or reason it away in the moment. It buys time so that the wave can crest and recede without harmful action. The choices available after the peak are better than the choices available during it.",
  "hint": "The goal in the moment is to avoid harmful action, and solving the problem comes later.",
  "src": "Module 10, DBT and Distress Tolerance"
 },
 {
  "term": "Risk factors",
  "prompt": "A student says, “If a friend has several risk factors for suicide, you can predict what they will do.” Which reply fits the module?",
  "options": [
   {
    "id": "a",
    "text": "Risk factors apply to people already in treatment, so a friend’s risk is not something a layperson can notice or judge"
   },
   {
    "id": "b",
    "text": "Risk factors predict behavior well once there are three or more of them, which is why clinicians count them on a checklist"
   },
   {
    "id": "c",
    "text": "Risk factors stay fixed over time, so a person with several of them carries the same level of risk until treatment ends"
   },
   {
    "id": "d",
    "text": "Risk factors are patterns across many people that raise attention and care, and they predict poorly for any one individual"
   }
  ],
  "correct": "d",
  "explain": "Risk and protective factors are patterns observed across groups. They tell a helper where to pay attention and do not work as a verdict on an individual. Protective factors can be strengthened on purpose.",
  "hint": "Think about what a pattern across many people can and cannot say about one person.",
  "src": "Module 10, Risk, Protection, and Safety Planning"
 },
 {
  "term": "Safety planning",
  "prompt": "Which feature makes a safety plan more useful than a general intention to stay safe?",
  "options": [
   {
    "id": "a",
    "text": "The person and helper build it together ahead of time, with warning signs, coping steps, contacts, and resources the person chose"
   },
   {
    "id": "b",
    "text": "It lists emergency numbers so that the person knows where to call and leaves the choice of coping steps open until needed"
   },
   {
    "id": "c",
    "text": "The clinician writes it alone after assessing risk and gives the person a copy to keep, signed at the bottom of the page"
   },
   {
    "id": "d",
    "text": "It is completed during the crisis itself, when the person’s own wishes are clearest and the helper can respond to them"
   }
  ],
  "correct": "a",
  "explain": "A safety plan is collaborative and made in advance, so it reflects what helps this person and is easy to reach when it is hardest to remember. It gathers warning signs, coping strategies, people and settings, professional and emergency resources, and ways to make the environment safer.",
  "hint": "Consider who builds it and when.",
  "src": "Module 10, Risk, Protection, and Safety Planning"
 },
 {
  "term": "Measurement-based care",
  "prompt": "Every second session a clinician collects a PTSD symptom checklist and ratings of avoidance and of belief in a stuck point. After six weeks the checklist total is flat and the avoidance ratings have dropped. What does this practice allow the clinician to do?",
  "options": [
   {
    "id": "a",
    "text": "See that the targeted process is moving though the total is not, and decide with the client whether to revise"
   },
   {
    "id": "b",
    "text": "Switch treatments at once, because ratings of a single process are unreliable and should not guide any change in the plan"
   },
   {
    "id": "c",
    "text": "Conclude that treatment has failed because the total is flat, and end it so that no more of the client’s time is spent"
   },
   {
    "id": "d",
    "text": "Wait until the checklist total drops before deciding anything, since totals are the only valid outcome in trauma treatment"
   }
  ],
  "correct": "a",
  "explain": "Measurement-based care treats the plan as a hypothesis. Separate ratings for the targeted process and for overall symptoms show whether the mechanism is changing even when the total has barely moved. The clinician reviews the pattern with the client and revises the intervention or the hypothesis when the process is not moving.",
  "hint": "Consider what each measure tracks.",
  "src": "Module 10, Measuring Whether the Process Is Moving"
 },
 {
  "term": "Informed consent",
  "prompt": "Mireille agreed to start therapy only because a court order says she must attend or face a penalty. Which condition for informed consent is most in question?",
  "options": [
   {
    "id": "a",
    "text": "Capacity, since agreeing to attend court-ordered therapy suggests she cannot weigh the options she faces in her case"
   },
   {
    "id": "b",
    "text": "Voluntariness, since the decision is shaped by pressure and the clinician must say what is required and what is her choice"
   },
   {
    "id": "c",
    "text": "Disclosure, since the clinician must still explain what will be reported to the court, though voluntariness is not affected"
   },
   {
    "id": "d",
    "text": "None of the three, since the court has already decided and the clinician needs only to carry out the order as written"
   }
  ],
  "correct": "b",
  "explain": "Consent requires disclosure, capacity, and voluntariness together. A mandate puts pressure on voluntariness, so the clinician states what is required, what remains the client’s choice, and what will be reported. The duty to disclose continues when a court is involved.",
  "hint": "Ask which of the three conditions the court order touches most directly.",
  "src": "Module 10, Consent in Trauma-Focused Care"
 },
 {
  "term": "Dialectic in DBT",
  "prompt": "Which statement best captures the dialectic at the center of DBT?",
  "options": [
   {
    "id": "a",
    "text": "“You need to change as quickly as you can, and acceptance is another name for giving up on yourself.”"
   },
   {
    "id": "b",
    "text": "“You need to accept yourself fully before change is worth attempting, so we will hold off on skills for now.”"
   },
   {
    "id": "c",
    "text": "“We will spend some weeks on acceptance and other weeks on change, and we will keep the two separate.”"
   },
   {
    "id": "d",
    "text": "“You are doing the best you can right now, and you can still learn to do better than this over time.”"
   }
  ],
  "correct": "d",
  "explain": "The dialectic holds acceptance and change together. Acceptance alone can leave a person without tools, and change alone can sound like a verdict that who they are now is unacceptable. DBT keeps both going at once.",
  "hint": "Look for the statement that holds both halves at once.",
  "src": "Module 10, DBT and Distress Tolerance"
 },
 {
  "term": "Prolonged Exposure",
  "prompt": "Pavel is terrified of crowded stores after an assault. His PE clinician starts by explaining the plan, then has him stand in the entrance of a quiet store for a few minutes, and later walk an aisle at a busy hour. What principle explains this order?",
  "options": [
   {
    "id": "a",
    "text": "Steps run from most manageable to most challenging, so early wins build the confidence and readiness harder steps need"
   },
   {
    "id": "b",
    "text": "Each step is chosen to keep his anxiety low, so that he feels little fear during any part of treatment"
   },
   {
    "id": "c",
    "text": "The order is a matter of convenience, since any approach to the feared situation produces the same learning at any pace"
   },
   {
    "id": "d",
    "text": "The hardest step comes first, since the largest rise in distress produces the fastest learning in the shortest time"
   }
  ],
  "correct": "a",
  "explain": "Pacing is central to exposure. Real-world steps are arranged from manageable to challenging so that early successes build readiness. The clinician keeps the person engaged enough to learn and supported enough not to be overwhelmed, and anxiety is expected to rise during practice.",
  "hint": "Consider why the clinician does not start in the busiest store.",
  "src": "Module 10, Why Pacing Matters"
 }
];

var idx = 0;
var answered = [];   // chosen id or null
var hintShown = {};

function el(t,c,h){var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

var CHECK='<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#3c6b3e" stroke-width="1.4"/><path d="M6.4 10.2l2.3 2.3 4.7-4.9" stroke="#3c6b3e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var CROSS='<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#a23b34" stroke-width="1.4"/><path d="M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6" stroke="#a23b34" stroke-width="1.6" stroke-linecap="round"/></svg>';

function init(){ answered = QUIZ.map(function(){return null;}); renderProgress(); renderQuestion(); }

function renderProgress(){
  var pct = (idx) / QUIZ.length * 100;
  document.getElementById("pbarfill").style.width = pct + "%";
  document.getElementById("pcount").textContent = "Question " + Math.min(idx+1,QUIZ.length) + " of " + QUIZ.length;
}

function renderQuestion(){
  renderProgress();
  var q = QUIZ[idx];
  var panel = document.getElementById("qpanel");
  panel.innerHTML = "";
  var chosen = answered[idx];
  var isAnswered = chosen !== null;

  var top = el("div","qtop");
  top.appendChild(el("span","qn","Question " + (idx+1) + " of " + QUIZ.length));
  top.appendChild(el("span","term-tag", esc(q.term)));
  panel.appendChild(top);

  panel.appendChild(el("p","qprompt", esc(q.prompt)));
  panel.appendChild(el("div","do","<b>Do this:</b> Choose the option that reflects the reading's meaning of the term rather than a familiar word. You'll see whether it's right and why before moving on."));

  var opts = el("div","options");
  q.options.forEach(function(o){
    var cls="opt";
    if(isAnswered){
      if(o.id===q.correct) cls+=" correct";
      else if(o.id===chosen) cls+=" wrong";
      else cls+=" dim";
    }
    var b = el("button",cls);
    b.type="button";
    if(isAnswered) b.disabled=true;
    var mark="";
    if(isAnswered && o.id===q.correct) mark=CHECK;
    else if(isAnswered && o.id===chosen) mark=CROSS;
    b.innerHTML='<span class="k">'+o.id.toUpperCase()+'.</span><span class="txt">'+esc(o.text)+'</span><span class="mark">'+mark+'</span>';
    if(!isAnswered) b.addEventListener("click",function(){ choose(o.id); });
    opts.appendChild(b);
  });
  panel.appendChild(opts);

  if(!isAnswered){
    var foot = el("div","foot");
    var hb = el("button","hintbtn", hintShown[idx] ? "Hide hint" : "Show a hint");
    hb.addEventListener("click", function(){ hintShown[idx]=!hintShown[idx]; renderQuestion(); });
    foot.appendChild(hb);
    foot.appendChild(el("span","",""));
    panel.appendChild(foot);
    if(hintShown[idx]) panel.appendChild(el("div","hintbox", esc(q.hint)));
  } else {
    var right = chosen===q.correct;
    panel.appendChild(el("p","verdict "+(right?"ok":"no"), right ? "Correct." : "Not quite."));
    var ex = el("p","explain", esc(q.explain));
    ex.innerHTML += '<div class="src">Reading: ' + esc(q.src) + '</div>';
    panel.appendChild(ex);

    var foot = el("div","foot");
    foot.appendChild(el("span","",""));
    var last = idx===QUIZ.length-1;
    var nb = el("button","btn");
    nb.innerHTML = last ? 'See your results' : 'Next question <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M4 10h11M11 6l4 4-4 4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    nb.addEventListener("click", function(){
      if(last){ finish(); } else { idx++; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
    });
    foot.appendChild(nb);
    panel.appendChild(foot);
  }
}

function choose(id){
  if(answered[idx]!==null) return;
  answered[idx]=id;
  renderQuestion();
}

function finish(){
  document.getElementById("pbarfill").style.width = "100%";
  document.getElementById("pcount").textContent = "Complete";
  document.getElementById("qpanel").classList.add("hidden");
  var correct = answered.filter(function(a,i){return a===QUIZ[i].correct;}).length;

  var rp = document.getElementById("resultsPanel");
  rp.classList.remove("hidden");
  rp.innerHTML="";
  rp.appendChild(el("h2",null,"Your results"));
  rp.appendChild(el("p","score","You answered <b>"+correct+" of "+QUIZ.length+"</b> correctly."));

  var bd = el("div","breakdown");
  QUIZ.forEach(function(q,i){
    var right = answered[i]===q.correct;
    var row = el("div","brow");
    row.innerHTML = '<span class="bi">'+(right?CHECK:CROSS)+'</span>' +
      '<span class="bt"><span class="bterm">'+esc(q.term)+'</span>'+(right?'':' (revisit in the reading: '+esc(q.src)+')')+'</span>';
    bd.appendChild(row);
  });
  rp.appendChild(bd);

  var act = el("div","actions");
  var again = el("button","btn secondary","Retake the self-test");
  again.addEventListener("click", function(){ idx=0; answered=QUIZ.map(function(){return null;}); hintShown={};
    document.getElementById("qpanel").classList.remove("hidden"); rp.classList.add("hidden"); renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); });
  act.appendChild(again);
  rp.appendChild(act);

  rp.appendChild(el("p","selfnote","This self-test scores only these multiple-choice items, and your score is not saved or sent anywhere. Terms you missed are the ones to practice producing from memory."));
  window.scrollTo({top:0,behavior:"smooth"});
}

init();
</script>
</body>
</html>
