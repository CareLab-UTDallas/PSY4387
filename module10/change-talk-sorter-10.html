<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Talk Sorter: Arturo</title>
<style>
  :root{
    --bg:#faf9f7; --ink:#1f1e1c; --muted:#6b6862; --line:#e7e4de;
    --panel:#ffffff; --panel-shadow:0 1px 2px rgba(28,27,25,.04),0 6px 20px rgba(28,27,25,.05);
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --do-bg:#f3f1ec; --do-ink:#57544e;
    --correct-bg:#eef5ee; --correct-line:#bcd6bd; --correct-ink:#3c6b3e;
    --wrong-bg:#fbecec; --wrong-line:#e3b9b9; --wrong-ink:#a23b34;
    --amber-bg:#fffbef; --amber-line:#e7c98a; --amber-ink:#8a6d2f;
    --instr-bg:#eef3fb; --instr-line:#c9d9f0; --instr-ink:#2f4a72;
    --focus:#2f6f4f; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55;}
  .wrap{max-width:780px;margin:0 auto;padding:24px 20px 60px;}
  .masthead{padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .masthead h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em;}
  .masthead .sub{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:70ch;}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;}
  .stp{font-size:12.5px;color:var(--muted);background:#eceae4;border-radius:999px;padding:4px 11px;}
  .stp.on{background:var(--accent);color:#fff;}
  .stp.done{background:var(--correct-bg);color:var(--correct-ink);}
  .case{background:var(--amber-bg);border:1px solid var(--amber-line);color:#5d4a1f;border-radius:12px;padding:13px 16px;margin-bottom:14px;font-size:14px;line-height:1.6;}
  .case b.t{display:block;margin-bottom:3px;color:var(--amber-ink);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--panel-shadow);padding:22px 24px;}
  .intro{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);border-radius:12px;padding:13px 16px;margin-bottom:16px;font-size:14px;line-height:1.55;}
  .intro b{font-weight:700;}
  .qtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px;}
  .qtop .qn{font-size:13px;color:var(--muted);}
  .qtop .tag{font-size:12px;color:var(--muted);background:#eceae4;border-radius:7px;padding:4px 10px;}
  .qprompt{font-size:17px;font-weight:600;margin:6px 0 6px;line-height:1.45;}
  .quote{font-size:17px;line-height:1.5;margin:8px 0 10px;padding:10px 14px;background:#f7f6f4;border-left:3px solid var(--accent);border-radius:6px;}
  .do{background:var(--do-bg);color:var(--do-ink);border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.5;margin:10px 0 16px;}
  .do b{color:var(--ink);}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;font-size:14.5px;line-height:1.5;cursor:pointer;color:var(--ink);transition:border-color .12s,background .12s;}
  .opt:hover:not(:disabled){border-color:#cfc9bf;}
  .opt:focus-visible,.btn:focus-visible,.cat:focus-visible,.node:focus-visible,.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:15px;}
  .opt:disabled{cursor:default;}
  .opt.correct,.cat.correct{background:var(--correct-bg);border-color:var(--correct-line);}
  .opt.wrong,.cat.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .opt.dim{opacity:.6;}
  .cats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .cat{flex:1 1 150px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--ink);text-align:center;}
  .cat:hover:not(:disabled){border-color:#cfc9bf;}
  .cat:disabled{cursor:default;}
  .cat.dim{opacity:.6;}
  .verdict{margin:16px 0 0;font-size:14.5px;font-weight:600;}
  .verdict.ok{color:var(--correct-ink);} .verdict.no{color:var(--wrong-ink);}
  .explain{margin:8px 0 0;font-size:14px;color:#44413b;line-height:1.6;}
  .explain .src{color:var(--muted);font-size:12.5px;margin-top:6px;}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 19px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;}
  .btn:hover{filter:brightness(1.05);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .seq{list-style:none;margin:8px 0 12px;padding:0;display:flex;flex-direction:column;gap:8px;}
  .seq li{display:flex;gap:10px;align-items:flex-start;background:#f7f6f4;border:1px dashed #d8d3c8;border-radius:10px;padding:10px 13px;font-size:14.5px;min-height:44px;}
  .seq li .n{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:18px;}
  .seq li.filled{background:#fff;border:1px solid var(--line);}
  .seq li.right{background:var(--correct-bg);border-color:var(--correct-line);}
  .seq li.bad{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .pool{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .node{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--ink);}
  .node:hover:not(:disabled){border-color:#cfc9bf;}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0 4px;}
  .chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip.right{background:var(--correct-bg);border-color:var(--correct-line);color:var(--correct-ink);}
  .chip.miss{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber-ink);}
  .chip.extra{background:var(--wrong-bg);border-color:var(--wrong-line);color:var(--wrong-ink);}
  .chip:disabled{cursor:default;}
  .ex ul{margin:6px 0 0 18px;padding:0;font-size:14px;color:#44413b;}
  .results h2{margin:0 0 4px;font-size:20px;}
  .results .score{font-size:16px;margin:0 0 4px;} .results .score b{color:var(--accent-ink);}
  .results .brow{display:flex;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid #f0eee9;}
  .results .brow:last-child{border-bottom:none;}
  .results .brow .bs{flex:0 0 64px;font-weight:700;color:var(--accent-ink);}
  .selfnote{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.55;}
  .take{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);border-radius:12px;padding:13px 16px;margin-top:14px;font-size:14px;}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Change Talk Sorter</h1>
    <p class="sub">Sort statements into change talk and sustain talk, choose responses that invite more, and match the response to readiness.</p>
  </div>
  <div id="root"></div>
</div>
<script>
var STEPS = [
 {
  "type": "classify",
  "title": "Sort the statements",
  "short": "Sort statements",
  "tag": "Change talk or sustain talk",
  "case": {
   "title": "Case: Arturo, 29",
   "text": "Arturo has been drinking more since a breakup. A counselor asks, “How do you feel about how much you have been drinking?” Over the first half hour, he says the following."
  },
  "intro": "<b>Step 1.<\/b> Change talk points toward change in the person’s own words. Sustain talk argues for keeping things the same. Doubt about ability also counts as sustain talk.",
  "doThis": "Choose change talk or sustain talk.",
  "cats": [
   {
    "id": "ch",
    "label": "Change talk"
   },
   {
    "id": "su",
    "label": "Sustain talk"
   }
  ],
  "src": "Module 10, Motivational Interviewing, Revisited",
  "items": [
   {
    "text": "“Most of my friends drink more than I do.”",
    "answer": "su",
    "why": "A comparison that argues the problem is not a problem."
   },
   {
    "text": "“I can’t picture a Friday night without drinks.”",
    "answer": "su",
    "why": "A statement of how hard it would be to change. It points toward keeping things the same."
   },
   {
    "text": "“I could try keeping it to weekends.”",
    "answer": "ch",
    "why": "He describes a concrete step he might take."
   },
   {
    "text": "“I skipped the gym again and I hate that.”",
    "answer": "ch",
    "why": "He names a downside of the status quo in his own words."
   },
   {
    "text": "“It’s not like I’m falling apart. I still get to work every day.”",
    "answer": "su",
    "why": "He argues that things are fine as they are."
   },
   {
    "text": "“I’ve been wondering what my life would look like if I cut back.”",
    "answer": "ch",
    "why": "Imagining something different is a flicker of change talk, and a listener can invite more."
   },
   {
    "text": "“I tried to stop last year and it lasted a week, so why bother.”",
    "answer": "su",
    "why": "Doubt about ability is sustain talk, because it argues against changing, even when it sounds sad."
   },
   {
    "text": "“I want to feel like myself again.”",
    "answer": "ch",
    "why": "A wish for something better, in his own words."
   }
  ],
  "revisit": "Reread “Motivational Interviewing, Revisited.”"
 },
 {
  "type": "mcq",
  "title": "Choose the response",
  "short": "Respond",
  "tag": "Evoking more change talk",
  "case": {
   "title": "Case: Arturo, 29",
   "text": "The counselor wants to invite more change talk without pushing."
  },
  "intro": "<b>Step 2.<\/b> For each statement from Arturo, choose the response that is most likely to move the conversation toward change.",
  "doThis": "Choose the best response to each statement.",
  "src": "Module 10, Motivational Interviewing, Revisited",
  "items": [
   {
    "prompt": "Arturo says, “I don’t love it. I felt rough this morning.” Which response invites more change talk?",
    "options": [
     {
      "id": "a",
      "text": "“Is it that bad, though, if it’s only a few drinks most nights?”"
     },
     {
      "id": "b",
      "text": "“Many people feel rough after drinking, which makes it a common experience.”"
     },
     {
      "id": "c",
      "text": "“What don’t you love about it? I would like to hear more about that morning.”"
     },
     {
      "id": "d",
      "text": "“You should cut back, and here are three approaches that tend to work for people.”"
     }
    ],
    "correct": "c",
    "why": "An open question about the part he named lets him say more in his own words. Advice supplies the reasons for him, normalizing sides with the sustain talk, and the last option asks him to defend the drinking.",
    "src": "Module 10"
   },
   {
    "prompt": "Arturo says, “Everyone drinks this much when work gets stressful.” Which response keeps both sides in play?",
    "options": [
     {
      "id": "a",
      "text": "“It feels normal among people you know, and you also noticed how rough this morning felt.”"
     },
     {
      "id": "b",
      "text": "“Let’s go through the health risks so that you understand why this matters.”"
     },
     {
      "id": "c",
      "text": "“Normal does not mean healthy, and stress is not an excuse for what you have been doing.”"
     },
     {
      "id": "d",
      "text": "“Not everyone drinks this much, and you are comparing yourself to the wrong people.”"
     }
    ],
    "correct": "a",
    "why": "A reflection that includes both sides respects what he said and points at what he noticed. Arguing against the comparison or listing risks hands him the job of defending the drinking.",
    "src": "Module 10"
   },
   {
    "prompt": "Arturo says, “I tried to stop last year and it lasted a week.” Which response draws out his ability?",
    "options": [
     {
      "id": "a",
      "text": "“A week shows you can do it for a stretch. What helped you get through it?”"
     },
     {
      "id": "b",
      "text": "“Most people who try to stop slip back in the first month, so a week is typical.”"
     },
     {
      "id": "c",
      "text": "“Since that attempt did not hold, we can try a different approach this time.”"
     },
     {
      "id": "d",
      "text": "“Then stopping may not be realistic for you, so we can plan around that.”"
     }
    ],
    "correct": "a",
    "why": "Affirming what he did and asking what helped elicits confidence talk. The other responses confirm his doubt or treat the attempt as a failure.",
    "src": "Module 10"
   }
  ],
  "revisit": "Reread “Motivational Interviewing, Revisited.”"
 },
 {
  "type": "mcq",
  "title": "Match the response to readiness",
  "short": "Match readiness",
  "tag": "Meeting people where they are",
  "case": {
   "title": "Three invented clients",
   "text": "Three invented clients arrive at different points. A helper who treats everyone as ready to act gives advice that feels like pressure."
  },
  "intro": "<b>Step 3.<\/b> Readiness moves. Choose the response that fits where each person actually is.",
  "doThis": "Choose the best response for each client.",
  "src": "Module 10, Readiness",
  "items": [
   {
    "prompt": "A client says, “I don’t think my drinking is an issue. My brother made me come.” Which stance fits?",
    "options": [
     {
      "id": "a",
      "text": "List the consequences of continued drinking so that he can see the reasons to change"
     },
     {
      "id": "b",
      "text": "End the session early, since he does not see a problem and a conversation will not help"
     },
     {
      "id": "c",
      "text": "Offer a detailed plan for cutting back so that he can start when he is ready"
     },
     {
      "id": "d",
      "text": "Stay curious about what he notices and raise awareness without arguing"
     }
    ],
    "correct": "d",
    "why": "A person who does not yet see a problem is not helped by a plan or a list of consequences. Curious, exploratory conversation can open the door without argument.",
    "src": "Module 10"
   },
   {
    "prompt": "A client says, “Part of me wants to cut back and part of me thinks I would lose my friends.” Which stance fits?",
    "options": [
     {
      "id": "a",
      "text": "Choose a side for him, since he has not been able to decide for himself and may need a push"
     },
     {
      "id": "b",
      "text": "Help him explore both sides so that his own reasons come into focus"
     },
     {
      "id": "c",
      "text": "Present an action plan, since torn clients benefit most from a clear next step"
     },
     {
      "id": "d",
      "text": "Wait in silence until he decides, so that the decision is entirely his"
     }
    ],
    "correct": "b",
    "why": "Ambivalence resolves when the person hears both sides in his own voice. Choosing for him or rushing to a plan treats him as further along than he is.",
    "src": "Module 10"
   },
   {
    "prompt": "A client says, “I’m going to cut back to weekends starting Monday. What should I do about Friday?” Which stance fits?",
    "options": [
     {
      "id": "a",
      "text": "Warn him about the likelihood of relapse so that he is prepared for it"
     },
     {
      "id": "b",
      "text": "Shift toward planning and encouragement, since he has voiced a commitment"
     },
     {
      "id": "c",
      "text": "Reopen the question of whether he is ready, since his plan may be too ambitious"
     },
     {
      "id": "d",
      "text": "Suggest he aim to stop completely, since weekends only may leave too much exposure to alcohol"
     }
    ],
    "correct": "b",
    "why": "A person who is ready to act benefits from planning and support. Reopening the decision or arguing for a different goal pushes him back toward doubt.",
    "src": "Module 10"
   }
  ],
  "revisit": "Reread “Readiness.”"
 }
];
var SUMMARY = {
 "title": "What you traced",
 "takeaway": "<b>Carry forward.<\/b> People talk themselves into change, so the work is to notice change talk, invite more of it, and fit the conversation to the person’s readiness. Arguing for change tends to bring out arguments against it.",
 "note": "This activity scores only the machine-checkable items, and nothing is saved or sent. Arturo and the other clients are invented."
};


function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var root=document.getElementById("root");
var S;
function newState(){ return {k:0, i:0, picked:null, seq:[], tries:0, revealed:false, sel:{}, checked:false, miss:[], retry:false, rq:[], order:[], res:STEPS.map(function(){return {score:0,max:0,done:false};})}; }
function reset(){ S=newState(); STEPS.forEach(function(st,ix){ st.maxScore=maxFor(st); S.res[ix].max=st.maxScore; }); render(); }
function maxFor(st){ if(st.type==="classify"||st.type==="mcq") return st.items.length; return 1; }
function post(){ try{ parent.postMessage(JSON.stringify({subject:"lti.frameResize",height:document.documentElement.scrollHeight}),"*"); }catch(e){} }
function toTop(){ try{ window.scrollTo({top:0,behavior:"smooth"}); }catch(e){} }
function bar(){
  return '<div class="steps" aria-hidden="true">'+STEPS.map(function(st,ix){
    var cls="stp"+(ix===S.k?" on":(S.res[ix].done?" done":""));
    return '<span class="'+cls+'">'+(ix+1)+'. '+esc(st.short||st.title)+'</span>'; }).join("")+'</div>';
}
function caseCard(st){ return st.case ? '<div class="case"><b class="t">'+esc(st.case.title)+'</b>'+st.case.text+'</div>' : ""; }
function render(){
  if(S.k>=STEPS.length){ return renderSummary(); }
  var st=STEPS[S.k], h=bar()+caseCard(st);
  if(S.i===0 && !S.started && st.intro){ h+='<div class="intro">'+st.intro+'</div>'; }
  h+='<section class="panel" aria-live="polite">';
  h+=({classify:rClassify,order:rOrder,mcq:rMcq,multi:rMulti})[st.type](st);
  h+='</section>';
  root.innerHTML=h; post();
}
function nextBtn(label){ return '<div class="foot"><span></span><button class="btn" type="button" data-act="next">'+label+'</button></div>'; }
function advanceLabel(st){
  var multi=(st.type==="classify"||st.type==="mcq");
  var last=multi?(S.i>=lastIdx(st) && !(!S.retry && S.miss.length)):true;
  if(!last) return (multi && S.i>=lastIdx(st))?"Take a second look at the ones you missed":"Next";
  return (S.k>=STEPS.length-1)?"See your results":"Continue to the next step";
}
function curItems(st){ return S.retry ? S.rq.map(function(ix){return st.items[ix];}) : st.items; }
function itemIx(st){ return S.retry ? S.rq[S.i] : S.i; }
function shuffled(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t; } return b; }
function retryBanner(){ return S.retry ? '<div class="intro"><b>Second look.</b> You missed this one the first time. The explanation you read applies here. Answer again without it. A correct answer now counts for half a point.</div>' : ""; }
function lastIdx(st){ return S.retry ? S.rq.length-1 : st.items.length-1; }
/* ---- classify ---- */
function rClassify(st){
  var it=curItems(st)[S.i], ans=S.picked!==null;
  var h=retryBanner()+'<div class="qtop"><span class="qn">'+esc(st.title)+', '+(S.retry?'second look ':'item ')+(S.i+1)+' of '+curItems(st).length+'</span><span class="tag">'+esc(st.tag||"")+'</span></div>';
  h+='<p class="quote">'+it.text+'</p>';
  h+='<div class="do"><b>Do this:</b> '+st.doThis+'</div><div class="cats">';
  st.cats.forEach(function(c){
    var cls="cat"; if(ans){ if(c.id===it.answer) cls+=" correct"; else if(c.id===S.picked) cls+=" wrong"; else cls+=" dim"; }
    h+='<button class="'+cls+'" type="button" data-act="cls" data-val="'+c.id+'"'+(ans?" disabled":"")+'>'+esc(c.label)+'</button>';
  });
  h+='</div>';
  if(ans){ var ok=S.picked===it.answer;
    h+='<p class="verdict '+(ok?"ok":"no")+'">'+(ok?"Correct.":"Not quite.")+'</p><div class="explain">'+it.why+(st.src?'<div class="src">Reading: '+esc(st.src)+'</div>':'')+'</div>'+nextBtn(advanceLabel(st));
  }
  return h;
}
/* ---- order ---- */
function rOrder(st){
  var chosen=S.seq, done=S.revealed||S.orderOk, full=chosen.length===st.correct.length;
  var h='<div class="qtop"><span class="qn">'+esc(st.title)+'</span><span class="tag">'+esc(st.tag||"")+'</span></div>';
  h+='<p class="qprompt">'+st.prompt+'</p><div class="do"><b>Do this:</b> '+st.doThis+'</div>';
  h+='<ol class="seq">';
  for(var p=0;p<st.correct.length;p++){
    var id=chosen[p], node=id?nodeById(st,id):null, cls="";
    if(node){ cls="filled"; if(full||done){ cls+= (id===st.correct[p])?" right":" bad"; } }
    var shown=node?node.text:"";
    if(S.revealed && !node){ shown=nodeById(st,st.correct[p]).text; }
    h+='<li class="'+cls+'"><span class="n">'+(p+1)+'</span><span>'+(shown?shown:'<span style="color:var(--muted)">…</span>')+'</span></li>';
  }
  h+='</ol>';
  if(!full && !S.revealed){
    h+='<div class="pool">';
    st.nodes.forEach(function(n){ if(chosen.indexOf(n.id)<0) h+='<button class="node" type="button" data-act="ord" data-val="'+n.id+'">'+n.text+'</button>'; });
    h+='</div><div class="foot"><span></span>'+(chosen.length?'<button class="btn secondary" type="button" data-act="undo">Undo last</button>':'')+'</div>';
  } else if(full && !S.orderOk && !S.revealed){
    h+='<p class="verdict no">Not quite. Green rows are in the right place and red rows are not.</p><p class="explain">'+st.hintWrong+'</p>';
    h+='<div class="foot"><button class="btn secondary" type="button" data-act="reveal">Show me the sequence</button><button class="btn" type="button" data-act="retry">Try again</button></div>';
  } else {
    h+='<p class="verdict '+(S.orderOk?"ok":"no")+'">'+(S.orderOk?"Correct.":"The sequence is complete.")+'</p><div class="explain">'+st.why+(st.src?'<div class="src">Reading: '+esc(st.src)+'</div>':'')+'</div>'+nextBtn(advanceLabel(st));
  }
  return h;
}
function nodeById(st,id){ for(var i=0;i<st.nodes.length;i++) if(st.nodes[i].id===id) return st.nodes[i]; return null; }
/* ---- mcq ---- */
function rMcq(st){
  var it=curItems(st)[S.i], ans=S.picked!==null;
  var h=retryBanner()+'<div class="qtop"><span class="qn">'+esc(st.title)+', '+(S.retry?'second look ':'question ')+(S.i+1)+' of '+curItems(st).length+'</span><span class="tag">'+esc(st.tag||"")+'</span></div>';
  h+='<p class="qprompt">'+it.prompt+'</p>';
  if(st.doThis) h+='<div class="do"><b>Do this:</b> '+st.doThis+'</div>';
  h+='<div class="options">';
  (S.retry?S.order[S.i]:it.options).forEach(function(o,oi){
    var cls="opt"; if(ans){ if(o.id===it.correct) cls+=" correct"; else if(o.id===S.picked) cls+=" wrong"; else cls+=" dim"; }
    h+='<button class="'+cls+'" type="button" data-act="pick" data-val="'+o.id+'"'+(ans?" disabled":"")+'><span class="k">'+String.fromCharCode(65+oi)+'.</span><span>'+o.text+'</span></button>';
  });
  h+='</div>';
  if(ans){ var ok=S.picked===it.correct;
    h+='<p class="verdict '+(ok?"ok":"no")+'">'+(ok?"Correct.":"Not quite.")+'</p><div class="explain">'+it.why+(it.src||st.src?'<div class="src">Reading: '+esc(it.src||st.src)+'</div>':'')+'</div>'+nextBtn(advanceLabel(st));
  }
  return h;
}
/* ---- multi ---- */
function rMulti(st){
  var h='<div class="qtop"><span class="qn">'+esc(st.title)+'</span><span class="tag">'+esc(st.tag||"")+'</span></div>';
  h+='<p class="qprompt">'+st.prompt+'</p><div class="do"><b>Do this:</b> '+st.doThis+'</div><div class="chips">';
  st.options.forEach(function(o){
    var on=!!S.sel[o.id], truth=st.truth.indexOf(o.id)>=0, cls="chip";
    if(S.checked){ if(on&&truth) cls+=" right"; else if(!on&&truth) cls+=" miss"; else if(on&&!truth) cls+=" extra"; }
    h+='<button class="'+cls+'" type="button" aria-pressed="'+(on?"true":"false")+'" data-act="tog" data-val="'+o.id+'"'+(S.checked?" disabled":"")+'>'+esc(o.label)+'</button>';
  });
  h+='</div>';
  if(!S.checked){
    var n=Object.keys(S.sel).filter(function(k){return S.sel[k];}).length;
    h+='<div class="foot"><span class="qn" style="font-size:13px;color:var(--muted)">'+n+' selected</span><button class="btn" type="button" data-act="chk"'+(n?"":" disabled")+'>Check my answer</button></div>';
  } else {
    var tp=0,fp=0; st.options.forEach(function(o){ var on=!!S.sel[o.id], t=st.truth.indexOf(o.id)>=0; if(on&&t) tp++; if(on&&!t) fp++; });
    var sc=Math.max(0,(tp-fp))/st.truth.length;
    h+='<p class="verdict '+(sc>=1?"ok":"no")+'">'+(sc>=1?"You found every process, with nothing extra.":"Green marks a correct selection, amber a missed process, and red a process that is not present in this case.")+'</p>';
    h+='<div class="explain ex"><ul>'+st.options.filter(function(o){ var on=!!S.sel[o.id], t=st.truth.indexOf(o.id)>=0; return t||on; }).map(function(o){ var t=st.truth.indexOf(o.id)>=0; return '<li><b>'+esc(o.label)+'.</b> '+(st.reasons[o.id]||(t?"Present.":"Not present in this case."))+'</li>'; }).join("")+'</ul>'+(st.src?'<div class="src">Reading: '+esc(st.src)+'</div>':'')+'</div>'+nextBtn(advanceLabel(st));
  }
  return h;
}
/* ---- summary ---- */
function renderSummary(){
  var tot=0,max=0; S.res.forEach(function(r){ tot+=r.score; max+=r.max; });
  var h=bar()+'<section class="panel results"><h2>'+esc(SUMMARY.title)+'</h2><p class="score">You earned <b>'+(Math.round(tot*10)/10)+' of '+max+'</b> points on the scored items. Items answered correctly on the second look count for half a point.</p><div>';
  STEPS.forEach(function(st,ix){ var r=S.res[ix]; h+='<div class="brow"><span class="bs">'+(Math.round(r.score*10)/10)+' / '+r.max+'</span><span><b>'+esc(st.title)+'.</b> '+(r.score>=r.max?"Full marks.":esc(st.revisit||"Revisit this step."))+'</span></div>'; });
  h+='</div><div class="take">'+SUMMARY.takeaway+'</div><div class="foot"><span></span><button class="btn secondary" type="button" data-act="again">Start over</button></div><p class="selfnote">'+SUMMARY.note+'</p></section>';
  root.innerHTML=h; post();
}
/* ---- actions ---- */
function act(a,v){
  var st=STEPS[S.k];
  if(a==="cls"){ if(S.picked!==null) return; S.picked=v; var it=curItems(st)[S.i]; if(v===it.answer) S.res[S.k].score+=(S.retry?0.5:1); else if(!S.retry) S.miss.push(S.i); render(); return; }
  if(a==="pick"){ if(S.picked!==null) return; S.picked=v; var q=curItems(st)[S.i]; if(v===q.correct) S.res[S.k].score+=(S.retry?0.5:1); else if(!S.retry) S.miss.push(S.i); render(); return; }
  if(a==="ord"){ if(S.seq.length>=st.correct.length||S.revealed) return; S.seq.push(v); if(S.seq.length===st.correct.length){ S.tries++; var ok=S.seq.every(function(x,i){return x===st.correct[i];}); if(ok){ S.orderOk=true; S.res[S.k].score=(S.tries===1)?1:0.5; S.res[S.k].done=true; } } render(); return; }
  if(a==="undo"){ S.seq.pop(); render(); return; }
  if(a==="retry"){ S.seq=[]; render(); return; }
  if(a==="reveal"){ S.revealed=true; S.res[S.k].done=true; render(); return; }
  if(a==="tog"){ if(S.checked) return; S.sel[v]=!S.sel[v]; render(); return; }
  if(a==="chk"){ var tp=0,fp=0; st.options.forEach(function(o){ var on=!!S.sel[o.id], t=st.truth.indexOf(o.id)>=0; if(on&&t) tp++; if(on&&!t) fp++; }); S.res[S.k].score=Math.max(0,(tp-fp))/st.truth.length; S.checked=true; S.res[S.k].done=true; render(); return; }
  if(a==="next"){
    var multiItem=(st.type==="classify"||st.type==="mcq");
    if(multiItem && S.i<lastIdx(st)){ S.i++; S.picked=null; render(); toTop(); return; }
    if(multiItem && !S.retry && S.miss.length){ S.retry=true; S.rq=S.miss.slice(); S.miss=[]; S.i=0; S.picked=null; if(st.type==="mcq"){ S.order=S.rq.map(function(ix){ return shuffled(st.items[ix].options); }); } render(); toTop(); return; }
    S.res[S.k].done=true; S.k++; S.i=0; S.retry=false; S.rq=[]; S.miss=[]; S.order=[]; S.picked=null; S.seq=[]; S.tries=0; S.revealed=false; S.orderOk=false; S.sel={}; S.checked=false; render(); toTop(); return;
  }
  if(a==="again"){ reset(); toTop(); return; }
}
root.addEventListener("click",function(e){ var t=e.target.closest("[data-act]"); if(!t||t.disabled) return; act(t.getAttribute("data-act"),t.getAttribute("data-val")); });
reset();

</script>
