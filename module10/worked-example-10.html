<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worked Example: From Ambivalence to Choice</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f7f6f4; --ink:#1f1e1c; --muted:#6f6c66;
    --line:#e7e4de; --line2:#eceae4;
    --clinician-bubble:#efe7e0; --patient-bubble:#eceae7;
    --amber-bg:#fffbef; --amber-line:#e7c98a; --amber-ink:#8a6d2f;
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --instr-bg:#eef3fb; --instr-line:#c9d9f0; --instr-ink:#2f4a72;
    --tab-active:#8a5a25;
    --chip-bg:#e9e7e2; --chip-ink:#4a4740;
    --field:#ffffff; --focus:#2f6f4f;
    --ok-bg:#eef5ee; --ok-line:#bcd6bd; --ok-ink:#3c5c3e;
    --radius:16px; --r-sm:11px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:940px;margin:0 auto;padding:22px 18px 60px;}

  /* Stage tabs */
  .stagebar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .stage-tab{display:flex;align-items:center;gap:10px;border:1px solid var(--line);
    background:#fff;color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer;
    font-size:14.5px;transition:.15s;}
  .stage-tab .n{color:var(--muted);}
  .stage-tab[aria-selected="true"]{background:var(--tab-active);border-color:var(--tab-active);color:#fff;}
  .stage-tab[aria-selected="true"] .n{color:#f0dcc6;}
  .stage-tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .arrow{color:var(--muted);}
  .progress{display:flex;gap:5px;margin-left:auto;align-items:center;}
  .pdot{width:26px;height:6px;border-radius:3px;background:var(--line);}
  .pdot.on{background:var(--accent);}

  /* Card shell */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px 24px 26px;}
  h2.sess{margin:0 0 6px;font-size:22px;letter-spacing:-.01em;}
  .sess-blurb{margin:0 0 14px;color:var(--muted);font-size:15px;max-width:70ch;}
  .metarow{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:8px;}
  .metaline{font-size:13.5px;margin:5px 0;padding:6px 10px;border-radius:8px;display:inline-block;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4;}
  .metaline.mech{background:#fdf3e7;color:#8a5a25;}
  .metaline.intv{background:#eaf4ee;color:#3c5c3e;}
  .metaline b{font-weight:700;}
  .adaptbanner{background:#f1ecfa;border:1px solid #d9cdf0;color:#5b3c8a;border-radius:12px;padding:12px 15px;margin:14px 0 4px;font-size:13.5px;line-height:1.5;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .adaptbanner b{font-weight:700;}
  .adaptbanner .back{flex:0 0 auto;background:none;border:none;color:#5b3c8a;text-decoration:underline;cursor:pointer;font:inherit;font-size:13.5px;padding:0;}
  .adaptbanner .back:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .pchip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13px;}
  .pchip b{font-weight:600;}
  .scen{background:var(--chip-bg);color:var(--chip-ink);border-radius:8px;padding:5px 11px;font-size:13px;}
  .recafter{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13.5px;margin:6px 0 2px;}
  .recafter a{color:var(--accent);text-decoration:none;cursor:default;}

  /* Instruction box */
  .instr{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);
    border-radius:12px;padding:14px 16px;margin:16px 0 20px;font-size:14px;line-height:1.55;}
  .instr h3{margin:0 0 6px;font-size:14px;font-weight:700;}
  .instr b{font-weight:700;}
  .instr .done{font-weight:700;}

  /* Chat */
  .chat{display:flex;flex-direction:column;gap:16px;}
  .row{display:flex;gap:12px;}
  .row.cl{flex-direction:row-reverse;}
  .avatar{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#efe7df;
    display:grid;place-items:center;margin-top:20px;}
  .row.pt .avatar{background:#e9e9e6;}
  .stack{max-width:74%;display:flex;flex-direction:column;gap:8px;}
  .who{font-size:12.5px;color:var(--muted);}
  .row.cl .who{text-align:right;}
  .bubble{border-radius:14px;padding:13px 15px;font-size:15px;line-height:1.5;}
  .row.cl .bubble{background:var(--clinician-bubble);border-top-right-radius:5px;text-align:right;}
  .row.pt .bubble{background:var(--patient-bubble);border-top-left-radius:5px;}
  .tech{background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:10px;
    padding:10px 13px;font-size:13px;color:var(--amber-ink);line-height:1.5;text-align:left;}
  .tech b{color:var(--amber-ink);font-weight:700;}

  /* Toggle */
  .toggle{margin-top:24px;border-top:1px solid var(--line);padding-top:18px;}
  .toggle h4{margin:0 0 4px;font-size:15px;}
  .toggle p{margin:0 0 12px;color:var(--muted);font-size:13.5px;max-width:74ch;}
  .toggle-btns{display:flex;flex-wrap:wrap;gap:9px;}
  .tbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 15px;
    cursor:pointer;font-size:13.5px;color:var(--ink);transition:.15s;}
  .tbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
  .tbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .tbtn-link{border:none;background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:13.5px;padding:9px 6px;text-decoration:none;}
  .tbtn-link[aria-pressed="true"]{color:var(--ink);font-weight:600;}
  .tbtn-link:hover{color:var(--ink);}
  .tbtn-link:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  /* Stage 2 gaps */
  .gapwrap{display:flex;flex-direction:column;gap:8px;}
  .gap-ta{width:100%;min-height:82px;resize:vertical;border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;background:var(--field);
    border-top-right-radius:5px;}
  .gap-ta:focus{outline:none;border-color:var(--focus);}
  .gap-ta.locked{background:#f3f1ec;color:#55524c;}
  .submit{align-self:flex-end;background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:10px 18px;font-size:14px;cursor:pointer;}
  .submit:disabled{opacity:.5;cursor:default;}
  .submit:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .compare{display:flex;flex-direction:column;gap:10px;margin-top:2px;}
  .cmp-card{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;text-align:left;}
  .cmp-expert{background:var(--clinician-bubble);}
  .cmp-expert .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);font-weight:700;margin-bottom:4px;}
  .cmp-tech{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);}
  .cmp-tech b{font-weight:700;}
  .cmp-fb{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok-ink);}
  .cmp-fb .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:5px;}
  .cmp-fb p{margin:0 0 7px;}
  .cmp-fb .k{font-weight:700;}

  .status{font-size:13px;color:var(--muted);margin-top:14px;}
  .status b{color:var(--accent-ink);}
  .hidden{display:none !important;}
  .done-banner{margin-top:16px;background:var(--ok-bg);border:1px solid var(--ok-line);
    color:var(--ok-ink);border-radius:12px;padding:14px 16px;font-size:14.5px;}
  .done-banner b{font-weight:700;}

  .bottom-nav{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;justify-content:flex-end;}
  .bottom-nav.back{justify-content:flex-start;}
  .nav-btn{display:inline-flex;align-items:center;gap:9px;border:none;cursor:pointer;
    background:var(--accent);color:#fff;border-radius:10px;padding:12px 20px;font-size:15px;
    font-weight:600;transition:.15s;}
  .nav-btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .nav-btn:hover{filter:brightness(1.05);}
  .nav-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  @media(max-width:560px){
    .stack{max-width:86%;}
    .panel{padding:18px 15px 20px;}
    h2.sess{font-size:19px;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">

  <div class="stagebar">
    <button class="stage-tab" id="tab1" aria-selected="true" onclick="setStage(1)">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10Z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.3" stroke="currentColor" stroke-width="1.5"/></svg>
      <span><span class="n">Stage 1:</span> Learn from the Expert</span>
    </button>
    <span class="arrow">&rarr;</span>
    <button class="stage-tab" id="tab2" aria-selected="false" onclick="setStage(2)">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M4 14.5 13.5 5l2 2L6 16.5 3.5 17l.5-2.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span><span class="n">Stage 2:</span> Fill in the Gaps</span>
    </button>
    <span class="progress" id="progress" aria-hidden="true"><span class="pdot on"></span><span class="pdot" id="pdot2"></span></span>
  </div>

  <div class="panel">
    <h2 class="sess" id="sessTitle"></h2>
    <p class="sess-blurb" id="sessBlurb"></p>
    <div class="metarow">
      <span class="pchip" id="pchip"></span>
      <span class="scen" id="scen"></span>
    </div>
    <div class="metaline mech" id="metaMech"></div>
    <div class="metaline intv" id="metaIntv"></div>
    <div class="recafter" id="recafter"></div>

    <div class="adaptbanner hidden" id="adaptBanner"></div>

    <div class="instr" id="instr"></div>

    <div class="chat" id="chat"></div>

    <!-- Stage 1 patient toggle -->
    <div class="toggle hidden" id="toggle">
      <h4>Explore with a different patient</h4>
      <p>The clinical situation, mechanism, techniques, and reasoning stay the same while the patient details and communication style change. Decide what you would change before clicking.</p>
      <div class="toggle-btns" id="toggleBtns"></div>
    </div>

    <div class="done-banner hidden" id="doneBanner"></div>
    <div class="status hidden" id="status"></div>

    <div class="bottom-nav hidden" id="bottomNav"></div>
  </div>
</div>

<script>
// Worked example data. Transcript, technique annotations and gap feedback are original and grounded in the module reading.
const SESSION = {
 "title": "From Ambivalence to Choice: Starting Trauma-Focused Care With Informed Consent",
 "tag": "Intervention",
 "blurb": "A clinician helps a client who wants relief from PTSD symptoms and dreads talking about the accident move to an informed choice about a first step, with a plan to measure whether it is working.",
 "recommendedAfter": [
  "Motivational Interviewing, Revisited and Consent in Trauma-Focused Care (Module 10 reading)"
 ],
 "metaMechanism": "Ambivalence about treatment and an unprocessed memory kept raw by avoidance, with stuck points about blame (“I am careless”)",
 "metaIntervention": "Motivational interviewing with informed consent, which elicits reasons, provides information with permission, elicits the client’s choice, sets a first step, and agrees on measures of avoidance and belief",
 "gapClinicianIndices": [
  1,
  2,
  3,
  4
 ],
 "patients": {
  "baseline": {
   "label": "Greta, 34",
   "chip": "A year after a serious car accident, she avoids driving, has flashbacks and poor sleep, believes “I am careless,” and says she wants relief and dreads talking about the accident",
   "banner": null
  },
  "adolescent": {
   "label": "Zainab, 16",
   "chip": "Eight months after a serious car accident, she has stopped riding in cars and quit swim team, has flashbacks and poor sleep, believes “I am careless,” and says she wants relief and dreads talking about it",
   "banner": "Adolescent (14–16)"
  },
  "literacy": {
   "label": "Beatriz, 44",
   "chip": "A year after a serious car accident, she avoids driving, has flashbacks and poor sleep, believes “I am careless,” and says she wants relief and dreads talking about it. She reads with difficulty",
   "banner": "Limited literacy"
  },
  "older": {
   "label": "Anselm, 72",
   "chip": "A year after a serious car accident, he avoids driving, has flashbacks and poor sleep, believes “I am careless,” and says he wants relief and dreads talking about it",
   "banner": "Older adult (70+)"
  }
 },
 "turns": [
  {
   "role": "clinician",
   "technique": {
    "label": "Start with the client’s own reasons",
    "text": "Opens with the side of the client that wants change and asks what would be different if symptoms eased. The question invites the client to voice reasons in their own words, which predicts later change."
   },
   "text": {
    "baseline": "Greta, last time you told me you want relief and that talking about the accident scares you. Can we start with the part that wants relief? What would be different in your life if the flashbacks and the avoiding eased?",
    "adolescent": "Zainab, last time you said you want relief and that talking about the accident scares you. Can we start with the part that wants relief? What would be different for you if the flashbacks and the avoiding eased?",
    "literacy": "Beatriz, last time you said you want to feel better, and that talking about the accident scares you. Tell me about the wanting to feel better. What would be different in your life if the bad memories eased?",
    "older": "Anselm, last time you told me you want relief and that talking about the accident scares you. May we begin with the part that wants relief? What would be different in your days if the flashbacks and the avoiding eased?"
   }
  },
  {
   "role": "patient",
   "text": {
    "baseline": "I would drive to work again. I would sleep. I would stop snapping at my sister. I just don’t know if I can talk about it without losing it.",
    "adolescent": "I would ride with my friends again. I would go back to swim. I’d stop feeling like nobody gets it. I just don’t know if I can talk about it without losing it.",
    "literacy": "I would drive to work again. I would sleep. I would stop snapping at my sister. I just don’t know if I can talk about it without losing it.",
    "older": "I would drive to the market again. I would sleep through the night. I would not be so short with my daughter. I don’t know that I can talk about it without coming apart."
   }
  },
  {
   "role": "clinician",
   "technique": {
    "label": "Reflect both sides without arguing",
    "text": "Reflects the reasons for change and the fear together and names the ambivalence as understandable. Asks which worry is largest, which lets the client explore the other side without defending it."
   },
   "text": {
    "baseline": "You want to drive again, sleep, and be easier with your sister, and part of you is afraid that talking about the accident will make you fall apart. Both of those make sense to me. What worries you most about starting?",
    "adolescent": "You want to ride with your friends, go back to swim, and feel understood, and part of you is afraid that talking about the accident will make you fall apart. Both of those make sense. What worries you most about starting?",
    "literacy": "You want to drive, sleep, and be kinder with your sister. You are also afraid that talking will make you lose it. Both make sense. What worries you most about starting?",
    "older": "You want to drive again, sleep through the night, and be more patient with your daughter, and part of you fears that talking about it will leave you coming apart. Both of those make sense. What worries you most about starting?"
   }
  },
  {
   "role": "patient",
   "text": {
    "baseline": "That I’ll fall apart and not be able to stop. Or that it will make it all feel real again. I’m not sure it will work. I do think the accident was my fault, and nothing anyone says changes that.",
    "adolescent": "That I’ll fall apart and not be able to stop. Or that it will make it all feel real again. I’m not sure it will even work. I keep thinking the accident was my fault, and nothing anyone says changes that.",
    "literacy": "That I’ll fall apart and not be able to stop. Or that it will make it all feel real again. I’m not sure it will work. I do think the accident was my fault, and nothing anyone says changes that.",
    "older": "That I’ll fall apart and not be able to stop. Or that it will all feel real again. I’m not certain it will help. I believe the accident was my fault, and nothing anyone says alters that."
   }
  },
  {
   "role": "clinician",
   "technique": {
    "label": "Ask permission, give information, ask for the client’s view",
    "text": "Offers information about two treatments after asking permission, including the parts that are hard and the other options. Discloses that distress may rise before it falls and that the studies show similar average results. Then asks what the client makes of it, which keeps the choice with the client."
   },
   "text": {
    "baseline": "Would it be okay if I told you how two of the best-studied treatments for this work, including the hard parts? In one, we approach the memory gradually, at a pace you help set, and distress often rises for a while before it falls. In the other, we work mostly on conclusions like “I am careless,” and we do not begin by retelling the memory in detail. In large studies they help people by similar amounts on average. There are other options too, including medication and waiting, and I can go over those if you like. What do you make of this?",
    "adolescent": "Would it be okay if I told you how two of the best-studied treatments for this work, including the hard parts? In one, we approach the memory gradually, at a pace you help set, and distress often goes up for a while before it goes down. In the other, we work mostly on conclusions like “I am careless,” and we do not begin by retelling the memory in detail. They help people by about the same amount on average. There are other options too, like medication or waiting, and I can go over those if you want. What do you think about this?",
    "literacy": "May I tell you about two treatments, including the hard parts? In one, we go toward the memory slowly, at a speed you help pick. It may feel worse before it feels better. In the other, we work on thoughts like “I am careless,” and we do not start by telling the whole memory. Studies show both help people about the same on average. There are other choices too, like medicine or waiting. Can you tell me in your own words what you heard, so I know I explained it well? Then tell me what you think.",
    "older": "May I explain how two of the best-studied treatments for this work, including the hard parts? In one, we approach the memory gradually, at a pace you help set, and distress often rises for a time before it falls. In the other, we work mostly on conclusions such as “I am careless,” and we do not begin by retelling the memory in detail. In large studies they help people by similar amounts on average. There are other options too, including medication and waiting, and I can go over those. Would it help if I wrote the two down for you to keep? What do you make of this?"
   }

  {
   "role": "patient",
   "text": {
    "baseline": "The belief one sounds like me. I think a lot about how I should have seen it coming. The memory part is what scares me. I’d want to go slow whichever one.",

    "literacy": "One is about the memory, and it might feel worse first. One is about my thoughts, like “I’m careless.” The second one sounds like me. The memory scares me. I’d want to go slow.",
    "older": "The second one sounds like me. I keep thinking I should have seen it coming. The memory is what scares me. I would want to go slowly in either case. Yes, a page to keep would help."
   }
  },
  {
   "role": "clinician",
   "technique": {
    "label": "Respond to the fear with pacing and steadying skills",
    "text": "Validates the fear without promising it will not happen, explains that pacing is a shared skill, and offers steadying skills first. Invites the client to say what would help them feel safe, which keeps the client in charge of the pace."
   },
   "text": {
    "baseline": "Going slow makes sense, and you will have a say in the pace. I would not promise it feels easy. Before any approach to the memory we would build ways to steady yourself, for example on the hard nights. What would help you feel safe enough to try?",
    "adolescent": "Going slow makes sense, and you will have a say in the pace. I would not promise it feels easy. Before any approach to the memory we would build ways to steady yourself, like on the hard nights. What would help you feel safe enough to try?",
    "literacy": "Going slow is fine. You help choose the speed. I will not promise it is easy. First we learn ways to calm yourself, like on hard nights. What would help you feel safe enough to try?",
    "older": "Going slowly makes sense, and you will have a say in the pace. I would not promise it will be easy. Before any approach to the memory we would build ways to steady yourself, such as on difficult nights. What would help you feel safe enough to try?"
   }
  },
  {
   "role": "patient",
   "text": {
    "baseline": "Steadying first would help. I’d want to start with the belief stuff, I think. If you asked me how ready I am, maybe a six out of ten.",
    "adolescent": "Steadying first would help. I’d want to start with the belief stuff, I think. Like, maybe a six out of ten ready.",
    "literacy": "Learning to calm down first would help. I’d want to start with the thoughts, I think. If you asked how ready I am, maybe a six out of ten.",
    "older": "Steadying first would help. I would like to begin with the beliefs, I think. If you asked how ready I am, perhaps a six out of ten."
   }
  },
  {
   "role": "clinician",
   "technique": {
    "label": "Evoke commitment and set up measurement",
    "text": "Asks what makes the rating a six and not a lower number, which draws out the client’s reasons. Then proposes a first step and brief measures of avoidance and of belief, so that the plan can be revised."
   },
   "text": {
    "baseline": "A six is a lot higher than a zero. What makes it a six and not a three? Here is one idea. We start with steadying skills and the belief work, and every few sessions you fill out a short checklist and two ratings, avoidance and how much you believe “I am careless.” That tells us whether it is working, and we can change course if it is not.",
    "adolescent": "A six is a lot higher than a zero. What makes it a six and not a three? Here is one idea. We start with steadying skills and the belief work, and every few sessions you fill out a short checklist and two ratings, avoidance and how much you believe “I am careless.” That tells us if it is working, and we can change the plan if it is not.",

   }

  {

   "technique": {
    "label": "Confirm the choice, keep it revisable, and give a safety net",
    "text": "Summarizes the choice in the client’s words, restates that the client can change their mind, and ends with where to turn between sessions. Consent stays ongoing, and the plan has a safety net."
   },
   "text": {
    "baseline": "Thank you. Today you chose to start with steadying skills and the belief work, with ratings every few sessions, and you can change your mind at any point, including moving to the memory work or pausing. We will talk it through when you do. If things ever feel unsafe between sessions, you can reach the clinic at the number on your card, or call or text 988, or call 911 in an emergency.",
    "adolescent": "Thank you. Today you chose to start with steadying skills and the belief work, with ratings every few sessions, and you can change your mind at any point. Yes, your mom can join the first part if you want her there. A parent or guardian gives legal consent, and your agreement, called assent, matters too. Most of what you tell me stays between us. If I ever worry about your safety, I would need to involve a parent, and I would tell you first. If things ever feel unsafe between sessions, you can call the clinic, or call or text 988, or call 911 in an emergency.",
    "literacy": "Thank you. You chose to start with calming skills and the thoughts, with a few questions every few visits. You can change your mind any time. If things ever feel unsafe, call the clinic at the number on your card, or call or text 988. In an emergency, call 911.",
    "older": "Thank you. Today you chose to start with steadying skills and the belief work, with ratings every few sessions, and you can change your mind at any point. Would a one-page summary of today’s plan help? If things ever feel unsafe between sessions, you can reach the clinic at the number on your card, or call or text 988, or call 911 in an emergency."
   }
  }
 ]
};

const GAP_FEEDBACK = {
 "1": {
  "lookFor": "A response that reflects the reasons for change and the fear together, names the mixed feelings as understandable, and asks an open question about the worry without arguing against it.",
  "why": "People defend whichever side of themselves gets argued against. Reflecting both sides keeps the client voicing their own reasons, and an open question about the fear invites the client to explore it. The reasons the client gave are change talk, and the reflection keeps them in play.",
  "watchFor": "Avoid reassuring the client that talking about the accident will not lead to falling apart, because that is a promise the clinician cannot keep. Avoid a list of reasons to start. Both moves hand the doubting side back to the client to defend."
 },
 "2": {
  "lookFor": "A response that asks permission before giving information, describes two treatments including the hard parts (distress may rise before it falls), mentions that average results are similar and that other options exist, and asks what the client makes of it.",
  "why": "Informed consent requires disclosure, including risks and alternatives. Asking permission and then asking for the client’s view keeps the exchange collaborative and leaves the decision with the client. The clinically small gap in the veteran trial makes the client’s preference a legitimate basis for the choice.",
  "watchFor": "Do not recommend one treatment over the other, and do not leave out the temporary rise in distress. A one-way explanation without a question can sound like pressure. The belief that the accident was the client’s fault is a stuck point, and it does not need to be argued with today."
 },
 "3": {
  "lookFor": "A response that validates the wish to go slowly, says pacing is a shared skill, offers steadying skills before any approach to the memory, and asks what would help the client feel safe enough to try.",
  "why": "The pacing principle favors building readiness first. Asking what would make it feel safe keeps the client in charge of the pace and invites the client to name a condition they can trust.",
  "watchFor": "Avoid promising that treatment will not be hard. Avoid pushing toward the memory work because it is the core of PE."
 },
 "4": {
  "lookFor": "A response that asks what makes the rating a six and not a lower number, draws out reasons in the client’s words, and proposes a first step with brief measures of avoidance and of belief so the plan can be revised.",
  "why": "Asking why the number is not lower elicits change talk about the client’s own readiness. Naming the measures at the start makes the plan a hypothesis that the two of them will test, which is the identify, intervene, measure, and revise cycle.",
  "watchFor": "Do not ask why the rating is not higher, because that invites reasons for staying where the client is. Do not set the measures without explaining what they are for, and do not leave out the option of changing course."
 }
};


// ---- state ----
var stage = 1;
var patientKey = "baseline";
var submitted = {}; // gapIndex -> true

var PATIENT_ORDER = ["adolescent","literacy","older"];
var PATIENT_BTNLABEL = {adolescent:"Adolescent (14–16)", literacy:"Limited literacy", older:"Older adult (70+)"};

function el(tag, cls, html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function clinicianTurnIndices(){
  var out=[]; SESSION.turns.forEach(function(t,i){ if(t.role==="clinician") out.push(i); }); return out;
}
function isGap(turnIdx){
  var cl = clinicianTurnIndices();
  var pos = cl.indexOf(turnIdx);
  return stage===2 && SESSION.gapClinicianIndices.indexOf(pos)!==-1;
}
function clinicianPos(turnIdx){ return clinicianTurnIndices().indexOf(turnIdx); }

function renderHeader(){
  document.getElementById("sessTitle").textContent = SESSION.title;
  document.getElementById("sessBlurb").textContent = SESSION.blurb;
  var p = SESSION.patients[patientKey];
  document.getElementById("pchip").innerHTML = "<b>Patient:</b> " + esc(p.label);
  document.getElementById("scen").textContent = p.chip;

  var mm = document.getElementById("metaMech"), mi = document.getElementById("metaIntv");
  if(SESSION.metaMechanism){ mm.innerHTML = "<b>Mechanism:</b> " + esc(SESSION.metaMechanism); mm.classList.remove("hidden"); }
  else { mm.classList.add("hidden"); mm.innerHTML = ""; }
  if(SESSION.metaIntervention){ mi.innerHTML = "<b>Intervention:</b> " + esc(SESSION.metaIntervention); mi.classList.remove("hidden"); }
  else { mi.classList.add("hidden"); mi.innerHTML = ""; }

  var ra = document.getElementById("recafter");
  ra.innerHTML = "";
  var book = '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" style="flex:0 0 auto"><path d="M3 4.5h5.5c.8 0 1.5.7 1.5 1.5v9c0-.8-.7-1.5-1.5-1.5H3v-9Z" stroke="#6f6c66" stroke-width="1.3"/><path d="M17 4.5h-5.5c-.8 0-1.5.7-1.5 1.5v9c0-.8.7-1.5 1.5-1.5H17v-9Z" stroke="#6f6c66" stroke-width="1.3"/></svg>';
  ra.insertAdjacentHTML("beforeend", book + "<span>Recommended after:</span>");
  SESSION.recommendedAfter.forEach(function(r,i){
    ra.insertAdjacentHTML("beforeend", (i?" , ":" ") + '<a>'+esc(r)+'</a>');
  });

  // Purple adaptation banner (Stage 1 only, when a non-baseline patient is active)
  var ab = document.getElementById("adaptBanner");
  if(stage===1 && p.banner){
    ab.classList.remove("hidden");
    ab.innerHTML = '<div><b>AI-adapted for: '+esc(p.banner)+'.</b> The mechanism, techniques, and clinical reasoning are unchanged. Only the patient details and communication style adapt. Amber annotations refer to the original phrasing.</div>' +
      '<button class="back" type="button" id="backOrig">Back to original</button>';
    document.getElementById("backOrig").addEventListener("click", function(){
      patientKey = "baseline"; renderHeader(); renderChat(); renderToggle();
    });
  } else {
    ab.classList.add("hidden"); ab.innerHTML = "";
  }
}

function renderInstr(){
  var box = document.getElementById("instr");
  if(stage===1){
    box.innerHTML =
      "<h3>What to do in Stage 1</h3>" +
      "(1) Read the full conversation from top to bottom. " +
      "(2) After each clinician response, read the <b>amber annotation box</b> below it. It explains <i>why</i> the clinician said what they said and names the technique. " +
      "(3) When a response surprises you, write one sentence about what you expected and why the expert's choice differs. " +
      "When you have read every exchange and every annotation, select <b>Stage 2: Fill in the Gaps</b>.";
  } else {
    box.innerHTML =
      "<h3>What to do in Stage 2</h3>" +
      "(1) Read the conversation to the first gap. (2) Type what you think the clinician could say. " +
      "(3) Select <b>Submit Response</b> to reveal the expert response and feedback. (4) Read the feedback before moving to the next gap. " +
      "<div class='done'>You are done when every gap has a submitted response and you have read each comparison.</div>";
  }
}

function bubbleRow(turn, turnIdx){
  var role = turn.role;
  var row = el("div","row "+(role==="clinician"?"cl":"pt"));
  var av = el("div","avatar");
  av.innerHTML = role==="clinician"
    ? '<svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M6 3v4a3 3 0 0 0 6 0V3" stroke="#8a5a25" stroke-width="1.4" stroke-linecap="round"/><path d="M9 10v2a4 4 0 0 0 8 0v-1" stroke="#8a5a25" stroke-width="1.4"/><circle cx="17" cy="9.5" r="1.6" stroke="#8a5a25" stroke-width="1.4"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="#6f6c66" stroke-width="1.4"/><path d="M4 16c0-3 2.7-5 6-5s6 2 6 5" stroke="#6f6c66" stroke-width="1.4" stroke-linecap="round"/></svg>';
  var stack = el("div","stack");
  var who = el("div","who", role==="clinician" ? (isGap(turnIdx) ? "Clinician (Your Turn)" : "Clinician") : "Patient");
  stack.appendChild(who);

  if(isGap(turnIdx)){
    stack.appendChild(buildGap(turn, turnIdx));
  } else {
    var b = el("div","bubble", esc(turn.text[patientKey]));
    stack.appendChild(b);
    if(role==="clinician" && turn.technique){
      var tech = el("div","tech","<b>Technique:</b> " + esc(turn.technique.text));
      stack.appendChild(tech);
    }
  }
  row.appendChild(av); row.appendChild(stack);
  return row;
}

function buildGap(turn, turnIdx){
  var wrap = el("div","gapwrap");
  var done = submitted[turnIdx];
  var ta = el("textarea","gap-ta"+(done?" locked":""));
  ta.placeholder = "What would you say to the patient here?";
  ta.setAttribute("aria-label","Your clinician response for this gap");
  if(done){ ta.value = done.text; ta.readOnly = true; }
  wrap.appendChild(ta);

  if(!done){
    var btn = el("button","submit","Submit Response");
    btn.disabled = true;
    ta.addEventListener("input", function(){ btn.disabled = ta.value.trim().length===0; });
    btn.addEventListener("click", function(){
      submitted[turnIdx] = { text: ta.value.trim() };
      renderChat(); updateStatus();
    });
    wrap.appendChild(btn);
  } else {
    wrap.appendChild(buildCompare(turn, turnIdx));
  }
  return wrap;
}

function buildCompare(turn, turnIdx){
  var pos = clinicianPos(turnIdx);
  var fb = GAP_FEEDBACK[pos];
  var box = el("div","compare");
  var exp = el("div","cmp-card cmp-expert");
  exp.innerHTML = "<div class='lab'>Expert Response</div>" + esc(turn.text[patientKey]);
  box.appendChild(exp);
  var tech = el("div","cmp-card cmp-tech","<b>Technique:</b> " + esc(turn.technique.text));
  box.appendChild(tech);
  var f = el("div","cmp-card cmp-fb");
  f.innerHTML = "<div class='lab'>Feedback</div>" +
    "<p><span class='k'>What a strong response includes:</span> " + esc(fb.lookFor) + "</p>" +
    "<p><span class='k'>Why:</span> " + esc(fb.why) + "</p>" +
    "<p><span class='k'>Watch for:</span> " + esc(fb.watchFor) + "</p>";
  box.appendChild(f);
  return box;
}

function renderChat(){
  var chat = document.getElementById("chat");
  chat.innerHTML = "";
  SESSION.turns.forEach(function(t,i){ chat.appendChild(bubbleRow(t,i)); });
}

function updateStatus(){
  var status = document.getElementById("status");
  var banner = document.getElementById("doneBanner");
  if(stage!==2){ status.classList.add("hidden"); banner.classList.add("hidden"); return; }
  var total = SESSION.gapClinicianIndices.length;
  var gapTurnIdxs = clinicianTurnIndices().filter(function(ti){ return isGap(ti); });
  var done = gapTurnIdxs.filter(function(ti){ return submitted[ti]; }).length;
  status.classList.remove("hidden");
  status.innerHTML = "Gaps completed: <b>"+done+" of "+total+"</b>.";
  if(done===total){
    banner.classList.remove("hidden");
    banner.innerHTML = "<b>Stage 2 complete.</b> You've submitted every gap and can compare each of your responses with the expert's. You've now finished both stages of this worked example.";
  } else {
    banner.classList.add("hidden");
  }
}

function renderToggle(){
  var t = document.getElementById("toggle");
  if(stage!==1){ t.classList.add("hidden"); return; }
  t.classList.remove("hidden");
  var box = document.getElementById("toggleBtns");
  box.innerHTML = "";
  var all = PATIENT_ORDER.map(function(k){return [k,PATIENT_BTNLABEL[k]];});
  all.forEach(function(pair){
    var b = el("button","tbtn", pair[1]);
    b.setAttribute("aria-pressed", String(patientKey===pair[0]));
    b.addEventListener("click", function(){
      patientKey = pair[0];
      renderHeader(); renderChat(); renderToggle();
    });
    box.appendChild(b);
  });
  // "Back to original" text link at the end of the toggle row (matches PDF)
  var back = el("button","tbtn-link", "Back to original");
  back.setAttribute("aria-pressed", String(patientKey==="baseline"));
  back.addEventListener("click", function(){
    patientKey = "baseline"; renderHeader(); renderChat(); renderToggle();
  });
  box.appendChild(back);
}

function renderBottomNav(){
  var nav = document.getElementById("bottomNav");
  nav.innerHTML = "";
  nav.classList.remove("hidden","back");
  if(stage===1){
    var b = el("button","nav-btn");
    b.innerHTML = 'Next Stage: Fill in the Gaps ' +
      '<svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M4 10h11M11 6l4 4-4 4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    b.addEventListener("click", function(){ setStage(2); });
    nav.appendChild(b);
  } else {
    nav.classList.add("back");
    var b2 = el("button","nav-btn secondary");
    b2.innerHTML = '<svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M16 10H5M9 6l-4 4 4 4" stroke="#1f1e1c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg> Back to Stage 1';
    b2.addEventListener("click", function(){ setStage(1); });
    nav.appendChild(b2);
  }
}

function setStage(s){
  stage = s;
  document.getElementById("tab1").setAttribute("aria-selected", String(s===1));
  document.getElementById("tab2").setAttribute("aria-selected", String(s===2));
  document.getElementById("pdot2").classList.toggle("on", s===2);
  // Stage 2 always uses baseline patient (variants are a Stage-1-only feature)
  if(s===2){ patientKey = "baseline"; }
  renderHeader(); renderInstr(); renderChat(); renderToggle(); updateStatus(); renderBottomNav();
  window.scrollTo({top:0, behavior:"smooth"});
}

// init
renderHeader(); renderInstr(); renderChat(); renderToggle(); updateStatus(); renderBottomNav();
</script>
</body>

  }
  window.addEventListener("load", postHeight);

  if (window.ResizeObserver) { new ResizeObserver(postHeight).observe(document.body); }
