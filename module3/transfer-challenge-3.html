<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer Challenge — When the Alliance Frays</title>
<style>
  :root{
    --bg:#faf9f7; --ink:#1f1e1c; --muted:#6b6862; --line:#e7e4de; --line2:#eceae4;
    --panel:#ffffff; --panel-shadow:0 1px 2px rgba(28,27,25,.04),0 6px 20px rgba(28,27,25,.05);
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --level-bg:#fbe7e0; --level-ink:#b0472a;
    --do-bg:#f3f1ec; --do-ink:#57544e;
    --correct-bg:#eef5ee; --correct-line:#bcd6bd; --correct-ink:#3c6b3e;
    --wrong-bg:#fbecec; --wrong-line:#e3b9b9; --wrong-ink:#a23b34;
    --sel-line:#c9d3c2;
    --focus:#2f6f4f; --radius:16px; --r-sm:11px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55;}
  .wrap{max-width:920px;margin:0 auto;padding:24px 20px 60px;}

  .head{display:flex;align-items:flex-start;gap:14px;margin-bottom:8px;}
  .back-ic{flex:0 0 auto;margin-top:4px;opacity:.6;}
  .head h1{margin:0;font-size:24px;letter-spacing:-.01em;font-weight:700;}
  .tabrow{display:flex;flex-wrap:wrap;gap:16px;margin:10px 0 22px;padding-left:38px;font-size:14px;}
  .lvl{background:var(--level-bg);color:var(--level-ink);font-weight:700;border-radius:8px;padding:4px 12px;}
  .tabrow .t{color:var(--muted);padding:4px 0;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--panel-shadow);padding:22px 24px;margin-bottom:20px;}
  .panel h2{margin:0 0 14px;font-size:17px;font-weight:700;}
  .panel p{margin:0 0 14px;font-size:15.5px;line-height:1.6;}
  .panel p:last-child{margin-bottom:0;}
  .scenario p.quote{color:#3a3833;}

  .qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;}
  .qhead h2{margin:0;font-size:17px;font-weight:700;}
  .qtype{flex:0 0 auto;font-size:12.5px;color:var(--muted);background:#eceae4;border-radius:7px;padding:5px 10px;}
  .qprompt{font-size:15.5px;margin:0 0 14px;line-height:1.55;}

  .do{background:var(--do-bg);color:var(--do-ink);border-radius:10px;padding:11px 14px;font-size:13.5px;line-height:1.5;margin-bottom:18px;}
  .do b{color:var(--ink);font-weight:700;}

  .options{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    font:inherit;font-size:15px;line-height:1.5;cursor:pointer;transition:border-color .12s,background .12s;color:var(--ink);}
  .opt:hover:not(:disabled){border-color:#cfc9bf;}
  .opt:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:14px;}
  .opt .txt{flex:1 1 auto;}
  .opt .mark{flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center;}
  .opt:disabled{cursor:default;}
  /* answered states */
  .opt.correct{background:var(--correct-bg);border-color:var(--correct-line);}
  .opt.correct .k{color:var(--correct-ink);}
  .opt.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .opt.wrong .k{color:var(--wrong-ink);}
  .opt.dim{opacity:.62;}

  .verdict{margin:16px 0 0;font-size:15px;font-weight:600;}
  .verdict.ok{color:var(--correct-ink);}
  .verdict.no{color:var(--wrong-ink);}
  .explain{margin:8px 0 0;font-size:14.5px;color:#44413b;line-height:1.6;}

  .qfoot{display:flex;justify-content:flex-end;margin-top:20px;}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:#fff;border:none;
    border-radius:10px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;transition:.12s;}
  .btn:hover{filter:brightness(1.05);}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .results h2{display:flex;align-items:center;gap:9px;}
  .results .score{font-size:15.5px;margin:0;}
  .ea-sub{color:var(--muted);font-size:14px;margin:-6px 0 14px;}
  .book{flex:0 0 auto;opacity:.7;}

  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
  @media(max-width:560px){ .wrap{padding:18px 14px 44px;} .tabrow{padding-left:0;} .head h1{font-size:20px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <svg class="back-ic" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12 5l-5 5 5 5" stroke="#1f1e1c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1 id="title"></h1>
  </div>
  <div class="tabrow" id="tabrow"></div>

  <!-- Scenario (persistent) -->
  <section class="panel scenario" id="scenario"></section>

  <!-- Question area -->
  <section class="panel" id="qpanel" aria-live="polite"></section>

  <!-- Results + Expert Analysis (hidden until finished) -->
  <section class="panel results hidden" id="resultsPanel"></section>
  <section class="panel hidden" id="eaPanel"></section>
</div>

<script>
// ===========================================================================
// Transfer Challenge 2 — "When the Alliance Frays"
// Scenario, three questions, options, correct answers, and Expert Analysis are
// VERBATIM from instructor screenshots. Answers are not stored anywhere.
// Content verified against the Module 3 reading (ug-module-readings.md):
//   - Bordin's tripartite alliance (goals/tasks/bond) and the task-breach example
//   - withdrawal vs. confrontation rupture markers
//   - repaired ruptures associated with better outcomes than no rupture
//     (Safran & Muran corrective-experience mechanism)
// ===========================================================================

const CHALLENGE = {
  title: "When the Alliance Frays",
  level: "Level 3: Apply",
  tabs: ["Mechanisms of Change", "Clinical Reasoning", "Treatment Planning"],

  scenario: {
    heading: "Clinical Scenario",
    paras: [
      "Dr. Chen is in session 7 with Marcus, a 34-year-old engineer who originally sought help for work-related anxiety. In session 6, Marcus described a conflict with his supervisor, and Dr. Chen responded by offering concrete advice about how Marcus should handle the situation — advice Marcus had not asked for. Marcus left session 6 feeling dismissed.",
      "In session 7, Marcus arrives 10 minutes late. He sits with arms crossed, responds to questions with brief, flat answers, and deflects attempts to revisit last week's homework. When Dr. Chen asks how the week went, Marcus says: 'Fine.' When Dr. Chen follows up, Marcus says flatly: 'You always seem to have an answer for everything. I'm not sure this is actually helping.'",
      "Dr. Chen notices the shift in tone. Rather than redirecting to technique, Dr. Chen pauses and says: 'Something feels different between us today. I wonder if I did something that didn't sit right last week. Can you help me understand what you've been experiencing?' Marcus is quiet for a moment, then says: 'When you told me exactly what I should say to my supervisor — I didn't ask for that. It felt like you thought I couldn't figure it out myself.' Dr. Chen acknowledges the misstep directly: 'You're right. I stepped over the line into telling you what to do rather than helping you think it through. That wasn't helpful and it wasn't what you needed.' Marcus's posture visibly relaxes."
    ]
  },

  doThis: "Pick the single best option, choosing based on the reasoning it reflects — not just a familiar phrase. After you answer, read whether you were correct and why before advancing.",

  questions: [
    {
      id: "q1",
      prompt: "Marcus's withdrawal (flat responses, crossed arms, 'I'm not sure this is actually helping') is best described as which type of alliance rupture marker?",
      options: [
        { id: "a", text: "A withdrawal rupture — Marcus is pulling back from emotional engagement and collaborative effort in the session" },
        { id: "b", text: "A confrontation rupture — Marcus is directly expressing anger or dissatisfaction with the therapist" },
        { id: "c", text: "A task rupture — Marcus disagrees with the specific homework assignment from last week" },
        { id: "d", text: "A goal rupture — Marcus no longer believes the treatment goals are appropriate for him" }
      ],
      correct: "a",
      explanation: "Marcus pulls back rather than pushing directly — flat answers, crossed arms, deflection, and lateness are markers of a withdrawal rupture, in which the client disengages quietly rather than openly challenging the therapist. (His one flat remark is a mild move toward confrontation, but the dominant pattern is withdrawal.)"
    },
    {
      id: "q2",
      prompt: "According to Bordin's tripartite model of the working alliance, which alliance component was MOST directly breached by Dr. Chen's unsolicited advice in session 6?",
      options: [
        { id: "a", text: "Goal agreement — Marcus and Dr. Chen now disagree about what the overall goals of treatment should be" },
        { id: "b", text: "Task agreement — Dr. Chen's advice-giving violated the implicit agreement that sessions would involve collaborative exploration rather than prescriptive direction" },
        { id: "c", text: "Bond quality — the interpersonal trust and emotional connection between therapist and patient was the first thing damaged" },
        { id: "d", text: "Therapist competence — Marcus now doubts whether Dr. Chen has sufficient expertise to treat work anxiety" }
      ],
      correct: "b",
      explanation: "Bordin's task component concerns the implicit agreement about what the work of sessions will involve. Dr. Chen's shift to telling Marcus what to say replaced the agreed collaborative exploration with an unasked-for directive — a task breach. The bond was damaged as a secondary consequence, but the direct breach was to the task."
    },
    {
      id: "q3",
      prompt: "Research on rupture-repair sequences consistently shows which outcome compared with alliances that remain strong and unruptured throughout treatment?",
      options: [
        { id: "a", text: "Worse outcomes, because ruptures reflect fundamental therapeutic incompatibility that repair cannot fully address" },
        { id: "b", text: "Equivalent outcomes, because the repair simply restores the alliance to its pre-rupture level" },
        { id: "c", text: "Better outcomes in some studies — successfully repaired ruptures predict stronger alliances and better results than alliances that were never challenged" },
        { id: "d", text: "Variable outcomes that depend entirely on the treatment modality rather than the rupture-repair process" }
      ],
      correct: "c",
      explanation: "Sessions with a rupture that then gets repaired are associated with better outcomes than sessions with no rupture at all. A well-handled repair is a corrective emotional experience: the client gains firsthand evidence that conflict can be raised and resolved without abandonment, which strengthens the alliance beyond its pre-rupture baseline."
    }
  ],

  expertAnalysis: {
    heading: "Expert Analysis",
    subhead: "Model answer and clinical reasoning walkthrough",
    paras: [
      "This scenario demonstrates three interlocking concepts from common-factors research: the nature of alliance ruptures, the markers used to identify them, and the mechanism by which repair produces change.",
      "The rupture type matters clinically. Marcus's pattern — withdrawal, flat responses, minimal engagement — is a withdrawal rupture rather than a confrontation rupture. Withdrawal ruptures are often harder to detect because the patient does not openly challenge the therapist; instead they become quiet, compliant, or avoidant in ways that can easily be mistaken for resistance or a bad week. Dr. Chen's move to directly name the shift ('something feels different between us') rather than pursuing the original session agenda is what made repair possible.",
      "From Bordin's model, the direct breach is to the task component of the alliance. The task component concerns the implicit agreement about what the work of sessions will involve — in this case, collaborative exploration rather than prescriptive advice. Dr. Chen's shift to telling Marcus what to say to his supervisor violated that agreement directly and specifically: it replaced the agreed task with an unasked-for directive. The bond component (the quality of the interpersonal trust and connection) was damaged as a secondary consequence — Marcus experienced the advice-giving as evidence that Dr. Chen did not regard him as capable of reasoning through the problem himself, which eroded the felt safety of the relationship. This is why Dr. Chen's repair — acknowledging the specific task-level misstep ('I stepped over the line into telling you what to do rather than helping you think it through') — works at both levels: it restores the task agreement explicitly and, in doing so, also addresses the relational damage to the bond by demonstrating that Dr. Chen can acknowledge error without becoming defensive.",
      "The research on rupture-repair sequences (Safran, Muran, and colleagues) is among the most important in common-factors literature. Studies consistently show that therapists who can recognize and repair ruptures produce better outcomes than therapists who avoid addressing relational difficulties. The mechanism is interpersonal: by experiencing a relationship in which conflict can be raised, acknowledged, and resolved without retaliation or abandonment, patients gain new relational data that disconfirms maladaptive interpersonal expectations. This is the common factor operating — not a technique, but a relational event that models collaborative problem-solving and strengthens the alliance beyond its pre-rupture baseline."
    ]
  }
};

var idx = 0;            // current question index
var answered = [];      // answered[i] = chosen option id or null
var correctCount = 0;

function el(t,c,h){var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

var CHECK = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#3c6b3e" stroke-width="1.4"/><path d="M6.4 10.2l2.3 2.3 4.7-4.9" stroke="#3c6b3e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var CROSS = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#a23b34" stroke-width="1.4"/><path d="M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6" stroke="#a23b34" stroke-width="1.6" stroke-linecap="round"/></svg>';
var BOOK = '<svg class="book" width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 4.5h5.5c.8 0 1.5.7 1.5 1.5v9c0-.8-.7-1.5-1.5-1.5H3v-9Z" stroke="#6f6c66" stroke-width="1.3"/><path d="M17 4.5h-5.5c-.8 0-1.5.7-1.5 1.5v9c0-.8.7-1.5 1.5-1.5H17v-9Z" stroke="#6f6c66" stroke-width="1.3"/></svg>';

function renderStatic(){
  document.getElementById("title").textContent = CHALLENGE.title;
  var tr = document.getElementById("tabrow");
  tr.appendChild(el("span","lvl", esc(CHALLENGE.level)));
  CHALLENGE.tabs.forEach(function(t){ tr.appendChild(el("span","t", esc(t))); });

  var sc = document.getElementById("scenario");
  sc.appendChild(el("h2",null, esc(CHALLENGE.scenario.heading)));
  CHALLENGE.scenario.paras.forEach(function(p,i){
    sc.appendChild(el("p", i>0?"quote":null, esc(p)));
  });
  answered = CHALLENGE.questions.map(function(){ return null; });
}

function renderQuestion(){
  var q = CHALLENGE.questions[idx];
  var panel = document.getElementById("qpanel");
  panel.innerHTML = "";
  var chosen = answered[idx];
  var isAnswered = chosen !== null;

  var head = el("div","qhead");
  head.appendChild(el("h2",null,"Question " + (idx+1) + " of " + CHALLENGE.questions.length));
  head.appendChild(el("span","qtype","Multiple Choice"));
  panel.appendChild(head);

  panel.appendChild(el("p","qprompt", esc(q.prompt)));
  panel.appendChild(el("div","do","<b>Do this:</b> " + esc(CHALLENGE.doThis)));

  var opts = el("div","options");
  q.options.forEach(function(o){
    var cls = "opt";
    if(isAnswered){
      if(o.id === q.correct) cls += " correct";
      else if(o.id === chosen) cls += " wrong";
      else cls += " dim";
    }
    var btn = el("button", cls);
    btn.type = "button";
    if(isAnswered) btn.disabled = true;
    var mark = "";
    if(isAnswered && o.id === q.correct) mark = CHECK;
    else if(isAnswered && o.id === chosen) mark = CROSS;
    btn.innerHTML = '<span class="k">'+o.id.toUpperCase()+'.</span>' +
                    '<span class="txt">'+esc(o.text)+'</span>' +
                    '<span class="mark">'+mark+'</span>';
    if(!isAnswered){
      btn.addEventListener("click", function(){ choose(o.id); });
    }
    opts.appendChild(btn);
  });
  panel.appendChild(opts);

  if(isAnswered){
    var right = chosen === q.correct;
    if(right){
      panel.appendChild(el("p","verdict ok","Correct!"));
    } else {
      var correctText = "";
      q.options.forEach(function(o){ if(o.id===q.correct) correctText = o.text; });
      panel.appendChild(el("p","verdict no","Incorrect. The correct answer is: " + esc(correctText)));
    }
    panel.appendChild(el("p","explain", esc(q.explanation)));

    var foot = el("div","qfoot");
    var last = idx === CHALLENGE.questions.length - 1;
    var b = el("button","btn");
    if(last){
      b.innerHTML = 'View Expert Analysis ' + BOOK.replace('class="book" ','');
      b.addEventListener("click", finish);
    } else {
      b.innerHTML = 'Next Question <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M4 10h11M11 6l4 4-4 4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      b.addEventListener("click", function(){ idx++; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); });
    }
    foot.appendChild(b);
    panel.appendChild(foot);
  }
}

function choose(optId){
  if(answered[idx] !== null) return;
  answered[idx] = optId;
  if(optId === CHALLENGE.questions[idx].correct) correctCount++;
  renderQuestion();
}

function finish(){
  document.getElementById("qpanel").classList.add("hidden");

  var rp = document.getElementById("resultsPanel");
  rp.classList.remove("hidden");
  rp.innerHTML = "";
  rp.appendChild(el("h2",null, BOOK + "<span>Your Results</span>"));
  rp.appendChild(el("p","score","Multiple Choice: " + correctCount + " / " + CHALLENGE.questions.length + " correct"));

  var ea = document.getElementById("eaPanel");
  ea.classList.remove("hidden");
  ea.innerHTML = "";
  ea.appendChild(el("h2",null, BOOK + "<span>" + esc(CHALLENGE.expertAnalysis.heading) + "</span>"));
  ea.appendChild(el("p","ea-sub", esc(CHALLENGE.expertAnalysis.subhead)));
  CHALLENGE.expertAnalysis.paras.forEach(function(p){ ea.appendChild(el("p",null, esc(p))); });

  window.scrollTo({top:0,behavior:"smooth"});
}

renderStatic();
renderQuestion();
</script>
</body>
</html>
