<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worked Example — Explaining Neuroplasticity: Treatment Rationale for Exposure</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f7f6f4; --ink:#1f1e1c; --muted:#6f6c66;
    --line:#e7e4de; --line2:#eceae4;
    --clinician-bubble:#efe7e0; --patient-bubble:#eceae7;
    --amber-bg:#fffbef; --amber-line:#e7c98a; --amber-ink:#8a6d2f;
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --instr-bg:#eef3fb; --instr-line:#c9d9f0; --instr-ink:#2f4a72;
    --tab-active:#8a5a25;
    --chip-bg:#e9e7e2; --chip-ink:#4a4740;
    --field:#ffffff; --focus:#2f6f4f;
    --ok-bg:#eef5ee; --ok-line:#bcd6bd; --ok-ink:#3c5c3e;
    --radius:16px; --r-sm:11px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:940px;margin:0 auto;padding:22px 18px 60px;}

  /* Stage tabs */
  .stagebar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .stage-tab{display:flex;align-items:center;gap:10px;border:1px solid var(--line);
    background:#fff;color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer;
    font-size:14.5px;transition:.15s;}
  .stage-tab .n{color:var(--muted);}
  .stage-tab[aria-selected="true"]{background:var(--tab-active);border-color:var(--tab-active);color:#fff;}
  .stage-tab[aria-selected="true"] .n{color:#f0dcc6;}
  .stage-tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .arrow{color:var(--muted);}
  .progress{display:flex;gap:5px;margin-left:auto;align-items:center;}
  .pdot{width:26px;height:6px;border-radius:3px;background:var(--line);}
  .pdot.on{background:var(--accent);}

  /* Card shell */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px 24px 26px;}
  h2.sess{margin:0 0 6px;font-size:22px;letter-spacing:-.01em;}
  .sess-blurb{margin:0 0 14px;color:var(--muted);font-size:15px;max-width:70ch;}
  .metarow{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:8px;}
  .metaline{font-size:13.5px;margin:5px 0;padding:6px 10px;border-radius:8px;display:inline-block;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4;}
  .metaline.mech{background:#fdf3e7;color:#8a5a25;}
  .metaline.intv{background:#eaf4ee;color:#3c5c3e;}
  .metaline b{font-weight:700;}
  .adaptbanner{background:#f1ecfa;border:1px solid #d9cdf0;color:#5b3c8a;border-radius:12px;padding:12px 15px;margin:14px 0 4px;font-size:13.5px;line-height:1.5;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .adaptbanner b{font-weight:700;}
  .adaptbanner .back{flex:0 0 auto;background:none;border:none;color:#5b3c8a;text-decoration:underline;cursor:pointer;font:inherit;font-size:13.5px;padding:0;}
  .adaptbanner .back:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .pchip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13px;}
  .pchip b{font-weight:600;}
  .scen{background:var(--chip-bg);color:var(--chip-ink);border-radius:8px;padding:5px 11px;font-size:13px;}
  .recafter{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13.5px;margin:6px 0 2px;}
  .recafter a{color:var(--accent);text-decoration:none;cursor:default;}

  /* Instruction box */
  .instr{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);
    border-radius:12px;padding:14px 16px;margin:16px 0 20px;font-size:14px;line-height:1.55;}
  .instr h3{margin:0 0 6px;font-size:14px;font-weight:700;}
  .instr b{font-weight:700;}
  .instr .done{font-weight:700;}

  /* Chat */
  .chat{display:flex;flex-direction:column;gap:16px;}
  .row{display:flex;gap:12px;}
  .row.cl{flex-direction:row-reverse;}
  .avatar{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#efe7df;
    display:grid;place-items:center;margin-top:20px;}
  .row.pt .avatar{background:#e9e9e6;}
  .stack{max-width:74%;display:flex;flex-direction:column;gap:8px;}
  .who{font-size:12.5px;color:var(--muted);}
  .row.cl .who{text-align:right;}
  .bubble{border-radius:14px;padding:13px 15px;font-size:15px;line-height:1.5;}
  .row.cl .bubble{background:var(--clinician-bubble);border-top-right-radius:5px;text-align:right;}
  .row.pt .bubble{background:var(--patient-bubble);border-top-left-radius:5px;}
  .tech{background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:10px;
    padding:10px 13px;font-size:13px;color:var(--amber-ink);line-height:1.5;text-align:left;}
  .tech b{color:var(--amber-ink);font-weight:700;}

  /* Toggle */
  .toggle{margin-top:24px;border-top:1px solid var(--line);padding-top:18px;}
  .toggle h4{margin:0 0 4px;font-size:15px;}
  .toggle p{margin:0 0 12px;color:var(--muted);font-size:13.5px;max-width:74ch;}
  .toggle-btns{display:flex;flex-wrap:wrap;gap:9px;}
  .tbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 15px;
    cursor:pointer;font-size:13.5px;color:var(--ink);transition:.15s;}
  .tbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
  .tbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .tbtn-link{border:none;background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:13.5px;padding:9px 6px;text-decoration:none;}
  .tbtn-link[aria-pressed="true"]{color:var(--ink);font-weight:600;}
  .tbtn-link:hover{color:var(--ink);}
  .tbtn-link:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  /* Stage 2 gaps */
  .gapwrap{display:flex;flex-direction:column;gap:8px;}
  .gap-ta{width:100%;min-height:82px;resize:vertical;border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;background:var(--field);
    border-top-right-radius:5px;}
  .gap-ta:focus{outline:none;border-color:var(--focus);}
  .gap-ta.locked{background:#f3f1ec;color:#55524c;}
  .submit{align-self:flex-end;background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:10px 18px;font-size:14px;cursor:pointer;}
  .submit:disabled{opacity:.5;cursor:default;}
  .submit:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .compare{display:flex;flex-direction:column;gap:10px;margin-top:2px;}
  .cmp-card{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;text-align:left;}
  .cmp-expert{background:var(--clinician-bubble);}
  .cmp-expert .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink);font-weight:700;margin-bottom:4px;}
  .cmp-tech{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);}
  .cmp-tech b{font-weight:700;}
  .cmp-fb{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok-ink);}
  .cmp-fb .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:5px;}
  .cmp-fb p{margin:0 0 7px;}
  .cmp-fb .k{font-weight:700;}

  .status{font-size:13px;color:var(--muted);margin-top:14px;}
  .status b{color:var(--accent-ink);}
  .hidden{display:none !important;}
  .done-banner{margin-top:16px;background:var(--ok-bg);border:1px solid var(--ok-line);
    color:var(--ok-ink);border-radius:12px;padding:14px 16px;font-size:14.5px;}
  .done-banner b{font-weight:700;}

  .bottom-nav{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;justify-content:flex-end;}
  .bottom-nav.back{justify-content:flex-start;}
  .nav-btn{display:inline-flex;align-items:center;gap:9px;border:none;cursor:pointer;
    background:var(--accent);color:#fff;border-radius:10px;padding:12px 20px;font-size:15px;
    font-weight:600;transition:.15s;}
  .nav-btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .nav-btn:hover{filter:brightness(1.05);}
  .nav-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  @media(max-width:560px){
    .stack{max-width:86%;}
    .panel{padding:18px 15px 20px;}
    h2.sess{font-size:19px;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">

  <div class="stagebar">
    <button class="stage-tab" id="tab1" aria-selected="true" onclick="setStage(1)">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10Z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.3" stroke="currentColor" stroke-width="1.5"/></svg>
      <span><span class="n">Stage 1:</span> Learn from the Expert</span>
    </button>
    <span class="arrow">&rarr;</span>
    <button class="stage-tab" id="tab2" aria-selected="false" onclick="setStage(2)">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M4 14.5 13.5 5l2 2L6 16.5 3.5 17l.5-2.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span><span class="n">Stage 2:</span> Fill in the Gaps</span>
    </button>
    <span class="progress" id="progress" aria-hidden="true"><span class="pdot on"></span><span class="pdot" id="pdot2"></span></span>
  </div>

  <div class="panel">
    <h2 class="sess" id="sessTitle"></h2>
    <p class="sess-blurb" id="sessBlurb"></p>
    <div class="metarow">
      <span class="pchip" id="pchip"></span>
      <span class="scen" id="scen"></span>
    </div>
    <div class="metaline mech" id="metaMech"></div>
    <div class="metaline intv" id="metaIntv"></div>
    <div class="recafter" id="recafter"></div>

    <div class="adaptbanner hidden" id="adaptBanner"></div>

    <div class="instr" id="instr"></div>

    <div class="chat" id="chat"></div>

    <!-- Stage 1 patient toggle -->
    <div class="toggle hidden" id="toggle">
      <h4>Explore with a different patient</h4>
      <p>Same clinical situation, different patient. The mechanism, techniques, and clinical reasoning stay identical while the patient details and communication style adapt. Consider what you would change before clicking.</p>
      <div class="toggle-btns" id="toggleBtns"></div>
    </div>

    <div class="done-banner hidden" id="doneBanner"></div>
    <div class="status hidden" id="status"></div>

    <div class="bottom-nav hidden" id="bottomNav"></div>
  </div>
</div>

<script>
// ===========================================================================
// Worked Example 6 (Module 6) — Explaining Neuroplasticity: Treatment
// Rationale for Exposure.
//
// Base transcript + technique annotations VERBATIM from the instructor PDFs
// (WorkedExample.pdf Stage 1 baseline; FillGaps.pdf Stage 2; AdolescentAdaptation.pdf;
//  LimitedLiteracyAdaptation.pdf; OlderAdultAdaptation.pdf).
//
// Techniques / mechanism / intervention held CONSTANT across all adaptations;
// only communication style adapts, per the platform's stated design.
//
// CORRECTION (per course conventions): the platform's three adaptations all kept
// the patient identical ("Vanessa, 34" with the same scenario chip). That is the
// documented platform error we correct here: each adaptation now gets a distinct
// name, age, and salient context, while every technique annotation and all clinical
// content stays identical. Baseline remains Vanessa, 34 exactly as supplied.
//
// FOUR Stage 2 gaps (from FillGaps.pdf), at the clinician turns following:
//   gap A — "So my brain is basically stuck on that old lesson..."   -> neuroplasticity turn
//   gap B — "...does that mean the fear could come back?"            -> return-of-fear / trail turn
//   gap C — "...training my thinking brain to manage my fear brain." -> neuroimaging-evidence turn
//   gap D — "...There's something real happening."                  -> reinforce-reframe / bridge turn
// Each gap's expert answer is the corresponding baseline clinician turn from Stage 1.
//
// Stage 2 feedback grounded in the Module 6 reading (ug-module-readings.md):
//   fear circuitry (amygdala alarm / prefrontal brake / hippocampus context);
//   neuroplasticity + LTP as the mechanism of change; new learning competes with
//   (does not erase) old learning, so fear can return and must be practiced across
//   contexts to generalize; prefrontal down-regulation of the amygdala; brain-scan
//   change is a group-level MECHANISM finding, not an individual diagnostic — used
//   here to bolster credibility and motivation, consistent with the reading's
//   careful-reader guardrails.
// ===========================================================================

const SESSION = {
  title: "Explaining Neuroplasticity — Treatment Rationale for Exposure",
  tag: "Intervention",
  blurb: "Demonstrates how to translate neuroscience concepts into a compelling treatment rationale. The clinician explains neuroplasticity and fear-circuit remodeling to help a patient understand why exposure therapy works.",
  recommendedAfter: ["Biological Systems"],
  metaMechanism: "Fear conditioning maintained by amygdala-mediated threat appraisal; avoidance prevents inhibitory learning and prefrontal down-regulation",
  metaIntervention: "Graded in-vivo exposure with psychoeducation about neuroplasticity",

  // Four gaps at these clinician-turn positions (0-based across clinician turns):
  // 2 = neuroplasticity, 3 = return of fear / trail, 5 = neuroimaging evidence,
  // 6 = reinforce reframe / bridge to planning.
  gapClinicianIndices: [2, 3, 5, 6],

  patients: {
    baseline: {
      label: "Vanessa, 34",
      chip: "Severe specific phobia of dogs following a childhood bite, avoidance interfering with daily routines",
      banner: null
    },
    adolescent: {
      label: "Maya, 15",
      chip: "Severe specific phobia of dogs following a childhood bite, avoidance interfering with school and daily routines",
      banner: "Adolescent (14–16)"
    },
    literacy: {
      label: "Rosa, 38",
      chip: "Severe specific phobia of dogs following a childhood bite, avoidance interfering with errands and work",
      banner: "Limited literacy"
    },
    older: {
      label: "Eleanor, 74",
      chip: "Severe specific phobia of dogs following a childhood bite, avoidance interfering with daily walks and independence",
      banner: "Older adult (70+)"
    }
  },

  turns: [
    // C0 — Opens with an invitation to share existing knowledge
    { role: "clinician",
      technique: { label: "Invitation to share",
        text: "Opens with an invitation to share existing knowledge, positioning the patient as an active learner rather than a passive recipient of information." },
      text: {
        baseline:   "Vanessa, before we start the exposure exercises, I want to make sure the rationale makes sense to you. You mentioned wanting to understand why this approach works. What's your current understanding of why the fear feels so automatic?",
        adolescent: "Vanessa, before we jump into the exposure exercises, I want to check in and see if the reason behind all this makes sense to you. You said you wanted to know why this actually helps. What do you think is going on when your fear just kicks in out of nowhere?",
        literacy:   "Vanessa, before we start, I want to make sure you know why we do these exercises. Can you tell me what you think makes your fear happen so quickly?",
        older:      "Before we begin the exposure exercises, I would like to ensure the reasoning behind this approach is clear to you. You mentioned an interest in understanding why this method is effective. At this point in your life, with your wealth of experience, what is your current understanding of why the fear response feels so immediate and automatic?"
      }
    },
    // P0
    { role: "patient",
      text: {
        baseline:   "I know it's irrational. I tell myself most dogs are friendly, but the moment I see one my body just reacts. My heart pounds, I freeze up. It's like my brain doesn't listen to logic.",
        adolescent: "I know it doesn't make sense. I keep telling myself that most dogs are chill, but as soon as I see one, my body just freaks out. My heart's racing, I freeze—it's like my brain just ignores all the facts.",
        literacy:   "I know my fear doesn't make sense. I tell myself most dogs are nice, but when I see one, my body gets scared. My heart races, I freeze. My brain doesn't listen to my thoughts.",
        older:      "I recognize that it isn't logical. I remind myself that most dogs are friendly, but as soon as I see one, my body just reacts. My heart starts pounding, I freeze. It's as if the logical part of my mind gets bypassed."
      }
    },
    // C1 — Amygdala / smoke detector metaphor
    { role: "clinician",
      technique: { label: "Accessible metaphor",
        text: "Translates neuroscience into an accessible metaphor (smoke detector). Links the patient's lived experience to the biological mechanism without being condescending." },
      text: {
        baseline:   "You've actually described something really important. There's a part of your brain called the amygdala that acts like a smoke detector. When you were bitten as a child, it learned 'dogs equal danger' and it stored that association. The reason logic doesn't override it is that the amygdala processes threats faster than the thinking parts of your brain can evaluate them.",
        adolescent: "You just described something super important. There's this part of your brain called the amygdala—it's kind of like your school's fire alarm. When you got bitten as a kid, your amygdala learned 'dogs = danger' and saved that info. So, even if you know better now, your amygdala reacts way faster than the logical part of your brain can catch up.",
        literacy:   "You explained something important. There is a part of your brain called the amygdala. The amygdala acts like a smoke detector—it warns you about danger. When you were bitten as a child, your amygdala learned 'dogs mean danger.' It remembers that lesson. The amygdala works faster than the thinking part of your brain, so your body reacts before you can think. Does that make sense to you?",
        older:      "You've described something quite significant. There's a region in the brain called the amygdala, which functions much like a smoke detector. When you experienced that dog bite as a child, your amygdala learned to associate dogs with danger, storing that lesson deep within your memory. The reason your logical thinking doesn't override this reaction is that the amygdala processes perceived threats more quickly than the reasoning parts of your brain can evaluate them. This is true across the lifespan, even as we accumulate decades of experience."
      }
    },
    // P1
    { role: "patient",
      text: {
        baseline:   "So my brain is basically stuck on that old lesson from when I was seven?",
        adolescent: "So my brain's basically stuck on that old lesson from when I was seven?",
        literacy:   "So my brain is stuck on what happened when I was seven?",
        older:      "So my brain is essentially holding onto that old lesson from when I was seven years old?"
      }
    },
    // C2 — Neuroplasticity as mechanism of change   [GAP A]
    { role: "clinician",
      technique: { label: "Mechanism of change",
        text: "Introduces neuroplasticity as the mechanism of change. Clarifies that exposure creates new learning rather than erasing old memories, which is consistent with inhibitory learning theory." },
      text: {
        baseline:   "Exactly. And here's the encouraging part: your brain is capable of forming new associations throughout your entire life. This is called neuroplasticity. When we do exposure work, we're not erasing the old memory. We're building a new, competing pathway that says 'dogs can be safe.' Over time, that new pathway gets stronger and the fear response gets quieter.",
        adolescent: "Exactly. But here's the good news: your brain can actually make new connections your whole life. That's called neuroplasticity. When we do exposure work, we're not deleting the old memory—we're building a new path that says 'dogs can be safe.' Over time, that new path gets stronger and the fear gets quieter.",
        literacy:   "Yes, that's right. But your brain can learn new things all your life. This is called neuroplasticity. Neuroplasticity means your brain can change and make new connections. When we do exposure, we build a new path in your brain that says 'dogs can be safe.' The old memory stays, but the new path gets stronger, and your fear gets weaker. Can you tell me what neuroplasticity means?",
        older:      "Precisely. And here's some encouraging news: the brain retains the ability to form new associations at every stage of life, including retirement and beyond. This is known as neuroplasticity. When we engage in exposure work, we are not erasing the old memory; rather, we are constructing a new, competing pathway that communicates 'dogs can be safe.' Over time, with repeated practice, this new pathway grows stronger, and the fear response diminishes."
      }
    },
    // P2
    { role: "patient",
      text: {
        baseline:   "That makes sense. But if the old memory is still there, does that mean the fear could come back?",
        adolescent: "That makes sense. But if the old memory's still there, does that mean the fear could come back?",
        literacy:   "It means my brain can change and learn new things.",
        older:      "That makes sense. But if the old memory remains, does that mean the fear could return?"
      }
    },
    // C3 — Return of fear / hiking-trail metaphor   [GAP B]
    { role: "clinician",
      technique: { label: "Return of fear (trail metaphor)",
        text: "Addresses return of fear honestly using the trail metaphor. Explains the rationale for conducting exposures across varied contexts to strengthen generalization." },
      text: {
        baseline:   "That's a really insightful question. Yes, there can be moments where the old pathway gets reactivated, like if you encounter a dog in a surprising context. But the more we practice exposure in different situations, the more robust that new pathway becomes. Think of it like a hiking trail. The old fear trail is well-worn, but every time we practice, we're clearing and widening the new trail.",
        adolescent: "That's a really smart question. Yeah, sometimes the old fear can pop up again, like if you run into a dog in a totally unexpected place. But the more we practice in different situations, the stronger and more reliable your new path gets. It's kind of like making a shortcut across the soccer field—the more you walk it, the clearer it gets, even if the old path is still there.",
        literacy:   "Exactly. Sometimes the old fear can come back, like if you see a dog when you don't expect it. But practicing in different places makes the new path stronger. It's like making a new walking trail. The old fear trail is used a lot, but every time we practice, we make the new trail bigger. Does that picture help you understand?",
        older:      "That is an excellent and thoughtful question. Yes, there may be occasions when the old pathway is reactivated, such as encountering a dog unexpectedly. However, the more we practice exposure in a variety of situations—much as you've adapted to new routines in retirement—the more resilient the new pathway becomes. Imagine it as a hiking trail: the old fear trail is well-trodden, but each practice session helps clear and widen the new trail."
      }
    },
    // P3
    { role: "patient",
      text: {
        baseline:   "So the more situations I practice in, the stronger the new pathway gets?",
        adolescent: "So the more different situations I practice in, the stronger the new path gets?",
        literacy:   "Yes. So practicing in more places makes the new path stronger?",
        older:      "So the more different situations I practice in, the stronger the new pathway becomes?"
      }
    },
    // C4 — Prefrontal-amygdala regulation
    { role: "clinician",
      technique: { label: "Prefrontal regulation",
        text: "Explains prefrontal-amygdala regulation in plain language. Extends the smoke detector metaphor to maintain coherence in the psychoeducation." },
      text: {
        baseline:   "Exactly. And here's what's happening at the brain level: your prefrontal cortex, the part that does reasoning and planning, gradually learns to send calming signals to the amygdala. It's like your thinking brain is learning to turn down the volume on the smoke detector when there's no actual fire.",
        adolescent: "Exactly. Here's what's happening in your brain: your prefrontal cortex—the part that helps you think things through and plan—starts sending calming messages to your amygdala. It's like your thinking brain is learning to turn down the volume on the fire alarm when there's no real fire.",
        literacy:   "Yes. Your prefrontal cortex—the part of your brain that helps you think and plan—learns to calm the amygdala. The prefrontal cortex is your thinking brain. It helps turn down the alarm when there is no real danger. Can you tell me what the prefrontal cortex does?",
        older:      "Exactly right. On a neurological level, your prefrontal cortex—the area responsible for reasoning and planning, which remains active and adaptable well into older adulthood—gradually learns to send calming signals to the amygdala. In other words, your thinking brain learns to lower the volume on the smoke detector when there is no real danger present."
      }
    },
    // P4
    { role: "patient",
      text: {
        baseline:   "I like that image. So exposure is basically training my thinking brain to manage my fear brain.",
        adolescent: "I like that idea. So exposure is basically training my thinking brain to handle my fear brain.",
        literacy:   "It helps me think and calm my fear.",
        older:      "I appreciate that analogy. So exposure is really about training my thinking brain to manage my fear brain."
      }
    },
    // C5 — Neuroimaging evidence + transition to readiness   [GAP C]
    { role: "clinician",
      technique: { label: "Neuroimaging evidence",
        text: "References neuroimaging evidence to bolster credibility, then transitions to assessing readiness. Connects the science directly to treatment motivation." },
      text: {
        baseline:   "That's a great way to put it. And research shows that these brain changes are measurable. People who complete exposure therapy show increased prefrontal activity and decreased amygdala reactivity on brain scans. Your brain physically changes. How does knowing this affect your willingness to try the exposure exercises we discussed?",
        adolescent: "That's a great way to say it. And there's real science behind it—studies show that after exposure therapy, people's brains actually change. Brain scans show more activity in the prefrontal cortex and less in the amygdala. Your brain literally rewires. How does knowing all that make you feel about trying the exposure exercises we talked about?",
        literacy:   "That's right. Exposure is training your thinking brain to handle your fear brain. Research shows people who do exposure therapy have more activity in the thinking part and less in the fear part on brain scans. Your brain really changes. Does knowing this make you feel more ready to try the exercises?",
        older:      "That's an excellent summary. Furthermore, research demonstrates that these changes in the brain are measurable. Individuals who complete exposure therapy show increased activity in the prefrontal cortex and decreased reactivity in the amygdala on brain scans. The brain actually changes in a physical sense. Knowing this, how does it influence your willingness to try the exposure exercises we've discussed?"
      }
    },
    // P5
    { role: "patient",
      text: {
        baseline:   "It actually makes me more willing. If I know there's a biological reason it works, it doesn't feel like I'm just white-knuckling it. There's something real happening.",
        adolescent: "It actually makes me more willing. If I know there's a real reason it works, it doesn't feel like I'm just forcing myself through it. There's something actually happening in my brain.",
        literacy:   "Yes, it makes me more ready. If I know my brain changes, it feels real, not just something I have to push through.",
        older:      "It actually makes me more willing. If I know there is a biological reason for its effectiveness, it doesn't feel as though I'm simply enduring discomfort. There is something tangible happening."
      }
    },
    // C6 — Reinforce reframe + bridge to planning   [GAP D]
    { role: "clinician",
      technique: { label: "Reframe as coping resource",
        text: "Reinforces the patient's reframe and bridges from psychoeducation to concrete treatment planning. The patient's understanding of the mechanism becomes a coping resource during exposure." },
      text: {
        baseline:   "That's exactly right. You're not just enduring discomfort. You're actively rewiring a circuit in your brain. And the fact that you understand the mechanism means you can remind yourself of what's happening when the anxiety spikes during an exposure. Shall we start planning our first step on the hierarchy?",
        adolescent: "Exactly. You're not just toughing it out—you're actually changing how your brain works. And now that you know what's going on, you can remind yourself of that when the anxiety spikes during an exposure. Ready to start planning our first step on your ladder?",
        literacy:   "That's right. You are not just suffering. You are changing your brain. If you remember this, it can help you when you feel anxious during an exercise. Are you ready to plan our first step?",
        older:      "Precisely. You are not merely tolerating anxiety; you are actively rewiring a circuit in your brain. And your understanding of this process means you can remind yourself of what is occurring when anxiety rises during an exposure. Shall we begin to plan the first step on your exposure hierarchy together?"
      }
    }
  ]
};

// Per-gap coaching feedback, grounded in the Module 6 reading + exposure/inhibitory-learning practice.
const GAP_FEEDBACK = {
  2: { // neuroplasticity as mechanism of change
    lookFor: "A response that names neuroplasticity as the reason change is possible and makes clear that exposure builds a new 'dogs can be safe' pathway rather than deleting the old memory. The old learning is not erased. It is outcompeted.",
    why: "The brain is an organ built to change. Learning physically strengthens synapses (long-term potentiation), so a new, calmer pathway can be built alongside the old fear learning. Framing exposure as new learning rather than erasure gives the patient an honest, accurate account she can believe in, and it matches inhibitory-learning theory.",
    watchFor: "Don't promise the old memory or fear is 'gone' or 'cured.' That overclaims, and it sets up the patient to read a normal return of fear as failure. Keep it as building and strengthening a competing pathway."
  },
  3: { // return of fear / practice across contexts
    lookFor: "A response that answers the return-of-fear question honestly (yes, the old pathway can reactivate in a new or surprising context) and then gives the rationale for practicing across many situations so the new learning generalizes.",
    why: "New learning tends to be filed with the context where it happened (the hippocampus's doing), so a fear calmed in one setting can return in another. The reading frames this as the expected next step rather than backsliding. Repeated practice across varied contexts is what makes the calmer pathway strong and general.",
    watchFor: "Don't reassure that the fear will never come back, and don't treat its return as a sign the work failed. The trail and pathway metaphor works because it keeps the old path present while the new one is widened with use."
  },
  5: { // neuroimaging evidence -> readiness
    lookFor: "A response that cites the measurable brain change from exposure (more prefrontal regulation, less amygdala reactivity on scans) to bolster credibility, then pivots to gauging the patient's readiness or motivation to begin.",
    why: "Naming that the change is physically real and visible on scans makes the rationale concrete and motivating, so the patient is not white-knuckling it. Used this way, imaging supports the mechanism story and treatment motivation, then hands off to planning.",
    watchFor: "Keep the brain-scan claim at the group and mechanism level. The reading is explicit that a scan can't diagnose an individual or read a person's thoughts, so don't imply you could scan this patient to prove or track her progress. Use the science to build willingness, not to dazzle or overclaim."
  },
  6: { // reinforce reframe + bridge to planning
    lookFor: "A response that affirms the patient's own reframe (she is rewiring a circuit, not merely suffering), turns that understanding into a coping resource she can use mid-exposure, and bridges to concrete next steps (planning the first item on the hierarchy).",
    why: "Consolidating the reframe converts psychoeducation into something usable. When anxiety spikes during exposure, the patient can remind herself what is happening in her brain. Bridging to the hierarchy keeps the session moving from 'why' to 'what we'll do,' where the actual new learning gets built.",
    watchFor: "Don't let the session stall in explanation. The value now is making the understanding portable and collaboratively moving into planning, securing her buy-in rather than lecturing further."
  }
};


// ---- state ----
var stage = 1;
var patientKey = "baseline";
var submitted = {}; // gapIndex -> true

var PATIENT_ORDER = ["adolescent","literacy","older"];
var PATIENT_BTNLABEL = {adolescent:"Adolescent (14–16)", literacy:"Limited literacy", older:"Older adult (70+)"};

function el(tag, cls, html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function clinicianTurnIndices(){
  var out=[]; SESSION.turns.forEach(function(t,i){ if(t.role==="clinician") out.push(i); }); return out;
}
function isGap(turnIdx){
  var cl = clinicianTurnIndices();
  var pos = cl.indexOf(turnIdx);
  return stage===2 && SESSION.gapClinicianIndices.indexOf(pos)!==-1;
}
function clinicianPos(turnIdx){ return clinicianTurnIndices().indexOf(turnIdx); }

function renderHeader(){
  document.getElementById("sessTitle").textContent = SESSION.title;
  document.getElementById("sessBlurb").textContent = SESSION.blurb;
  var p = SESSION.patients[patientKey];
  document.getElementById("pchip").innerHTML = "<b>Patient:</b> " + esc(p.label);
  document.getElementById("scen").textContent = p.chip;

  var mm = document.getElementById("metaMech"), mi = document.getElementById("metaIntv");
  if(SESSION.metaMechanism){ mm.innerHTML = "<b>Mechanism:</b> " + esc(SESSION.metaMechanism); mm.classList.remove("hidden"); }
  else { mm.classList.add("hidden"); mm.innerHTML = ""; }
  if(SESSION.metaIntervention){ mi.innerHTML = "<b>Intervention:</b> " + esc(SESSION.metaIntervention); mi.classList.remove("hidden"); }
  else { mi.classList.add("hidden"); mi.innerHTML = ""; }

  var ra = document.getElementById("recafter");
  ra.innerHTML = "";
  var book = '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" style="flex:0 0 auto"><path d="M3 4.5h5.5c.8 0 1.5.7 1.5 1.5v9c0-.8-.7-1.5-1.5-1.5H3v-9Z" stroke="#6f6c66" stroke-width="1.3"/><path d="M17 4.5h-5.5c-.8 0-1.5.7-1.5 1.5v9c0-.8.7-1.5 1.5-1.5H17v-9Z" stroke="#6f6c66" stroke-width="1.3"/></svg>';
  ra.insertAdjacentHTML("beforeend", book + "<span>Recommended after:</span>");
  SESSION.recommendedAfter.forEach(function(r,i){
    ra.insertAdjacentHTML("beforeend", (i?" , ":" ") + '<a>'+esc(r)+'</a>');
  });

  // Purple adaptation banner (Stage 1 only, when a non-baseline patient is active)
  var ab = document.getElementById("adaptBanner");
  if(stage===1 && p.banner){
    ab.classList.remove("hidden");
    ab.innerHTML = '<div><b>AI-adapted for: '+esc(p.banner)+'.</b> The mechanism, techniques, and clinical reasoning are unchanged. Only the patient details and communication style adapt. Amber annotations refer to the original phrasing.</div>' +
      '<button class="back" type="button" id="backOrig">Back to original</button>';
    document.getElementById("backOrig").addEventListener("click", function(){
      patientKey = "baseline"; renderHeader(); renderChat(); renderToggle();
    });
  } else {
    ab.classList.add("hidden"); ab.innerHTML = "";
  }
}

function renderInstr(){
  var box = document.getElementById("instr");
  if(stage===1){
    box.innerHTML =
      "<h3>What to do in Stage 1</h3>" +
      "(1) Read the full conversation from top to bottom. " +
      "(2) After each clinician response, read the <b>amber annotation box</b> below it. It explains <i>why</i> the clinician said what they said, not just the technique name. " +
      "(3) When a response surprises you, write one sentence about what you expected and why the expert's choice differs. " +
      "When you have read every exchange and every annotation, select <b>Stage 2: Fill in the Gaps</b>.";
  } else {
    box.innerHTML =
      "<h3>What to do in Stage 2</h3>" +
      "(1) Read the conversation to the first gap. (2) Type what you think the clinician could say. " +
      "(3) Select <b>Submit Response</b> to reveal the expert response and feedback. (4) Read the feedback before moving to the next gap. " +
      "<div class='done'>You are done when every gap has a submitted response and you have read each comparison.</div>";
  }
}

function bubbleRow(turn, turnIdx){
  var role = turn.role;
  var row = el("div","row "+(role==="clinician"?"cl":"pt"));
  var av = el("div","avatar");
  av.innerHTML = role==="clinician"
    ? '<svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M6 3v4a3 3 0 0 0 6 0V3" stroke="#8a5a25" stroke-width="1.4" stroke-linecap="round"/><path d="M9 10v2a4 4 0 0 0 8 0v-1" stroke="#8a5a25" stroke-width="1.4"/><circle cx="17" cy="9.5" r="1.6" stroke="#8a5a25" stroke-width="1.4"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="#6f6c66" stroke-width="1.4"/><path d="M4 16c0-3 2.7-5 6-5s6 2 6 5" stroke="#6f6c66" stroke-width="1.4" stroke-linecap="round"/></svg>';
  var stack = el("div","stack");
  var who = el("div","who", role==="clinician" ? (isGap(turnIdx) ? "Clinician (Your Turn)" : "Clinician") : "Patient");
  stack.appendChild(who);

  if(isGap(turnIdx)){
    stack.appendChild(buildGap(turn, turnIdx));
  } else {
    var b = el("div","bubble", esc(turn.text[patientKey]));
    stack.appendChild(b);
    if(role==="clinician" && turn.technique){
      var tech = el("div","tech","<b>Technique:</b> " + esc(turn.technique.text));
      stack.appendChild(tech);
    }
  }
  row.appendChild(av); row.appendChild(stack);
  return row;
}

function buildGap(turn, turnIdx){
  var wrap = el("div","gapwrap");
  var done = submitted[turnIdx];
  var ta = el("textarea","gap-ta"+(done?" locked":""));
  ta.placeholder = "What would you say to the patient here?";
  ta.setAttribute("aria-label","Your clinician response for this gap");
  if(done){ ta.value = done.text; ta.readOnly = true; }
  wrap.appendChild(ta);

  if(!done){
    var btn = el("button","submit","Submit Response");
    btn.disabled = true;
    ta.addEventListener("input", function(){ btn.disabled = ta.value.trim().length===0; });
    btn.addEventListener("click", function(){
      submitted[turnIdx] = { text: ta.value.trim() };
      renderChat(); updateStatus();
    });
    wrap.appendChild(btn);
  } else {
    wrap.appendChild(buildCompare(turn, turnIdx));
  }
  return wrap;
}

function buildCompare(turn, turnIdx){
  var pos = clinicianPos(turnIdx);
  var fb = GAP_FEEDBACK[pos];
  var box = el("div","compare");
  var exp = el("div","cmp-card cmp-expert");
  exp.innerHTML = "<div class='lab'>Expert Response</div>" + esc(turn.text[patientKey]);
  box.appendChild(exp);
  var tech = el("div","cmp-card cmp-tech","<b>Technique:</b> " + esc(turn.technique.text));
  box.appendChild(tech);
  var f = el("div","cmp-card cmp-fb");
  f.innerHTML = "<div class='lab'>Feedback</div>" +
    "<p><span class='k'>What a strong response includes:</span> " + esc(fb.lookFor) + "</p>" +
    "<p><span class='k'>Why:</span> " + esc(fb.why) + "</p>" +
    "<p><span class='k'>Watch for:</span> " + esc(fb.watchFor) + "</p>";
  box.appendChild(f);
  return box;
}

function renderChat(){
  var chat = document.getElementById("chat");
  chat.innerHTML = "";
  SESSION.turns.forEach(function(t,i){ chat.appendChild(bubbleRow(t,i)); });
}

function updateStatus(){
  var status = document.getElementById("status");
  var banner = document.getElementById("doneBanner");
  if(stage!==2){ status.classList.add("hidden"); banner.classList.add("hidden"); return; }
  var total = SESSION.gapClinicianIndices.length;
  var gapTurnIdxs = clinicianTurnIndices().filter(function(ti){ return isGap(ti); });
  var done = gapTurnIdxs.filter(function(ti){ return submitted[ti]; }).length;
  status.classList.remove("hidden");
  status.innerHTML = "Gaps completed: <b>"+done+" of "+total+"</b>.";
  if(done===total){
    banner.classList.remove("hidden");
    banner.innerHTML = "<b>Stage 2 complete.</b> You've submitted every gap and can compare each of your responses with the expert's. You've now finished both stages of this worked example.";
  } else {
    banner.classList.add("hidden");
  }
}

function renderToggle(){
  var t = document.getElementById("toggle");
  if(stage!==1){ t.classList.add("hidden"); return; }
  t.classList.remove("hidden");
  var box = document.getElementById("toggleBtns");
  box.innerHTML = "";
  var all = PATIENT_ORDER.map(function(k){return [k,PATIENT_BTNLABEL[k]];});
  all.forEach(function(pair){
    var b = el("button","tbtn", pair[1]);
    b.setAttribute("aria-pressed", String(patientKey===pair[0]));
    b.addEventListener("click", function(){
      patientKey = pair[0];
      renderHeader(); renderChat(); renderToggle();
    });
    box.appendChild(b);
  });
  // "Back to original" text link at the end of the toggle row (matches PDF)
  var back = el("button","tbtn-link", "Back to original");
  back.setAttribute("aria-pressed", String(patientKey==="baseline"));
  back.addEventListener("click", function(){
    patientKey = "baseline"; renderHeader(); renderChat(); renderToggle();
  });
  box.appendChild(back);
}

function renderBottomNav(){
  var nav = document.getElementById("bottomNav");
  nav.innerHTML = "";
  nav.classList.remove("hidden","back");
  if(stage===1){
    var b = el("button","nav-btn");
    b.innerHTML = 'Next Stage: Fill in the Gaps ' +
      '<svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M4 10h11M11 6l4 4-4 4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    b.addEventListener("click", function(){ setStage(2); });
    nav.appendChild(b);
  } else {
    nav.classList.add("back");
    var b2 = el("button","nav-btn secondary");
    b2.innerHTML = '<svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M16 10H5M9 6l-4 4 4 4" stroke="#1f1e1c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg> Back to Stage 1';
    b2.addEventListener("click", function(){ setStage(1); });
    nav.appendChild(b2);
  }
}

function setStage(s){
  stage = s;
  document.getElementById("tab1").setAttribute("aria-selected", String(s===1));
  document.getElementById("tab2").setAttribute("aria-selected", String(s===2));
  document.getElementById("pdot2").classList.toggle("on", s===2);
  // Stage 2 always uses baseline patient (variants are a Stage-1-only feature)
  if(s===2){ patientKey = "baseline"; }
  renderHeader(); renderInstr(); renderChat(); renderToggle(); updateStatus(); renderBottomNav();
  window.scrollTo({top:0, behavior:"smooth"});
}

// init
renderHeader(); renderInstr(); renderChat(); renderToggle(); updateStatus(); renderBottomNav();
</script>
</body>
