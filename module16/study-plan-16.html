<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Plan Builder</title>
<style>
  :root{
    --bg:#faf9f7; --ink:#1f1e1c; --muted:#6b6862; --line:#e7e4de;
    --panel:#ffffff; --panel-shadow:0 1px 2px rgba(28,27,25,.04),0 6px 20px rgba(28,27,25,.05);
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --do-bg:#f3f1ec; --do-ink:#57544e;
    --correct-bg:#eef5ee; --correct-line:#bcd6bd; --correct-ink:#3c6b3e;
    --wrong-bg:#fbecec; --wrong-line:#e3b9b9; --wrong-ink:#a23b34;
    --amber-bg:#fffbef; --amber-line:#e7c98a; --amber-ink:#8a6d2f;
    --instr-bg:#eef3fb; --instr-line:#c9d9f0; --instr-ink:#2f4a72;
    --focus:#2f6f4f; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55;}
  .wrap{max-width:780px;margin:0 auto;padding:24px 20px 60px;}
  .masthead{padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .masthead h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em;}
  .masthead .sub{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:70ch;}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;}
  .stp{font-size:12.5px;color:var(--muted);background:#eceae4;border-radius:999px;padding:4px 11px;}
  .stp.on{background:var(--accent);color:#fff;}
  .stp.done{background:var(--correct-bg);color:var(--correct-ink);}
  .case{background:var(--amber-bg);border:1px solid var(--amber-line);color:#5d4a1f;border-radius:12px;padding:13px 16px;margin-bottom:14px;font-size:14px;line-height:1.6;}
  .case b.t{display:block;margin-bottom:3px;color:var(--amber-ink);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--panel-shadow);padding:22px 24px;}
  .intro{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);border-radius:12px;padding:13px 16px;margin-bottom:16px;font-size:14px;line-height:1.55;}
  .intro b{font-weight:700;}
  .qtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px;}
  .qtop .qn{font-size:13px;color:var(--muted);}
  .qtop .tag{font-size:12px;color:var(--muted);background:#eceae4;border-radius:7px;padding:4px 10px;}
  .qprompt{font-size:17px;font-weight:600;margin:6px 0 6px;line-height:1.45;}
  .quote{font-size:17px;line-height:1.5;margin:8px 0 10px;padding:10px 14px;background:#f7f6f4;border-left:3px solid var(--accent);border-radius:6px;}
  .do{background:var(--do-bg);color:var(--do-ink);border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.5;margin:10px 0 16px;}
  .do b{color:var(--ink);}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;font-size:14.5px;line-height:1.5;cursor:pointer;color:var(--ink);transition:border-color .12s,background .12s;}
  .opt:hover:not(:disabled){border-color:#cfc9bf;}
  .opt:focus-visible,.btn:focus-visible,.cat:focus-visible,.node:focus-visible,.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:15px;}
  .opt:disabled{cursor:default;}
  .opt.correct,.cat.correct{background:var(--correct-bg);border-color:var(--correct-line);}
  .opt.wrong,.cat.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .opt.dim{opacity:.6;}
  .cats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .cat{flex:1 1 150px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--ink);text-align:center;}
  .cat:hover:not(:disabled){border-color:#cfc9bf;}
  .cat:disabled{cursor:default;}
  .cat.dim{opacity:.6;}
  .verdict{margin:16px 0 0;font-size:14.5px;font-weight:600;}
  .verdict.ok{color:var(--correct-ink);} .verdict.no{color:var(--wrong-ink);}
  .explain{margin:8px 0 0;font-size:14px;color:#44413b;line-height:1.6;}
  .explain .src{color:var(--muted);font-size:12.5px;margin-top:6px;}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 19px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;}
  .btn:hover{filter:brightness(1.05);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .seq{list-style:none;margin:8px 0 12px;padding:0;display:flex;flex-direction:column;gap:8px;}
  .seq li{display:flex;gap:10px;align-items:flex-start;background:#f7f6f4;border:1px dashed #d8d3c8;border-radius:10px;padding:10px 13px;font-size:14.5px;min-height:44px;}
  .seq li .n{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:18px;}
  .seq li.filled{background:#fff;border:1px solid var(--line);}
  .seq li.right{background:var(--correct-bg);border-color:var(--correct-line);}
  .seq li.bad{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .pool{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .node{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--ink);}
  .node:hover:not(:disabled){border-color:#cfc9bf;}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0 4px;}
  .chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip.right{background:var(--correct-bg);border-color:var(--correct-line);color:var(--correct-ink);}
  .chip.miss{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber-ink);}
  .chip.extra{background:var(--wrong-bg);border-color:var(--wrong-line);color:var(--wrong-ink);}
  .chip:disabled{cursor:default;}
  .ex ul{margin:6px 0 0 18px;padding:0;font-size:14px;color:#44413b;}
  .results h2{margin:0 0 4px;font-size:20px;}
  .results .score{font-size:16px;margin:0 0 4px;} .results .score b{color:var(--accent-ink);}
  .results .brow{display:flex;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid #f0eee9;}
  .results .brow:last-child{border-bottom:none;}
  .results .brow .bs{flex:0 0 64px;font-weight:700;color:var(--accent-ink);}
  .selfnote{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.55;}
  .take{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);border-radius:12px;padding:13px 16px;margin-top:14px;font-size:14px;}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }

  .note{font-size:13.5px;line-height:1.55;margin:0 0 12px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;}
  .note.safe{background:var(--wrong-bg);border-color:var(--wrong-line);color:#5b2320;}
  .note.illus{background:var(--amber-bg);border-color:var(--amber-line);color:#5d4a1f;}
  h2.hd{margin:0 0 8px;font-size:19px;}
  h3.ch{margin:16px 0 4px;font-size:14.5px;font-weight:700;}
  p.explain{font-size:14.5px;line-height:1.6;margin:6px 0 10px;}
  fieldset.grp{border:none;margin:14px 0 0;padding:0;}
  fieldset.grp legend{font-size:15px;font-weight:600;margin:0 0 8px;padding:0;}
  .opt.sel{border:2px solid var(--ink);background:#f7f6f4;padding:12px 14px;}
  .opt .gl{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;}
  .opt .mark{flex:0 0 auto;min-width:20px;font-weight:700;}
  ol.chain{margin:6px 0 0;padding-left:20px;font-size:13.5px;color:#44413b;line-height:1.5;}
  ol.chain li{margin:2px 0;}
  .fact{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff;}
  .fact .ft{font-size:14.5px;line-height:1.55;margin:0 0 6px;}
  .fact .fh{font-size:12.5px;font-weight:700;color:var(--muted);margin:6px 0 2px;}
  .cbrow{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px;}
  .cb{font:inherit;font-size:13.5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink);}
  .cb:hover{border-color:#cfc9bf;}
  .cb:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .cb.sel{border:2px solid var(--ink);background:#f7f6f4;padding:5px 11px;font-weight:600;}
  .tx{background:#f7f6f4;border-left:3px solid var(--accent);border-radius:6px;padding:10px 14px;margin:6px 0 12px;font-size:14px;line-height:1.55;}
  .tx p{margin:4px 0;}
  table.data{border-collapse:collapse;width:100%;font-size:13px;}
  table.data caption{text-align:left;font-size:12.5px;color:var(--muted);padding:4px 0;}
  table.data th,table.data td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top;}
  table.data th{background:#f3f1ec;}
  .tblwrap{overflow-x:auto;}
  .fbbox{margin-top:8px;} .fbbox p{margin:6px 0;font-size:14px;color:#44413b;line-height:1.6;}
  .badge{display:inline-block;font-size:12.5px;font-weight:700;border-radius:7px;padding:3px 9px;border:1px solid var(--line);background:#f3f1ec;}
  .badge.ok{background:var(--correct-bg);border-color:var(--correct-line);color:var(--correct-ink);}
  .badge.alt{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber-ink);}
  .badge.no{background:var(--wrong-bg);border-color:var(--wrong-line);color:var(--wrong-ink);}
  .cmp{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff;}
  .cmp .ct{font-size:14px;margin:0 0 6px;font-weight:600;}
  .cmp p{margin:5px 0;font-size:13.5px;line-height:1.55;color:#44413b;}
  textarea.weak{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14.5px;resize:vertical;}
  textarea.weak:focus{outline:2px solid var(--focus);outline-offset:1px;}
  label.lb{display:block;font-size:14px;font-weight:600;margin:12px 0 6px;}
  label.tick{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.5;margin:6px 0;cursor:pointer;}
  label.tick input{margin-top:3px;}
  ul.plain{margin:6px 0 10px;padding-left:20px;font-size:14px;line-height:1.55;}
  ul.plain li{margin:3px 0;}
  [tabindex="-1"]:focus{outline:none;}

  .row2{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin:8px 0;}
  label.fld{display:block;font-size:14px;font-weight:600;margin:0 0 4px;}
  select.sel{font:inherit;font-size:14.5px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);}
  select.sel:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .days{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;}
  .days label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13.5px;background:#fff;cursor:pointer;}
  .days label.on{border:2px solid var(--ink);padding:6px 9px;background:#f7f6f4;}
  .days input{margin:0;}
  .days input:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .mrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff;}
  .mrow .mt{font-size:14px;margin:0 0 6px;}
  .mrow .mt b{font-weight:700;}
  pre.plan{white-space:pre-wrap;word-wrap:break-word;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:8px 0;}
  pre.plan:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .warn{font-size:13.5px;margin:8px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--amber-line);background:var(--amber-bg);color:#5d4a1f;}
  .bar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;}
  @media print{ .noprint{display:none !important;} body{background:#fff;} .panel{border:none;box-shadow:none;padding:0;} pre.plan{border:none;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead noprint">
    <h1>Study Plan Builder</h1>
    <p class="sub">Enter your exam date, the days you can study, and how well you know each module. The page writes a retrieval schedule you can copy or print.</p>
  </div>
  <div id="root"></div>
</div>
<script>
var STORE_KEY = "psy4387-m16-calibration-v1";
var MODS = [
 {
  "n": 1,
  "topic": "why therapy needs a new organizing idea, the Dodo verdict, allegiance, three legs, measurement",
  "cl": "A",
  "p": [
   {
    "t": "From memory, separate mechanism, technique, and outcome, using an example of your own.",
    "c": [
     "From Orientation to Mechanism: A New Way to Organize Everything"
    ]
   },
   {
    "t": "Say what the Dodo Bird Verdict shows and what it does not show, then explain why the allegiance effect calls for caution when you read a trial.",
    "c": [
     "What the Dodo Bird Verdict Does Not Mean",
     "A Bias to Watch: The Allegiance Effect"
    ]
   },
   {
    "t": "Name the three legs of evidence-based practice and explain how measurement tells you whether a plan is working.",
    "c": [
     "Evidence-Based Practice: Three Legs of a Stool",
     "Getting Better on Purpose: Feedback and the Improvement Loop"
    ]
   }
  ]
 },
 {
  "n": 2,
  "topic": "the traditions, reinforcement and punishment, circular causality",
  "cl": "A",
  "p": [
   {
    "t": "Give an everyday example of each of the four reinforcement and punishment cases and say what changes in each.",
    "c": [
     "A Closer Look at Reinforcement: Four Everyday Mechanisms"
    ]
   },
   {
    "t": "Name the real mechanism that each of the five traditions found and one thing each tends to get wrong.",
    "c": [
     "Five Traditions, One Question",
     "What Each Tradition Tends to Get Wrong"
    ]
   },
   {
    "t": "Explain circular causality with a case of your own and say where in the circle you could step in.",
    "c": [
     "The Systemic Tradition: The Person in the Web"
    ]
   }
  ]
 },
 {
  "n": 3,
  "topic": "common factors, the alliance, empathy, ruptures, therapist effects",
  "cl": "A",
  "p": [
   {
    "t": "Name Bordin's three parts of a working bond and say why the alliance is a mechanism and not a mood.",
    "c": [
     "Bordin's Model: Three Parts of a Working Bond",
     "The Alliance as a Mechanism, Not a Mood"
    ]
   },
   {
    "t": "Separate empathy, congruence, and unconditional positive regard, with one sentence a therapist might say for each.",
    "c": [
     "Empathy",
     "Congruence",
     "Micro-Explainer: Unconditional Positive Regard"
    ]
   },
   {
    "t": "Describe a rupture and a repair, and say what therapist effects add to the picture of who delivers treatment.",
    "c": [
     "Ruptures and Repairs: When the Relationship Strains",
     "Therapist Effects: Who Delivers It Matters"
    ]
   }
  ]
 },
 {
  "n": 4,
  "topic": "cognitive processes and the techniques matched to them",
  "cl": "B",
  "p": [
   {
    "t": "Name the three levels of thought, with a belief of your own at each level.",
    "c": [
     "Three Levels of Thought: Surface, Rules, and Bedrock"
    ]
   },
   {
    "t": "Match four techniques to four targets. Use cognitive restructuring, a behavioral experiment, behavioral activation, and exposure.",
    "c": [
     "Cognitive Restructuring: Working Directly With Thoughts",
     "Behavioral Experiments: Testing Beliefs in the Real World",
     "Behavioral Activation: Acting Your Way Into Feeling",
     "Exposure: New Learning Through Approach"
    ]
   },
   {
    "t": "State what cognitive work is and what it is not, and name two limits of the cognitive level.",
    "c": [
     "The Strengths and Limits of the Cognitive Level"
    ]
   }
  ]
 },
 {
  "n": 5,
  "topic": "interpersonal loops, avoidance, extinction, motivational interviewing",
  "cl": "B",
  "p": [
   {
    "t": "Draw an interpersonal feedback loop from a case of your own and mark where each person's reply feeds the next.",
    "c": [
     "The Interpersonal Feedback Loop",
     "A Field Guide to Common Loops"
    ]
   },
   {
    "t": "Explain avoidance, negative reinforcement, and extinction in one connected account.",
    "c": [
     "The Many Faces of Avoidance",
     "Extinction: How Old Fears Get Rewritten"
    ]
   },
   {
    "t": "Describe what reflective listening and motivational interviewing do differently from giving advice.",
    "c": [
     "Motivational Interviewing: Helping People Talk Themselves Into Change"
    ]
   }
  ]
 },
 {
  "n": 6,
  "topic": "the brain's alarm and manager, plasticity, reading brain claims",
  "cl": "B",
  "p": [
   {
    "t": "Say what the amygdala and the prefrontal cortex each do and why arguing with an alarm fails.",
    "c": [
     "The Brain's Alarm System: The Amygdala",
     "Why You Cannot Simply Argue an Alarm Away"
    ]
   },
   {
    "t": "Contrast top-down and bottom-up influence with one example of each.",
    "c": [
     "Two Directions of Influence: Top-Down and Bottom-Up"
    ]
   },
   {
    "t": "Give three questions you would ask about a headline that claims a brain scan explains a disorder.",
    "c": [
     "Becoming a Careful Reader of Brain Claims"
    ]
   }
  ]
 },
 {
  "n": 7,
  "topic": "emotion regulation, rumination, attachment, equifinality, resilience",
  "cl": "B",
  "p": [
   {
    "t": "Name the five places where a person can step in during Gross's process model and match reappraisal and suppression to them.",
    "c": [
     "Gross's Process Model: Five Places to Step In",
     "Two Strategies Worth Knowing Well: Reappraisal and Suppression"
    ]
   },
   {
    "t": "Separate rumination from problem solving and say what feeds each.",
    "c": [
     "Rumination: When Thinking Feels Like Coping but Isn't"
    ]
   },
   {
    "t": "Explain equifinality and multifinality with one example each, and say what resilience does and does not mean.",
    "c": [
     "Why the Same Start Leads to Different Ends",
     "Resilience: Adversity Is Not Destiny"
    ]
   }
  ]
 },
 {
  "n": 9,
  "topic": "anxiety and depression, maintenance loops, matching a plan to a process",
  "cl": "C",
  "p": [
   {
    "t": "Draw the anxiety maintenance loop with avoidance, checking, and reassurance, and mark one place to interrupt it.",
    "c": [
     "The Anxiety Maintenance Loop",
     "Checking and Reassurance"
    ]
   },
   {
    "t": "Explain inhibitory learning in exposure and why a fear can return.",
    "c": [
     "Inhibitory Learning in Exposure",
     "When Old Fears Come Back"
    ]
   },
   {
    "t": "Draw the depression maintenance loop and match one plan to the process that is active.",
    "c": [
     "The Depression Maintenance Loop",
     "Mechanism-Treatment Matching"
    ]
   }
  ]
 },
 {
  "n": 10,
  "topic": "trauma, substance use, motivational interviewing, consent, safety planning",
  "cl": "C",
  "p": [
   {
    "t": "Explain how trauma memory and avoidance keep the PTSD loop going.",
    "c": [
     "What Trauma Does to Memory",
     "What PTSD Looks Like Day to Day"
    ]
   },
   {
    "t": "Compare Prolonged Exposure and Cognitive Processing Therapy and say what a flat process measure would tell you.",
    "c": [
     "Two Roads, One Destination",
     "Measuring Whether the Process Is Moving"
    ]
   },
   {
    "t": "Say what a skilled reply to ambivalence sounds like, and where consent and safety planning come in.",
    "c": [
     "Motivational Interviewing, Revisited",
     "Consent in Trauma-Focused Care",
     "Risk, Protection, and Safety Planning"
    ]
   }
  ]
 },
 {
  "n": 11,
  "topic": "research methods, effect size, reliable change, reading a trial",
  "cl": "D",
  "p": [
   {
    "t": "Explain why a fair test needs comparison and random assignment, and rank three designs by level of evidence.",
    "c": [
     "The Fair Test: Why We Need Comparison and Control",
     "Levels of Evidence"
    ]
   },
   {
    "t": "Say what an effect size and Cohen's d tell you and what statistical significance leaves out.",
    "c": [
     "How Much Does It Help? Effect Size and Cohen's d",
     "Real vs. Meaningful: Statistical and Clinical Significance"
    ]
   },
   {
    "t": "Walk through reliable change in four steps and list four checks for reading a trial critically.",
    "c": [
     "Reliable Change, Step by Step",
     "Reading a Trial Critically"
    ]
   }
  ]
 },
 {
  "n": 12,
  "topic": "evidence-based practice, adaptation, the measurement-based care loop",
  "cl": "D",
  "p": [
   {
    "t": "Name the three legs and say what each adds, then say what the label empirically supported treatment does not guarantee.",
    "c": [
     "Leg One: The Best Available Research Evidence",
     "Empirically Supported Treatments: The Label and Its Limits"
    ]
   },
   {
    "t": "Separate surface from deep structure in an adaptation and state the preservation rule.",
    "c": [
     "Adapting Without Losing the Mechanism",
     "The Preservation Rule"
    ]

function thinPre(pre,needed,mins,postCap){

      var rest=keep.slice(0,i).concat(keep.slice(i+1)); if(cap(rest)<needed) continue;
      var score=Math.abs(g-2); if(best<0||score<bestGap){ best=i; bestGap=score; }

function frequencies(rate,cap,ns){

  mods.forEach(function(n){ f[n]=({1:3,2:2,3:1})[rate[n]]; if(f[n]>ns) f[n]=ns; });
  function sum(){ var t=0; mods.forEach(function(n){ t+=f[n]; }); return t; }
  var guard=0;

  while(sum()>cap&&guard++<500){
    var pool=mods.filter(function(n){return f[n]>1;});
    if(pool.length){ pool.sort(function(a,b){ return rate[b]-rate[a]||f[b]-f[a]||b-a; }); f[pool[0]]--; continue; }
    var live=mods.filter(function(n){return f[n]>0;}); live.sort(function(a,b){ return rate[b]-rate[a]||b-a; }); if(!live.length) break; f[live[0]]=0;

    grow.sort(function(a,b){ return rate[a]-rate[b]||f[a]-f[b]||a-b; }); f[grow[0]]++;

}
function placeModules(sessions,rate,mins){

  work.forEach(function(s){ s.cap=capacity(s,mins); cap+=s.cap; });
  var f=frequencies(rate,cap,ns), order=MODS.map(function(m){return m.n;});

  var dropped=[], placed={}, occ={};
  order.forEach(function(n){
    placed[n]=0; var want=f[n]; if(rate[n]&&want===0){ dropped.push(n); return; }
    var off=(rate[n]-1)*0.3;

  if(v==="rate"){ a=String(val).split("|"); S.rate[a[0]]=parseInt(a[1],10); S.plan=null; render('[data-act="rate"][data-val="'+val+'"]'); return; }
  if(v==="import"){ doImport(); render("#panelhead"); return; }
  if(v==="build"){ S.plan=buildPlan(S.exam,S.days,S.mins,S.rate); S.copied=""; render(S.plan.ok?"#planhead":"#panelhead"); return; }
  if(v==="copy"){ if(!S.plan||!S.plan.ok) return; var done=false;
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(S.plan.text); done=true; } }catch(e){}
    S.copied=done?"The plan was copied. Paste it into your notes.":"Copying was blocked here. Click in the text, select all, and copy it yourself."; render('[data-act="copy"]'); return; }
  if(v==="print"){ try{ window.print(); }catch(e){} return; }
  if(v==="again"){ reset(); try{ window.scrollTo({top:0,behavior:"smooth"}); }catch(e){} return; }
}
root.addEventListener("click",function(e){ var t=e.target.closest("[data-act]"); if(!t||t.disabled) return; var v=t.getAttribute("data-act"); if(v==="exam"||v==="mins") return; act(v,t.getAttribute("data-val")); });
root.addEventListener("change",function(e){ var t=e.target; if(!t||!t.getAttribute) return; var v=t.getAttribute("data-act"); if(v==="exam"||v==="mins") act(v,t.value); });
reset();

</script>
</body>
</html>
