<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mixed Retrieval Round 2</title>
<style>
  :root{
    --bg:#faf9f7; --ink:#1f1e1c; --muted:#6b6862; --line:#e7e4de;
    --panel:#ffffff; --panel-shadow:0 1px 2px rgba(28,27,25,.04),0 6px 20px rgba(28,27,25,.05);
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --do-bg:#f3f1ec; --do-ink:#57544e;
    --correct-bg:#eef5ee; --correct-line:#bcd6bd; --correct-ink:#3c6b3e;
    --wrong-bg:#fbecec; --wrong-line:#e3b9b9; --wrong-ink:#a23b34;
    --amber-bg:#fffbef; --amber-line:#e7c98a; --amber-ink:#8a6d2f;
    --instr-bg:#eef3fb; --instr-line:#c9d9f0; --instr-ink:#2f4a72;
    --focus:#2f6f4f; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55;}
  .wrap{max-width:780px;margin:0 auto;padding:24px 20px 60px;}
  .masthead{padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .masthead h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em;}
  .masthead .sub{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:70ch;}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;}
  .stp{font-size:12.5px;color:var(--muted);background:#eceae4;border-radius:999px;padding:4px 11px;}
  .stp.on{background:var(--accent);color:#fff;}
  .stp.done{background:var(--correct-bg);color:var(--correct-ink);}
  .case{background:var(--amber-bg);border:1px solid var(--amber-line);color:#5d4a1f;border-radius:12px;padding:13px 16px;margin-bottom:14px;font-size:14px;line-height:1.6;}
  .case b.t{display:block;margin-bottom:3px;color:var(--amber-ink);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--panel-shadow);padding:22px 24px;}
  .intro{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);border-radius:12px;padding:13px 16px;margin-bottom:16px;font-size:14px;line-height:1.55;}
  .intro b{font-weight:700;}
  .qtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px;}
  .qtop .qn{font-size:13px;color:var(--muted);}
  .qtop .tag{font-size:12px;color:var(--muted);background:#eceae4;border-radius:7px;padding:4px 10px;}
  .qprompt{font-size:17px;font-weight:600;margin:6px 0 6px;line-height:1.45;}
  .quote{font-size:17px;line-height:1.5;margin:8px 0 10px;padding:10px 14px;background:#f7f6f4;border-left:3px solid var(--accent);border-radius:6px;}
  .do{background:var(--do-bg);color:var(--do-ink);border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.5;margin:10px 0 16px;}
  .do b{color:var(--ink);}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;font-size:14.5px;line-height:1.5;cursor:pointer;color:var(--ink);transition:border-color .12s,background .12s;}
  .opt:hover:not(:disabled){border-color:#cfc9bf;}
  .opt:focus-visible,.btn:focus-visible,.cat:focus-visible,.node:focus-visible,.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:15px;}
  .opt:disabled{cursor:default;}
  .opt.correct,.cat.correct{background:var(--correct-bg);border-color:var(--correct-line);}
  .opt.wrong,.cat.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .opt.dim{opacity:.6;}
  .cats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .cat{flex:1 1 150px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--ink);text-align:center;}
  .cat:hover:not(:disabled){border-color:#cfc9bf;}
  .cat:disabled{cursor:default;}
  .cat.dim{opacity:.6;}
  .verdict{margin:16px 0 0;font-size:14.5px;font-weight:600;}
  .verdict.ok{color:var(--correct-ink);} .verdict.no{color:var(--wrong-ink);}
  .explain{margin:8px 0 0;font-size:14px;color:#44413b;line-height:1.6;}
  .explain .src{color:var(--muted);font-size:12.5px;margin-top:6px;}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 19px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;}
  .btn:hover{filter:brightness(1.05);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .seq{list-style:none;margin:8px 0 12px;padding:0;display:flex;flex-direction:column;gap:8px;}
  .seq li{display:flex;gap:10px;align-items:flex-start;background:#f7f6f4;border:1px dashed #d8d3c8;border-radius:10px;padding:10px 13px;font-size:14.5px;min-height:44px;}
  .seq li .n{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:18px;}
  .seq li.filled{background:#fff;border:1px solid var(--line);}
  .seq li.right{background:var(--correct-bg);border-color:var(--correct-line);}
  .seq li.bad{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .pool{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .node{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--ink);}
  .node:hover:not(:disabled){border-color:#cfc9bf;}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0 4px;}
  .chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip.right{background:var(--correct-bg);border-color:var(--correct-line);color:var(--correct-ink);}
  .chip.miss{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber-ink);}
  .chip.extra{background:var(--wrong-bg);border-color:var(--wrong-line);color:var(--wrong-ink);}
  .chip:disabled{cursor:default;}
  .ex ul{margin:6px 0 0 18px;padding:0;font-size:14px;color:#44413b;}
  .results h2{margin:0 0 4px;font-size:20px;}
  .results .score{font-size:16px;margin:0 0 4px;} .results .score b{color:var(--accent-ink);}
  .results .brow{display:flex;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid #f0eee9;}
  .results .brow:last-child{border-bottom:none;}
  .results .brow .bs{flex:0 0 64px;font-weight:700;color:var(--accent-ink);}
  .selfnote{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.55;}
  .take{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);border-radius:12px;padding:13px 16px;margin-top:14px;font-size:14px;}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Mixed Retrieval Round 2</h1>
    <p class="sub">Ten more scenarios in new settings with a few more evaluation items. Use a different day from Round 1.</p>
  </div>
  <div id="root"></div>
</div>
<script>
var STEPS = [
 {
  "type": "mcq",
  "title": "Round 2",
  "short": "Round 2",
  "tag": "Mixed retrieval, round 2",
  "doThis": "Say or write your answer before you press Show the options. Then choose the best-supported option.",
  "intro": "<b>Ten new scenarios from across Modules 1 to 15.<\/b> Every person and number is invented. Each item names two modules after you answer. Before the options appear, say your answer aloud or write it down. Only that typed or spoken first answer is unscored, and the option you choose afterward is scored. Nothing is saved or sent. Items you miss come back at the end for half credit. Use a different day for each round. If anything in these scenarios affects you personally, you can call or text 988 at any hour, or call 911 in an emergency.",
  "revisit": "Return to the headings named in the feedback for the items you missed.",
  "items": [
   {
    "id": "R2-01",
    "prompt": "Marguerite, a delivery driver, was lunged at by a dog on one stretch of her route. Since then she skips that street and loops three blocks around it, which adds about eleven minutes that she notices only when she totals her mileage at the end of each week. Each time she takes the loop, her chest unclenches, and last week she began looping around a second street with a fenced yard. Which term best explains why the detouring grows?",
    "bloom": "apply",
    "primary": 2,
    "secondary": 10,
    "anchors": [
     "avoidance and negative reinforcement"
    ],
    "outcomes": [
     "CSLO2",
     "PLO1",
     "N-CT"
    ],
    "topic": "Delivery driver detours around a street after a dog lunged (negative reinforcement versus punishment)",
    "src": "Module 2, A Closer Look at Reinforcement: Four Everyday Mechanisms | Module 5, How Behavior Gets Trained: Reinforcement Up Close",
    "correct": "b",
    "options": [
     {
      "id": "a",
      "text": "Punishment, because the extra eleven minutes is an unpleasant result that should make detouring less likely",
      "fb": "Punishment weakens behavior when an unpleasant consequence follows it closely. The extra time shows up only when she totals her mileage, long after the relief has done its work. Detouring is spreading, which is the opposite of weakening.",
      "rv": "Module 2, Audio Overview: Negative Reinforcement Versus Punishment"
     },
     {
      "id": "b",
      "text": "Negative reinforcement, because the detour removes dread and so makes detouring more likely next time",
      "fb": "A behavior grows when it removes something unpleasant, and negative refers to the removal. The relief arrives within seconds, and the cost of the extra mileage arrives later and in small amounts. The relief has more pull on the next choice.",
      "rv": "Module 2, A Closer Look at Reinforcement: Four Everyday Mechanisms | Module 5, How Behavior Gets Trained: Reinforcement Up Close"
     },
     {
      "id": "c",
      "text": "Extinction, because the fear fades each week that she does not meet the dog on her route",
      "fb": "Extinction needs the feared cue to be met repeatedly without the bad outcome. She never meets the cue, so nothing is updated, and the fear spread to a second street.",
      "rv": "Module 5, Extinction: How Old Fears Get Rewritten"
     },
     {
      "id": "d",
      "text": "Classical conditioning alone, because the street has become a cue that triggers her dread",
      "fb": "Classical conditioning explains how the street came to set off dread. It does not explain why a behavior (detouring) is growing, which comes from the consequences that follow it.",
      "rv": "Module 2, The Behavioral Tradition, Revisited: How Fears Grow and Shrink"
     }
    ]
   },
   {
    "id": "R2-02",
    "prompt": "Isolde, an intake coordinator, reviews a clinic's consent handout. It states in bold, \"Everything you tell your therapist is confidential,\" and it asks clients to sign at the bottom. Staff report that clients are often surprised when a therapist later mentions a required report, and some stop attending afterward. Which analysis best fits the course's account of consent and the working alliance?",
    "bloom": "analyze",
    "primary": 13,
    "secondary": 3,
    "anchors": [
     "consent and confidentiality limits",
     "alliance as a mechanism"
    ],
    "outcomes": [
     "CSLO3",
     "PLO5",
     "N-PRO"
    ],
    "topic": "Consent handout that says everything is confidential and clients who are surprised by a required report",
    "src": "Module 13, Informed Consent in Therapy | Module 3, The Alliance as a Mechanism, Not a Mood",
    "correct": "a",
    "options": [
     {
      "id": "a",
      "text": "The handout overpromises and treats consent as a signature, so a required disclosure later feels like a broken promise",
      "fb": "Consent is a continuing conversation that tells clients the limits at the outset and again as circumstances change. A signature records one moment. A client who feels misled has reason to doubt the bond and the shared understanding of how the work runs, and dropping out follows.",
      "rv": "Module 13, Informed Consent in Therapy | Module 3, The Alliance as a Mechanism, Not a Mood"
     },
     {
      "id": "b",
      "text": "The handout should list the possible exceptions in small print, so that no client can say they were not told",
      "fb": "The aim is a client who understands the limits, in language that is reasonably understandable. Small print protects the clinic and leaves the client no better informed.",
      "rv": "Module 13, Informed Consent in Therapy"
     },
     {
      "id": "c",
      "text": "The handout is fine, because the signature shows that clients consented and the surprise comes from individual sensitivity",
      "fb": "A signed form that was never explained leaves the client uninformed. Consent has a content requirement (in language the person understands) and a timing requirement, and neither is met by a signature alone.",
      "rv": "Module 13, Informed Consent in Therapy"
     },
     {
      "id": "d",
      "text": "The handout should be shortened to a single sentence, because describing limits at the start makes clients less honest",
      "fb": "Telling clients early and calmly makes any later report less of a surprise. Presented as part of the professional's obligations, the limits do not need to chill honesty.",
      "rv": "Module 10, Consent in Trauma-Focused Care"
     }
    ]
   },
   {
    "id": "R2-03",
    "prompt": "Calla found a lump in her neck, and her doctor examined it and found nothing concerning. Since then she asks her husband several times a day whether it is serious. He answers warmly each time. The calm lasts about an hour and the questions return. A counselor proposes a plan for the household. Judged by how the course describes reassurance loops, which plan is best supported?",
    "bloom": "evaluate",
    "primary": 9,
    "secondary": 5,
    "anchors": [
     "reassurance loop"
    ],
    "outcomes": [
     "CSLO2",
     "CSLO3",
     "PLO1",
     "N-CT"
    ],
    "topic": "Family reassurance about a lump a doctor already examined (warmth with gradually less reassurance)",
    "src": "Module 9, Checking and Reassurance | Module 5, A Third Illustration: Priya and the Reassurance Trap",
    "correct": "a",
    "options": [
     {
      "id": "a",
      "text": "He stays warm but gives fewer reassuring answers over time, Calla practices tolerating doubt, and they track her asking",
      "fb": "Reassurance works as a check supplied by another person, and each answer teaches her that she needed it. Clinicians sometimes coach families to respond with warmth while gradually providing less reassurance, so the person can learn to tolerate the doubt. Tracking the asking provides a gauge for the process.",
      "rv": "Module 9, Checking and Reassurance | Module 5, A Third Illustration: Priya and the Reassurance Trap"
     },
     {
      "id": "b",
      "text": "Calla books a second medical opinion to settle the question, since an expert's answer should carry more weight than her husband's",
      "fb": "A second examination after a thorough first one is another check. It brings relief that fades, and each check teaches her that she needed one to manage the doubt. Whether any further medical review is warranted is her physician's call, and the household plan concerns how the daily questions are answered.",
      "rv": "Module 9, Shared Processes Across Anxiety Presentations"
     },
     {
      "id": "c",
      "text": "He answers faster and more fully each time, so that the doubt is finally settled and the questions stop",
      "fb": "A check can only report on this moment, and the doubt returns. More complete answers feed the loop, because each answer is another instance of relief following the question.",
      "rv": "Module 9, Checking and Reassurance"
     },
     {
      "id": "d",
      "text": "He refuses to discuss the lump and turns away from her when she asks, so that the habit fades through lack of attention",
      "fb": "The course aims at warmth with gradually fewer reassuring answers. Coldness risks the supportive relationship, and the loop can be named without blaming the person who loves her.",
      "rv": "Module 5, A Third Illustration: Priya and the Reassurance Trap"
     }
    ]
   },
   {
    "id": "R2-04",
    "prompt": "Yosef, a clinic director, writes in the annual report, \"Every client whose questionnaire score dropped by 4 points or more improved.\" The clinic uses an invented 0 to 50 anxiety scale where lower scores are better, with a standard deviation of 6 and a reliability of .80. By the Module 11 method, the smallest reliable drop is about 7.4 points. A counselor objects. Judged against the reliable change criterion, which evaluation is best supported?",
    "bloom": "evaluate",
    "primary": 11,
    "secondary": 12,
    "anchors": [
     "reliable change"
    ],
    "outcomes": [
     "CSLO3",
     "CSLO4",
     "PLO2",
     "N-CT"
    ],
    "topic": "Annual report claim that every client who dropped 4 points improved (measurement noise on an invented 0 to 50 anxiety scale)",
    "src": "Module 11, Reliable Change, Step by Step | Module 12, Measurement-Based Care: The Loop",
    "correct": "d",
    "options": [
     {
      "id": "a",
      "text": "The sentence is acceptable if the report adds a p-value, because statistical significance would show the drops were real",
      "fb": "A p-value describes group data under an assumption of no effect, and it does not tell you whether one person's change exceeded the noise in the instrument. Reliable change is the individual-level question.",
      "rv": "Module 11, Real vs. Meaningful: Statistical and Clinical Significance"
     },
     {
      "id": "b",
      "text": "The sentence is wrong, because only clients who finish below a clinical cutpoint can be counted as improved",
      "fb": "Improved means a reliable change without crossing the cutpoint. Crossing the cutpoint is part of the definition of recovered. The sentence's problem is the noise, and the cutpoint is a separate criterion.",
      "rv": "Module 11, Reliable Change, Step by Step"
     },
     {
      "id": "c",
      "text": "The sentence is supported, because a drop in a questionnaire score is evidence that the person improved, and 4 points is a visible change",
      "fb": "Scores wobble from day to day and from the way a question is read. A small drop can arise from noise alone, and clients also tend to enter treatment at an extreme point, which adds regression to the mean.",
      "rv": "Module 11, Reliable Change, Step by Step"
     },
     {
      "id": "d",
      "text": "The sentence overreaches, because drops of 4 to 7 points fall inside measurement noise and only drops of 8 or more clear it",
      "fb": "A change counts as reliable when it exceeds what measurement noise would produce for one person. Drops of 4 through 7 points fall under about 7.4. The report can say how many clients changed reliably and how many did not.",
      "rv": "Module 11, Reliable Change, Step by Step | Module 12, Measurement-Based Care: The Loop"
     }
    ]
   },
   {
    "id": "R2-05",
    "prompt": "Evander has two kinds of bad nights. On some he lies awake running through \"what if the roof leaks again, what if the repair bill is too high, what if I cannot pay it.\" On others he goes over his decision to leave a team two years ago and asks why he made it. A counselor says both nights involve one shared process. Which analysis is most accurate?",
    "bloom": "analyze",
    "primary": 4,
    "secondary": 7,
    "anchors": [
     "rumination"
    ],
    "outcomes": [
     "CSLO2",
     "PLO1",
     "N-CT"
    ],
    "topic": "Two kinds of sleepless nights, roof-repair what-if chains and a replayed decision to leave a team (worry and rumination as repetitive negative thinking)",
    "src": "Module 4, When the Problem Is the Overthinking Itself | Module 7, Rumination: When Thinking Feels Like Coping but Isn't | Module 9, Where Anxiety and Depression Overlap",
    "correct": "c",
    "options": [
     {
      "id": "a",
      "text": "The nights spent replaying the old decision are the real problem, because the what-if nights about the roof are responsible preparation for real risks",
      "fb": "Worry feels like preparation and resembles problem solving, which makes it hard to drop. It moves from one what-if to the next and rarely reaches a solution.",
      "rv": "Module 9, Shared Processes Across Anxiety Presentations"
     },
     {
      "id": "b",
      "text": "Both are forms of problem solving, because each night touches a real concern that Evander has, such as the repair bill or the team he left",
      "fb": "The topics are real, and the thinking does not produce a next step on either night. A process that circles without a destination is the mark of overthinking.",
      "rv": "Module 7, Spotting the Difference in Real Life"
     },
     {
      "id": "c",
      "text": "Both are repetitive, passive thinking, with worry aimed ahead and rumination behind, so interrupting the circling could help both",
      "fb": "Worry and rumination share repetitive, passive features and differ in their time focus. The core difficulty is the process of circling without reaching a conclusion, which is why working on the process (noticing the chain and stepping out of it) can be more efficient than debating each thought.",
      "rv": "Module 4, When the Problem Is the Overthinking Itself | Module 7, Rumination: When Thinking Feels Like Coping but Isn't | Module 9, Where Anxiety and Depression Overlap"
     },
     {
      "id": "d",
      "text": "Worry and rumination differ in kind, so each needs its own treatment with techniques that do not overlap",
      "fb": "The two are close relatives. Both are repetitive negative thinking and both appear across diagnoses, which is one reason the same process-level methods can help with either.",
      "rv": "Module 9, Where Anxiety and Depression Overlap"
     }
    ]
   },
   {
    "id": "R2-06",
    "prompt": "Yosef dreads the Thursday review meeting because his manager tends to criticize people in front of the group. This week he keeps attending and asks a trusted colleague to stay next to him. In Gross's process model, which point in the chain has he stepped in at?",
    "bloom": "apply",
    "primary": 7,
    "secondary": 14,
    "anchors": [
     "reappraisal versus suppression"
    ],
    "outcomes": [
     "CSLO1",
     "CSLO2",
     "PLO1",
     "N-CT"
    ],
    "topic": "Dreaded review meeting and four coping moves located on Gross's chain (modification, reappraisal, suppression, breathing)",
    "src": "Module 7, Gross's Process Model: Five Places to Step In | Module 7, Two Strategies Worth Knowing Well: Reappraisal and Suppression",
    "correct": "b",
    "options": [
     {
      "id": "a",
      "text": "Expressive suppression, because the colleague's presence helps him keep his face calm in front of the group",
      "fb": "Suppression holds back the outward signs of an emotion after it has started. Sitting beside a supportive colleague changes the situation. It does nothing about hiding a feeling that is already running.",
      "rv": "Module 7, Two Strategies Worth Knowing Well: Reappraisal and Suppression"
     },
     {
      "id": "b",
      "text": "Situation modification, because he enters the situation and changes something about it to make it more manageable",
      "fb": "Situation modification keeps the person in the situation and alters it, as bringing a trusted friend does. It can help, and it can turn into a prop if it becomes a condition for attending, so it works best as a step toward needing it less.",
      "rv": "Module 7, Gross's Process Model: Five Places to Step In | Module 7, Two Strategies Worth Knowing Well: Reappraisal and Suppression"
     },
     {
      "id": "c",
      "text": "Cognitive reappraisal, because the colleague's presence changes how he reads the manager's comments before the feeling builds",
      "fb": "Reappraisal changes the meaning of a situation before the emotion builds. Nothing in the scenario says that he has reinterpreted what the manager's comments mean.",
      "rv": "Module 7, Two Strategies Worth Knowing Well: Reappraisal and Suppression"
     },
     {
      "id": "d",
      "text": "Situation selection, because he picked the one setting in which the feeling would be least likely to build, a meeting with a colleague beside him",
      "fb": "Situation selection means choosing which situations to enter or avoid. Yosef still goes to the meeting, so he has not selected out of it. Skipping the meeting would be selection.",
      "rv": "Module 7, Gross's Process Model: Five Places to Step In"
     }
    ]
   },
   {
    "id": "R2-07",
    "prompt": "Marguerite finished a course of exposure for her fear of heights. She stood calmly at the rail of her clinic's third-floor balcony and later on the walkway of the hospital where she works. Two months later, at a lookout tower in another city, her fear returns at nearly full strength. She tells a friend, \"I guess the treatment never worked.\" Which statement best fits the brain-based account of what happened?",
    "bloom": "apply",
    "primary": 6,
    "secondary": 5,
    "anchors": [
     "extinction versus new learning"
    ],
    "outcomes": [
     "CSLO1",
     "CSLO2",
     "PLO1",
     "N-CT"

  if(a==="reveal"){ S.revealed=true; S.res[S.k].done=true; render(); return; }
  if(a==="tog"){ if(S.checked) return; S.sel[v]=!S.sel[v]; render(); return; }
  if(a==="chk"){ var tp=0,fp=0; st.options.forEach(function(o){ var on=!!S.sel[o.id], t=st.truth.indexOf(o.id)>=0; if(on&&t) tp++; if(on&&!t) fp++; }); S.res[S.k].score=Math.max(0,(tp-fp))/st.truth.length; S.checked=true; S.res[S.k].done=true; render(); return; }
  if(a==="next"){
    var multiItem=(st.type==="classify"||st.type==="mcq");
    if(multiItem && S.i<lastIdx(st)){ S.i++; S.picked=null; render(); toTop(); return; }
    if(multiItem && !S.retry && S.miss.length){ S.retry=true; S.rq=S.miss.slice(); S.miss=[]; S.i=0; S.picked=null; if(st.type==="mcq"){ S.order=S.rq.map(function(ix){ return shuffled(st.items[ix].options); }); } render(); toTop(); return; }
    S.res[S.k].done=true; S.k++; S.i=0; S.retry=false; S.rq=[]; S.miss=[]; S.order=[]; S.picked=null; S.seq=[]; S.tries=0; S.revealed=false; S.orderOk=false; S.sel={}; S.checked=false; render(); toTop(); return;
  }
  if(a==="again"){ reset(); toTop(); return; }
}
root.addEventListener("click",function(e){ var t=e.target.closest("[data-act]"); if(!t||t.disabled) return; act(t.getAttribute("data-act"),t.getAttribute("data-val")); });
reset();

</script>
