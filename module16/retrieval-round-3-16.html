<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mixed Retrieval Round 3</title>
<style>
  :root{
    --bg:#faf9f7; --ink:#1f1e1c; --muted:#6b6862; --line:#e7e4de;
    --panel:#ffffff; --panel-shadow:0 1px 2px rgba(28,27,25,.04),0 6px 20px rgba(28,27,25,.05);
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --do-bg:#f3f1ec; --do-ink:#57544e;
    --correct-bg:#eef5ee; --correct-line:#bcd6bd; --correct-ink:#3c6b3e;
    --wrong-bg:#fbecec; --wrong-line:#e3b9b9; --wrong-ink:#a23b34;
    --amber-bg:#fffbef; --amber-line:#e7c98a; --amber-ink:#8a6d2f;
    --instr-bg:#eef3fb; --instr-line:#c9d9f0; --instr-ink:#2f4a72;
    --focus:#2f6f4f; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55;}
  .wrap{max-width:780px;margin:0 auto;padding:24px 20px 60px;}
  .masthead{padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .masthead h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em;}
  .masthead .sub{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:70ch;}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;}
  .stp{font-size:12.5px;color:var(--muted);background:#eceae4;border-radius:999px;padding:4px 11px;}
  .stp.on{background:var(--accent);color:#fff;}
  .stp.done{background:var(--correct-bg);color:var(--correct-ink);}
  .case{background:var(--amber-bg);border:1px solid var(--amber-line);color:#5d4a1f;border-radius:12px;padding:13px 16px;margin-bottom:14px;font-size:14px;line-height:1.6;}
  .case b.t{display:block;margin-bottom:3px;color:var(--amber-ink);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--panel-shadow);padding:22px 24px;}
  .intro{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);border-radius:12px;padding:13px 16px;margin-bottom:16px;font-size:14px;line-height:1.55;}
  .intro b{font-weight:700;}
  .qtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px;}
  .qtop .qn{font-size:13px;color:var(--muted);}
  .qtop .tag{font-size:12px;color:var(--muted);background:#eceae4;border-radius:7px;padding:4px 10px;}
  .qprompt{font-size:17px;font-weight:600;margin:6px 0 6px;line-height:1.45;}
  .quote{font-size:17px;line-height:1.5;margin:8px 0 10px;padding:10px 14px;background:#f7f6f4;border-left:3px solid var(--accent);border-radius:6px;}
  .do{background:var(--do-bg);color:var(--do-ink);border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.5;margin:10px 0 16px;}
  .do b{color:var(--ink);}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;font-size:14.5px;line-height:1.5;cursor:pointer;color:var(--ink);transition:border-color .12s,background .12s;}
  .opt:hover:not(:disabled){border-color:#cfc9bf;}
  .opt:focus-visible,.btn:focus-visible,.cat:focus-visible,.node:focus-visible,.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:15px;}
  .opt:disabled{cursor:default;}
  .opt.correct,.cat.correct{background:var(--correct-bg);border-color:var(--correct-line);}
  .opt.wrong,.cat.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .opt.dim{opacity:.6;}
  .cats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .cat{flex:1 1 150px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--ink);text-align:center;}
  .cat:hover:not(:disabled){border-color:#cfc9bf;}
  .cat:disabled{cursor:default;}
  .cat.dim{opacity:.6;}
  .verdict{margin:16px 0 0;font-size:14.5px;font-weight:600;}
  .verdict.ok{color:var(--correct-ink);} .verdict.no{color:var(--wrong-ink);}
  .explain{margin:8px 0 0;font-size:14px;color:#44413b;line-height:1.6;}
  .explain .src{color:var(--muted);font-size:12.5px;margin-top:6px;}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 19px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;}
  .btn:hover{filter:brightness(1.05);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .seq{list-style:none;margin:8px 0 12px;padding:0;display:flex;flex-direction:column;gap:8px;}
  .seq li{display:flex;gap:10px;align-items:flex-start;background:#f7f6f4;border:1px dashed #d8d3c8;border-radius:10px;padding:10px 13px;font-size:14.5px;min-height:44px;}
  .seq li .n{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:18px;}
  .seq li.filled{background:#fff;border:1px solid var(--line);}
  .seq li.right{background:var(--correct-bg);border-color:var(--correct-line);}
  .seq li.bad{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .pool{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .node{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--ink);}
  .node:hover:not(:disabled){border-color:#cfc9bf;}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0 4px;}
  .chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip.right{background:var(--correct-bg);border-color:var(--correct-line);color:var(--correct-ink);}
  .chip.miss{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber-ink);}
  .chip.extra{background:var(--wrong-bg);border-color:var(--wrong-line);color:var(--wrong-ink);}
  .chip:disabled{cursor:default;}
  .ex ul{margin:6px 0 0 18px;padding:0;font-size:14px;color:#44413b;}
  .results h2{margin:0 0 4px;font-size:20px;}
  .results .score{font-size:16px;margin:0 0 4px;} .results .score b{color:var(--accent-ink);}
  .results .brow{display:flex;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid #f0eee9;}
  .results .brow:last-child{border-bottom:none;}
  .results .brow .bs{flex:0 0 64px;font-weight:700;color:var(--accent-ink);}
  .selfnote{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.55;}
  .take{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);border-radius:12px;padding:13px 16px;margin-top:14px;font-size:14px;}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Mixed Retrieval Round 3</h1>
    <p class="sub">Ten scenarios with the most evaluation items. Use a different day from Rounds 1 and 2.</p>
  </div>
  <div id="root"></div>
</div>
<script>
var STEPS = [
 {
  "type": "mcq",
  "title": "Round 3",
  "short": "Round 3",
  "tag": "Mixed retrieval, round 3",
  "doThis": "Say or write your answer before you press Show the options. Then choose the best-supported option.",
  "intro": "<b>Ten new scenarios from across Modules 1 to 15.<\/b> Every person and number is invented. Each item names two modules after you answer. Before the options appear, say your answer aloud or write it down. Only that typed or spoken first answer is unscored, and the option you choose afterward is scored. Nothing is saved or sent. Items you miss come back at the end for half credit. Use a different day for each round. If anything in these scenarios affects you personally, you can call or text 988 at any hour, or call 911 in an emergency.",
  "revisit": "Return to the headings named in the feedback for the items you missed.",
  "items": [
   {
    "id": "R3-01",
    "prompt": "Philippa, a counselor, is five sessions into work with a client when he says with a flat look, \"I thought you would have done something about this by now.\" Which response fits what the course teaches about strains in the relationship?",
    "bloom": "apply",
    "primary": 3,
    "secondary": 5,
    "anchors": [
     "alliance as a mechanism"
    ],
    "outcomes": [
     "CSLO1",
     "PLO1",
     "N-CT"
    ],
    "topic": "Client says he expected more progress by now (a rupture about pace and how to respond)",
    "src": "Module 3, Ruptures and Repairs: When the Relationship Strains | Module 3, Bordin's Model: Three Parts of a Working Bond",
    "correct": "c",
    "options": [
     {
      "id": "a",
      "text": "Offer to refer him to a different clinician who may move faster, to protect his chances of getting what he came for",
      "fb": "A quick referral takes the remark as a verdict and gives up the chance to repair. Goals and tasks need agreement, and a conversation can produce a better plan with the same clinician.",
      "rv": "Module 3, Bordin's Model: Three Parts of a Working Bond"
     },
     {
      "id": "b",
      "text": "Describe the usual timeline for this kind of work and ask him to keep going through the planned sessions before he judges the results",
      "fb": "Explaining the timeline answers the complaint with an argument and leaves the strain in place. His remark is information about the alliance, and a reply that defends the schedule makes it less likely that he says more.",
      "rv": "Module 3, Ruptures and Repairs: When the Relationship Strains"
     },
     {
      "id": "c",
      "text": "Ask what he hoped would be different by now, link the pace to his goal, and agree on a nearer point to check progress",
      "fb": "A rupture handled with curiosity is an opportunity to repair the alliance. Asking what he hoped for addresses the goal part of Bordin's model, and an agreed check-in addresses the task part, so the work becomes shared again.",
      "rv": "Module 3, Ruptures and Repairs: When the Relationship Strains | Module 3, Bordin's Model: Three Parts of a Working Bond"
     },
     {
      "id": "d",
      "text": "Reflect that he feels frustrated, thank him, and then return to the agenda she planned for the session",
      "fb": "Naming the feeling is a good start, and moving straight back to her own agenda leaves the strain unexamined. Ruptures that go unspoken can quietly erode the alliance, and the repair needs a conversation about what he hoped for.",
      "rv": "Module 3, Ruptures and Repairs: When the Relationship Strains"
     }
    ]
   },
   {
    "id": "R3-02",
    "prompt": "Torvald keeps promising himself that he will open the shared folder with his tax documents. Each time he opens it, dread rises, he closes the laptop, and the dread drops within seconds. A late-filing notice arrives three weeks after he first meant to start. Which feature of this cycle best explains why firm resolve alone so often fails?",
    "bloom": "analyze",
    "primary": 14,
    "secondary": 2,
    "anchors": [
     "avoidance and negative reinforcement"
    ],
    "outcomes": [
     "CSLO2",
     "PLO1",
     "N-CT"
    ],
    "topic": "Dreaded tax folder, immediate relief and a penalty notice three weeks later (why resolve alone fails)",
    "src": "Module 14, Avoidance and the Reinforcement Cycle | Module 2, Audio Overview: Negative Reinforcement Versus Punishment",
    "correct": "a",
    "options": [
     {
      "id": "a",
      "text": "The relief arrives within seconds and the cost weeks later, so the relief shapes the behavior and resolve does not change that",
      "fb": "If the general learning principle holds here, consequences that follow a behavior closely shape it more than consequences that arrive later. Closing the laptop is negatively reinforced by the quick drop in dread. A plan that changes what happens in the moment has more chance than a promise to try harder.",
      "rv": "Module 14, Avoidance and the Reinforcement Cycle | Module 2, Audio Overview: Negative Reinforcement Versus Punishment"
     },
     {
      "id": "b",
      "text": "The late-filing notice is a punishment strong enough to outweigh the relief, so his resolve will win once the penalty grows larger",
      "fb": "Punishment weakens behavior when it follows closely and reliably. The late-filing notice arrives weeks after the choice, and the relief at the laptop arrives at once.",
      "rv": "Module 2, Audio Overview: Negative Reinforcement Versus Punishment"
     },
     {
      "id": "c",
      "text": "He has not yet found the original cause of the dread, and avoidance will continue until that cause is understood",
      "fb": "A cause is what started a problem, and a maintaining mechanism is what feeds it now. Waiting for a full account of the origin can delay work on the loop that is running this week.",
      "rv": "Module 14, Maintaining Mechanisms: What Keeps a Problem Going"
     },
     {
      "id": "d",
      "text": "Torvald lacks willpower, a stable trait of his that explains why he avoids paperwork and would explain avoidance in other people like him",
      "fb": "Calling avoidance a flaw of character explains little and points to nothing the clinician can change. The loop explanation names what feeds the behavior now.",
      "rv": "Module 14, Maintaining Mechanisms: What Keeps a Problem Going"
     }
    ]
   },
   {
    "id": "R3-03",
    "prompt": "Nuala has a trauma history and has been offered prolonged exposure. After hearing that distress usually rises before it improves, she says she wants to start with supportive sessions and decide about exposure later. Her clinician believes the research favors exposure. Judged by the course's account of consent and of the three legs, which response is best supported?",
    "bloom": "evaluate",
    "primary": 13,
    "secondary": 12,
    "anchors": [
     "consent and confidentiality limits",
     "three legs of evidence-based practice"
    ],
    "outcomes": [
     "CSLO3",
     "PLO4",
     "PLO5",
     "N-PRO"
    ],
    "topic": "Client with a trauma history wants supportive sessions first and to decide on exposure later",
    "src": "Module 10, Consent in Trauma-Focused Care | Module 13, Informed Consent in Therapy | Module 12, When the Three Legs Disagree",
    "correct": "d",
    "options": [
     {
      "id": "a",
      "text": "Begin supportive sessions and not mention exposure again unless she raises it, because bringing it up would pressure her to change her mind",
      "fb": "Consent is revisited when the plan changes direction or new information appears, and she is entitled to ongoing information about alternatives. Mentioning options at a planned review is information, and pressure is something different.",
      "rv": "Module 13, Informed Consent in Therapy"
     },
     {
      "id": "b",
      "text": "Decline to work with her unless she accepts exposure, because treating her without the recommended approach would be unethical",
      "fb": "Clients have the right to decline a recommended approach and to make decisions the clinician would not make. The clinician offers an honest opinion and leaves the decision with the client.",
      "rv": "Module 13, Informed Consent in Therapy"
     },
     {
      "id": "c",
      "text": "Proceed with exposure and describe it as the usual plan, because the research leg supports it and she should defer to that",
      "fb": "Presenting a recommendation as the only plan removes voluntariness. Research cannot decide for the person in the room, and consent is an ongoing conversation.",
      "rv": "Module 10, Consent in Trauma-Focused Care"
     },
     {
      "id": "d",
      "text": "Respect her choice, confirm she understands the alternatives and risks, state the evidence accurately, and set a planned review",
      "fb": "Consent includes disclosure of alternatives, capacity, and voluntariness, and a client may make decisions the clinician considers unwise. Because the two main trauma-focused treatments help by similar amounts on average, her informed preference carries real weight, and the plan can still include a review.",
      "rv": "Module 10, Consent in Trauma-Focused Care | Module 13, Informed Consent in Therapy | Module 12, When the Three Legs Disagree"
     }
    ]
   },
   {
    "id": "R3-04",
    "prompt": "After nearly every set at practice, Nuala, a 17-year-old swimmer, asks her coach, \"Was that okay? Did I look slow?\" The coach says it looked fine, and Nuala's shoulders drop. Over the season the coach notices that he has stopped giving her technical corrections, because corrections bring more questions. Which analysis best fits the loop account?",
    "bloom": "analyze",
    "primary": 2,
    "secondary": 14,
    "anchors": [
     "reassurance loop"
    ],
    "outcomes": [
     "CSLO2",
     "PLO1",
     "N-CT"
    ],
    "topic": "Swimmer asks the coach \"was that okay?\" after each set and the coach stops giving corrections (circular causality)",
    "src": "Module 2, The Reassurance Trap | Module 14, Interpersonal Loops",
    "correct": "d",
    "options": [
     {
      "id": "a",
      "text": "The coach's kindness is the cause of Nuala's anxiety, so he should stop answering her questions and leave her to cope during practice",
      "fb": "Circular causality looks at a pattern in which each action feeds the other, and it does not assign the blame to one person. The kindness is part of a loop, and responding with warmth and fewer reassuring answers serves better than withdrawal.",
      "rv": "Module 2, The Systemic Tradition: The Person in the Web"
     },
     {
      "id": "b",
      "text": "The coach should answer in fewer words, so each exchange ends sooner and the habit has fewer chances to grow stronger",
      "fb": "Briefer answers keep the structure of the loop (ask, receive relief, ask again). The length of the answer matters little, because the pattern is the ask, the relief, and the next ask.",
      "rv": "Module 2, The Reassurance Trap"
     },
     {
      "id": "c",
      "text": "Her anxiety began at an earlier club, and the loop can be addressed once that history has been worked through in detail",
      "fb": "The origin may be complicated or impossible to establish, and a loop that is running now can be addressed now. Formulating around maintenance offers a way to begin with what is happening today.",
      "rv": "Module 14, Maintaining Mechanisms: What Keeps a Problem Going"
     },
     {
      "id": "d",
      "text": "Each move feeds the other, since her asking brings his reassurance and relief follows, so either person can interrupt the loop",
      "fb": "Reassurance that works in the moment removes the asker's doubt, and the coach's wish to ease it keeps him answering. Both behaviors strengthen, and the pattern lives between the two people. The loop can be interrupted from either side, for example by warm responses that gradually give fewer reassuring answers.",
      "rv": "Module 2, The Reassurance Trap | Module 14, Interpersonal Loops"
     }
    ]
   },
   {
    "id": "R3-05",
    "prompt": "Anneke reads a clinic protocol that says, \"If a client's weekly PHQ-9 total has not fallen by at least 5 points by session 6, the client moves to weekly sessions.\" The rule came from a staff meeting and cites no study. Judged by how the course treats decision rules and reliable change, which evaluation is best supported?",
    "bloom": "evaluate",
    "primary": 12,
    "secondary": 11,
    "anchors": [
     "reliable change"
    ],
    "outcomes": [
     "CSLO3",
     "CSLO4",
     "PLO2",
     "N-CT"
    ],
    "topic": "Clinic rule to step up if the PHQ-9 has not fallen 5 points by session 6 (decision rules as illustrations)",
    "src": "Module 12, Measurement-Based Care: The Loop | Module 11, Reliable Change, Step by Step",
    "correct": "b",
    "options": [
     {
      "id": "a",
      "text": "The rule is unhelpful, because a fixed rule replaces clinical judgment and removes the clinician's reasoning from the decision",
      "fb": "The rule triggers a review, and the review is where judgment enters. Fixing the trigger ahead of time keeps the decision from depending on mood or memory.",
      "rv": "Module 12, Measurement-Based Care: The Loop"
     },
     {
      "id": "b",
      "text": "The rule is a reasonable commitment to decide in advance, and its 5-point line is an illustration that needs checking",
      "fb": "A rule's contribution is the commitment to decide in advance. The numbers belong to the clinician and the client, who set them with reasons and revise them. The course gives no validated cutoff for any real measure, and a reliable change line depends on the instrument's own reliability and spread.",
      "rv": "Module 12, Measurement-Based Care: The Loop | Module 11, Reliable Change, Step by Step"
     },
     {
      "id": "c",
      "text": "The rule is correct, because 5 points is the course's own line for reliable change on a standard depression measure",
      "fb": "The course's reliable change line applied to an invented scale and came out at about 6.65 points. It showed how the line is computed, and real instruments need their own values.",
      "rv": "Module 11, Reliable Change, Step by Step"
     },
     {
      "id": "d",
      "text": "The rule is evidence-based, because it uses a standard questionnaire and ties the decision to a fixed session number and a fixed cutoff",
      "fb": "Using a standard measure does not validate the threshold attached to it. The line itself came from a meeting and cites no study, so it needs its own reasoning.",
      "rv": "Module 12, Measurement-Based Care: The Loop"
     }
    ]
   },
   {
    "id": "R3-06",
    "prompt": "In his first exposure for fear of fainting in crowds, Torvald stays in a busy shopping mall for forty minutes. His anxiety rating stays at 8 of 10 the whole time, and he leaves still nervous. Before the session he rated \"I will collapse\" as 90 percent likely. Afterward he rates it 20 percent. A trainee says the session failed because his anxiety did not come down. Which analysis is best?",
    "bloom": "analyze",
    "primary": 9,
    "secondary": 14,
    "anchors": [
     "extinction versus new learning"
    ],
    "outcomes": [
     "CSLO2",
     "CSLO4",
     "PLO1",
     "N-CT"
    ],
    "topic": "Exposure session where anxiety stays high but the feared outcome fails to occur (what counts as learning)",
    "src": "Module 9, Inhibitory Learning in Exposure | Module 14, How Loops Break: The New-Learning Idea",
    "correct": "a",
    "options": [
     {
      "id": "a",
      "text": "It worked, since a feared prediction was tested and not confirmed, and anxiety falling during the session is optional",
      "fb": "The goal is to test the feared outcome. Learning grows when reality contradicts a specific prediction, and a person can leave an exposure nervous and still have learned that the outcome did not occur. His fall in the collapse rating is the sign of new learning.",
      "rv": "Module 9, Inhibitory Learning in Exposure | Module 14, How Loops Break: The New-Learning Idea"
     },
     {
      "id": "b",
      "text": "The session worked because anxiety stayed high, since high anxiety is what makes the new safe memory strong",
      "fb": "High anxiety is not the active ingredient. The learning comes from the prediction failing to come true, and a session can succeed with a high or low anxiety rating.",
      "rv": "Module 9, Inhibitory Learning in Exposure"
     },
     {
      "id": "c",
      "text": "Little can be judged until the fear returns, because a relapse is what shows whether learning took place in the first session",
      "fb": "The change in his prediction is evidence about learning now. A later return of fear is also expected and is an invitation to practice again, so it would not erase what this session showed.",
      "rv": "Module 9, When Old Fears Come Back"
     },
     {
      "id": "d",
      "text": "The session failed, because exposure works when anxiety drains away during the session, as habituation predicts",
      "fb": "That is the habituation account, which the reading calls incomplete. People sometimes improve without much drop in anxiety during a session, and some whose anxiety fell a lot later relapse.",
      "rv": "Module 9, Inhibitory Learning in Exposure"
     }
    ]
   },
   {
    "id": "R3-07",
    "prompt": "Casimir, a hospital scheduler, worries on the drive home about staffing gaps, mistakes he might have made, and how colleagues see him. In four sessions his counselor has tested each worry against the evidence. Every time one is settled, the next arrives within a minute, and Casimir says he feels like he is bailing a boat that has a hole in it. Which change in approach best fits the course's account of overthinking?",
    "bloom": "apply",
    "primary": 4,
    "secondary": 7,
    "anchors": [
     "rumination"
    ],
    "outcomes": [
     "CSLO2",
     "PLO1",
     "N-CT"
    ],
    "topic": "Testing each worry against evidence while the next arrives within a minute (working on the process of overthinking)",
    "src": "Module 4, When the Problem Is the Overthinking Itself | Module 7, Rumination: When Thinking Feels Like Coping but Isn't",
    "correct": "b",
    "options": [
     {
      "id": "a",

/* ---- order ---- */

    if(multiItem && S.i<lastIdx(st)){ S.i++; S.picked=null; render(); toTop(); return; }
    if(multiItem && !S.retry && S.miss.length){ S.retry=true; S.rq=S.miss.slice(); S.miss=[]; S.i=0; S.picked=null; if(st.type==="mcq"){ S.order=S.rq.map(function(ix){ return shuffled(st.items[ix].options); }); } render(); toTop(); return; }
    S.res[S.k].done=true; S.k++; S.i=0; S.retry=false; S.rq=[]; S.miss=[]; S.order=[]; S.picked=null; S.seq=[]; S.tries=0; S.revealed=false; S.orderOk=false; S.sel={}; S.checked=false; render(); toTop(); return;
  }
  if(a==="again"){ reset(); toTop(); return; }
}
root.addEventListener("click",function(e){ var t=e.target.closest("[data-act]"); if(!t||t.disabled) return; act(t.getAttribute("data-act"),t.getAttribute("data-val")); });
reset();

</script>
