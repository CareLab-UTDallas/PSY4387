  .node{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--ink);}

  .chip.extra{background:var(--wrong-bg);border-color:var(--wrong-line);color:var(--wrong-ink);}
  .chip:disabled{cursor:default;}
  .ex ul{margin:6px 0 0 18px;padding:0;font-size:14px;color:#44413b;}
  .results h2{margin:0 0 4px;font-size:20px;}
  .results .score{font-size:16px;margin:0 0 4px;} .results .score b{color:var(--accent-ink);}
  .results .brow{display:flex;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid #f0eee9;}

  .selfnote{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.55;}
  .take{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);border-radius:12px;padding:13px 16px;margin-top:14px;font-size:14px;}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>

var SUMMARY = {
 "title": "Confusable Pairs results",
 "takeaway": "Each pair separates on one detail, such as the direction of a behavior, the time focus of a thought, or the question a study asks. Look for that detail first when two terms seem to fit.",
 "note": "All scenes and numbers are invented. Nothing is saved or sent. If anything in these cards affects you personally, you can call or text 988 at any hour, or call 911 in an emergency."
};


function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var root=document.getElementById("root");
var S;
function newState(){ return {k:0, i:0, picked:null, seq:[], tries:0, revealed:false, sel:{}, checked:false, miss:[], retry:false, rq:[], order:[], res:STEPS.map(function(){return {score:0,max:0,done:false};})}; }
function reset(){ S=newState(); STEPS.forEach(function(st,ix){ st.maxScore=maxFor(st); S.res[ix].max=st.maxScore; }); render(); }
function maxFor(st){ if(st.type==="classify"||st.type==="mcq") return st.items.length; return 1; }
function post(){ try{ parent.postMessage(JSON.stringify({subject:"lti.frameResize",height:document.documentElement.scrollHeight}),"*"); }catch(e){} }
function toTop(){ try{ window.scrollTo({top:0,behavior:"smooth"}); }catch(e){} }
function bar(){
  return '<div class="steps" aria-hidden="true">'+STEPS.map(function(st,ix){
    var cls="stp"+(ix===S.k?" on":(S.res[ix].done?" done":""));
    return '<span class="'+cls+'">'+(ix+1)+'. '+esc(st.short||st.title)+'</span>'; }).join("")+'</div>';
}
function caseCard(st){ return st.case ? '<div class="case"><b class="t">'+esc(st.case.title)+'</b>'+st.case.text+'</div>' : ""; }
function render(){
  if(S.k>=STEPS.length){ return renderSummary(); }
  var st=STEPS[S.k], h=bar()+caseCard(st);
  if(S.i===0 && !S.started && st.intro){ h+='<div class="intro">'+st.intro+'</div>'; }
  h+='<section class="panel" aria-live="polite">';
  h+=({classify:rClassify,order:rOrder,mcq:rMcq,multi:rMulti})[st.type](st);
  h+='</section>';
  root.innerHTML=h; post();
}
function nextBtn(label){ return '<div class="foot"><span></span><button class="btn" type="button" data-act="next">'+label+'</button></div>'; }
function advanceLabel(st){
  var multi=(st.type==="classify"||st.type==="mcq");
  var last=multi?(S.i>=lastIdx(st) && !(!S.retry && S.miss.length)):true;
  if(!last) return (multi && S.i>=lastIdx(st))?"Take a second look at the ones you missed":"Next";
  return (S.k>=STEPS.length-1)?"See your results":"Continue to the next step";
}
function curItems(st){ return S.retry ? S.rq.map(function(ix){return st.items[ix];}) : st.items; }
function itemIx(st){ return S.retry ? S.rq[S.i] : S.i; }
function shuffled(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t; } return b; }
function retryBanner(){ return S.retry ? '<div class="intro"><b>Second look.</b> You missed this one the first time. The explanation you read applies here. Answer again without it. A correct answer now counts for half a point.</div>' : ""; }
function lastIdx(st){ return S.retry ? S.rq.length-1 : st.items.length-1; }
/* ---- classify ---- */
function rClassify(st){
  var it=curItems(st)[S.i], ans=S.picked!==null;
  var h=retryBanner()+'<div class="qtop"><span class="qn">'+esc(st.title)+', '+(S.retry?'second look ':'item ')+(S.i+1)+' of '+curItems(st).length+'</span><span class="tag">'+esc(st.tag||"")+'</span></div>';
  h+='<p class="quote">'+it.text+'</p>';
  h+='<div class="do"><b>Do this:</b> '+st.doThis+'</div><div class="cats">';
  st.cats.forEach(function(c){
    var cls="cat"; if(ans){ if(c.id===it.answer) cls+=" correct"; else if(c.id===S.picked) cls+=" wrong"; else cls+=" dim"; }
    h+='<button class="'+cls+'" type="button" data-act="cls" data-val="'+c.id+'"'+(ans?" disabled":"")+'>'+esc(c.label)+'</button>';
  });
  h+='</div>';
  if(ans){ var ok=S.picked===it.answer;
    h+='<p class="verdict '+(ok?"ok":"no")+'">'+(ok?"Correct.":"Not quite.")+'</p><div class="explain">'+it.why+(st.src?'<div class="src">Reading: '+esc(st.src)+'</div>':'')+'</div>'+nextBtn(advanceLabel(st));
  }
  return h;
}
/* ---- order ---- */
function rOrder(st){
  var chosen=S.seq, done=S.revealed||S.orderOk, full=chosen.length===st.correct.length;
  var h='<div class="qtop"><span class="qn">'+esc(st.title)+'</span><span class="tag">'+esc(st.tag||"")+'</span></div>';
  h+='<p class="qprompt">'+st.prompt+'</p><div class="do"><b>Do this:</b> '+st.doThis+'</div>';
  h+='<ol class="seq">';
  for(var p=0;p<st.correct.length;p++){
    var id=chosen[p], node=id?nodeById(st,id):null, cls="";
    if(node){ cls="filled"; if(full||done){ cls+= (id===st.correct[p])?" right":" bad"; } }
    var shown=node?node.text:"";
    if(S.revealed && !node){ shown=nodeById(st,st.correct[p]).text; }
    h+='<li class="'+cls+'"><span class="n">'+(p+1)+'</span><span>'+(shown?shown:'<span style="color:var(--muted)">…</span>')+'</span></li>';
  }
  h+='</ol>';
  if(!full && !S.revealed){
    h+='<div class="pool">';
    st.nodes.forEach(function(n){ if(chosen.indexOf(n.id)<0) h+='<button class="node" type="button" data-act="ord" data-val="'+n.id+'">'+n.text+'</button>'; });
    h+='</div><div class="foot"><span></span>'+(chosen.length?'<button class="btn secondary" type="button" data-act="undo">Undo last</button>':'')+'</div>';
  } else if(full && !S.orderOk && !S.revealed){
    h+='<p class="verdict no">Not quite. Green rows are in the right place and red rows are not.</p><p class="explain">'+st.hintWrong+'</p>';
    h+='<div class="foot"><button class="btn secondary" type="button" data-act="reveal">Show me the sequence</button><button class="btn" type="button" data-act="retry">Try again</button></div>';
  } else {
    h+='<p class="verdict '+(S.orderOk?"ok":"no")+'">'+(S.orderOk?"Correct.":"The sequence is complete.")+'</p><div class="explain">'+st.why+(st.src?'<div class="src">Reading: '+esc(st.src)+'</div>':'')+'</div>'+nextBtn(advanceLabel(st));
  }
  return h;
}
function nodeById(st,id){ for(var i=0;i<st.nodes.length;i++) if(st.nodes[i].id===id) return st.nodes[i]; return null; }
/* ---- mcq ---- */
function rMcq(st){
  var it=curItems(st)[S.i], ans=S.picked!==null;
  var h=retryBanner()+'<div class="qtop"><span class="qn">'+esc(st.title)+', '+(S.retry?'second look ':'question ')+(S.i+1)+' of '+curItems(st).length+'</span><span class="tag">'+esc(st.tag||"")+'</span></div>';
  h+='<p class="qprompt">'+it.prompt+'</p>';
  if(st.doThis) h+='<div class="do"><b>Do this:</b> '+st.doThis+'</div>';
  h+='<div class="options">';
  (S.retry?S.order[S.i]:it.options).forEach(function(o,oi){
    var cls="opt"; if(ans){ if(o.id===it.correct) cls+=" correct"; else if(o.id===S.picked) cls+=" wrong"; else cls+=" dim"; }
    h+='<button class="'+cls+'" type="button" data-act="pick" data-val="'+o.id+'"'+(ans?" disabled":"")+'><span class="k">'+String.fromCharCode(65+oi)+'.</span><span>'+o.text+'</span></button>';
  });
  h+='</div>';
  if(ans){ var ok=S.picked===it.correct;
    h+='<p class="verdict '+(ok?"ok":"no")+'">'+(ok?"Correct.":"Not quite.")+'</p><div class="explain">'+it.why+(it.src||st.src?'<div class="src">Reading: '+esc(it.src||st.src)+'</div>':'')+'</div>'+nextBtn(advanceLabel(st));
  }
  return h;
}
/* ---- multi ---- */
function rMulti(st){
  var h='<div class="qtop"><span class="qn">'+esc(st.title)+'</span><span class="tag">'+esc(st.tag||"")+'</span></div>';
  h+='<p class="qprompt">'+st.prompt+'</p><div class="do"><b>Do this:</b> '+st.doThis+'</div><div class="chips">';
  st.options.forEach(function(o){
    var on=!!S.sel[o.id], truth=st.truth.indexOf(o.id)>=0, cls="chip";
    if(S.checked){ if(on&&truth) cls+=" right"; else if(!on&&truth) cls+=" miss"; else if(on&&!truth) cls+=" extra"; }
    h+='<button class="'+cls+'" type="button" aria-pressed="'+(on?"true":"false")+'" data-act="tog" data-val="'+o.id+'"'+(S.checked?" disabled":"")+'>'+esc(o.label)+'</button>';
  });
  h+='</div>';
  if(!S.checked){
    var n=Object.keys(S.sel).filter(function(k){return S.sel[k];}).length;
    h+='<div class="foot"><span class="qn" style="font-size:13px;color:var(--muted)">'+n+' selected</span><button class="btn" type="button" data-act="chk"'+(n?"":" disabled")+'>Check my answer</button></div>';
  } else {
    var tp=0,fp=0; st.options.forEach(function(o){ var on=!!S.sel[o.id], t=st.truth.indexOf(o.id)>=0; if(on&&t) tp++; if(on&&!t) fp++; });
    var sc=Math.max(0,(tp-fp))/st.truth.length;
    h+='<p class="verdict '+(sc>=1?"ok":"no")+'">'+(sc>=1?"You found every process, with nothing extra.":"Green marks a correct selection, amber a missed process, and red a process that is not present in this case.")+'</p>';
    h+='<div class="explain ex"><ul>'+st.options.filter(function(o){ var on=!!S.sel[o.id], t=st.truth.indexOf(o.id)>=0; return t||on; }).map(function(o){ var t=st.truth.indexOf(o.id)>=0; return '<li><b>'+esc(o.label)+'.</b> '+(st.reasons[o.id]||(t?"Present.":"Not present in this case."))+'</li>'; }).join("")+'</ul>'+(st.src?'<div class="src">Reading: '+esc(st.src)+'</div>':'')+'</div>'+nextBtn(advanceLabel(st));
  }
  return h;
}
/* ---- summary ---- */
function renderSummary(){
  var tot=0,max=0; S.res.forEach(function(r){ tot+=r.score; max+=r.max; });
  var h=bar()+'<section class="panel results"><h2>'+esc(SUMMARY.title)+'</h2><p class="score">You earned <b>'+(Math.round(tot*10)/10)+' of '+max+'</b> points on the scored items. Items answered correctly on the second look count for half a point.</p><div>';
  STEPS.forEach(function(st,ix){ var r=S.res[ix]; h+='<div class="brow"><span class="bs">'+(Math.round(r.score*10)/10)+' / '+r.max+'</span><span><b>'+esc(st.title)+'.</b> '+(r.score>=r.max?"Full marks.":esc(st.revisit||"Revisit this step."))+'</span></div>'; });
  h+='</div><div class="take">'+SUMMARY.takeaway+'</div><div class="foot"><span></span><button class="btn secondary" type="button" data-act="again">Start over</button></div><p class="selfnote">'+SUMMARY.note+'</p></section>';
  root.innerHTML=h; post();
}
/* ---- actions ---- */
function act(a,v){
  var st=STEPS[S.k];
  if(a==="cls"){ if(S.picked!==null) return; S.picked=v; var it=curItems(st)[S.i]; if(v===it.answer) S.res[S.k].score+=(S.retry?0.5:1); else if(!S.retry) S.miss.push(S.i); render(); return; }
  if(a==="pick"){ if(S.picked!==null) return; S.picked=v; var q=curItems(st)[S.i]; if(v===q.correct) S.res[S.k].score+=(S.retry?0.5:1); else if(!S.retry) S.miss.push(S.i); render(); return; }
  if(a==="ord"){ if(S.seq.length>=st.correct.length||S.revealed) return; S.seq.push(v); if(S.seq.length===st.correct.length){ S.tries++; var ok=S.seq.every(function(x,i){return x===st.correct[i];}); if(ok){ S.orderOk=true; S.res[S.k].score=(S.tries===1)?1:0.5; S.res[S.k].done=true; } } render(); return; }
  if(a==="undo"){ S.seq.pop(); render(); return; }
  if(a==="retry"){ S.seq=[]; render(); return; }
  if(a==="reveal"){ S.revealed=true; S.res[S.k].done=true; render(); return; }
  if(a==="tog"){ if(S.checked) return; S.sel[v]=!S.sel[v]; render(); return; }
  if(a==="chk"){ var tp=0,fp=0; st.options.forEach(function(o){ var on=!!S.sel[o.id], t=st.truth.indexOf(o.id)>=0; if(on&&t) tp++; if(on&&!t) fp++; }); S.res[S.k].score=Math.max(0,(tp-fp))/st.truth.length; S.checked=true; S.res[S.k].done=true; render(); return; }
  if(a==="next"){
    var multiItem=(st.type==="classify"||st.type==="mcq");
    if(multiItem && S.i<lastIdx(st)){ S.i++; S.picked=null; render(); toTop(); return; }
    if(multiItem && !S.retry && S.miss.length){ S.retry=true; S.rq=S.miss.slice(); S.miss=[]; S.i=0; S.picked=null; if(st.type==="mcq"){ S.order=S.rq.map(function(ix){ return shuffled(st.items[ix].options); }); } render(); toTop(); return; }
    S.res[S.k].done=true; S.k++; S.i=0; S.retry=false; S.rq=[]; S.miss=[]; S.order=[]; S.picked=null; S.seq=[]; S.tries=0; S.revealed=false; S.orderOk=false; S.sel={}; S.checked=false; render(); toTop(); return;
  }
  if(a==="again"){ reset(); toTop(); return; }
}
root.addEventListener("click",function(e){ var t=e.target.closest("[data-act]"); if(!t||t.disabled) return; act(t.getAttribute("data-act"),t.getAttribute("data-val")); });
reset();
