<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mixed Retrieval Round 1</title>
<style>
  :root{
    --bg:#faf9f7; --ink:#1f1e1c; --muted:#6b6862; --line:#e7e4de;
    --panel:#ffffff; --panel-shadow:0 1px 2px rgba(28,27,25,.04),0 6px 20px rgba(28,27,25,.05);
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --do-bg:#f3f1ec; --do-ink:#57544e;
    --correct-bg:#eef5ee; --correct-line:#bcd6bd; --correct-ink:#3c6b3e;
    --wrong-bg:#fbecec; --wrong-line:#e3b9b9; --wrong-ink:#a23b34;
    --amber-bg:#fffbef; --amber-line:#e7c98a; --amber-ink:#8a6d2f;
    --instr-bg:#eef3fb; --instr-line:#c9d9f0; --instr-ink:#2f4a72;
    --focus:#2f6f4f; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55;}
  .wrap{max-width:780px;margin:0 auto;padding:24px 20px 60px;}
  .masthead{padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .masthead h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em;}
  .masthead .sub{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:70ch;}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;}
  .stp{font-size:12.5px;color:var(--muted);background:#eceae4;border-radius:999px;padding:4px 11px;}
  .stp.on{background:var(--accent);color:#fff;}
  .stp.done{background:var(--correct-bg);color:var(--correct-ink);}
  .case{background:var(--amber-bg);border:1px solid var(--amber-line);color:#5d4a1f;border-radius:12px;padding:13px 16px;margin-bottom:14px;font-size:14px;line-height:1.6;}
  .case b.t{display:block;margin-bottom:3px;color:var(--amber-ink);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--panel-shadow);padding:22px 24px;}
  .intro{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);border-radius:12px;padding:13px 16px;margin-bottom:16px;font-size:14px;line-height:1.55;}
  .intro b{font-weight:700;}
  .qtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px;}
  .qtop .qn{font-size:13px;color:var(--muted);}
  .qtop .tag{font-size:12px;color:var(--muted);background:#eceae4;border-radius:7px;padding:4px 10px;}
  .qprompt{font-size:17px;font-weight:600;margin:6px 0 6px;line-height:1.45;}
  .quote{font-size:17px;line-height:1.5;margin:8px 0 10px;padding:10px 14px;background:#f7f6f4;border-left:3px solid var(--accent);border-radius:6px;}
  .do{background:var(--do-bg);color:var(--do-ink);border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.5;margin:10px 0 16px;}
  .do b{color:var(--ink);}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;font-size:14.5px;line-height:1.5;cursor:pointer;color:var(--ink);transition:border-color .12s,background .12s;}
  .opt:hover:not(:disabled){border-color:#cfc9bf;}
  .opt:focus-visible,.btn:focus-visible,.cat:focus-visible,.node:focus-visible,.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:15px;}
  .opt:disabled{cursor:default;}
  .opt.correct,.cat.correct{background:var(--correct-bg);border-color:var(--correct-line);}
  .opt.wrong,.cat.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .opt.dim{opacity:.6;}
  .cats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .cat{flex:1 1 150px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--ink);text-align:center;}
  .cat:hover:not(:disabled){border-color:#cfc9bf;}
  .cat:disabled{cursor:default;}
  .cat.dim{opacity:.6;}
  .verdict{margin:16px 0 0;font-size:14.5px;font-weight:600;}
  .verdict.ok{color:var(--correct-ink);} .verdict.no{color:var(--wrong-ink);}
  .explain{margin:8px 0 0;font-size:14px;color:#44413b;line-height:1.6;}
  .explain .src{color:var(--muted);font-size:12.5px;margin-top:6px;}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 19px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;}
  .btn:hover{filter:brightness(1.05);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .seq{list-style:none;margin:8px 0 12px;padding:0;display:flex;flex-direction:column;gap:8px;}
  .seq li{display:flex;gap:10px;align-items:flex-start;background:#f7f6f4;border:1px dashed #d8d3c8;border-radius:10px;padding:10px 13px;font-size:14.5px;min-height:44px;}
  .seq li .n{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:18px;}
  .seq li.filled{background:#fff;border:1px solid var(--line);}
  .seq li.right{background:var(--correct-bg);border-color:var(--correct-line);}
  .seq li.bad{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .pool{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .node{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--ink);}
  .node:hover:not(:disabled){border-color:#cfc9bf;}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0 4px;}
  .chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip.right{background:var(--correct-bg);border-color:var(--correct-line);color:var(--correct-ink);}
  .chip.miss{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber-ink);}
  .chip.extra{background:var(--wrong-bg);border-color:var(--wrong-line);color:var(--wrong-ink);}
  .chip:disabled{cursor:default;}
  .ex ul{margin:6px 0 0 18px;padding:0;font-size:14px;color:#44413b;}
  .results h2{margin:0 0 4px;font-size:20px;}
  .results .score{font-size:16px;margin:0 0 4px;} .results .score b{color:var(--accent-ink);}
  .results .brow{display:flex;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid #f0eee9;}
  .results .brow:last-child{border-bottom:none;}
  .results .brow .bs{flex:0 0 64px;font-weight:700;color:var(--accent-ink);}
  .selfnote{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.55;}
  .take{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);border-radius:12px;padding:13px 16px;margin-top:14px;font-size:14px;}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Mixed Retrieval Round 1</h1>
    <p class="sub">Ten new scenarios drawn from across the course. Say your answer first, then choose, then read the reasoning for every option.</p>
  </div>
  <div id="root"></div>
</div>
<script>
var STEPS = [
 {
  "type": "mcq",
  "title": "Round 1",
  "short": "Round 1",
  "tag": "Mixed retrieval, round 1",
  "doThis": "Say or write your answer before you press Show the options. Then choose the best-supported option.",
  "intro": "<b>Ten new scenarios from across Modules 1 to 15.<\/b> Every person and number is invented. Each item names two modules after you answer. Before the options appear, say your answer aloud or write it down. Only that typed or spoken first answer is unscored, and the option you choose afterward is scored. Nothing is saved or sent. Items you miss come back at the end for half credit. Use a different day for each round. If anything in these scenarios affects you personally, you can call or text 988 at any hour, or call 911 in an emergency.",
  "revisit": "Return to the headings named in the feedback for the items you missed.",
  "items": [
   {
    "id": "R1-01",
    "prompt": "Bastian is a teaching assistant who drafts grading comments late at night. Before sending any of them he asks his officemate, \"Does this sound okay, or too harsh?\" She says it sounds fine, he feels calm for a few minutes, and then he asks about the next draft. Over the semester he asks about more of them, and she says she feels like a proofreader. Which statement best explains why the asking continues?",
    "bloom": "apply",
    "primary": 5,
    "secondary": 9,
    "anchors": [
     "reassurance loop",
     "avoidance and negative reinforcement"
    ],
    "outcomes": [
     "CSLO2",
     "PLO1",
     "N-CT"
    ],
    "topic": "Teaching assistant asks an officemate to approve each grading comment (reassurance as a safety behavior)",
    "src": "Module 5, A Third Illustration: Priya and the Reassurance Trap | Module 9, Checking and Reassurance",
    "correct": "b",
    "options": [
     {
      "id": "a",
      "text": "His officemate's approval is a pleasant reward, so the asking continues because praise feels good and makes him want more of it",
      "fb": "Approval that adds something pleasant would be positive reinforcement. The scenario points elsewhere. What changes after each answer is that his doubt drops, and the calm lasts only minutes. A behavior that grows because something unpleasant is taken away is negative reinforcement.",
      "rv": "Module 2, A Closer Look at Reinforcement: Four Everyday Mechanisms"
     },
     {
      "id": "b",
      "text": "Each answer relieves doubt briefly and so strengthens the asking, while the doubt returns because one answer settles little",
      "fb": "Reassurance supplied by another person works as a safety behavior. The relief is the reinforcer, so asking becomes more likely, and each answer teaches Bastian that he needed it to manage the doubt. Something unpleasant (doubt) is removed, which makes this negative reinforcement, and the doubt comes back because a check reports only on this moment.",
      "rv": "Module 5, A Third Illustration: Priya and the Reassurance Trap | Module 9, Checking and Reassurance"
     },
     {
      "id": "c",
      "text": "Her growing fatigue punishes the asking, so it should fade without a change on his part once she shows her irritation",
      "fb": "Punishment weakens a behavior only when the consequence reaches the person and follows the behavior closely. Her fatigue is out of his sight, and the relief he feels follows each request within seconds. The immediate relief outweighs a social cost he does not see.",
      "rv": "Module 2, Audio Overview: Negative Reinforcement Versus Punishment"
     },
     {
      "id": "d",
      "text": "His doubts are probably accurate, so checking each draft with a colleague is sound quality control and not a maintaining process",
      "fb": "Asking about one difficult draft is ordinary quality control. This pattern has different features. The asking spreads to more drafts, the calm is brief, and the doubt returns each time. A check that grows as relief wears off is working as a safety behavior.",
      "rv": "Module 9, Checking and Reassurance"
     }
    ]
   },
   {
    "id": "R1-02",
    "prompt": "Tavish is a trainee counselor at a community clinic. In an intake session a new client says, \"Before I tell you anything, can you promise that nothing I say will ever reach my sister?\" Which response fits what the course teaches about confidentiality?",
    "bloom": "apply",
    "primary": 13,
    "secondary": 10,
    "anchors": [
     "consent and confidentiality limits"
    ],
    "outcomes": [
     "CSLO3",
     "PLO5",
     "N-PRO"
    ],
    "topic": "Intake question about whether anything could reach a client's sister (limits of confidentiality at the outset)",
    "src": "Module 13, Confidentiality and Where It Gives Way | Module 13, Informed Consent in Therapy",
    "correct": "a",
    "options": [
     {
      "id": "a",
      "text": "Say nearly everything stays private, name the exceptions up front, and tell her he is a supervised trainee and who supervises him",
      "fb": "Limits belong at the start, in plain language, and again when circumstances change. A trainee also tells the client that he is supervised and who the supervisor is. Naming the exceptions early makes any later required disclosure less of a surprise, and the details of the exceptions depend on where the clinic is located.",
      "rv": "Module 13, Confidentiality and Where It Gives Way | Module 13, Informed Consent in Therapy"
     },
     {
      "id": "b",
      "text": "Wait to discuss limits until something comes up that might need to be reported, since raising them early could make her guarded and less open",
      "fb": "The professional standard asks that limits be discussed at the outset and again as circumstances change. Saying them early and calmly makes a later report easier to hear. Waiting means she may disclose before she knows the conditions.",
      "rv": "Module 10, Consent in Trauma-Focused Care"
     },
     {
      "id": "c",
      "text": "Promise that nothing will reach her sister, since trust at the start depends on an unconditional promise that she can count on",
      "fb": "A promise that cannot be kept in every case creates an unfair surprise later. Confidentiality is limited by law and by the clinic's rules, so the honest response names the limits first. Trust grows from accuracy about what will and will not stay private.",
      "rv": "Module 13, Confidentiality and Where It Gives Way"
     },
     {
      "id": "d",
      "text": "Tell her the limits are set by the clinic's lawyers, hand her the form, and ask her to sign before the session continues",
      "fb": "A signature records one moment. Consent is a continuing conversation in language the client can understand, and a signed form that was never explained leaves her uninformed. Passing the question to the lawyers also skips the chance to answer her actual worry.",
      "rv": "Module 13, Informed Consent in Therapy"
     }
    ]
   },
   {
    "id": "R1-03",
    "prompt": "Ximena has to decide whether to attend her cousin's wedding after a falling-out with him. On Monday evening she sat with a notebook, listed what she would gain and lose by going, texted another cousin to ask who else would attend, and set Friday as her deadline. On Wednesday evening she spent two hours replaying the argument at the family dinner, asking herself why she always says the wrong thing. She ended with nothing written and no plan. Which detail best separates Wednesday as rumination from Monday as problem solving?",
    "bloom": "analyze",
    "primary": 7,
    "secondary": 14,
    "anchors": [
     "rumination"
    ],
    "outcomes": [
     "CSLO2",
     "PLO1",
     "N-CT"
    ],
    "topic": "Two evenings with a notebook before a wedding decision, one problem solving and one rumination (what separates the two)",
    "src": "Module 7, Rumination: When Thinking Feels Like Coping but Isn't | Module 7, Spotting the Difference in Real Life",
    "correct": "a",
    "options": [
     {
      "id": "a",
      "text": "Wednesday's thinking circled the same why-questions and ended with no step, while Monday's thinking produced actions and a deadline",
      "fb": "Rumination is repetitive, passive dwelling that does not move toward a resolution. Reflection and problem solving have a destination, and Monday's session produced a text message and a deadline. The unanswerable why-questions and the empty page are the markers on Wednesday.",
      "rv": "Module 7, Rumination: When Thinking Feels Like Coping but Isn't | Module 7, Spotting the Difference in Real Life"
     },
     {
      "id": "b",
      "text": "Wednesday lasted longer, and the amount of time spent is what separates rumination from ordinary deliberate thought",
      "fb": "Long planning sessions are common and healthy. Length alone does not mark rumination. What marks rumination is passive repetition of questions that cannot be answered, which leaves the person no closer to a decision.",
      "rv": "Module 7, Rumination: When Thinking Feels Like Coping but Isn't"
     },
     {
      "id": "c",
      "text": "Wednesday involved more negative feeling, and the intensity of the feeling is what defines rumination as opposed to planning or reflection",
      "fb": "Both evenings could involve strong feeling. Rumination is defined by what the thinking does, which is circle without resolving. Intense emotion appears in careful problem solving too.",
      "rv": "Module 7, Rumination: When Thinking Feels Like Coping but Isn't"
     },
     {
      "id": "d",
      "text": "Wednesday concerned the past, and problem solving usually concerns the future, so looking backward at an event counts as rumination",
      "fb": "Looking back can be useful problem solving. Asking what went wrong in an argument and what to try next time points backward and still has a destination. The separating feature is whether the thinking moves toward understanding or a plan.",
      "rv": "Module 7, Spotting the Difference in Real Life"
     }
    ]
   },
   {
    "id": "R1-04",
    "prompt": "On the invented 0 to 60 scale from the Module 11 reliable change section, lower scores are better, the standard deviation is 8, and the reliability is .91, which puts the smallest reliable drop at about 6.65 points. Lucan, a clinic data analyst, reviews three invented clients. Client one went from 34 to 31. Client two went from 40 to 30. Client three went from 27 to 20. Which statement fits the numbers?",
    "bloom": "apply",
    "primary": 11,
    "secondary": 12,
    "anchors": [
     "reliable change"
    ],
    "outcomes": [
     "CSLO3",
     "CSLO4",
     "PLO2",
     "N-CT"
    ],
    "topic": "Three invented clients on the Module 11 scale with drops of 3, 10, and 7 (reliable change threshold of about 6.65 points)",
    "src": "Module 11, Reliable Change, Step by Step",
    "correct": "c",
    "options": [
     {
      "id": "a",
      "text": "Client three improved most, because a drop of 7 from a start of 27 is the largest share of a starting score, so it is the strongest result",
      "fb": "Client three has the largest percentage drop, and the percentage ignores the noise in the instrument. Module 11 contrasts a 23 percent drop that is inside the noise with a smaller percentage drop that is reliable. The size of the change in points is what is compared with the threshold.",
      "rv": "Module 11, Reliable Change, Step by Step"
     },
     {
      "id": "b",
      "text": "All three changed reliably, because each drop is larger than the 2.4-point standard error of measurement for the scale",
      "fb": "The standard error of measurement describes noise in one score. A change score contains the error from two scores, so the noise in a change is larger, about 3.39 points here, and the reliable line is about 6.65. Comparing a change with a single-score error line is too lenient.",
      "rv": "Module 11, Reliable Change, Step by Step"
     },
     {
      "id": "c",
      "text": "Clients two and three changed reliably, because drops of 10 and 7 pass about 6.65, while the drop of 3 falls inside the noise",
      "fb": "The threshold applies to the size of the change in points. Client one dropped 3, which is under about 6.65. Client two dropped 10, which gives a reliable change index of about 2.95, and client three dropped 7, which gives about 2.06. Both pass the line.",
      "rv": "Module 11, Reliable Change, Step by Step"
     },
     {
      "id": "d",
      "text": "Client two has recovered, because a drop beyond the noise threshold is what the word recovered means in this framework",
      "fb": "Recovered requires two things, a reliable change and a post-treatment score that has crossed a cutpoint into the everyday-functioning range. The scenario gives no cutpoint, so client two can be called improved and not recovered.",
      "rv": "Module 11, Reliable Change, Step by Step"
     }
    ]
   },
   {
    "id": "R1-05",
    "prompt": "Odile is a counselor in her fourth session with a client who works nights in a warehouse. On a brief end-of-session form the client rates \"I feel respected and liked here\" as 9 of 10, \"I know what we do in our sessions\" as 8, and \"We are working on what I came here for\" as 3. His stated goal was a steadier sleep schedule, and the sessions have mostly covered his childhood. Which analysis fits Bordin's model best?",
    "bloom": "analyze",
    "primary": 3,
    "secondary": 10,
    "anchors": [
     "alliance as a mechanism"
    ],
    "outcomes": [
     "CSLO1",
     "PLO1",
     "N-CT"
    ],
    "topic": "Alliance form with high bond and low agreement on goals (Bordin's three parts)",
    "src": "Module 3, Bordin's Model: Three Parts of a Working Bond | Module 3, The Alliance as a Mechanism, Not a Mood",
    "correct": "a",
    "options": [
     {
      "id": "a",
      "text": "Agreement on goals is the strained part, so the warm bond may not carry the work, and realigning sessions with his aim comes first",
      "fb": "Bordin's alliance has three parts, goals, tasks, and bond. His bond rating is high and his task rating is high, and the goal rating is low. A strong bond with disagreement about goals leaves the alliance unable to do its work as a mechanism, so the repair starts with the goals.",
      "rv": "Module 3, Bordin's Model: Three Parts of a Working Bond | Module 3, The Alliance as a Mechanism, Not a Mood"
     },
     {
      "id": "b",
      "text": "No part is strained, because a high bond rating means the alliance is working as a mechanism of change for him",
      "fb": "The alliance is a mechanism when all three parts line up, and a pleasant mood in the room is not enough. A client who feels liked and sees the work heading away from his goal is at risk of quietly dropping out.",
      "rv": "Module 3, The Alliance as a Mechanism, Not a Mood"
     },
     {
      "id": "c",
      "text": "The tasks are the strained part, because he does not understand what happens in sessions and needs a clearer explanation of the method",
      "fb": "He rated his knowledge of what happens in sessions as 8 of 10. The tasks are clear to him. The low rating concerns whether those tasks serve what he wanted.",
      "rv": "Module 3, Bordin's Model: Three Parts of a Working Bond"
     },
     {
      "id": "d",
      "text": "The bond is the strained part, so the counselor should spend the next sessions building more warmth and trust with him before anything else",
      "fb": "The bond is the highest rating on the form. Spending more time on warmth would address a part that is already strong and leave the mismatch about goals in place.",
      "rv": "Module 3, Bordin's Model: Three Parts of a Working Bond"
     }
    ]
   },
   {
    "id": "R1-06",
    "prompt": "Two of Tavish's clients both meet criteria for panic disorder. Client A had a first attack after fainting on a hot day and now skips exercise, hot rooms, and other activity that raises her heart rate. Client B had a first attack during a stressful exam week and now spends hours each day checking his pulse and reading symptom forums. Both start a ten-week plan, and Tavish plans to give both the same panic questionnaire every two weeks. Which addition best fits the course's reasoning about two routes to one label?",
    "bloom": "analyze",
    "primary": 14,
    "secondary": 7,
    "anchors": [
     "outcome and process measures",
     "equifinality"
    ],
    "outcomes": [
     "CSLO3",
     "CSLO2",
     "PLO2",
     "N-CT"
    ],
    "topic": "Two panic clients with different routes and loops (matching process measures to loops)",
    "src": "Module 14, Checking the Gauges | Module 14, Same Outcome, Different Paths",
    "correct": "d",
    "options": [
     {
      "id": "a",
      "text": "No further measure for either, because the questionnaire already shows whether the treatment is working for each of them well enough",
      "fb": "An outcome measure shows whether the person is improving. It does not show whether the targeted process is the thing that is changing. Without a process measure, an improvement could come from the alliance, expectancy, or time, and a stall would be hard to interpret.",
      "rv": "Module 14, Checking the Gauges"
     },
     {
      "id": "b",
      "text": "The same process measure for both, because the matching diagnosis means that one and the same process keeps both clients panicking",
      "fb": "Equifinality says two people can arrive at one label by different routes. The label does not reveal which loop is running, and a single shared process measure could miss the loop that matters for one of them.",
      "rv": "Module 14, Same Outcome, Different Paths"
     },
     {
      "id": "c",
      "text": "A measure of each person's first attack, because the route into the problem is what the plan should track over time",
      "fb": "The first attack belongs with precipitating factors, which describe where a problem came from. The plan works on what keeps the problem going now, so the gauge belongs on the maintaining loop.",
      "rv": "Module 14, Maintaining Mechanisms: What Keeps a Problem Going"
     },
     {
      "id": "d",
      "text": "A process measure matched to each person's loop, such as minutes of brisk activity for A and daily pulse checks for B",
      "fb": "The questionnaire is an outcome measure and shows whether each person is improving. Two people can reach one label by different routes and be kept there by different loops, so each needs a gauge on the process the plan targets. Tracking both lets Tavish see whether the intended process is the one moving.",
      "rv": "Module 14, Checking the Gauges | Module 14, Same Outcome, Different Paths"
     }
    ]
   },

  if(a==="show"){ S.rev=S.rev||{}; S.rev[revKey()]=true; render(); return; }
  if(a==="pick"){ if(S.picked!==null) return; S.picked=v; var q=curItems(st)[S.i]; if(!S.retry){ S.log=S.log||[]; S.log.push({id:q.id,ok:v===q.correct,src:q.src,p:q.primary}); } if(v===q.correct) S.res[S.k].score+=(S.retry?0.5:1); else if(!S.retry) S.miss.push(S.i); render(); return; }
  if(a==="ord"){ if(S.seq.length>=st.correct.length||S.revealed) return; S.seq.push(v); if(S.seq.length===st.correct.length){ S.tries++; var ok=S.seq.every(function(x,i){return x===st.correct[i];}); if(ok){ S.orderOk=true; S.res[S.k].score=(S.tries===1)?1:0.5; S.res[S.k].done=true; } } render(); return; }
  if(a==="undo"){ S.seq.pop(); render(); return; }
  if(a==="retry"){ S.seq=[]; render(); return; }
  if(a==="reveal"){ S.revealed=true; S.res[S.k].done=true; render(); return; }
  if(a==="tog"){ if(S.checked) return; S.sel[v]=!S.sel[v]; render(); return; }
  if(a==="chk"){ var tp=0,fp=0; st.options.forEach(function(o){ var on=!!S.sel[o.id], t=st.truth.indexOf(o.id)>=0; if(on&&t) tp++; if(on&&!t) fp++; }); S.res[S.k].score=Math.max(0,(tp-fp))/st.truth.length; S.checked=true; S.res[S.k].done=true; render(); return; }
  if(a==="next"){
    var multiItem=(st.type==="classify"||st.type==="mcq");
    if(multiItem && S.i<lastIdx(st)){ S.i++; S.picked=null; render(); toTop(); return; }
    if(multiItem && !S.retry && S.miss.length){ S.retry=true; S.rq=S.miss.slice(); S.miss=[]; S.i=0; S.picked=null; if(st.type==="mcq"){ S.order=S.rq.map(function(ix){ return shuffled(st.items[ix].options); }); } render(); toTop(); return; }
    S.res[S.k].done=true; S.k++; S.i=0; S.retry=false; S.rq=[]; S.miss=[]; S.order=[]; S.picked=null; S.seq=[]; S.tries=0; S.revealed=false; S.orderOk=false; S.sel={}; S.checked=false; render(); toTop(); return;
  }
  if(a==="again"){ reset(); toTop(); return; }
}
root.addEventListener("click",function(e){ var t=e.target.closest("[data-act]"); if(!t||t.disabled) return; act(t.getAttribute("data-act"),t.getAttribute("data-val")); });
reset();
