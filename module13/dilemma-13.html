function commit(){
  var t=TURNS[S.t], o=t.options[S.pick], sc=(S.retried?Math.min(o.r,1):o.r);
  S.log.push({skill:t.skill,r:o.r,score:sc,retried:S.retried,first:S.first});
  S.branch=(o.r===2?"g":(o.r===1?"m":"p"));
}
function summary(){
  var tot=0; S.log.forEach(function(l){tot+=l.score;});
  var worst=S.log.slice().sort(function(a,b){return a.score-b.score;})[0];
  var h=pills()+'<section class="panel" id="panel" tabindex="-1"><h2 style="margin:0 0 4px;font-size:20px;">Your conversation with Vesna</h2><p>You scored <b>'+tot+' of '+(TURNS.length*2)+'</b> across the five skills. A retried turn counts for at most 1 point.</p><div>';
  S.log.forEach(function(l){ h+='<div class="brow"><span class="bs">'+l.score+' / 2</span><span><b>'+esc(SKILLS[l.skill])+'.</b> '+(l.score===2?"Skilled response.":esc(REVISIT[l.skill]))+'</span></div>'; });
  h+='</div>';
  if(tot<TURNS.length*2){ h+='<div class="take"><b>Where to look again:</b> '+esc(REVISIT[worst.skill])+'</div>'; }
  h+='<div class="take"><b>What carries forward:</b> '+esc(TAKE)+'</div><div class="foot"><span></span><button class="btn secondary" type="button" data-act="again">Start over</button></div><p class="note">'+esc(NOTE)+'</p></section>';
  root.innerHTML=h; post();
}
root.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b||b.disabled) return;
  if(b.hasAttribute("data-ix")){ if(S.pick!==null) return; S.pick=parseInt(b.getAttribute("data-ix"),10); if(!S.retried) S.first=S.pick; render(); return; }
  var a=b.getAttribute("data-act");
  if(a==="retry"){ S.retried=true; S.pick=null; render(); return; }
  if(a==="next"){ commit(); S.pick=null; S.retried=false; S.first=null; if(S.t>=TURNS.length-1){ S.done=true; } else { S.t++; } render(); try{window.scrollTo({top:0,behavior:"smooth"});}catch(x){} return; }
  if(a==="again"){ fresh(); return; }
});
fresh();

</script>
</body>
</html>
