<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer Challenge: Ethics in a New Setting</title>
<style>
  :root{
    --bg:#faf9f7; --ink:#1f1e1c; --muted:#6b6862; --line:#e7e4de; --line2:#eceae4;
    --panel:#ffffff; --panel-shadow:0 1px 2px rgba(28,27,25,.04),0 6px 20px rgba(28,27,25,.05);
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --level-bg:#fbe7e0; --level-ink:#b0472a;
    --do-bg:#f3f1ec; --do-ink:#57544e;
    --correct-bg:#eef5ee; --correct-line:#bcd6bd; --correct-ink:#3c6b3e;
    --wrong-bg:#fbecec; --wrong-line:#e3b9b9; --wrong-ink:#a23b34;
    --sel-line:#c9d3c2;
    --focus:#2f6f4f; --radius:16px; --r-sm:11px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55;}
  .wrap{max-width:920px;margin:0 auto;padding:24px 20px 60px;}

  .head{display:flex;align-items:flex-start;gap:14px;margin-bottom:8px;}
  .back-ic{flex:0 0 auto;margin-top:4px;opacity:.6;}
  .head h1{margin:0;font-size:24px;letter-spacing:-.01em;font-weight:700;}
  .tabrow{display:flex;flex-wrap:wrap;gap:16px;margin:10px 0 22px;padding-left:38px;font-size:14px;}
  .lvl{background:var(--level-bg);color:var(--level-ink);font-weight:700;border-radius:8px;padding:4px 12px;}
  .tabrow .t{color:var(--muted);padding:4px 0;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--panel-shadow);padding:22px 24px;margin-bottom:20px;}
  .panel h2{margin:0 0 14px;font-size:17px;font-weight:700;}
  .panel p{margin:0 0 14px;font-size:15.5px;line-height:1.6;}
  .panel p:last-child{margin-bottom:0;}
  .scenario p.quote{color:#3a3833;}

  .qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;}
  .qhead h2{margin:0;font-size:17px;font-weight:700;}
  .qtype{flex:0 0 auto;font-size:12.5px;color:var(--muted);background:#eceae4;border-radius:7px;padding:5px 10px;}
  .qprompt{font-size:15.5px;margin:0 0 14px;line-height:1.55;}

  .do{background:var(--do-bg);color:var(--do-ink);border-radius:10px;padding:11px 14px;font-size:13.5px;line-height:1.5;margin-bottom:18px;}
  .do b{color:var(--ink);font-weight:700;}

  .options{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    font:inherit;font-size:15px;line-height:1.5;cursor:pointer;transition:border-color .12s,background .12s;color:var(--ink);}
  .opt:hover:not(:disabled){border-color:#cfc9bf;}
  .opt:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:14px;}
  .opt .txt{flex:1 1 auto;}
  .opt .mark{flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center;}
  .opt:disabled{cursor:default;}
  /* answered states */
  .opt.correct{background:var(--correct-bg);border-color:var(--correct-line);}
  .opt.correct .k{color:var(--correct-ink);}
  .opt.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .opt.wrong .k{color:var(--wrong-ink);}
  .opt.dim{opacity:.62;}

  .verdict{margin:16px 0 0;font-size:15px;font-weight:600;}
  .verdict.ok{color:var(--correct-ink);}
  .verdict.no{color:var(--wrong-ink);}
  .explain{margin:8px 0 0;font-size:14.5px;color:#44413b;line-height:1.6;}

  .qfoot{display:flex;justify-content:flex-end;margin-top:20px;}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:#fff;border:none;
    border-radius:10px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;transition:.12s;}
  .btn:hover{filter:brightness(1.05);}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .results h2{display:flex;align-items:center;gap:9px;}
  .results .score{font-size:15.5px;margin:0;}
  .ea-sub{color:var(--muted);font-size:14px;margin:-6px 0 14px;}
  .book{flex:0 0 auto;opacity:.7;}

  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
  @media(max-width:560px){ .wrap{padding:18px 14px 44px;} .tabrow{padding-left:0;} .head h1{font-size:20px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <svg class="back-ic" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12 5l-5 5 5 5" stroke="#1f1e1c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1 id="title"></h1>
  </div>
  <div class="tabrow" id="tabrow"></div>

  <!-- Scenario (persistent) -->
  <section class="panel scenario" id="scenario"></section>

  <!-- Question area -->
  <section class="panel" id="qpanel" aria-live="polite"></section>

  <!-- Results + Expert Analysis (hidden until finished) -->
  <section class="panel results hidden" id="resultsPanel"></section>
  <section class="panel hidden" id="eaPanel"></section>
</div>

<script>
// Challenge data. Scenario, questions, and expert analysis are original and grounded in the module reading.
const CHALLENGE = {
 "title": "Ethics in a New Setting: The Campus Athletic Department",
 "level": "Level 5: Evaluate",
 "tabs": [
  "Sources of Authority",
  "Roles and Relationships",
  "Continuity of Care"
 ],
 "scenario": {
  "heading": "Clinical Scenario",
  "paras": [
   "Bronwyn is an invented licensed psychologist who counsels students in a university athletic department. The department, the people in it, and all details are invented for this exercise, and the laws and policies of any real place may differ. Bronwyn reports to the department’s director of counseling services, and the department’s written policy covers scheduling and records and says nothing about contact from coaches. Hadley is an invented 20-year-old student-athlete who has seen Bronwyn for nine sessions for low mood after an injury. At intake he signed a consent form, and Bronwyn reviewed the limits of confidentiality, including that safety concerns can be a limit.",
   "The head coach phones Bronwyn and asks whether Hadley has been attending and whether he is okay to play on Saturday. Later, the athletic director asks Bronwyn to also write a fitness-to-play opinion for the coaching staff. Hadley has told Bronwyn that he fears an unfavorable record could cost him his scholarship. His scores on the mood measure Bronwyn uses have been flat for several sessions. Bronwyn’s contract with the department ends in six weeks.",
   "Intake staff ask every student about thoughts of ending their life, and a student who says yes gets a same-day safety conversation. Hadley has not reported such thoughts. If this scenario affects you personally, you can call or text 988 at any hour, and in an emergency you can call 911."
  ]
 },
 "doThis": "Pick the best option. After you answer, read whether you were correct and why before advancing.",
 "questions": [
  {
   "id": "q1",
   "bloom": "evaluate",
   "prompt": "The coach’s call arrives first. Which response best fits the sources of authority in this case?",
   "options": [
    {
     "id": "a",
     "text": "Decline to confirm or deny that Hadley is a client without his release, tell him about the call, and ask the director what law and policy require, since policy is silent"
    },
    {
     "id": "b",
     "text": "Confirm that Hadley attends but say nothing about his health, since attendance alone reveals nothing clinical and the coach has a legitimate role with the team’s schedule"
    },
    {
     "id": "c",
     "text": "Tell the coach that Hadley is fine to play, since a general reassurance reveals no detail and usually keeps the coach from pressing for more on Saturday"
    },
    {
     "id": "d",
     "text": "Refuse to speak with the coach and say nothing to Hadley, since treating the call as if it had not happened spares him worry before Saturday’s game and the season"
    }
   ],
   "correct": "a",
   "explanation": "Standard 4.05 gives two routes to disclosure, consent and a legal basis with a valid purpose, and the coach’s call supplies neither. In many settings the fact that a person is a client is itself confidential. The department’s policy is silent, so the director and the local law fill the gap, and Hadley decides what, if anything, he wants shared and in what form. Confirming attendance discloses protected information without a release. A general reassurance about fitness to play discloses a clinical judgment and may be wrong. Saying nothing to Hadley withholds information he needs to take part in decisions about his own records."
  },
  {
   "id": "q2",
   "bloom": "evaluate",
   "prompt": "The athletic director asks Bronwyn to write a fitness-to-play opinion for the coaching staff. Which position best reflects Standards 3.05 and 3.07?",
   "options": [
    {
     "id": "a",
     "text": "Accept the request if Hadley signs a general release, since his consent makes any multiple relationship acceptable and ends the question for the department and for him"
    },
    {
     "id": "b",
     "text": "Accept the request, since the code never names this overlap and a gap in the standards usually means the role is permitted in the department’s own setting"
    },
    {
     "id": "c",
     "text": "Decline the evaluation and stay in her counseling role, since the evaluator role could reasonably be expected to impair her objectivity, and suggest an independent evaluator"
    },
    {
     "id": "d",
     "text": "Decline and end Hadley’s treatment at once, since someone else can then handle the evaluation without a conflict with his counselor and he can be referred on"
    }
   ],
   "correct": "c",
   "explanation": "Serving as Hadley’s counselor and as the department’s evaluator would put Bronwyn in two roles whose purposes conflict, and an evaluation for the coaching staff could reasonably be expected to impair her objectivity and risk harm to the trust treatment depends on. Standard 3.07 asks psychologists to clarify the role, who the client is, and the limits of confidentiality when a third party requests services, and an independent evaluator protects each role. A silent standard does not mean a role is permitted, and the question returns to judgment. Consent from Hadley is one factor, and it does not settle the expected effect on the work. Ending treatment at once harms Hadley and fails the process Standard 10.10(c) calls for."
  },
  {
   "id": "q3",
   "bloom": "evaluate",
   "prompt": "Bronwyn’s contract ends in six weeks, and Hadley’s scores have been flat for several sessions. Which plan best fits the code and the measurement data?",
   "options": [
    {
     "id": "a",
     "text": "Transfer his case to a colleague without telling him and update him afterward, since a seamless handoff spares him worry before the season ends"
    },
    {
     "id": "b",
     "text": "Tell Hadley now, review his progress and options with him, and offer a referral with a release, since early notice leaves the choice with him"
    },
    {
     "id": "c",
     "text": "Tell him now and end treatment at the next session, since the contract ends anyway and flat scores show that he is not likely to benefit from more"
    },
    {
     "id": "d",
     "text": "Wait until the last week to mention the end and then give him a list of local providers, since telling him earlier would unsettle him during the season"
    }
   ],
   "correct": "b",
   "explanation": "Standard 10.09 asks for an orderly resolution of responsibility for client care when an employment relationship ends, and Standard 10.10(c) calls for pretermination counseling and suggestions of alternative providers. Early notice gives Hadley a say and time to move. A release lets records go to the new provider. Flat scores are one input to a decision about whether he is likely to benefit, and no source used in this course gives a score rule that makes ending required, so Bronwyn reviews with him why the series is flat and which adjustments are available. Waiting until the last week or transferring him without telling him removes his choice, and ending at the next session treats a score pattern as a rule."
  }
 ],
 "expertAnalysis": {
  "heading": "Expert Analysis",
  "subhead": "Model answer and ethical reasoning walkthrough",
  "paras": [
   "The first decision is whose rule governs the coach’s call. The department’s policy is silent, so the code, the law, and the director’s direction fill the gap. Standard 4.05 allows disclosure with the client’s consent or, without it, only where law mandates or permits it for a valid purpose, and the coach’s question supplies neither. Bronwyn declines to confirm that Hadley is a client without his release, tells Hadley about the call, and asks him what he wants shared. She also asks the director what the department’s policy and the local law require, since both vary by place. A trainee in the same position would bring the call to a supervisor.",
   "The second decision concerns roles. Counselor and evaluator for the coaching staff are two roles with different clients and purposes, and combining them could reasonably be expected to impair objectivity and risk exploitation or harm under Standard 3.05(a). Standard 3.07 asks Bronwyn to be clear about who the client is and the limits of confidentiality when a third party seeks a service. She offers to help the department identify an independent evaluator, and she tells Hadley about the request so that his treatment does not depend on a role he did not agree to. Hadley’s worry about his scholarship deserves an honest answer about who can see the record under policy and law, and Bronwyn does not promise more than she can keep.",
   "The third decision is continuity. The contract end is a known interruption, and Standards 10.09, 3.12, and 10.10(c) point toward early planning, pretermination counseling, and alternative providers. The flat scores are one input. Bronwyn reviews with Hadley what the series might mean, such as noise in the measure, a poor fit, a missing mechanism, or a gain the measure does not capture, and which adjustments are available before a handoff. If anything in the case moved toward risk, the safety conversation the department already uses would come first, and Hadley would hear about 988 and 911 from her directly."
  ]
 }
};

var idx = 0;            // current question index
var answered = [];      // answered[i] = chosen option id or null
var correctCount = 0;

function el(t,c,h){var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

var CHECK = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#3c6b3e" stroke-width="1.4"/><path d="M6.4 10.2l2.3 2.3 4.7-4.9" stroke="#3c6b3e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var CROSS = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#a23b34" stroke-width="1.4"/><path d="M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6" stroke="#a23b34" stroke-width="1.6" stroke-linecap="round"/></svg>';
var BOOK = '<svg class="book" width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 4.5h5.5c.8 0 1.5.7 1.5 1.5v9c0-.8-.7-1.5-1.5-1.5H3v-9Z" stroke="#6f6c66" stroke-width="1.3"/><path d="M17 4.5h-5.5c-.8 0-1.5.7-1.5 1.5v9c0-.8.7-1.5 1.5-1.5H17v-9Z" stroke="#6f6c66" stroke-width="1.3"/></svg>';

function renderStatic(){
  document.getElementById("title").textContent = CHALLENGE.title;
  var tr = document.getElementById("tabrow");
  tr.appendChild(el("span","lvl", esc(CHALLENGE.level)));
  CHALLENGE.tabs.forEach(function(t){ tr.appendChild(el("span","t", esc(t))); });

  var sc = document.getElementById("scenario");
  sc.appendChild(el("h2",null, esc(CHALLENGE.scenario.heading)));
  CHALLENGE.scenario.paras.forEach(function(p,i){
    sc.appendChild(el("p", i===1?"quote":null, esc(p)));
  });
  answered = CHALLENGE.questions.map(function(){ return null; });
}

function renderQuestion(){
  var q = CHALLENGE.questions[idx];
  var panel = document.getElementById("qpanel");
  panel.innerHTML = "";
  var chosen = answered[idx];
  var isAnswered = chosen !== null;

  var head = el("div","qhead");
  head.appendChild(el("h2",null,"Question " + (idx+1) + " of " + CHALLENGE.questions.length));
  head.appendChild(el("span","qtype","Multiple Choice"));
  panel.appendChild(head);

  panel.appendChild(el("p","qprompt", esc(q.prompt)));
  panel.appendChild(el("div","do","<b>Do this:</b> " + esc(CHALLENGE.doThis)));

  var opts = el("div","options");
  q.options.forEach(function(o){
    var cls = "opt";
    if(isAnswered){
      if(o.id === q.correct) cls += " correct";
      else if(o.id === chosen) cls += " wrong";
      else cls += " dim";
    }
    var btn = el("button", cls);
    btn.type = "button";
    if(isAnswered) btn.disabled = true;
    var mark = "";
    if(isAnswered && o.id === q.correct) mark = CHECK;
    else if(isAnswered && o.id === chosen) mark = CROSS;
    btn.innerHTML = '<span class="k">'+o.id.toUpperCase()+'.</span>' +
                    '<span class="txt">'+esc(o.text)+'</span>' +
                    '<span class="mark">'+mark+'</span>';
    if(!isAnswered){
      btn.addEventListener("click", function(){ choose(o.id); });
    }
    opts.appendChild(btn);
  });
  panel.appendChild(opts);

  if(isAnswered){
    var right = chosen === q.correct;
    if(right){
      panel.appendChild(el("p","verdict ok","Correct!"));
    } else {
      var correctText = "";
      q.options.forEach(function(o){ if(o.id===q.correct) correctText = o.text; });
      panel.appendChild(el("p","verdict no","Incorrect. The correct answer is: " + esc(correctText)));
    }
    panel.appendChild(el("p","explain", esc(q.explanation)));

    var foot = el("div","qfoot");
    var last = idx === CHALLENGE.questions.length - 1;
    var b = el("button","btn");
    if(last){
      b.innerHTML = 'View Expert Analysis ' + BOOK.replace('class="book" ','');
      b.addEventListener("click", finish);
    } else {
      b.innerHTML = 'Next Question <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M4 10h11M11 6l4 4-4 4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      b.addEventListener("click", function(){ idx++; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); });
    }
    foot.appendChild(b);
    panel.appendChild(foot);
  }
}

function choose(optId){
  if(answered[idx] !== null) return;
  answered[idx] = optId;
  if(optId === CHALLENGE.questions[idx].correct) correctCount++;
  renderQuestion();
}

function finish(){
  document.getElementById("qpanel").classList.add("hidden");

  var rp = document.getElementById("resultsPanel");
  rp.classList.remove("hidden");
  rp.innerHTML = "";
  rp.appendChild(el("h2",null, BOOK + "<span>Your Results</span>"));
  rp.appendChild(el("p","score","Multiple Choice: " + correctCount + " / " + CHALLENGE.questions.length + " correct"));

  var ea = document.getElementById("eaPanel");
  ea.classList.remove("hidden");
  ea.innerHTML = "";
  ea.appendChild(el("h2",null, BOOK + "<span>" + esc(CHALLENGE.expertAnalysis.heading) + "</span>"));
  ea.appendChild(el("p","ea-sub", esc(CHALLENGE.expertAnalysis.subhead)));
  CHALLENGE.expertAnalysis.paras.forEach(function(p){ ea.appendChild(el("p",null, esc(p))); });

  window.scrollTo({top:0,behavior:"smooth"});
}

renderStatic();
renderQuestion();
</script>
</body>
</html>
