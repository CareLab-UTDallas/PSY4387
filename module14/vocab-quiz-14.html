<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 14 Vocabulary: Self-Test</title>
<style>
  :root{
    --bg:#faf9f7; --ink:#1f1e1c; --muted:#6b6862; --line:#e7e4de;
    --panel:#ffffff; --panel-shadow:0 1px 2px rgba(28,27,25,.04),0 6px 20px rgba(28,27,25,.05);
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --do-bg:#f3f1ec; --do-ink:#57544e;
    --correct-bg:#eef5ee; --correct-line:#bcd6bd; --correct-ink:#3c6b3e;
    --wrong-bg:#fbecec; --wrong-line:#e3b9b9; --wrong-ink:#a23b34;
    --amber-bg:#fffbef; --amber-line:#e7c98a; --amber-ink:#8a6d2f;
    --focus:#2f6f4f; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 20px 60px;}

  .masthead{padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .masthead h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em;}
  .masthead .sub{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:70ch;}

  .progress{display:flex;align-items:center;gap:10px;margin:2px 0 16px;}
  .pbar{flex:1 1 auto;height:6px;border-radius:3px;background:var(--line);overflow:hidden;}
  .pbar span{display:block;height:100%;background:var(--accent);width:0;transition:width .25s;}
  .pcount{font-size:12.5px;color:var(--muted);flex:0 0 auto;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--panel-shadow);padding:22px 24px;}
  .qtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px;}
  .qtop .qn{font-size:13px;color:var(--muted);}
  .qtop .term-tag{font-size:12px;color:var(--muted);background:#eceae4;border-radius:7px;padding:4px 10px;}
  .qprompt{font-size:17px;font-weight:600;margin:2px 0 6px;line-height:1.4;}
  .do{background:var(--do-bg);color:var(--do-ink);border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.5;margin:10px 0 16px;}
  .do b{color:var(--ink);}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;font-size:14.5px;
    line-height:1.5;cursor:pointer;transition:border-color .12s,background .12s;color:var(--ink);}
  .opt:hover:not(:disabled){border-color:#cfc9bf;}
  .opt:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:15px;}
  .opt .mark{flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center;margin-left:auto;}
  .opt:disabled{cursor:default;}
  .opt.correct{background:var(--correct-bg);border-color:var(--correct-line);}
  .opt.correct .k{color:var(--correct-ink);}
  .opt.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .opt.wrong .k{color:var(--wrong-ink);}
  .opt.dim{opacity:.6;}

  .verdict{margin:16px 0 0;font-size:14.5px;font-weight:600;}
  .verdict.ok{color:var(--correct-ink);}
  .verdict.no{color:var(--wrong-ink);}
  .explain{margin:8px 0 0;font-size:14px;color:#44413b;line-height:1.6;}
  .explain .src{color:var(--muted);font-size:12.5px;margin-top:6px;}

  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;}
  .hintbtn{background:none;border:none;color:var(--accent-ink);font:inherit;font-size:13.5px;cursor:pointer;text-decoration:underline;padding:0;}
  .hintbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .hintbox{margin-top:12px;background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);
    border-radius:10px;padding:10px 13px;font-size:13.5px;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;
    border-radius:10px;padding:11px 19px;font-size:14.5px;font-weight:600;cursor:pointer;}
  .btn:hover{filter:brightness(1.05);}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  /* results */
  .results h2{margin:0 0 4px;font-size:20px;}
  .results .score{font-size:16px;margin:0 0 4px;}
  .results .score b{color:var(--accent-ink);}
  .results .breakdown{margin:16px 0 0;border-top:1px solid var(--line);padding-top:14px;}
  .results .brow{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 0;border-bottom:1px solid #f0eee9;}
  .results .brow:last-child{border-bottom:none;}
  .results .bi{flex:0 0 auto;margin-top:1px;}
  .results .bt{flex:1 1 auto;}
  .results .bt .bterm{font-weight:600;}
  .results .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .selfnote{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.55;}

  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Transdiagnostic Mechanisms Vocabulary: Self-Test</h1>
    <p class="sub">Ten questions on the core Module 14 terms. Each question applies a term in a short scenario. Pick an answer to see whether it is right and why.</p>
  </div>

  <div class="progress" aria-hidden="true">
    <div class="pbar"><span id="pbarfill"></span></div>
    <div class="pcount" id="pcount"></div>
  </div>

  <section class="panel" id="qpanel" aria-live="polite"></section>

  <section class="panel results hidden" id="resultsPanel"></section>
</div>

<script>
// Data for this self-test. Items are original, scenario-based, and grounded in the module reading.
var QUIZ = [
 {
  "term": "Maintaining mechanism",
  "bloom": "apply",
  "prompt": "A person became afraid of elevators after being stuck in one ten years ago. The fear continues today because she takes the stairs every time, and the relief she feels each time seems to confirm that elevators are dangerous. Which statement separates the cause from the maintaining mechanism?",
  "options": [
   {
    "id": "a",
    "text": "The stuck elevator is the cause, and taking the stairs is the maintaining mechanism, since relief feeds the fear now"
   },
   {
    "id": "b",
    "text": "The stuck elevator is the maintaining mechanism, since the fear has been tied to that event ever since it happened"
   },
   {
    "id": "c",
    "text": "Both are maintaining mechanisms, since any process that appears in the history of a fear is keeping it going"
   },
   {
    "id": "d",
    "text": "Taking the stairs is the cause, since the avoidance began first and the fear grew out of it over the years"
   }
  ],
  "correct": "a",
  "explain": "A cause is what started a problem, and a maintaining mechanism is what feeds it now, often long after the cause has faded. The elevator incident started the fear and the stair-taking keeps it running, because each relief teaches her that avoiding was necessary. Treating the incident as the mechanism confuses where the fear came from with what is feeding it today. The avoidance began after the fear, so it cannot be the cause. A history item is not a mechanism just because it appears in the story, and a clinician looks for the part that is running in the present.",
  "hint": "Ask which fact is still operating this week.",
  "src": "Module 14, Maintaining Mechanisms: What Keeps a Problem Going"
 },
 {
  "term": "Safety behaviors",
  "bloom": "analyze",
  "prompt": "A woman with social anxiety attends every work party. At each one she stands next to the door, keeps her phone in her hand, and rehearses each sentence before she says it. She tells her counselor, “I am not avoiding anything anymore.” Which reading fits best?",
  "options": [
   {
    "id": "a",
    "text": "She is using reappraisal, since rehearsing each sentence changes how she interprets what is happening at the party"
   },
   {
    "id": "b",
    "text": "She uses safety behaviors in the situation, since they can stop her learning that parties are tolerable without them"
   },
   {
    "id": "c",
    "text": "She is still avoiding the situation, since standing next to the door amounts to skipping the party"
   },
   {
    "id": "d",
    "text": "She is going through extinction, since repeated attendance weakens a fear whatever she happens to do while she is there"
   }
  ],
  "correct": "b",
  "explain": "Safety behaviors are small actions taken inside a feared situation to feel safer. Because she credits the door, the phone, and the rehearsal for getting through, the feared outcome never gets a fair test, so the fear stays intact even though she attends. Calling it plain avoidance misses that she is present. Extinction needs the cue to be met without the outcome and without the props that prevent the learning. Rehearsal is preparation, and it does not change how she reads the room, so reappraisal does not describe it.",
  "hint": "She is in the room. What is she doing while she is there?",
  "src": "Module 14, Avoidance and the Reinforcement Cycle"
 },
 {
  "term": "Negative reinforcement",
  "bloom": "apply",
  "prompt": "A student feels dread each time he opens his email, so he stops opening it, and the dread drops within seconds. Over the following weeks he opens it less and less. Which term explains why not opening it becomes more likely?",
  "options": [
   {
    "id": "a",
    "text": "Positive reinforcement, since relief is a pleasant outcome and positive means that the outcome is pleasant"
   },
   {
    "id": "b",
    "text": "Negative reinforcement, since the behavior removes something unpleasant and so becomes likelier the next time"
   },
   {
    "id": "c",
    "text": "Punishment, since the dread is an unpleasant consequence that follows the behavior and so should weaken it over time"
   },
   {
    "id": "d",
    "text": "Extinction, since the dread weakens every time he stays away from his inbox and leaves it unchecked for a while"
   }
  ],
  "correct": "b",
  "explain": "Negative reinforcement strengthens a behavior because it removes or avoids something unpleasant, and negative refers to the removal. Not opening the email takes the dread away, so not opening becomes more likely. Punishment weakens a behavior, and here the behavior grows. Extinction describes a response weakening when the cue is met without the outcome, and he never meets the cue. Positive reinforcement adds something to strengthen a behavior, and in this case something is taken away, which is the point of the term.",
  "hint": "Look at what happens to the dread right after the behavior.",
  "src": "Module 14, Avoidance and the Reinforcement Cycle"
 },
 {
  "term": "Interpersonal feedback loop",
  "bloom": "analyze",
  "prompt": "A manager who fears errors rereads every report her team writes. Her team stops checking its own work because she will catch problems anyway, and the few errors that slip through make her reread more closely. Which term names the structure that keeps this pattern going?",
  "options": [
   {
    "id": "a",
    "text": "Behavioral withdrawal, a gradual pulling back from activity and contact that removes experiences which would lift mood"
   },
   {
    "id": "b",
    "text": "An interpersonal feedback loop, a cycle in which one person’s behavior evokes reactions that strengthen the pattern"
   },
   {
    "id": "c",
    "text": "Suppression, a strategy that holds back the outward expression of a feeling after the feeling has begun"
   },
   {
    "id": "d",
    "text": "Distress tolerance, the ability to get through a painful moment without acting in ways that make it worse"
   }
  ],
  "correct": "b",
  "explain": "Her checking evokes a response from the team, and the team’s response produces the errors that justify more checking. Each person acts in an understandable way, and together they keep the circle turning. Behavioral withdrawal describes pulling back from activity, and the team here is doing less checking while the manager is doing more. Distress tolerance and suppression describe how one person manages feelings, and neither names a pattern that runs between people.",
  "hint": "Find the arrow that runs from one person to another and back.",
  "src": "Module 14, Interpersonal Loops"
 },
 {
  "term": "Perpetuating factors",
  "bloom": "understand",
  "prompt": "A clinician lists four facts about a client. A chaotic series of moves in childhood, the loss of a job last spring, a daily habit of avoiding his email, and a sibling who calls every week. Which fact is a perpetuating factor?",
  "options": [
   {
    "id": "a",
    "text": "The daily habit of avoiding his email, since it runs now and keeps the current problem going from week to week"
   },
   {
    "id": "b",
    "text": "The weekly calls from his sibling, since a strength in the client’s life is what perpetuates his recovery"
   },
   {
    "id": "c",
    "text": "The chaotic moves in childhood, since the earliest vulnerability is the one that keeps a problem going over time"
   },
   {
    "id": "d",
    "text": "The loss of the job last spring, since the event that set off the episode is also what sustains it now"
   }
  ],
  "correct": "a",
  "explain": "Perpetuating factors keep the current problem going, and they are the maintaining mechanisms. The daily avoidance runs now and feeds itself through relief. The childhood moves are a predisposing factor, an earlier vulnerability. The job loss is the precipitating factor, the event that set off the current episode. The sibling’s calls are a protective factor, a resource that works against the problem. A formulation that lists only the first two groups says where the problem came from and leaves little to change in the present.",
  "hint": "Sort each fact by what it is doing in the present.",
  "src": "Module 14, Reading One Person at Five Levels"
 },
 {
  "term": "Non-inferiority",
  "bloom": "understand",
  "prompt": "A trial reports that a transdiagnostic group treatment was non-inferior to diagnosis-specific treatment on a well-being measure at the end of treatment. Which statement describes what the design tested?",
  "options": [
   {
    "id": "a",
    "text": "Whether the new treatment produced better scores than the established one on the main outcome measure"
   },
   {
    "id": "b",
    "text": "Whether the two treatments produced identical scores for each participant at the end of treatment"
   },
   {
    "id": "c",
    "text": "Whether the new treatment was no worse than the established one by more than a stated margin"
   },
   {
    "id": "d",
    "text": "Whether the new treatment beat a waitlist by a larger margin than the established treatment did"
   }
  ],
  "correct": "c",
  "explain": "A non-inferiority design asks whether a new treatment falls short of an established one by more than a margin set in advance. It supports a conclusion that no worse-by-that-margin was detected and cannot support a conclusion that the new treatment is better. A superiority claim needs a design that tests superiority. The waitlist comparison asks a different question from the one between the two treatments. No design shows identical scores for every person, because individuals vary even when group averages are close.",
  "hint": "The design checks whether the new treatment falls short, and it cannot show that the treatment wins.",
  "src": "Module 14, What a Shared Process Predicts and What It Does Not"
 },
 {
  "term": "Intolerance of uncertainty",
  "bloom": "analyze",
  "prompt": "A woman will not send a text until two friends confirm it sounds fine, and she lies awake because the outcome of tomorrow’s appointment is unknown. She says, “I cannot stand not knowing.” Which cognitive mechanism fits best?",
  "options": [
   {
    "id": "a",
    "text": "An automatic thought, a quick and unbidden interpretation that arises in a situation and feels like plain fact to her"
   },
   {
    "id": "b",
    "text": "Threat overestimation, the habit of judging a feared outcome as more likely and more costly than it is"
   },
   {
    "id": "c",
    "text": "The negative cognitive triad, a pattern of bleak beliefs about the self, the world, and the future ahead"
   },
   {
    "id": "d",
    "text": "Intolerance of uncertainty, a belief that not knowing is dangerous, with a drive to remove the unknown entirely"
   }
  ],
  "correct": "d",
  "explain": "Her checking with friends and her sleeplessness both aim at removing the unknown, and her own words name the unknown as the problem. Intolerance of uncertainty fuels worry and reassurance seeking. Threat overestimation concerns how likely and how costly an outcome seems, and she has not said the appointment will go badly. Nothing in the case points to bleak beliefs about the self, the world, and the future. Automatic thoughts are present in many problems and describe a single interpretation, while her pattern is organized around not knowing.",
  "hint": "Which belief explains both the checking and the sleepless night?",
  "src": "Module 14, Cognitive Loops"
 },
 {
  "term": "Equifinality",
  "bloom": "understand",
  "prompt": "Three people in a counseling caseload all meet criteria for depression. One lost a parent in childhood, one spent years under harsh standards at work, and one developed a serious medical illness. Which principle does this set of histories illustrate?",
  "options": [
   {
    "id": "a",
    "text": "Comorbidity, the presence of more than one diagnosis in the same person at the same time"
   },
   {
    "id": "b",
    "text": "Multifinality, the principle that the same starting point can lead to different outcomes later"
   },
   {
    "id": "c",
    "text": "Equifinality, the principle that different starting points and paths can lead to the same outcome"
   },
   {
    "id": "d",
    "text": "A transdiagnostic process, a mechanism that maintains problems under many different diagnostic labels"
   }
  ],
  "correct": "c",
  "explain": "Three different routes arrive at one diagnosis, which is equifinality. Multifinality runs the other way, with one starting point leading to several outcomes. Comorbidity concerns two or more diagnoses in a single person, and each person here has one. A transdiagnostic process describes what keeps problems going across labels, and the case describes how the problems began. A route to a problem is a separate matter from the process that maintains it now.",
  "hint": "Count the starting points and count the endpoints.",
  "src": "Module 14, Same Outcome, Different Paths"
 },
 {
  "term": "Non-active control conditions",
  "bloom": "evaluate",
  "prompt": "A review reports that a transdiagnostic treatment beat waitlist and usual care in many trials. Which addition would let the review say something about transdiagnostic versus diagnosis-specific treatment?",
  "options": [
   {
    "id": "a",
    "text": "Trials that put it head to head with a protocol written for one diagnosis, since that comparison is the one at issue"
   },
   {
    "id": "b",
    "text": "More waitlist trials, since pooling additional trials narrows the interval around the combined effect size"
   },
   {
    "id": "c",
    "text": "A larger pooled sample of participants, since size alone would reveal whether either approach was better"
   },
   {
    "id": "d",
    "text": "A longer follow-up against usual care, since lasting benefit would show that the treatment is the stronger one"
   }
  ],
  "correct": "a",
  "explain": "Waitlist and usual care are non-active control conditions, and a treatment that beats them has shown only that it beats them. A statement about transdiagnostic versus diagnosis-specific treatment needs a comparison in which the diagnosis-specific protocol was the other arm. More waitlist trials and a larger sample would tighten an estimate against the same controls and leave the question untouched. Longer follow-up against usual care tells how long a benefit lasts relative to usual care, and it does not compare the two kinds of protocol.",
  "hint": "A comparison answers only the question its comparison group poses.",
  "src": "Module 14, What the Evidence Supports"
 },
 {
  "term": "Mechanism-treatment matching",
  "bloom": "apply",
  "prompt": "A clinician sees a client whose problem is kept going by long stretches in bed and avoidance of contact. She chooses scheduled, graded activities and counts the activities completed each week. Which practice describes her choice of intervention?",
  "options": [
   {
    "id": "a",
    "text": "A diagnosis-specific protocol, a manual designed for one diagnosis and followed in the same order for every client"
   },
   {
    "id": "b",
    "text": "Measurement-based care alone, the routine collection of brief measures with results used to adjust the plan over time"
   },
   {
    "id": "c",
    "text": "Emotion regulation training, which teaches processes that influence which emotions a person has and how they are expressed"
   },
   {
    "id": "d",
    "text": "Mechanism-treatment matching, choosing the intervention that most directly targets the process maintaining the problem"
   }
  ],
  "correct": "d",
  "explain": "She identified withdrawal as the maintaining process and chose graded activity because it restores the experiences withdrawal has been blocking, which is matching. Counting activities each week is also good practice, and it is tracking of the process, so measurement-based care is part of her plan and does not explain why she picked this intervention. Nothing in the case says she is following a manual written for one diagnosis. Emotion regulation training targets a different process from the one she identified.",
  "hint": "Ask how she chose the intervention, apart from how she checks it.",
  "src": "Module 14, The Process-Based Approach and Treatment Matching"
 }
];

var idx = 0;
var answered = [];   // chosen id or null
var hintShown = {};

function el(t,c,h){var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

var CHECK='<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#3c6b3e" stroke-width="1.4"/><path d="M6.4 10.2l2.3 2.3 4.7-4.9" stroke="#3c6b3e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var CROSS='<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#a23b34" stroke-width="1.4"/><path d="M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6" stroke="#a23b34" stroke-width="1.6" stroke-linecap="round"/></svg>';

function init(){ answered = QUIZ.map(function(){return null;}); renderProgress(); renderQuestion(); }

function renderProgress(){
  var pct = (idx) / QUIZ.length * 100;
  document.getElementById("pbarfill").style.width = pct + "%";
  document.getElementById("pcount").textContent = "Question " + Math.min(idx+1,QUIZ.length) + " of " + QUIZ.length;
}

function renderQuestion(){
  renderProgress();
  var q = QUIZ[idx];
  var panel = document.getElementById("qpanel");
  panel.innerHTML = "";
  var chosen = answered[idx];
  var isAnswered = chosen !== null;

  var top = el("div","qtop");
  top.appendChild(el("span","qn","Question " + (idx+1) + " of " + QUIZ.length));
  top.appendChild(el("span","term-tag", esc(q.term)));
  panel.appendChild(top);

  panel.appendChild(el("p","qprompt", esc(q.prompt)));
  panel.appendChild(el("div","do","<b>Do this:</b> Choose the option that reflects the reading's meaning of the term rather than a familiar word. You'll see whether it's right and why before moving on."));

  var opts = el("div","options");
  q.options.forEach(function(o){
    var cls="opt";
    if(isAnswered){
      if(o.id===q.correct) cls+=" correct";
      else if(o.id===chosen) cls+=" wrong";
      else cls+=" dim";
    }
    var b = el("button",cls);
    b.type="button";
    if(isAnswered) b.disabled=true;
    var mark="";
    if(isAnswered && o.id===q.correct) mark=CHECK;
    else if(isAnswered && o.id===chosen) mark=CROSS;
    b.innerHTML='<span class="k">'+o.id.toUpperCase()+'.</span><span class="txt">'+esc(o.text)+'</span><span class="mark">'+mark+'</span>';
    if(!isAnswered) b.addEventListener("click",function(){ choose(o.id); });
    opts.appendChild(b);
  });
  panel.appendChild(opts);

  if(!isAnswered){
    var foot = el("div","foot");
    var hb = el("button","hintbtn", hintShown[idx] ? "Hide hint" : "Show a hint");
    hb.addEventListener("click", function(){ hintShown[idx]=!hintShown[idx]; renderQuestion(); });
    foot.appendChild(hb);
    foot.appendChild(el("span","",""));
    panel.appendChild(foot);
    if(hintShown[idx]) panel.appendChild(el("div","hintbox", esc(q.hint)));
  } else {
    var right = chosen===q.correct;
    panel.appendChild(el("p","verdict "+(right?"ok":"no"), right ? "Correct." : "Not quite."));
    var ex = el("p","explain", esc(q.explain));
    ex.innerHTML += '<div class="src">Reading: ' + esc(q.src) + '</div>';
    panel.appendChild(ex);

    var foot = el("div","foot");
    foot.appendChild(el("span","",""));
    var last = idx===QUIZ.length-1;
    var nb = el("button","btn");
    nb.innerHTML = last ? 'See your results' : 'Next question <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M4 10h11M11 6l4 4-4 4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    nb.addEventListener("click", function(){
      if(last){ finish(); } else { idx++; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
    });
    foot.appendChild(nb);
    panel.appendChild(foot);
  }
}

function choose(id){
  if(answered[idx]!==null) return;
  answered[idx]=id;
  renderQuestion();
}

function finish(){
  document.getElementById("pbarfill").style.width = "100%";
  document.getElementById("pcount").textContent = "Complete";
  document.getElementById("qpanel").classList.add("hidden");
  var correct = answered.filter(function(a,i){return a===QUIZ[i].correct;}).length;

  var rp = document.getElementById("resultsPanel");
  rp.classList.remove("hidden");
  rp.innerHTML="";
  rp.appendChild(el("h2",null,"Your results"));
  rp.appendChild(el("p","score","You answered <b>"+correct+" of "+QUIZ.length+"</b> correctly."));

  var bd = el("div","breakdown");
  QUIZ.forEach(function(q,i){
    var right = answered[i]===q.correct;
    var row = el("div","brow");
    row.innerHTML = '<span class="bi">'+(right?CHECK:CROSS)+'</span>' +
      '<span class="bt"><span class="bterm">'+esc(q.term)+'</span>'+(right?'':' (revisit in the reading: '+esc(q.src)+')')+'</span>';
    bd.appendChild(row);
  });
  rp.appendChild(bd);

  var act = el("div","actions");
  var again = el("button","btn secondary","Retake the self-test");
  again.addEventListener("click", function(){ idx=0; answered=QUIZ.map(function(){return null;}); hintShown={};
    document.getElementById("qpanel").classList.remove("hidden"); rp.classList.add("hidden"); renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); });
  act.appendChild(again);
  rp.appendChild(act);

  rp.appendChild(el("p","selfnote","This self-test scores only these multiple-choice items, and your score is not saved or sent anywhere. Terms you missed are the ones to practice producing from memory."));
  window.scrollTo({top:0,behavior:"smooth"});
}

init();
</script>
</body>
</html>
