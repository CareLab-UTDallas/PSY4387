    "why": "Asking first respects her control and the withdrawal option she was told about. It also holds back sharing that her releases already cover and the plan needs, so the seating and attendance steps wait. What this keeps for Anika is her say. What it puts at risk is timing, and the releases go unused without a conversation about why."
   },
   {
    "r": 0,
    "who": "Social worker",
    "t": "Her mother drives her to every appointment, so I’ll ask her mother to explain the plan to Anika and go over it with her, which saves a visit and keeps the family involved. I think she will take it better from someone she trusts at home, and her mother already knows most of it from the drives, so little here will be news to her.",
    "reply": "Her mother will want to help. I’m not sure Anika knows we talked about her.",
    "why": "Her mother is not on the releases, and a third party is not the person to explain a care plan to the patient. What this keeps for the team is a saved visit. What it puts at risk is Anika’s first say in her own plan, her trust, and the confidentiality of her care."
   }
  ],
  "order": [
   3,
   0,
   1,
   2
  ]
 }
];
var REVISIT = [
 "Name the decision the meeting has to reach and a time limit before anything else. Review Leading a Case Conference.",
 "Share the loop as a short ordered chain with the first point of interruption and the measure, then ask each member what it changes in their part of the care. Review Reading One Person at Five Levels and Leading a Case Conference.",
 "Ask the quieter member by name for what she sees in her own setting, because her information can change the plan. Review Leading a Case Conference and Checking the Gauges.",
 "Return to the formulation, the measures, and the patient’s goals, and check delivery before judging a plan that has not moved. Review Checking the Gauges and Where to Start: Choosing an Interruption Point.",
 "Name an owner and a date for each step, name the measure, and set a review date. Review Leading a Case Conference and Checking the Gauges.",
 "Tell the patient what was discussed and decided, ask her agreement where the plan needs it, and share only what each person’s part requires. Module 13 sets out the reasoning in Informed Consent in Therapy and Confidentiality and Where It Gives Way, and the rules differ by place and policy."
];
var TAKE = "In this module’s model, a case conference turns a formulation into a plan when the chair sets a purpose and a time limit, shares the loop briefly and checks that it is understood, asks the quieter member for what only she has seen, settles disagreement by returning to the formulation, the measures, and the patient’s goals, and ends with owners and dates. The patient hears what was decided and agrees to the steps that need her agreement, and the team shares only what each part of the plan requires, under the rules of the place and the employer. Defensible options can differ, such as raising a dose first or testing a plan first, and the better one depends on what the team learns about delivery.";
var NOTE = "This practice conversation is invented and scores only the choices shown. It practices one kind of team meeting with scripted team members who hold defensible views, and it is not clinical training or legal advice. Rules about sharing information differ by place, employer, and program, so confirm the ones that apply to you. Anika’s situation is hers alone and does not describe any group of people. It is not a way to assess or treat yourself or anyone you know. If you or someone you know is struggling, call or text 988 at any hour, or call 911 in an emergency.";


function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var root=document.getElementById("root"), S;
var LABEL={2:"Skilled response",1:"Acceptable, with a gap",0:"Missed the skill"};
function fresh(){ S={t:0,branch:"start",pick:null,retried:false,first:null,log:[],done:false}; render(); }
function post(){ try{ parent.postMessage(JSON.stringify({subject:"lti.frameResize",height:document.documentElement.scrollHeight}),"*"); }catch(e){} }
function pills(){ return '<div class="pills" aria-hidden="true">'+TURNS.map(function(t,i){ return '<span class="pill'+(i===S.t&&!S.done?" on":(i<S.log.length?" done":""))+'">'+(i+1)+'. '+esc(SKILLS[t.skill])+'</span>'; }).join("")+'</div>'; }
function clientLine(t){ return t.client[S.branch]||t.client.start||t.client.m; }
function render(){
  if(S.done){ return summary(); }
  var t=TURNS[S.t], h=pills()+'<div class="case"><b class="t">Case: Anika</b>'+SCENARIO.map(function(p){return '<p style="margin:0 0 8px">'+esc(p)+'</p>';}).join("")+'</div><section class="panel" id="panel" tabindex="-1" aria-live="polite">';
  h+='<p class="skill">Turn '+(S.t+1)+' of '+TURNS.length+'. Skill practiced: '+esc(SKILLS[t.skill])+'</p>';
  h+='<p class="quote"><span class="who">'+esc(t.who)+'</span>'+esc(clientLine(t))+'</p>';
  h+='<div class="do"><b>Do this:</b> Choose what you would say next as chair. Each choice changes how the team responds.</div><div class="options">';
  t.order.forEach(function(ix,pos){
    var o=t.options[ix], cls="opt";
    if(S.pick!==null){ cls+=" r"+o.r; if(S.pick===ix) cls+=" pick"; else cls+=" dim"; }
    h+='<button type="button" class="'+cls+'" data-ix="'+ix+'"'+(S.pick!==null?" disabled":"")+'><span class="k">'+String.fromCharCode(65+pos)+'.</span><span>'+esc(o.t)+'</span></button>';
  });
  h+='</div>';
  if(S.pick!==null){
    var o=t.options[S.pick], best=t.options.filter(function(x){return x.r===2;})[0], eff=(S.retried?Math.min(o.r,1):o.r);
    h+='<p class="verdict r'+o.r+'">'+LABEL[o.r]+(S.retried?" (second try, scored at most 1 of 2)":"")+'</p>';
    h+='<p class="quote"><span class="who">'+esc(o.who||t.who)+'</span>'+esc(o.reply)+'</p><p class="explain">'+esc(o.why)+'</p>';
    if(o.r<2) h+='<div class="better"><b>A stronger response:</b> '+esc(best.t)+'</div>';
    h+='<div class="foot">'+((o.r===0&&!S.retried)?'<button class="btn secondary" type="button" data-act="retry">Try this turn again</button>':'<span></span>')+'<button class="btn" type="button" data-act="next">'+(S.t>=TURNS.length-1?"See your results":"Continue the meeting")+'</button></div>';
  }
  h+='</section>'; root.innerHTML=h; post();
  var p=document.getElementById("panel"); if(p&&S.pick!==null){ try{p.focus();}catch(e){} }
}
function commit(){
  var t=TURNS[S.t], o=t.options[S.pick], sc=(S.retried?Math.min(o.r,1):o.r);
  S.log.push({skill:t.skill,r:o.r,score:sc,retried:S.retried,first:S.first});
  S.branch=(o.r===2?"g":(o.r===1?"m":"p"));
}
function summary(){
  var tot=0; S.log.forEach(function(l){tot+=l.score;});
  var worst=S.log.slice().sort(function(a,b){return a.score-b.score;})[0];
  var h=pills()+'<section class="panel" id="panel" tabindex="-1"><h2 style="margin:0 0 4px;font-size:20px;">Your case conference</h2><p>You scored <b>'+tot+' of '+(TURNS.length*2)+'</b> across the six skills. A retried turn counts for at most 1 point.</p><div>';
  S.log.forEach(function(l){ h+='<div class="brow"><span class="bs">'+l.score+' / 2</span><span><b>'+esc(SKILLS[l.skill])+'.</b> '+(l.score===2?"Skilled response.":esc(REVISIT[l.skill]))+'</span></div>'; });
  h+='</div>';
  if(tot<TURNS.length*2){ h+='<div class="take"><b>Where to look again:</b> '+esc(REVISIT[worst.skill])+'</div>'; }
  h+='<div class="take"><b>What carries forward:</b> '+esc(TAKE)+'</div><div class="foot"><span></span><button class="btn secondary" type="button" data-act="again">Start over</button></div><p class="note">'+esc(NOTE)+'</p></section>';
  root.innerHTML=h; post();
}
root.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b||b.disabled) return;
  if(b.hasAttribute("data-ix")){ if(S.pick!==null) return; S.pick=parseInt(b.getAttribute("data-ix"),10); if(!S.retried) S.first=S.pick; render(); return; }
  var a=b.getAttribute("data-act");
  if(a==="retry"){ S.retried=true; S.pick=null; render(); return; }
  if(a==="next"){ commit(); S.pick=null; S.retried=false; S.first=null; if(S.t>=TURNS.length-1){ S.done=true; } else { S.t++; } render(); try{window.scrollTo({top:0,behavior:"smooth"});}catch(x){} return; }
  if(a==="again"){ fresh(); return; }
});
fresh();

</script>
