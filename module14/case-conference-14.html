  "note": "This practice conversation is invented and scores only the choices shown. It practices one kind of team meeting with scripted team members who hold defensible views, and it is not clinical training or legal advice. Rules about sharing information differ by place, employer, and program, so confirm the ones that apply to you. Linnea’s situation is invented and does not describe any group of people. It is not a way to assess or treat yourself or anyone you know. If you or someone you know is struggling, call or text 988 at any hour, or call 911 in an emergency.",
  "revisit_over": {
   "3": "Make a family member’s role the patient’s decision, and let the formulation and the measures test the plan. The loop may include other people. Review Interpersonal Loops and Leading a Case Conference. Module 13 sets out the reasoning in Identifying the Client, and the rules differ by place and policy."
  }
 }
];


function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var root=document.getElementById("root"), S=null, PROG={best:{}}, SAVED=true;
var STORE_KEY="psy4387-m14-conference-library-v1";
var LABEL={2:"Skilled response",1:"Acceptable, with a gap",0:"Missed the skill"};
function caseById(id){ for(var i=0;i<CASES.length;i++){ if(CASES[i].id===id) return CASES[i]; } return null; }
function maxOf(c){ return c.turns.length*2; }
function readStore(){ try{ var ls=window.localStorage; if(!ls) return null; var raw=ls.getItem(STORE_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function writeStore(){ try{ window.localStorage.setItem(STORE_KEY, JSON.stringify(PROG)); return true; }catch(e){ return false; } }
function clearStore(){ try{ window.localStorage.removeItem(STORE_KEY); }catch(e){} }
function loadProgress(){
  PROG={best:{}};
  var o=readStore();
  if(o && typeof o==="object" && o.best && typeof o.best==="object"){
    CASES.forEach(function(c){ var v=o.best[c.id]; if(typeof v==="number" && v>=0 && v<=maxOf(c) && Math.floor(v)===v){ PROG.best[c.id]=v; } });
  }
}
function doneCount(){ return CASES.filter(function(c){ return PROG.best[c.id]!==undefined; }).length; }
function unplayed(excl){ return CASES.filter(function(c){ return PROG.best[c.id]===undefined && c.id!==excl; }).map(function(c){ return c.id; }); }
function drawNext(excl){ var u=unplayed(excl); if(!u.length) return null; return u[Math.floor(Math.random()*u.length)]; }
function blank(cid){ return {cid:cid,t:0,branch:"start",pick:null,retried:false,first:null,log:[],done:false,recorded:false,total:null,prev:undefined,list:false,confirm:false}; }
function startCase(id){ S=blank(id); render(); try{window.scrollTo({top:0,behavior:"smooth"});}catch(x){} }
function init(){
  loadProgress();
  if(doneCount()===0){ startCase(1); return; }
  var id=drawNext(null);
  if(id===null){ S=blank(null); S.list=true; render(); } else { startCase(id); }
}
function post(){ try{ parent.postMessage(JSON.stringify({subject:"lti.frameResize",height:document.documentElement.scrollHeight}),"*"); }catch(e){} }
function pills(c){ return '<div class="pills" aria-hidden="true">'+c.turns.map(function(t,i){ return '<span class="pill'+(i===S.t&&!S.done?" on":(i<S.log.length?" done":""))+'">'+(i+1)+'. '+esc(SKILLS[t.skill])+'</span>'; }).join("")+'</div>'; }
function clientLine(t){ return t.client[S.branch]||t.client.start||t.client.m; }
function chipHtml(c){
  var b=PROG.best[c.id], cur=(S&&S.cid===c.id), cls="chip"+(b!==undefined?" done":"")+(cur?" cur":"");
  var st=(b!==undefined)?("Best "+b+" of "+maxOf(c)):"Not played yet";
  return '<button type="button" class="'+cls+'" data-case="'+c.id+'"><span class="n">Case '+c.id+'</span><span class="nm">'+esc(c.name)+', '+esc(c.setting.toLowerCase())+', '+esc(c.presentation.toLowerCase())+(cur?" (current)":"")+'</span><span class="st">'+st+'</span></button>';
}
function libBar(){
  var n=CASES.length, d=doneCount(), c=S&&S.cid?caseById(S.cid):null;
  var h='<div class="lib" role="region" aria-label="Practice library"><div class="row"><span class="prog">'+(c?'<b>Case '+c.id+' of '+n+'</b>. ':'')+'<b>'+d+' of '+n+'</b> cases completed.</span>'
    +'<button type="button" class="linkbtn" data-act="list" aria-expanded="'+(S.list?"true":"false")+'">'+(S.list?"Hide the case list":"Show the case list")+'</button></div>';
  if(d===n){ h+='<p class="msg" style="margin:10px 0 0">You have completed all '+n+' cases. Choose any case to practice it again. Your best score for each case is kept.</p>'; }
  if(S.list){ h+='<div class="chips">'+CASES.map(chipHtml).join("")+'</div><p class="meta" style="margin:8px 0 0">Choosing a case starts it now and ends the one in progress. Scores stay in this browser, nothing is sent, and no grade is recorded in Canvas.</p>'; }
  return h+'</div>';
}
function resetBar(){
  var h='<div class="reset">';
  if(S.confirm){ h+='<p style="margin:0 0 8px">This clears the scores saved in this browser and starts the library again at Case 1. Reset your practice record?</p><button type="button" class="btn secondary" data-act="reset-yes">Yes, reset</button><button type="button" class="btn secondary" data-act="reset-no">Cancel</button>'; }
  else { h+='<button type="button" class="btn secondary" data-act="reset">Reset my practice record</button>'; }
  if(!SAVED){ h+='<p class="meta" style="margin:8px 0 0">This browser would not save your record, so it lasts only while this page stays open.</p>'; }
  return h+'</div>';
}
function render(){
  if(!S.cid){ root.innerHTML=libBar()+resetBar(); post(); return; }
  var c=caseById(S.cid);
  if(S.done){ return summary(c); }
  var t=c.turns[S.t];
  var h=libBar()+pills(c)+'<div class="case"><b class="t">Case '+c.id+' of '+CASES.length+', invented: '+esc(c.name)+'</b><p class="meta" style="margin:0 0 8px;color:#6b5a30">Setting: '+esc(c.setting)+'. About '+esc(c.minutes)+' minutes of meeting time.</p>'+c.scenario.map(function(p){return '<p style="margin:0 0 8px">'+esc(p)+'</p>';}).join("")+'</div><section class="panel" id="panel" tabindex="-1" aria-live="polite">';
  h+='<p class="skill">Turn '+(S.t+1)+' of '+c.turns.length+'. Skill practiced: '+esc(SKILLS[t.skill])+'</p>';
  h+='<p class="quote"><span class="who">'+esc(t.who)+'</span>'+esc(clientLine(t))+'</p>';
  h+='<div class="do"><b>Do this:</b> Choose what you would say next as chair. Each choice changes how the team responds.</div><div class="options">';
  t.order.forEach(function(ix,pos){
    var o=t.options[ix], cls="opt";
    if(S.pick!==null){ cls+=" r"+o.r; if(S.pick===ix) cls+=" pick"; else cls+=" dim"; }
    h+='<button type="button" class="'+cls+'" data-ix="'+ix+'"'+(S.pick!==null?" disabled":"")+'><span class="k">'+String.fromCharCode(65+pos)+'.</span><span>'+esc(o.t)+'</span></button>';
  });
  h+='</div>';
  if(S.pick!==null){
    var o=t.options[S.pick], best=t.options.filter(function(x){return x.r===2;})[0];
    h+='<p class="verdict r'+o.r+'">'+LABEL[o.r]+(S.retried?" (second try, scored at most 1 of 2)":"")+'</p>';
    h+='<p class="quote"><span class="who">'+esc(o.who||t.who)+'</span>'+esc(o.reply)+'</p><p class="explain">'+esc(o.why)+'</p>';
    if(o.r<2) h+='<div class="better"><b>A stronger response:</b> '+esc(best.t)+'</div>';
    h+='<div class="foot">'+((o.r===0&&!S.retried)?'<button class="btn secondary" type="button" data-act="retry">Try this turn again</button>':'<span></span>')+'<button class="btn" type="button" data-act="next">'+(S.t>=c.turns.length-1?"See your results":"Continue the meeting")+'</button></div>';
  }
  h+='</section>'+resetBar(); root.innerHTML=h; post();
  var p=document.getElementById("panel"); if(p&&S.pick!==null){ try{p.focus();}catch(e){} }
}
function commit(){
  var c=caseById(S.cid), t=c.turns[S.t], o=t.options[S.pick], sc=(S.retried?Math.min(o.r,1):o.r);
  S.log.push({skill:t.skill,r:o.r,score:sc,retried:S.retried,first:S.first});
  S.branch=(o.r===2?"g":(o.r===1?"m":"p"));
  if(S.t>=c.turns.length-1){ finish(c); }
}
function finish(c){
  var tot=0; S.log.forEach(function(l){tot+=l.score;});
  S.done=true; S.total=tot;
  if(!S.recorded){
    S.recorded=true; S.prev=PROG.best[c.id];
    if(S.prev===undefined || tot>S.prev){ PROG.best[c.id]=tot; }
    SAVED=writeStore();
  }
}
function revisitFor(c,i){ var o=c.revisit_over&&c.revisit_over[String(i)]; return o||REVISIT[i]; }
function summary(c){
  S.list=true;
  var tot=S.total, mx=maxOf(c), n=CASES.length;
  var worst=S.log.slice().sort(function(a,b){return a.score-b.score;})[0];
  var h=libBar()+pills(c)+'<section class="panel" id="panel" tabindex="-1"><h2 style="margin:0 0 4px;font-size:20px;">Your case conference with '+esc(c.name)+'</h2><p>You scored <b>'+tot+' of '+mx+'</b> on this case across the six skills. A retried turn counts for at most 1 point.</p>';
  var best=PROG.best[c.id];
  h+='<p class="meta" style="font-size:13.5px">'+(S.prev===undefined?"This is your first score on this case.":(tot>S.prev?"This is a new best on this case. Your earlier best was "+S.prev+" of "+mx+".":"Your best on this case is "+best+" of "+mx+"."))+' Your record stays in this browser. No grade is recorded in Canvas, so use Mark as done on the Canvas page when you have finished as many conferences as you plan to.</p><div>';
  S.log.forEach(function(l){ h+='<div class="brow"><span class="bs">'+l.score+' / 2</span><span><b>'+esc(SKILLS[l.skill])+'.</b> '+(l.score===2?"Skilled response.":esc(revisitFor(c,l.skill)))+'</span></div>'; });
  h+='</div>';
  if(tot<mx){ h+='<div class="take"><b>Where to look again:</b> '+esc(revisitFor(c,worst.skill))+'</div>'; }
  h+='<div class="take"><b>What carries forward:</b> '+esc(c.take)+'</div>';
  var u=unplayed(c.id);
  if(u.length){ h+='<p class="msg">'+doneCount()+' of '+n+' cases completed. '+u.length+' not played yet.</p>'; }
  else { h+='<p class="msg">You have completed all '+n+' cases. Choose any case from the list below to replay it.</p>'; }
  h+='<div class="foot"><button class="btn secondary" type="button" data-act="again">Replay this case</button>'+(u.length?'<button class="btn" type="button" data-act="another">Practice another case</button>':'<button class="btn" type="button" data-act="list">Show the case list</button>')+'</div>';
  h+='<p class="note">'+esc(c.note)+'</p></section>';
  root.innerHTML=h+resetBar(); post();
  var p=document.getElementById("panel"); if(p){ try{p.focus();}catch(e){} }
}
function doPick(ix){ if(!S||!S.cid||S.done||S.pick!==null) return; S.pick=ix; if(!S.retried) S.first=ix; render(); }
function doRetry(){ if(!S||S.pick===null) return; S.retried=true; S.pick=null; render(); }
function doNext(){ if(!S||S.pick===null) return; commit(); S.pick=null; S.retried=false; S.first=null; if(!S.done){ S.t++; } render(); try{window.scrollTo({top:0,behavior:"smooth"});}catch(x){} }
function doCase(id){ if(caseById(id)) startCase(id); }
function doAnother(){ var cur=S&&S.cid; var id=drawNext(cur); if(id===null){ S.list=true; render(); return; } startCase(id); }
function doAgain(){ if(S&&S.cid) startCase(S.cid); }
function doReset(){ PROG={best:{}}; clearStore(); SAVED=true; startCase(1); }
root.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b||b.disabled) return;
  if(b.hasAttribute("data-ix")){ doPick(parseInt(b.getAttribute("data-ix"),10)); return; }
  if(b.hasAttribute("data-case")){ doCase(parseInt(b.getAttribute("data-case"),10)); return; }
  var a=b.getAttribute("data-act");
  if(a==="retry") doRetry(); else if(a==="next") doNext(); else if(a==="again") doAgain(); else if(a==="another") doAnother();
  else if(a==="list"){ S.list=!S.list; render(); }
  else if(a==="reset"){ S.confirm=true; render(); }
  else if(a==="reset-no"){ S.confirm=false; render(); }
  else if(a==="reset-yes") doReset();
});
init();

</script>
</body>
</html>
