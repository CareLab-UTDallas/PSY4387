<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Effect Sizes and What They Mean</title>
<style>
  :root{

    --amber-bg:#fffbef; --amber-line:#e7c98a; --amber-ink:#8a6d2f;
    --instr-bg:#eef3fb; --instr-line:#c9d9f0; --instr-ink:#2f4a72;
    --focus:#2f6f4f; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55;}
  .wrap{max-width:780px;margin:0 auto;padding:24px 20px 60px;}
  .masthead{padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .masthead h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em;}
  .masthead .sub{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:70ch;}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;}
  .stp{font-size:12.5px;color:var(--muted);background:#eceae4;border-radius:999px;padding:4px 11px;}
  .stp.on{background:var(--accent);color:#fff;}
  .stp.done{background:var(--correct-bg);color:var(--correct-ink);}
  .case{background:var(--amber-bg);border:1px solid var(--amber-line);color:#5d4a1f;border-radius:12px;padding:13px 16px;margin-bottom:14px;font-size:14px;line-height:1.6;}
  .case b.t{display:block;margin-bottom:3px;color:var(--amber-ink);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--panel-shadow);padding:22px 24px;}
  .intro{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);border-radius:12px;padding:13px 16px;margin-bottom:16px;font-size:14px;line-height:1.55;}

  .qtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px;}
  .qtop .qn{font-size:13px;color:var(--muted);}
  .qtop .tag{font-size:12px;color:var(--muted);background:#eceae4;border-radius:7px;padding:4px 10px;}
  .qprompt{font-size:17px;font-weight:600;margin:6px 0 6px;line-height:1.45;}
  .quote{font-size:17px;line-height:1.5;margin:8px 0 10px;padding:10px 14px;background:#f7f6f4;border-left:3px solid var(--accent);border-radius:6px;}
  .do{background:var(--do-bg);color:var(--do-ink);border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.5;margin:10px 0 16px;}
  .do b{color:var(--ink);}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;font-size:14.5px;line-height:1.5;cursor:pointer;color:var(--ink);transition:border-color .12s,background .12s;}
  .opt:hover:not(:disabled){border-color:#cfc9bf;}
  .opt:focus-visible,.btn:focus-visible,.cat:focus-visible,.node:focus-visible,.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:15px;}
  .opt:disabled{cursor:default;}
  .opt.correct,.cat.correct{background:var(--correct-bg);border-color:var(--correct-line);}
  .opt.wrong,.cat.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .opt.dim{opacity:.6;}
  .cats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .cat{flex:1 1 150px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--ink);text-align:center;}

  .cat:disabled{cursor:default;}
  .cat.dim{opacity:.6;}
  .verdict{margin:16px 0 0;font-size:14.5px;font-weight:600;}
  .verdict.ok{color:var(--correct-ink);} .verdict.no{color:var(--wrong-ink);}
  .explain{margin:8px 0 0;font-size:14px;color:#44413b;line-height:1.6;}
  .explain .src{color:var(--muted);font-size:12.5px;margin-top:6px;}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 19px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;}
  .btn:hover{filter:brightness(1.05);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .seq{list-style:none;margin:8px 0 12px;padding:0;display:flex;flex-direction:column;gap:8px;}
  .seq li{display:flex;gap:10px;align-items:flex-start;background:#f7f6f4;border:1px dashed #d8d3c8;border-radius:10px;padding:10px 13px;font-size:14.5px;min-height:44px;}
  .seq li .n{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:18px;}
  .seq li.filled{background:#fff;border:1px solid var(--line);}
  .seq li.right{background:var(--correct-bg);border-color:var(--correct-line);}
  .seq li.bad{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .pool{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .node{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--ink);}
  .node:hover:not(:disabled){border-color:#cfc9bf;}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0 4px;}
  .chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip.right{background:var(--correct-bg);border-color:var(--correct-line);color:var(--correct-ink);}
  .chip.miss{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber-ink);}
  .chip.extra{background:var(--wrong-bg);border-color:var(--wrong-line);color:var(--wrong-ink);}
  .chip:disabled{cursor:default;}
  .ex ul{margin:6px 0 0 18px;padding:0;font-size:14px;color:#44413b;}
  .results h2{margin:0 0 4px;font-size:20px;}
  .results .score{font-size:16px;margin:0 0 4px;} .results .score b{color:var(--accent-ink);}
  .results .brow{display:flex;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid #f0eee9;}
  .results .brow:last-child{border-bottom:none;}
  .results .brow .bs{flex:0 0 64px;font-weight:700;color:var(--accent-ink);}
  .selfnote{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.55;}
  .take{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);border-radius:12px;padding:13px 16px;margin-top:14px;font-size:14px;}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>

</div>

 {

   "title": "Case: a trial of a worry program (invented)",
   "text": "A student reads a trial of an invented worry program. The Worry Scale runs from 0 to 60 and lower scores are better. All numbers in this activity are invented for practice.<table style=\"border-collapse:collapse;margin:8px 0 6px;font-size:13.5px;width:100%\"><thead><tr><th style=\"text-align:left;padding:4px 10px;border-bottom:1px solid #d9c79a;font-weight:700\">Group<\/th><th style=\"text-align:left;padding:4px 10px;border-bottom:1px solid #d9c79a;font-weight:700\">n<\/th><th style=\"text-align:left;padding:4px 10px;border-bottom:1px solid #d9c79a;font-weight:700\">Mean change in score<\/th><th style=\"text-align:left;padding:4px 10px;border-bottom:1px solid #d9c79a;font-weight:700\">SD<\/th><\/tr><\/thead><tbody><tr><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">Program<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">70<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">-9.0<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">8<\/td><\/tr><tr><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">Comparison<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">70<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">-5.0<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">8<\/td><\/tr><\/tbody><\/table>The between-group difference is 4 points, and the spread of scores (the SD) is about 8 points."
  },
  "intro": "<b>Step 1.<\/b> Cohen's d expresses a gap in units of how spread out the scores are.",
  "doThis": "Choose the best-supported answer for each question.",
  "src": "Module 11, How Much Does It Help? Effect Size and Cohen's d",
  "items": [
   {
    "prompt": "What Cohen's d does this trial report, and how does the field’s convention label it?",
    "options": [
     {
      "id": "a",
      "text": "About 4, a large effect, because the program group scored 4 points better than the comparison group"
     },
     {
      "id": "b",
      "text": "About 0.5, a medium effect, because the 4-point difference divided by the 8-point spread is one half"
     },
     {
      "id": "c",
      "text": "About 1.1, a large effect, because the program group’s own 9-point change exceeds one spread of scores"

     {
      "id": "d",
      "text": "About 0.2, a small effect, because the two groups differ by less than one full spread of scores"
     }
    ],
    "correct": "b",
    "why": "Cohen's d is the between-group gap divided by the spread of scores, so 4 divided by 8 is 0.5. The field’s shorthand calls 0.5 medium. Dividing the program group’s own change by the spread ignores the comparison group, and the raw point difference has no standard scale.",
    "bloom": "apply"
   },
   {
    "prompt": "With d near 0.5, which statement does the evidence support?",
    "options": [
     {
      "id": "a",
      "text": "Many comparison participants still did better than some program participants, because the two curves overlap a good deal"
     },
     {
      "id": "b",
      "text": "Nearly every program participant improved more than the comparison participants did, because an average effect applies to each person"
     },
     {
      "id": "c",
      "text": "A medium effect justifies adopting the program in most settings, because it is large enough whatever the cost"
     },
     {
      "id": "d",
      "text": "About half of the program participants recovered who otherwise would not have, because a medium effect means half of treated people benefit"
     }
    ],
    "correct": "a",
    "why": "Picture two overlapping bell curves. At a medium effect the treated curve has moved toward the better end, and plenty of comparison participants still did better than plenty of treated ones. An average effect describes the groups, and it says little about whether one person will benefit. Whether an effect is big enough also depends on cost, risk, and what else is available.",
    "bloom": "analyze"
   },
   {
    "prompt": "Trial A used the Worry Scale (0 to 60) and found a 6-point difference with a spread of 12 points. Trial B used a Sleep Index (0 to 28) and found a 3-point difference with a spread of 4 points. Which statement is best supported?",
    "options": [
     {
      "id": "a",
      "text": "Trial A, because its scale has more points and each point may carry more information"
     },
     {
      "id": "b",
      "text": "Trial A, because 6 points is more than 3 points and the raw gap is what readers see first"
     },
     {
      "id": "c",
      "text": "Trial B, with d of 0.75 against 0.5, because dividing each gap by its own spread puts both trials on one common scale"
     },
     {
      "id": "d",
      "text": "The two cannot be compared, because the questionnaires measure different things on scales of different length"

    ],

    "bloom": "analyze"
   }

 {

  "short": "Intervals",
  "tag": "Size and certainty",
  "case": {
   "title": "Case: how certain is the estimate? (invented)",
   "text": "A student compares invented trials that report an effect with a 95 percent confidence interval. All numbers in this activity are invented for practice.<table style=\"border-collapse:collapse;margin:8px 0 6px;font-size:13.5px;width:100%\"><thead><tr><th style=\"text-align:left;padding:4px 10px;border-bottom:1px solid #d9c79a;font-weight:700\">Trial<\/th><th style=\"text-align:left;padding:4px 10px;border-bottom:1px solid #d9c79a;font-weight:700\">Comparison<\/th><th style=\"text-align:left;padding:4px 10px;border-bottom:1px solid #d9c79a;font-weight:700\">n per arm<\/th><th style=\"text-align:left;padding:4px 10px;border-bottom:1px solid #d9c79a;font-weight:700\">d<\/th><th style=\"text-align:left;padding:4px 10px;border-bottom:1px solid #d9c79a;font-weight:700\">95% CI<\/th><\/tr><\/thead><tbody><tr><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">P<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">Waitlist<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">150<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">0.45<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">0.22 to 0.68<\/td><\/tr><tr><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">Q<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">Waitlist<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">20<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">0.45<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">-0.18 to 1.08<\/td><\/tr><tr><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">R<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">Active treatment<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">60<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">0.10<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">-0.26 to 0.46<\/td><\/tr><\/tbody><\/table>"
  },
  "intro": "<b>Step 2.<\/b> A point estimate says how big the effect looks. The interval says what values the data leave plausible.",
  "doThis": "Choose the best-supported answer for each question.",
  "src": "Module 11, How Much Does It Help? Effect Size and Cohen's d",
  "items": [
   {
    "prompt": "Trials P and Q report the same d. Which statement is best supported?",
    "options": [
     {
      "id": "a",
      "text": "Both trials support the same conclusion with similar confidence, because both found the same d"
     },
     {
      "id": "b",
      "text": "P’s data exclude no effect while Q’s fit anything from no effect to a large one, because P’s interval is narrower"
     },
     {
      "id": "c",
      "text": "P’s narrower interval shows that its effect is larger than Q’s, because greater precision raises the estimate"
     },
     {
      "id": "d",
      "text": "Q’s wider interval shows the program works across more varied participants, because width reflects variety in the sample"
     }
    ],
    "correct": "b",
    "why": "The two estimates are the same and the certainty around them differs. P’s interval stays above zero. Q’s runs from a slight worsening to a large benefit, so one small trial cannot tell the possibilities apart. Width reflects precision and carries no information about variety among participants or the size of the effect.",
    "bloom": "analyze"
   },
   {
    "prompt": "The authors of Trial R write, “The program is no better than the active treatment.” Which revision is best supported?",
    "options": [
     {
      "id": "a",
      "text": "Superiority was not shown, because the data fit no difference and a modest benefit over the active treatment"
     },
     {
      "id": "b",
      "text": "The program is better than the active treatment, because the estimate of d is above zero in the data collected"
     },
     {
      "id": "c",
      "text": "The trial is uninformative, because a d below 0.2 means that no effect could be measured at all"
     },
     {
      "id": "d",
      "text": "The statement stands, because an interval that includes zero shows that the two treatments are equal"
     }
    ],
    "correct": "a",
    "why": "An interval that includes zero means the trial could not rule out no difference. It does not show that there is none, because the same interval includes benefits up to 0.46. The fair summary is that superiority was not shown. Treating a point estimate above zero as a win ignores the interval.",
    "bloom": "evaluate"
   },
   {
    "prompt": "Which change would narrow the interval in Trial Q the most?",
    "options": [
     {
      "id": "a",
      "text": "Reporting a 99 percent interval in place of the 95 percent interval, because a higher level means greater certainty"
     },
     {
      "id": "b",
      "text": "Analyzing only the participants who improved, because their scores vary less than the scores of everyone enrolled"
     },
     {
      "id": "c",
      "text": "Reporting d to three decimal places, because a more exact number reflects a more exact estimate of the effect"
     },
     {
      "id": "d",
      "text": "Enrolling many more people, because width is driven mainly by the number of people in the trial"
     }
    ],
    "correct": "d",
    "why": "More participants shrink uncertainty, which is how pooling many trials in a meta-analysis produces a narrower diamond. A 99 percent interval is wider than a 95 percent one. Analyzing only the improvers biases the estimate, and extra decimals change the display and leave the uncertainty as it was.",
    "bloom": "analyze"
   }
  ],
  "revisit": "Reread “How Much Does It Help? Effect Size and Cohen's d” and “Reading a Forest Plot.”"
 },
 {
  "type": "mcq",
  "title": "Number needed to treat",
  "short": "NNT",
  "tag": "An effect as a count of people",
  "case": {
   "title": "Case: two programs, reported as NNT (invented)",
   "text": "The number needed to treat (NNT) states an effect as a count of people. It equals 1 divided by the difference in the share of people who benefit, so a 25 percentage-point difference gives an NNT of 4. An NNT of 4 means that for every four patients treated, one benefits who would not have benefited without the treatment. All numbers in this activity are invented for practice.<table style=\"border-collapse:collapse;margin:8px 0 6px;font-size:13.5px;width:100%\"><thead><tr><th style=\"text-align:left;padding:4px 10px;border-bottom:1px solid #d9c79a;font-weight:700\">Program<\/th><th style=\"text-align:left;padding:4px 10px;border-bottom:1px solid #d9c79a;font-weight:700\">Improved meaningfully with program<\/th><th style=\"text-align:left;padding:4px 10px;border-bottom:1px solid #d9c79a;font-weight:700\">Improved with comparison<\/th><th style=\"text-align:left;padding:4px 10px;border-bottom:1px solid #d9c79a;font-weight:700\">Difference<\/th><th style=\"text-align:left;padding:4px 10px;border-bottom:1px solid #d9c79a;font-weight:700\">NNT<\/th><th style=\"text-align:left;padding:4px 10px;border-bottom:1px solid #d9c79a;font-weight:700\">Cost per person<\/th><\/tr><\/thead><tbody><tr><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">A<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">45%<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">20%<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">25 points<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">4<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">$400<\/td><\/tr><tr><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">B<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">30%<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">25%<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">5 points<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">20<\/td><td style=\"padding:4px 10px;border-bottom:1px solid #eadfc0;vertical-align:top\">$40<\/td><\/tr><\/tbody><\/table>"
  },
  "intro": "<b>Step 3.<\/b> NNT is one more way to state magnitude. It depends on how benefit was defined and on what the comparison was.",
  "doThis": "Choose the best-supported answer for each question.",
  "src": "Module 11, How Much Does It Help? Effect Size and Cohen's d",
  "items": [
   {
    "prompt": "What does the NNT of 4 mean for Program A?",
    "options": [

      "text": "For every four treated, about one improves who would not have otherwise, because the added share is 25 points"

     {
      "id": "d",
      "text": "Program A fails in one of every four people treated and works in the other three, because NNT is a failure count"

/* ---- classify ---- */
function rClassify(st){
  var it=curItems(st)[S.i], ans=S.picked!==null;
  var h=retryBanner()+'<div class="qtop"><span class="qn">'+esc(st.title)+', '+(S.retry?'second look ':'item ')+(S.i+1)+' of '+curItems(st).length+'</span><span class="tag">'+esc(st.tag||"")+'</span></div>';
  h+='<p class="quote">'+it.text+'</p>';
  h+='<div class="do"><b>Do this:</b> '+st.doThis+'</div><div class="cats">';
  st.cats.forEach(function(c){
    var cls="cat"; if(ans){ if(c.id===it.answer) cls+=" correct"; else if(c.id===S.picked) cls+=" wrong"; else cls+=" dim"; }
    h+='<button class="'+cls+'" type="button" data-act="cls" data-val="'+c.id+'"'+(ans?" disabled":"")+'>'+esc(c.label)+'</button>';
  });
  h+='</div>';
  if(ans){ var ok=S.picked===it.answer;
    h+='<p class="verdict '+(ok?"ok":"no")+'">'+(ok?"Correct.":"Not quite.")+'</p><div class="explain">'+it.why+(st.src?'<div class="src">Reading: '+esc(st.src)+'</div>':'')+'</div>'+nextBtn(advanceLabel(st));
  }
  return h;
}
/* ---- order ---- */
function rOrder(st){
  var chosen=S.seq, done=S.revealed||S.orderOk, full=chosen.length===st.correct.length;
  var h='<div class="qtop"><span class="qn">'+esc(st.title)+'</span><span class="tag">'+esc(st.tag||"")+'</span></div>';
  h+='<p class="qprompt">'+st.prompt+'</p><div class="do"><b>Do this:</b> '+st.doThis+'</div>';
  h+='<ol class="seq">';
  for(var p=0;p<st.correct.length;p++){
    var id=chosen[p], node=id?nodeById(st,id):null, cls="";
    if(node){ cls="filled"; if(full||done){ cls+= (id===st.correct[p])?" right":" bad"; } }
    var shown=node?node.text:"";
    if(S.revealed && !node){ shown=nodeById(st,st.correct[p]).text; }
    h+='<li class="'+cls+'"><span class="n">'+(p+1)+'</span><span>'+(shown?shown:'<span style="color:var(--muted)">…</span>')+'</span></li>';
  }
  h+='</ol>';
  if(!full && !S.revealed){
    h+='<div class="pool">';
    st.nodes.forEach(function(n){ if(chosen.indexOf(n.id)<0) h+='<button class="node" type="button" data-act="ord" data-val="'+n.id+'">'+n.text+'</button>'; });
    h+='</div><div class="foot"><span></span>'+(chosen.length?'<button class="btn secondary" type="button" data-act="undo">Undo last</button>':'')+'</div>';
  } else if(full && !S.orderOk && !S.revealed){
    h+='<p class="verdict no">Not quite. Green rows are in the right place and red rows are not.</p><p class="explain">'+st.hintWrong+'</p>';
    h+='<div class="foot"><button class="btn secondary" type="button" data-act="reveal">Show me the sequence</button><button class="btn" type="button" data-act="retry">Try again</button></div>';
  } else {
    h+='<p class="verdict '+(S.orderOk?"ok":"no")+'">'+(S.orderOk?"Correct.":"The sequence is complete.")+'</p><div class="explain">'+st.why+(st.src?'<div class="src">Reading: '+esc(st.src)+'</div>':'')+'</div>'+nextBtn(advanceLabel(st));
  }
  return h;
}
function nodeById(st,id){ for(var i=0;i<st.nodes.length;i++) if(st.nodes[i].id===id) return st.nodes[i]; return null; }
/* ---- mcq ---- */
function rMcq(st){
  var it=curItems(st)[S.i], ans=S.picked!==null;
  var h=retryBanner()+'<div class="qtop"><span class="qn">'+esc(st.title)+', '+(S.retry?'second look ':'question ')+(S.i+1)+' of '+curItems(st).length+'</span><span class="tag">'+esc(st.tag||"")+'</span></div>';
  h+='<p class="qprompt">'+it.prompt+'</p>';
  if(st.doThis) h+='<div class="do"><b>Do this:</b> '+st.doThis+'</div>';
  h+='<div class="options">';
  (S.retry?S.order[S.i]:it.options).forEach(function(o,oi){
    var cls="opt"; if(ans){ if(o.id===it.correct) cls+=" correct"; else if(o.id===S.picked) cls+=" wrong"; else cls+=" dim"; }
    h+='<button class="'+cls+'" type="button" data-act="pick" data-val="'+o.id+'"'+(ans?" disabled":"")+'><span class="k">'+String.fromCharCode(65+oi)+'.</span><span>'+o.text+'</span></button>';
  });
  h+='</div>';
  if(ans){ var ok=S.picked===it.correct;
    h+='<p class="verdict '+(ok?"ok":"no")+'">'+(ok?"Correct.":"Not quite.")+'</p><div class="explain">'+it.why+(it.src||st.src?'<div class="src">Reading: '+esc(it.src||st.src)+'</div>':'')+'</div>'+nextBtn(advanceLabel(st));
  }
  return h;
}
/* ---- multi ---- */
function rMulti(st){
  var h='<div class="qtop"><span class="qn">'+esc(st.title)+'</span><span class="tag">'+esc(st.tag||"")+'</span></div>';
  h+='<p class="qprompt">'+st.prompt+'</p><div class="do"><b>Do this:</b> '+st.doThis+'</div><div class="chips">';
  st.options.forEach(function(o){
    var on=!!S.sel[o.id], truth=st.truth.indexOf(o.id)>=0, cls="chip";
    if(S.checked){ if(on&&truth) cls+=" right"; else if(!on&&truth) cls+=" miss"; else if(on&&!truth) cls+=" extra"; }
    h+='<button class="'+cls+'" type="button" aria-pressed="'+(on?"true":"false")+'" data-act="tog" data-val="'+o.id+'"'+(S.checked?" disabled":"")+'>'+esc(o.label)+'</button>';
  });
  h+='</div>';
  if(!S.checked){
    var n=Object.keys(S.sel).filter(function(k){return S.sel[k];}).length;
    h+='<div class="foot"><span class="qn" style="font-size:13px;color:var(--muted)">'+n+' selected</span><button class="btn" type="button" data-act="chk"'+(n?"":" disabled")+'>Check my answer</button></div>';
  } else {
    var tp=0,fp=0; st.options.forEach(function(o){ var on=!!S.sel[o.id], t=st.truth.indexOf(o.id)>=0; if(on&&t) tp++; if(on&&!t) fp++; });
    var sc=Math.max(0,(tp-fp))/st.truth.length;
    h+='<p class="verdict '+(sc>=1?"ok":"no")+'">'+(sc>=1?"You found every process, with nothing extra.":"Green marks a correct selection, amber a missed process, and red a process that is not present in this case.")+'</p>';
    h+='<div class="explain ex"><ul>'+st.options.filter(function(o){ var on=!!S.sel[o.id], t=st.truth.indexOf(o.id)>=0; return t||on; }).map(function(o){ var t=st.truth.indexOf(o.id)>=0; return '<li><b>'+esc(o.label)+'.</b> '+(st.reasons[o.id]||(t?"Present.":"Not present in this case."))+'</li>'; }).join("")+'</ul>'+(st.src?'<div class="src">Reading: '+esc(st.src)+'</div>':'')+'</div>'+nextBtn(advanceLabel(st));
  }
  return h;
}
/* ---- summary ---- */
function renderSummary(){
  var tot=0,max=0; S.res.forEach(function(r){ tot+=r.score; max+=r.max; });
  var h=bar()+'<section class="panel results"><h2>'+esc(SUMMARY.title)+'</h2><p class="score">You earned <b>'+(Math.round(tot*10)/10)+' of '+max+'</b> points on the scored items. Items answered correctly on the second look count for half a point.</p><div>';
  STEPS.forEach(function(st,ix){ var r=S.res[ix]; h+='<div class="brow"><span class="bs">'+(Math.round(r.score*10)/10)+' / '+r.max+'</span><span><b>'+esc(st.title)+'.</b> '+(r.score>=r.max?"Full marks.":esc(st.revisit||"Revisit this step."))+'</span></div>'; });
  h+='</div><div class="take">'+SUMMARY.takeaway+'</div><div class="foot"><span></span><button class="btn secondary" type="button" data-act="again">Start over</button></div><p class="selfnote">'+SUMMARY.note+'</p></section>';
  root.innerHTML=h; post();
}
/* ---- actions ---- */
function act(a,v){
  var st=STEPS[S.k];
  if(a==="cls"){ if(S.picked!==null) return; S.picked=v; var it=curItems(st)[S.i]; if(v===it.answer) S.res[S.k].score+=(S.retry?0.5:1); else if(!S.retry) S.miss.push(S.i); render(); return; }
  if(a==="pick"){ if(S.picked!==null) return; S.picked=v; var q=curItems(st)[S.i]; if(v===q.correct) S.res[S.k].score+=(S.retry?0.5:1); else if(!S.retry) S.miss.push(S.i); render(); return; }
  if(a==="ord"){ if(S.seq.length>=st.correct.length||S.revealed) return; S.seq.push(v); if(S.seq.length===st.correct.length){ S.tries++; var ok=S.seq.every(function(x,i){return x===st.correct[i];}); if(ok){ S.orderOk=true; S.res[S.k].score=(S.tries===1)?1:0.5; S.res[S.k].done=true; } } render(); return; }
  if(a==="undo"){ S.seq.pop(); render(); return; }
  if(a==="retry"){ S.seq=[]; render(); return; }
  if(a==="reveal"){ S.revealed=true; S.res[S.k].done=true; render(); return; }
  if(a==="tog"){ if(S.checked) return; S.sel[v]=!S.sel[v]; render(); return; }
  if(a==="chk"){ var tp=0,fp=0; st.options.forEach(function(o){ var on=!!S.sel[o.id], t=st.truth.indexOf(o.id)>=0; if(on&&t) tp++; if(on&&!t) fp++; }); S.res[S.k].score=Math.max(0,(tp-fp))/st.truth.length; S.checked=true; S.res[S.k].done=true; render(); return; }
  if(a==="next"){
    var multiItem=(st.type==="classify"||st.type==="mcq");
    if(multiItem && S.i<lastIdx(st)){ S.i++; S.picked=null; render(); toTop(); return; }
    if(multiItem && !S.retry && S.miss.length){ S.retry=true; S.rq=S.miss.slice(); S.miss=[]; S.i=0; S.picked=null; if(st.type==="mcq"){ S.order=S.rq.map(function(ix){ return shuffled(st.items[ix].options); }); } render(); toTop(); return; }
    S.res[S.k].done=true; S.k++; S.i=0; S.retry=false; S.rq=[]; S.miss=[]; S.order=[]; S.picked=null; S.seq=[]; S.tries=0; S.revealed=false; S.orderOk=false; S.sel={}; S.checked=false; render(); toTop(); return;
  }
  if(a==="again"){ reset(); toTop(); return; }
}
root.addEventListener("click",function(e){ var t=e.target.closest("[data-act]"); if(!t||t.disabled) return; act(t.getAttribute("data-act"),t.getAttribute("data-val")); });
reset();

</script>
