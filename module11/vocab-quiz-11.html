<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 11 Vocabulary: Self-Test</title>
<style>
  :root{
    --bg:#faf9f7; --ink:#1f1e1c; --muted:#6b6862; --line:#e7e4de;
    --panel:#ffffff; --panel-shadow:0 1px 2px rgba(28,27,25,.04),0 6px 20px rgba(28,27,25,.05);
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --do-bg:#f3f1ec; --do-ink:#57544e;
    --correct-bg:#eef5ee; --correct-line:#bcd6bd; --correct-ink:#3c6b3e;
    --wrong-bg:#fbecec; --wrong-line:#e3b9b9; --wrong-ink:#a23b34;
    --amber-bg:#fffbef; --amber-line:#e7c98a; --amber-ink:#8a6d2f;
    --focus:#2f6f4f; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 20px 60px;}

  .masthead{padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .masthead h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em;}
  .masthead .sub{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:70ch;}

  .progress{display:flex;align-items:center;gap:10px;margin:2px 0 16px;}
  .pbar{flex:1 1 auto;height:6px;border-radius:3px;background:var(--line);overflow:hidden;}
  .pbar span{display:block;height:100%;background:var(--accent);width:0;transition:width .25s;}
  .pcount{font-size:12.5px;color:var(--muted);flex:0 0 auto;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--panel-shadow);padding:22px 24px;}
  .qtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px;}
  .qtop .qn{font-size:13px;color:var(--muted);}
  .qtop .term-tag{font-size:12px;color:var(--muted);background:#eceae4;border-radius:7px;padding:4px 10px;}
  .qprompt{font-size:17px;font-weight:600;margin:2px 0 6px;line-height:1.4;}
  .do{background:var(--do-bg);color:var(--do-ink);border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.5;margin:10px 0 16px;}
  .do b{color:var(--ink);}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;font-size:14.5px;
    line-height:1.5;cursor:pointer;transition:border-color .12s,background .12s;color:var(--ink);}
  .opt:hover:not(:disabled){border-color:#cfc9bf;}
  .opt:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:15px;}
  .opt .mark{flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center;margin-left:auto;}
  .opt:disabled{cursor:default;}
  .opt.correct{background:var(--correct-bg);border-color:var(--correct-line);}
  .opt.correct .k{color:var(--correct-ink);}
  .opt.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .opt.wrong .k{color:var(--wrong-ink);}
  .opt.dim{opacity:.6;}

  .verdict{margin:16px 0 0;font-size:14.5px;font-weight:600;}
  .verdict.ok{color:var(--correct-ink);}
  .verdict.no{color:var(--wrong-ink);}
  .explain{margin:8px 0 0;font-size:14px;color:#44413b;line-height:1.6;}
  .explain .src{color:var(--muted);font-size:12.5px;margin-top:6px;}

  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;}
  .hintbtn{background:none;border:none;color:var(--accent-ink);font:inherit;font-size:13.5px;cursor:pointer;text-decoration:underline;padding:0;}
  .hintbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .hintbox{margin-top:12px;background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);
    border-radius:10px;padding:10px 13px;font-size:13.5px;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;
    border-radius:10px;padding:11px 19px;font-size:14.5px;font-weight:600;cursor:pointer;}
  .btn:hover{filter:brightness(1.05);}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  /* results */
  .results h2{margin:0 0 4px;font-size:20px;}
  .results .score{font-size:16px;margin:0 0 4px;}
  .results .score b{color:var(--accent-ink);}
  .results .breakdown{margin:16px 0 0;border-top:1px solid var(--line);padding-top:14px;}
  .results .brow{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 0;border-bottom:1px solid #f0eee9;}
  .results .brow:last-child{border-bottom:none;}
  .results .bi{flex:0 0 auto;margin-top:1px;}
  .results .bt{flex:1 1 auto;}
  .results .bt .bterm{font-weight:600;}
  .results .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .selfnote{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.55;}

  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Research Methods Vocabulary: Self-Test</h1>
    <p class="sub">Ten questions on the core Module 11 terms. Each question applies a term in a short invented scenario, and some ask which statement shows the term misused. Pick an answer to see whether it is right and why.</p>
  </div>

  <div class="progress" aria-hidden="true">
    <div class="pbar"><span id="pbarfill"></span></div>
    <div class="pcount" id="pcount"></div>
  </div>

  <section class="panel" id="qpanel" aria-live="polite"></section>

  <section class="panel results hidden" id="resultsPanel"></section>
</div>

<script>
// Data for this self-test. Items are original, scenario-based, and grounded in the module reading.
var QUIZ = [
 {
  "term": "Counterfactual",
  "prompt": "Otto (an invented client) began therapy after a rough month, and by week eight he feels much better. His sister asks how he would be doing now if he had never gone. Which statement uses the term for that imagined outcome correctly?",
  "options": [
   {
    "id": "a",
    "text": "It is the baseline, Otto’s own scores from before therapy began, and it can be measured directly, so his sister’s question has a clear answer"
   },
   {
    "id": "b",
    "text": "It is the placebo response, the lift in mood that comes from hope and attention, and it can be isolated by asking Otto what he expected from therapy"
   },
   {
    "id": "c",
    "text": "It is the counterfactual, and researchers can observe it in Otto by pausing his therapy for a few weeks and measuring how his scores change in that time"
   },
   {
    "id": "d",
    "text": "It is the counterfactual, the outcome Otto would have had without therapy, and it cannot be observed because he cannot both get therapy and skip it"
   }
  ],
  "correct": "d",
  "explain": "The counterfactual is what would have happened to this person without the treatment. It is imagined and can never be observed for one person, which is why researchers build a comparison group to estimate it. Otto’s baseline is something he was measured on, so it does not answer his sister’s question. A placebo response is one rival explanation for feeling better and is a different thing from the missing outcome. Pausing therapy creates a new situation, because Otto has already changed, so it cannot recover what would have happened.",
  "hint": "Ask whether anyone could ever watch both versions of Otto’s eight weeks.",
  "src": "Module 11, The Fair Test: Why We Need Comparison and Control",
  "bloom": "understand"
 },
 {
  "term": "Allocation concealment",
  "prompt": "Rhea (invented) enrolls participants in a randomized trial of a sleep program. Which situation shows that allocation concealment has been broken?",
  "options": [
   {
    "id": "a",
    "text": "A printed list of upcoming assignments lies on Rhea’s desk, so she knows the next person she enrolls will receive the program"
   },
   {
    "id": "b",
    "text": "Outcome raters learn each participant’s group when they open the scoring files, so they know who received the sleep program and who did not"
   },
   {
    "id": "c",
    "text": "Assignments come from a computer program that releases each one only after a participant’s enrollment has been recorded in the trial database"
   },
   {
    "id": "d",
    "text": "Participants learn at their first session whether they were placed in the program or on the waitlist, because the difference is obvious to them"
   }
  ],
  "correct": "a",
  "explain": "Allocation concealment means the person enrolling participants cannot see or influence the next assignment. A visible list lets Rhea steer a hopeful or less severe person toward the slot she knows is coming, even without meaning to. Participants who know their group and raters who know it are failures of blinding, a separate safeguard that comes after assignment. Releasing each assignment only after enrollment is recorded is how concealment is kept.",
  "hint": "Concealment protects the moment of enrollment, before anyone is placed in a group.",
  "src": "Module 11, After the Coin Flip",
  "bloom": "apply"
 },
 {
  "term": "Confounding",
  "prompt": "Asha (invented) runs a clinic where clients choose between a new group therapy and usual care. The clients who chose the group were more motivated and had more family support, and they improved more. Which term names the main reason this comparison cannot isolate the effect of the therapy?",
  "options": [
   {
    "id": "a",
    "text": "Regression to the mean, since clients who join something new tend to be at a low point from which scores lift on their own"
   },
   {
    "id": "b",
    "text": "Low statistical power, since a single clinic cannot enroll enough clients to detect a real difference between two options"
   },
   {
    "id": "c",
    "text": "Confounding, since motivation and support relate to both choosing the group and improving, so either could explain the gap"
   },
   {
    "id": "d",
    "text": "Publication bias, since clinics with a favorable result are the ones that report it, which skews the record toward the group"
   }
  ],
  "correct": "c",
  "explain": "A confound is a hidden factor tied to both the treatment and the outcome. Here, motivation and support shape who picked the group and also how people improve, so the two groups differed before treatment began. Low power concerns whether a study can detect an effect, and publication bias concerns which studies get reported. Regression to the mean is real, and it would affect both groups, so it cannot explain a gap that follows the clients’ own choice.",
  "hint": "Look for the factor linked to who chose the group and to how they did.",
  "src": "Module 11, Random Assignment",
  "bloom": "apply"
 },
 {
  "term": "Statistical power",
  "prompt": "Fabian (invented) is checking statements about statistical power in small trials. Which statement shows the term misused?",
  "options": [
   {
    "id": "a",
    "text": "A trial with 12 people per group found no difference, so, given its low power, the treatment is shown to have no effect"
   },
   {
    "id": "b",
    "text": "A trial with 400 people per group has a better chance of detecting a modest real effect than a trial with 40 per group"
   },
   {
    "id": "c",
    "text": "A small trial that does reach significance tends to report an effect larger than the true one, because only large estimates clear the bar"
   },
   {
    "id": "d",
    "text": "A low-powered trial can miss a real effect, which makes a null result from that trial weak evidence that nothing is there"
   }
  ],
  "correct": "a",
  "explain": "Low power makes a null result uninformative. A trial too small to detect a real effect cannot show that the effect is absent, and the statement reverses that logic. The other three describe power correctly. It grows with sample size, it makes null results weak, and it inflates the estimates of small studies that do reach significance.",
  "hint": "Ask what a trial that could not have detected a real effect can say about whether one exists.",
  "src": "Module 11, How Many People Is Enough? Sample Size and Power",
  "bloom": "apply"
 },
 {
  "term": "Intention-to-treat",
  "prompt": "In Yael’s (invented) trial, 80 people were assigned to an app program and 80 to usual care. Twenty-five app users stopped using the program early. Yael analyzes all 160 people in the groups they were assigned to, whether or not they kept using the app. Which statement describes her analysis correctly?",
  "options": [
   {
    "id": "a",
    "text": "It is an intention-to-treat analysis, which sets aside people who stopped early so the estimate reflects the program at full strength"
   },
   {
    "id": "b",
    "text": "It is a completers analysis, which keeps everyone assigned to a group and gives the most favorable view of what the app can do"
   },
   {
    "id": "c",
    "text": "It is a completers analysis, which is the more conservative choice because it counts only people who finished and gave later data"
   },
   {
    "id": "d",
    "text": "It is an intention-to-treat analysis, which keeps the early leavers in the app group so that attrition cannot flatter the program"
   }
  ],
  "correct": "d",
  "explain": "An intention-to-treat analysis counts every participant in the group they were randomly assigned to, whether or not they finished. It is generally the more conservative estimate and better reflects the attrition of ordinary practice. A completers analysis counts only people who finished and can inflate an effect, so it is the less conservative choice. Yael’s analysis keeps all 160 people, which is the defining feature of intention-to-treat.",
  "hint": "Ask who stays in the analysis when some people leave the program early.",
  "src": "Module 11, Who Was Counted: Attrition and Intention-to-Treat",
  "bloom": "apply"
 },
 {
  "term": "Confidence interval",
  "prompt": "Anders (invented) reads that a trial reports d = 0.40 with a 95 percent confidence interval from -0.05 to 0.85. Which interpretation fits the interval?",
  "options": [
   {
    "id": "a",
    "text": "The data are compatible with no effect and with a large benefit, so the estimate is imprecise and cannot rule out zero"
   },
   {
    "id": "b",
    "text": "Ninety-five percent of participants improved by an amount between -0.05 and 0.85 standard deviations more than the comparison group"
   },
   {
    "id": "c",
    "text": "The result is statistically significant, since the estimate is positive and most of the interval lies above zero"
   },
   {
    "id": "d",
    "text": "The effect is established as medium, since the estimate of 0.40 sits in the medium range and the interval is a formality"
   }
  ],
  "correct": "a",
  "explain": "A confidence interval shows the range of values plausibly consistent with the data. This one includes zero, so the trial could not rule out no difference, and it also reaches a large effect, so the estimate is imprecise. Most of the interval lying above zero is not enough, because the conventional test asks whether zero is excluded. The interval describes uncertainty about the group-level estimate and does not describe what happened to individual participants.",
  "hint": "Check whether zero lies inside the interval and how far the upper end reaches.",
  "src": "Module 11, Reading a Forest Plot",
  "bloom": "apply"
 },
 {
  "term": "Moderator",
  "prompt": "Cora (invented) is summarizing a trial for a classmate. Which of her statements shows the term moderator misused?",
  "options": [
   {
    "id": "a",
    "text": "Moderators show for whom or under what conditions an effect is stronger, which is why one average effect can hide widely different results"
   },
   {
    "id": "b",
    "text": "Because the therapy works by reducing avoidance, avoidance is the moderator that carries the effect from the therapy to the outcome"
   },
   {
    "id": "c",
    "text": "If the benefit was larger for older participants than for younger ones, then age would be a moderator of the treatment effect"
   },
   {
    "id": "d",
    "text": "Because the therapy helped people with mild symptoms a great deal and people with severe symptoms a little, symptom severity is a moderator"
   }
  ],
  "correct": "b",
  "explain": "A variable that carries the effect from the treatment to the outcome is a mediator, the mechanism in research language. A moderator changes how well the treatment works and tells you for whom or when. Severity and age, as described in the other statements, change the size of the effect, which makes them moderators.",
  "hint": "Ask which statement describes a step in the causal chain, and which describe a change in the size of the effect.",
  "src": "Module 11, What Carries the Change, and For Whom?",
  "bloom": "apply"
 },
 {
  "term": "Pre-registration",
  "prompt": "Fenna (invented) compares a trial’s registered plan with its published paper. The plan named the symptom total at week 12 as the primary outcome. The paper calls the sleep subscale the primary outcome and reports the symptom total as secondary, with no explanation. What does her comparison allow her to conclude?",
  "options": [
   {
    "id": "a",
    "text": "The trial shows publication bias, since a result that reached the journals is evidence that other trials have gone unpublished elsewhere"
   },
   {
    "id": "b",
    "text": "The outcome may have been switched after results were known, which raises concern about selective reporting without proving the result wrong"
   },
   {
    "id": "c",
    "text": "The difference is a formatting matter, since primary and secondary outcomes are interchangeable once a trial has finished and been written up"
   },
   {
    "id": "d",
    "text": "The paper is probably fraudulent, since a switched primary outcome usually means the authors are hiding a failed result from readers"
   }
  ],
  "correct": "b",
  "explain": "The registered plan names the primary outcome before data are collected, so differences between the plan and the report are a sign that outcomes may have been switched or selectively reported. A sign is a reason for scrutiny and does not establish intent or show the finding is false. Primary and secondary outcomes are not interchangeable, because the primary outcome is the one the trial was designed to test. Publication bias concerns which trials get published and does not apply to the choice of outcome within one paper.",
  "hint": "Consider what a comparison between a plan and a report can show and what it cannot.",
  "src": "Module 11, When Science Checks Itself: The Replication Crisis",
  "bloom": "apply"
 },
 {
  "term": "Feasibility",
  "prompt": "Jasper (invented) reads about a 30-person pilot of a mood program that has no comparison group. Which statement shows the term feasibility misused?",
  "options": [
   {
    "id": "a",
    "text": "Counts of how many eligible people enrolled and how many finished the weekly modules are feasibility results from a pilot"
   },
   {
    "id": "b",
    "text": "Because 24 of 30 completed the assessments, above a target set in advance, the program looks practical to test in a larger trial"
   },
   {
    "id": "c",
    "text": "Because 80 percent finished and mood scores fell 6 points, the pilot shows that the program is both feasible and effective"
   },
   {
    "id": "d",
    "text": "Safety events and participants’ ratings of acceptability are reported alongside enrollment as feasibility results from a pilot"
   }
  ],
  "correct": "c",
  "explain": "Feasibility asks whether a program or trial can be carried out as planned, and counts of enrollment, completion, acceptability, and safety answer it. A single-arm pilot cannot answer an efficacy question, because a drop in scores cannot be separated from time, regression to the mean, or the hope that comes with joining a program. The first statement attaches an efficacy verb to a feasibility design.",
  "hint": "Look for the statement that claims more than a pilot with no comparison group can show.",
  "src": "Module 11, What a Pilot Can and Cannot Show",
  "bloom": "apply"
 },
 {
  "term": "Reliable Change Index",
  "prompt": "Alba (invented) uses an invented questionnaire on which the standard error of the difference is 4.0 points. A client’s score fell from 34 to 29. Which statement uses the Reliable Change Index correctly?",
  "options": [
   {
    "id": "a",
    "text": "The drop is 5 points, about 15 percent of the starting score, which is enough to count as reliable change on any questionnaire"
   },
   {
    "id": "b",
    "text": "The index is 5 divided by 4, about 1.25, which is below 1.96, so the drop cannot be separated from measurement noise on this scale"
   },
   {
    "id": "c",
    "text": "The index is 5 divided by 4, about 1.25, which is below 1.96, so the client did not improve at all and treatment should change"
   },
   {
    "id": "d",
    "text": "The index is 5 divided by 4, about 1.25, and any value above 1.0 counts as reliable change, so the client changed reliably"
   }
  ],
  "correct": "b",
  "explain": "The index divides the observed change by the standard error of the difference, and by convention a value beyond 1.96 counts as reliable change. At 1.25 the drop falls inside the noise of this scale. That does not show the client stayed the same, because a real but small improvement may be too small for the instrument to confirm in one person. A percentage ignores the instrument’s noise, and the 1.96 criterion is the convention the module uses.",
  "hint": "Divide the change by the standard error of the difference and compare the result with 1.96.",
  "src": "Module 11, Step 4. The Reliable Change Index",
  "bloom": "apply"
 }
];

var idx = 0;
var answered = [];   // chosen id or null
var hintShown = {};

function el(t,c,h){var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

var CHECK='<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#3c6b3e" stroke-width="1.4"/><path d="M6.4 10.2l2.3 2.3 4.7-4.9" stroke="#3c6b3e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var CROSS='<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#a23b34" stroke-width="1.4"/><path d="M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6" stroke="#a23b34" stroke-width="1.6" stroke-linecap="round"/></svg>';

function init(){ answered = QUIZ.map(function(){return null;}); renderProgress(); renderQuestion(); }

function renderProgress(){
  var pct = (idx) / QUIZ.length * 100;
  document.getElementById("pbarfill").style.width = pct + "%";
  document.getElementById("pcount").textContent = "Question " + Math.min(idx+1,QUIZ.length) + " of " + QUIZ.length;
}

function renderQuestion(){
  renderProgress();
  var q = QUIZ[idx];
  var panel = document.getElementById("qpanel");
  panel.innerHTML = "";
  var chosen = answered[idx];
  var isAnswered = chosen !== null;

  var top = el("div","qtop");
  top.appendChild(el("span","qn","Question " + (idx+1) + " of " + QUIZ.length));
  top.appendChild(el("span","term-tag", esc(q.term)));
  panel.appendChild(top);

  panel.appendChild(el("p","qprompt", esc(q.prompt)));
  panel.appendChild(el("div","do","<b>Do this:</b> Choose the option that reflects the reading's meaning of the term rather than a familiar word. You'll see whether it's right and why before moving on."));

  var opts = el("div","options");
  q.options.forEach(function(o){
    var cls="opt";
    if(isAnswered){
      if(o.id===q.correct) cls+=" correct";
      else if(o.id===chosen) cls+=" wrong";
      else cls+=" dim";
    }
    var b = el("button",cls);
    b.type="button";
    if(isAnswered) b.disabled=true;
    var mark="";
    if(isAnswered && o.id===q.correct) mark=CHECK;
    else if(isAnswered && o.id===chosen) mark=CROSS;
    b.innerHTML='<span class="k">'+o.id.toUpperCase()+'.</span><span class="txt">'+esc(o.text)+'</span><span class="mark">'+mark+'</span>';
    if(!isAnswered) b.addEventListener("click",function(){ choose(o.id); });
    opts.appendChild(b);
  });
  panel.appendChild(opts);

  if(!isAnswered){
    var foot = el("div","foot");
    var hb = el("button","hintbtn", hintShown[idx] ? "Hide hint" : "Show a hint");
    hb.addEventListener("click", function(){ hintShown[idx]=!hintShown[idx]; renderQuestion(); });
    foot.appendChild(hb);
    foot.appendChild(el("span","",""));
    panel.appendChild(foot);
    if(hintShown[idx]) panel.appendChild(el("div","hintbox", esc(q.hint)));
  } else {
    var right = chosen===q.correct;
    panel.appendChild(el("p","verdict "+(right?"ok":"no"), right ? "Correct." : "Not quite."));
    var ex = el("p","explain", esc(q.explain));
    ex.innerHTML += '<div class="src">Reading: ' + esc(q.src) + '</div>';
    panel.appendChild(ex);

    var foot = el("div","foot");
    foot.appendChild(el("span","",""));
    var last = idx===QUIZ.length-1;
    var nb = el("button","btn");
    nb.innerHTML = last ? 'See your results' : 'Next question <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M4 10h11M11 6l4 4-4 4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    nb.addEventListener("click", function(){
      if(last){ finish(); } else { idx++; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
    });
    foot.appendChild(nb);
    panel.appendChild(foot);
  }
}

function choose(id){
  if(answered[idx]!==null) return;
  answered[idx]=id;
  renderQuestion();
}

function finish(){
  document.getElementById("pbarfill").style.width = "100%";
  document.getElementById("pcount").textContent = "Complete";
  document.getElementById("qpanel").classList.add("hidden");
  var correct = answered.filter(function(a,i){return a===QUIZ[i].correct;}).length;

  var rp = document.getElementById("resultsPanel");
  rp.classList.remove("hidden");
  rp.innerHTML="";
  rp.appendChild(el("h2",null,"Your results"));
  rp.appendChild(el("p","score","You answered <b>"+correct+" of "+QUIZ.length+"</b> correctly."));

  var bd = el("div","breakdown");
  QUIZ.forEach(function(q,i){
    var right = answered[i]===q.correct;
    var row = el("div","brow");
    row.innerHTML = '<span class="bi">'+(right?CHECK:CROSS)+'</span>' +
      '<span class="bt"><span class="bterm">'+esc(q.term)+'</span>'+(right?'':' (revisit in the reading: '+esc(q.src)+')')+'</span>';
    bd.appendChild(row);
  });
  rp.appendChild(bd);

  var act = el("div","actions");
  var again = el("button","btn secondary","Retake the self-test");
  again.addEventListener("click", function(){ idx=0; answered=QUIZ.map(function(){return null;}); hintShown={};
    document.getElementById("qpanel").classList.remove("hidden"); rp.classList.add("hidden"); renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); });
  act.appendChild(again);
  rp.appendChild(act);

  rp.appendChild(el("p","selfnote","This self-test scores only these multiple-choice items, and your score is not saved or sent anywhere. Terms you missed are the ones to practice producing from memory."));
  window.scrollTo({top:0,behavior:"smooth"});
}

init();
</script>
</body>
</html>
