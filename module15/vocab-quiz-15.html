<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 15 Vocabulary: Self-Test</title>
<style>
  :root{
    --bg:#faf9f7; --ink:#1f1e1c; --muted:#6b6862; --line:#e7e4de;
    --panel:#ffffff; --panel-shadow:0 1px 2px rgba(28,27,25,.04),0 6px 20px rgba(28,27,25,.05);
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --do-bg:#f3f1ec; --do-ink:#57544e;
    --correct-bg:#eef5ee; --correct-line:#bcd6bd; --correct-ink:#3c6b3e;
    --wrong-bg:#fbecec; --wrong-line:#e3b9b9; --wrong-ink:#a23b34;
    --amber-bg:#fffbef; --amber-line:#e7c98a; --amber-ink:#8a6d2f;
    --focus:#2f6f4f; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 20px 60px;}

  .masthead{padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .masthead h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em;}
  .masthead .sub{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:70ch;}

  .progress{display:flex;align-items:center;gap:10px;margin:2px 0 16px;}
  .pbar{flex:1 1 auto;height:6px;border-radius:3px;background:var(--line);overflow:hidden;}
  .pbar span{display:block;height:100%;background:var(--accent);width:0;transition:width .25s;}
  .pcount{font-size:12.5px;color:var(--muted);flex:0 0 auto;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--panel-shadow);padding:22px 24px;}
  .qtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px;}
  .qtop .qn{font-size:13px;color:var(--muted);}
  .qtop .term-tag{font-size:12px;color:var(--muted);background:#eceae4;border-radius:7px;padding:4px 10px;}
  .qprompt{font-size:17px;font-weight:600;margin:2px 0 6px;line-height:1.4;}
  .do{background:var(--do-bg);color:var(--do-ink);border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.5;margin:10px 0 16px;}
  .do b{color:var(--ink);}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;
    border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;font-size:14.5px;
    line-height:1.5;cursor:pointer;transition:border-color .12s,background .12s;color:var(--ink);}
  .opt:hover:not(:disabled){border-color:#cfc9bf;}
  .opt:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:15px;}
  .opt .mark{flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center;margin-left:auto;}
  .opt:disabled{cursor:default;}
  .opt.correct{background:var(--correct-bg);border-color:var(--correct-line);}
  .opt.correct .k{color:var(--correct-ink);}
  .opt.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .opt.wrong .k{color:var(--wrong-ink);}
  .opt.dim{opacity:.6;}

  .verdict{margin:16px 0 0;font-size:14.5px;font-weight:600;}
  .verdict.ok{color:var(--correct-ink);}
  .verdict.no{color:var(--wrong-ink);}
  .explain{margin:8px 0 0;font-size:14px;color:#44413b;line-height:1.6;}
  .explain .src{color:var(--muted);font-size:12.5px;margin-top:6px;}

  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;}
  .hintbtn{background:none;border:none;color:var(--accent-ink);font:inherit;font-size:13.5px;cursor:pointer;text-decoration:underline;padding:0;}
  .hintbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .hintbox{margin-top:12px;background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink);
    border-radius:10px;padding:10px 13px;font-size:13.5px;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;
    border-radius:10px;padding:11px 19px;font-size:14.5px;font-weight:600;cursor:pointer;}
  .btn:hover{filter:brightness(1.05);}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  /* results */
  .results h2{margin:0 0 4px;font-size:20px;}
  .results .score{font-size:16px;margin:0 0 4px;}
  .results .score b{color:var(--accent-ink);}
  .results .breakdown{margin:16px 0 0;border-top:1px solid var(--line);padding-top:14px;}
  .results .brow{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 0;border-bottom:1px solid #f0eee9;}
  .results .brow:last-child{border-bottom:none;}
  .results .bi{flex:0 0 auto;margin-top:1px;}
  .results .bt{flex:1 1 auto;}
  .results .bt .bterm{font-weight:600;}
  .results .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .selfnote{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.55;}

  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Digital Care and Implementation Vocabulary: Self-Test</h1>
    <p class="sub">Ten questions on the core Module 15 terms. Each question applies a term in a short invented scenario. Pick an answer to see whether it is right and why.</p>
  </div>

  <div class="progress" aria-hidden="true">
    <div class="pbar"><span id="pbarfill"></span></div>
    <div class="pcount" id="pcount"></div>
  </div>

  <section class="panel" id="qpanel" aria-live="polite"></section>

  <section class="panel results hidden" id="resultsPanel"></section>
</div>

<script>
// Data for this self-test. Items are original, scenario-based, and grounded in the module reading.
var QUIZ = [
 {
  "term": "Stepped care",
  "bloom": "apply",
  "prompt": "A clinic starts every adult with mild depression on a guided self-help program. At week 4 it moves anyone whose score is still 10 or more to eight therapy visits, and after the visits it refers anyone still above that line for psychiatric consultation. Which term names this arrangement?",
  "options": [
   {
    "id": "a",
    "text": "Stepped care, in which people begin with a lower-intensity option and move up when a stated rule says they need more"
   },
   {
    "id": "b",
    "text": "Triage, in which one assessment at intake assigns each person a level of care that stays fixed for the whole episode"
   },
   {
    "id": "c",
    "text": "Treatment fidelity, in which a program is delivered with its core elements in place and at the intended dose"
   },
   {
    "id": "d",
    "text": "Blended care, in which live visits and a digital program are combined and the clinician uses what the program records"
   }
  ],
  "correct": "a",
  "explain": "Starting with a lower-intensity option and moving up when a rule says so is the defining feature of stepped care. Blended care combines live visits with a digital program for the same client and has no built-in rule for moving between levels. Triage sorts people once at intake, and this clinic rechecks scores and moves people. Fidelity concerns whether any one step is delivered as designed and says nothing about how people move between steps.",
  "hint": "Look for the rule that moves people between levels.",
  "src": "Module 15, Stepped Care With Measurement"
 },
 {
  "term": "Blended care",
  "bloom": "apply",
  "prompt": "A therapist sees a client by video every other week. Between visits the client completes short exercises in an online program, and the therapist reviews the entries before each visit and builds the session around them. Which term fits this arrangement best?",
  "options": [
   {
    "id": "a",
    "text": "Unguided self-help, in which the client works through an online program alone and no clinician reviews the entries or replies"
   },
   {
    "id": "b",
    "text": "Blended care, in which live sessions and a digital program are combined and the clinician uses what the program records"
   },
   {
    "id": "c",
    "text": "A digital therapeutic, in which software alone delivers the treatment and the clinician does not take part"
   },
   {
    "id": "d",
    "text": "Stepped care, in which the less frequent contact marks a lower step that a rule can later move to a higher one as scores change"
   }
  ],
  "correct": "b",
  "explain": "The therapist and the program each carry part of the work, and the therapist uses what the program records. That combination defines blended care. Unguided self-help has no clinician reviewing the entries. Stepped care needs a rule that moves the client between levels, and nothing in the case describes one. A digital therapeutic is software that delivers the treatment, and a video visit every other week means a person is part of it. Video visits alone would be teletherapy, and the exercises between visits are what make this blended.",
  "hint": "Ask who uses the program's record and when.",
  "src": "Module 15, Blended Care and the Human in the Loop"
 },
 {
  "term": "Digital divide",
  "bloom": "analyze",
  "prompt": "A county announces a free video-visit program and calls it “access for everyone.” One resident has a phone with a small data allowance, no internet at home, and little practice with apps. After two visits that cut out partway, she stops attending. Which concept names the barrier the announcement overlooks?",
  "options": [
   {
    "id": "a",
    "text": "The research-to-practice gap, the lag between a finding and its routine use in clinics, which delayed the program’s start"
   },
   {
    "id": "b",
    "text": "The digital divide, the differences in connection, devices, and skills that decide who can use digital care even when it costs nothing"
   },
   {
    "id": "c",
    "text": "The treatment gap, the fact that many people who need care do not receive it, whatever the reason they go without, including cost and distance"
   },
   {
    "id": "d",
    "text": "Treatment fidelity, the delivery of a program’s core elements as designed, which the visits that cut out did not allow her to receive"
   }
  ],
  "correct": "b",
  "explain": "Her barriers are a limited connection, a limited device allowance, and little practice with apps, and a free program does not remove any of them. That is the digital divide. The treatment gap describes the overall fact that many people who need care go without, and it names the result and leaves the barrier unnamed. Fidelity concerns delivery of a program’s elements, and a dropped connection is a problem with access to the program. The research-to-practice gap concerns how slowly findings reach clinics, and the case says nothing about delay.",
  "hint": "Which concept names the specific barrier, and which names only the overall result?",
  "src": "Module 15, The Digital Divide and Who Gets Reached"
 },
 {
  "term": "Treatment fidelity and adaptation",
  "bloom": "analyze",
  "prompt": "A program has three core elements, a weekly activity plan, a review of the past week, and a skills practice. A rural clinic translates the handouts, swaps in local examples, and shortens sessions from 60 to 45 minutes while keeping all three elements. Which statement describes this best?",
  "options": [
   {
    "id": "a",
    "text": "It is a change of no consequence, because fidelity concerns only whether sessions are held on the scheduled day"
   },
   {
    "id": "b",
    "text": "It is an adaptation that keeps the core elements, so it is consistent with treatment fidelity as the program’s developers define it"
   },
   {
    "id": "c",
    "text": "It is a loss of fidelity, because any change to the written program means it is no longer delivered as designed"
   },
   {
    "id": "d",
    "text": "It is a breach of the ethical principle of Fidelity, because honoring the client relationship requires delivering the manual unchanged"
   }
  ],
  "correct": "b",
  "explain": "Treatment fidelity in this module means delivering the elements the treatment relies on. Translating handouts, changing examples, and shortening sessions change the surface and keep the core elements, so the clinic has adapted the program and kept fidelity. Treating any change as a loss of fidelity would rule out the adaptation that helps a program fit a place. The ethical principle of Fidelity from Module 13 concerns trust and responsibility toward clients, and it does not require an unchanged manual. Fidelity covers more than the schedule, because it asks whether the core elements were delivered.",
  "hint": "Separate what the program relies on from how it is dressed for a place.",
  "src": "Module 15, Fidelity and Adaptation"
 },
 {
  "term": "Implementation science and dissemination",
  "bloom": "understand",
  "prompt": "A health system mails a newsletter and runs a one-hour webinar to tell clinicians about a new program. A year later a research team studies why only a few clinics use it and tests ways to change that. Which pairing of terms fits?",
  "options": [
   {
    "id": "a",
    "text": "Both the mailing and the study are implementation science, because any activity that aims at a program’s use counts as that one field"
   },
   {
    "id": "b",
    "text": "The mailing and webinar are sustainment, keeping the program running, and the team’s work is dissemination because it concerns how the program spread across clinics"
   },
   {
    "id": "c",
    "text": "The mailing and webinar are implementation science, the study of getting programs used, and the team’s work is dissemination because it reports findings to other groups"
   },
   {
    "id": "d",
    "text": "The mailing and webinar are dissemination, spreading information, and the team’s work is implementation science, the study of getting programs used in practice"
   }
  ],
  "correct": "d",
  "explain": "Dissemination spreads information about a program. Implementation science studies what gets a program used in routine care and tests ways to improve that, which is what the research team does. Reversing the pairing treats the study as the act of spreading information and the newsletter as research. Sustainment concerns whether a program continues after startup, and neither activity addresses that. Lumping the two together loses the difference between telling people about a program and studying what makes them use it.",
  "hint": "One activity tells people, and the other studies why they do or do not act on it.",
  "src": "Module 15, Implementation Science and Dissemination"
 },
 {
  "term": "Sustainment",
  "bloom": "apply",
  "prompt": "A three-year grant that launched a digital program in a county clinic has ended. The clinic still offers the program because it has a line in the regular budget, a trained staff member who runs it, and payer coverage for visits. In the EPIS framework, which phase does this describe?",
  "options": [
   {
    "id": "a",
    "text": "Sustainment, the phase in which a program continues after the start-up effort and outside support have ended"
   },
   {
    "id": "b",
    "text": "Exploration, the phase in which an organization weighs needs and options before it chooses a program"
   },
   {
    "id": "c",
    "text": "Implementation, the phase in which the program is put into use and staff are trained to deliver it"
   },
   {
    "id": "d",
    "text": "Adoption and preparation, the phase in which the organization decides to use the program and gets ready to start"
   }
  ],
  "correct": "a",
  "explain": "The program continues after the grant, and budget, staffing, and payer coverage keep it running. That is sustainment, the last EPIS phase. Implementation is the earlier period of putting the program into use and training staff. Adoption and preparation covers the decision to use it and getting ready, and exploration covers weighing needs and options. All three come before the point this clinic has reached.",
  "hint": "Which phase begins after the launch effort and outside support end?",
  "src": "Module 15, Sustainment"
 },
 {
  "term": "Reach",
  "bloom": "analyze",
  "prompt": "A county program enrolled 800 adults, and 90 percent of them improved. About 40,000 adults in the county meet the criteria for the program. A board member says the program is succeeding. Which idea from RE-AIM does the comparison of 800 with 40,000 bring into view?",
  "options": [
   {
    "id": "a",
    "text": "Reach, the share of eligible people who take part and who they are, which these figures put at 2 percent"
   },
   {
    "id": "b",
    "text": "Adoption, whether clinics and staff agree to deliver the program, which these figures do not address"
   },
   {
    "id": "c",
    "text": "Maintenance, whether the program and its results continue over time, which these figures do not address"
   },
   {
    "id": "d",
    "text": "Effectiveness, the amount of benefit participants get, which these figures describe only as 90 percent improving"
   }
  ],
  "correct": "a",
  "explain": "Eight hundred of 40,000 eligible adults is 2 percent, and reach is the share of eligible people who take part, along with who they are. A program can work well for the people it enrolls and still touch few of the people who need it. The 90 percent who improved speaks to benefit among participants, and without a comparison it falls short of effectiveness. Maintenance and adoption concern continuation and delivery by clinics, and the figures say nothing about either.",
  "hint": "Divide the people enrolled by the people eligible.",
  "src": "Module 15, Measuring Reach"
 },
 {
  "term": "Digital therapeutic",
  "bloom": "understand",
  "prompt": "A clinic compares three programs. Program 1 is a mood-tracking app sold with no treatment claims. Program 2 is software that delivers a structured treatment for insomnia, and its maker submitted evidence to a regulator that reviewed the claims made for it. Program 3 is a text service that pairs clients with a human coach. Which is a digital therapeutic?",
  "options": [
   {
    "id": "a",
    "text": "Program 3, because the coach delivers the active treatment and the text service only carries it"
   },
   {
    "id": "b",
    "text": "Programs 1 and 2, because both are software and the regulator’s review covers any software that a clinic chooses to use"
   },
   {
    "id": "c",
    "text": "Program 2, because the software itself delivers the treatment and a regulator reviewed the claims made for it"
   },
   {
    "id": "d",
    "text": "Program 1, because tracking mood is a core part of treatment and any app that supports treatment counts as one"
   }
  ],
  "correct": "c",
  "explain": "A digital therapeutic is software that delivers a treatment and has been through regulatory review of its claims. Program 2 meets both parts. Program 1 makes no treatment claims and has no review behind it, and supporting treatment does not make an app a treatment. In Program 3 the coach is the active ingredient and the software carries messages. The regulator’s review attaches to the product and its claims, and it does not extend to other software a clinic happens to use.",
  "hint": "Check each program for software that delivers treatment and for regulatory review.",
  "src": "Module 15, Digital Therapeutics: Software With Regulatory Review"
 },
 {
  "term": "Guided and unguided programs",
  "bloom": "apply",
  "prompt": "A health plan lists two online programs. Program X gives members weekly 10-minute calls with a trained coach who reviews their progress. Program Y sends automated reminders and nothing else. Which classification is correct?",
  "options": [
   {
    "id": "a",
    "text": "X is unguided because the coach does not deliver therapy, and Y is guided because the reminders prompt members to continue"
   },
   {
    "id": "b",
    "text": "Both are unguided, because guidance means a licensed therapist delivers the program’s content in live sessions"
   },
   {
    "id": "c",
    "text": "X is guided because a person supports the member through the program, and Y is unguided because its contact is automated"
   },
   {
    "id": "d",
    "text": "Both are guided, because each one contacts the member on a regular schedule between sessions of the program"
   }
  ],
  "correct": "c",
  "explain": "Guidance means a person supports the user through the program, for example with scheduled contact that reviews progress. A coach who calls weekly provides that, and automated reminders do not. Regular contact by itself does not make a program guided, because a reminder has no person behind it. The coach need not deliver therapy for the program to count as guided. Guidance describes human support, and requiring live therapy sessions would turn it into a different form of care.",
  "hint": "Is a person involved in the contact, or is a system?",
  "src": "Module 15, Internet-Based CBT and the Role of Guidance"
 },
 {
  "term": "Reliable change",
  "bloom": "analyze",
  "prompt": "On an invented depression scale, the standard error of the difference is 4 points. A client’s score fell from 22 to 16, a drop of 6 points or 27 percent. The clinic’s rule keeps a client in the first step only after reliable improvement. Which conclusion fits?",
  "options": [
   {
    "id": "a",
    "text": "The drop is reliable, because 27 percent is larger than a 20 percent improvement threshold and so is unlikely to be measurement noise"
   },
   {
    "id": "b",
    "text": "The drop cannot be judged yet, because reliable change requires the client to cross a cutoff into the healthy range of the scale first"
   },
   {
    "id": "c",
    "text": "The drop is reliable, because any drop of 5 points or more on a scale of this length is larger than measurement error"
   },
   {
    "id": "d",
    "text": "The drop is within measurement noise, because reliable change here needs about 8 points (1.96 times 4), so the rule is not met"
   }
  ],
  "correct": "d",
  "explain": "A change counts as reliable when it exceeds about 1.96 times the standard error of the difference. Here that is 1.96 times 4, or 7.84, so a drop of 6 falls inside the noise and the rule is not met. A percentage ignores how noisy the instrument is, and a fixed number of points ignores it as well, since the threshold depends on the instrument. Crossing a cutoff is a second criterion for recovery, and the noise question comes first. The drop may still reflect real improvement, and this instrument cannot confirm it for one person.",
  "hint": "Multiply the standard error of the difference by 1.96 and compare.",
  "src": "Module 15, Stepped Care With Measurement"
 }
];

var idx = 0;
var answered = [];   // chosen id or null
var hintShown = {};

function el(t,c,h){var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

var CHECK='<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#3c6b3e" stroke-width="1.4"/><path d="M6.4 10.2l2.3 2.3 4.7-4.9" stroke="#3c6b3e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var CROSS='<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#a23b34" stroke-width="1.4"/><path d="M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6" stroke="#a23b34" stroke-width="1.6" stroke-linecap="round"/></svg>';

function init(){ answered = QUIZ.map(function(){return null;}); renderProgress(); renderQuestion(); }

function renderProgress(){
  var pct = (idx) / QUIZ.length * 100;
  document.getElementById("pbarfill").style.width = pct + "%";
  document.getElementById("pcount").textContent = "Question " + Math.min(idx+1,QUIZ.length) + " of " + QUIZ.length;
}

function renderQuestion(){
  renderProgress();
  var q = QUIZ[idx];
  var panel = document.getElementById("qpanel");
  panel.innerHTML = "";
  var chosen = answered[idx];
  var isAnswered = chosen !== null;

  var top = el("div","qtop");
  top.appendChild(el("span","qn","Question " + (idx+1) + " of " + QUIZ.length));
  top.appendChild(el("span","term-tag", esc(q.term)));
  panel.appendChild(top);

  panel.appendChild(el("p","qprompt", esc(q.prompt)));
  panel.appendChild(el("div","do","<b>Do this:</b> Choose the option that reflects the reading's meaning of the term rather than a familiar word. You'll see whether it's right and why before moving on."));

  var opts = el("div","options");
  q.options.forEach(function(o){
    var cls="opt";
    if(isAnswered){
      if(o.id===q.correct) cls+=" correct";
      else if(o.id===chosen) cls+=" wrong";
      else cls+=" dim";
    }
    var b = el("button",cls);
    b.type="button";
    if(isAnswered) b.disabled=true;
    var mark="";
    if(isAnswered && o.id===q.correct) mark=CHECK;
    else if(isAnswered && o.id===chosen) mark=CROSS;
    b.innerHTML='<span class="k">'+o.id.toUpperCase()+'.</span><span class="txt">'+esc(o.text)+'</span><span class="mark">'+mark+'</span>';
    if(!isAnswered) b.addEventListener("click",function(){ choose(o.id); });
    opts.appendChild(b);
  });
  panel.appendChild(opts);

  if(!isAnswered){
    var foot = el("div","foot");
    var hb = el("button","hintbtn", hintShown[idx] ? "Hide hint" : "Show a hint");
    hb.addEventListener("click", function(){ hintShown[idx]=!hintShown[idx]; renderQuestion(); });
    foot.appendChild(hb);
    foot.appendChild(el("span","",""));
    panel.appendChild(foot);
    if(hintShown[idx]) panel.appendChild(el("div","hintbox", esc(q.hint)));
  } else {
    var right = chosen===q.correct;
    panel.appendChild(el("p","verdict "+(right?"ok":"no"), right ? "Correct." : "Not quite."));
    var ex = el("p","explain", esc(q.explain));
    ex.innerHTML += '<div class="src">Reading: ' + esc(q.src) + '</div>';
    panel.appendChild(ex);

    var foot = el("div","foot");
    foot.appendChild(el("span","",""));
    var last = idx===QUIZ.length-1;
    var nb = el("button","btn");
    nb.innerHTML = last ? 'See your results' : 'Next question <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M4 10h11M11 6l4 4-4 4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    nb.addEventListener("click", function(){
      if(last){ finish(); } else { idx++; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
    });
    foot.appendChild(nb);
    panel.appendChild(foot);
  }
}

function choose(id){
  if(answered[idx]!==null) return;
  answered[idx]=id;
  renderQuestion();
}

function finish(){
  document.getElementById("pbarfill").style.width = "100%";
  document.getElementById("pcount").textContent = "Complete";
  document.getElementById("qpanel").classList.add("hidden");
  var correct = answered.filter(function(a,i){return a===QUIZ[i].correct;}).length;

  var rp = document.getElementById("resultsPanel");
  rp.classList.remove("hidden");
  rp.innerHTML="";
  rp.appendChild(el("h2",null,"Your results"));
  rp.appendChild(el("p","score","You answered <b>"+correct+" of "+QUIZ.length+"</b> correctly."));

  var bd = el("div","breakdown");
  QUIZ.forEach(function(q,i){
    var right = answered[i]===q.correct;
    var row = el("div","brow");
    row.innerHTML = '<span class="bi">'+(right?CHECK:CROSS)+'</span>' +
      '<span class="bt"><span class="bterm">'+esc(q.term)+'</span>'+(right?'':' (revisit in the reading: '+esc(q.src)+')')+'</span>';
    bd.appendChild(row);
  });
  rp.appendChild(bd);

  var act = el("div","actions");
  var again = el("button","btn secondary","Retake the self-test");
  again.addEventListener("click", function(){ idx=0; answered=QUIZ.map(function(){return null;}); hintShown={};
    document.getElementById("qpanel").classList.remove("hidden"); rp.classList.add("hidden"); renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); });
  act.appendChild(again);
  rp.appendChild(act);

  rp.appendChild(el("p","selfnote","This self-test scores only these multiple-choice items, and your score is not saved or sent anywhere. Terms you missed are the ones to practice producing from memory."));
  window.scrollTo({top:0,behavior:"smooth"});
}

init();
</script>
</body>
</html>
