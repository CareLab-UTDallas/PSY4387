<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Tool Appraisal</title>
<style>
  :root{
    --bg:#faf9f7; --ink:#1f1e1c; --muted:#6b6862; --line:#e7e4de;
    --panel:#ffffff; --panel-shadow:0 1px 2px rgba(28,27,25,.04),0 6px 20px rgba(28,27,25,.05);
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --do-bg:#f3f1ec; --do-ink:#57544e;
    --correct-bg:#eef5ee; --correct-line:#bcd6bd; --correct-ink:#3c6b3e;
    --wrong-bg:#fbecec; --wrong-line:#e3b9b9; --wrong-ink:#a23b34;
    --amber-bg:#fffbef; --amber-line:#e7c98a; --amber-ink:#8a6d2f;
    --instr-bg:#eef3fb; --instr-line:#c9d9f0; --instr-ink:#2f4a72;
    --focus:#2f6f4f; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55;}
  .wrap{max-width:780px;margin:0 auto;padding:24px 20px 60px;}
  .masthead{padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .masthead h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.01em;}
  .masthead .sub{margin:6px 0 0;color:var(--muted);font-size:14.5px;max-width:70ch;}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;}
  .stp{font-size:12.5px;color:var(--muted);background:#eceae4;border-radius:999px;padding:4px 11px;}
  .stp.on{background:var(--accent);color:#fff;}
  .stp.done{background:var(--correct-bg);color:var(--correct-ink);}
  .case{background:var(--amber-bg);border:1px solid var(--amber-line);color:#5d4a1f;border-radius:12px;padding:13px 16px;margin-bottom:14px;font-size:14px;line-height:1.6;}
  .case b.t{display:block;margin-bottom:3px;color:var(--amber-ink);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--panel-shadow);padding:22px 24px;}
  .intro{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);border-radius:12px;padding:13px 16px;margin-bottom:16px;font-size:14px;line-height:1.55;}
  .intro b{font-weight:700;}
  .qtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px;}
  .qtop .qn{font-size:13px;color:var(--muted);}
  .qtop .tag{font-size:12px;color:var(--muted);background:#eceae4;border-radius:7px;padding:4px 10px;}
  .qprompt{font-size:17px;font-weight:600;margin:6px 0 6px;line-height:1.45;}
  .quote{font-size:17px;line-height:1.5;margin:8px 0 10px;padding:10px 14px;background:#f7f6f4;border-left:3px solid var(--accent);border-radius:6px;}
  .do{background:var(--do-bg);color:var(--do-ink);border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.5;margin:10px 0 16px;}
  .do b{color:var(--ink);}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;font-size:14.5px;line-height:1.5;cursor:pointer;color:var(--ink);transition:border-color .12s,background .12s;}
  .opt:hover:not(:disabled){border-color:#cfc9bf;}
  .opt:focus-visible,.btn:focus-visible,.cat:focus-visible,.node:focus-visible,.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:15px;}
  .opt:disabled{cursor:default;}
  .opt.correct,.cat.correct{background:var(--correct-bg);border-color:var(--correct-line);}
  .opt.wrong,.cat.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .opt.dim{opacity:.6;}
  .cats{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .cat{flex:1 1 150px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;color:var(--ink);text-align:center;}
  .cat:hover:not(:disabled){border-color:#cfc9bf;}
  .cat:disabled{cursor:default;}
  .cat.dim{opacity:.6;}
  .verdict{margin:16px 0 0;font-size:14.5px;font-weight:600;}
  .verdict.ok{color:var(--correct-ink);} .verdict.no{color:var(--wrong-ink);}
  .explain{margin:8px 0 0;font-size:14px;color:#44413b;line-height:1.6;}
  .explain .src{color:var(--muted);font-size:12.5px;margin-top:6px;}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 19px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;}
  .btn:hover{filter:brightness(1.05);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .seq{list-style:none;margin:8px 0 12px;padding:0;display:flex;flex-direction:column;gap:8px;}
  .seq li{display:flex;gap:10px;align-items:flex-start;background:#f7f6f4;border:1px dashed #d8d3c8;border-radius:10px;padding:10px 13px;font-size:14.5px;min-height:44px;}
  .seq li .n{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:18px;}
  .seq li.filled{background:#fff;border:1px solid var(--line);}
  .seq li.right{background:var(--correct-bg);border-color:var(--correct-line);}
  .seq li.bad{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .pool{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .node{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--ink);}
  .node:hover:not(:disabled){border-color:#cfc9bf;}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0 4px;}
  .chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip.right{background:var(--correct-bg);border-color:var(--correct-line);color:var(--correct-ink);}
  .chip.miss{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber-ink);}
  .chip.extra{background:var(--wrong-bg);border-color:var(--wrong-line);color:var(--wrong-ink);}
  .chip:disabled{cursor:default;}
  .ex ul{margin:6px 0 0 18px;padding:0;font-size:14px;color:#44413b;}
  .results h2{margin:0 0 4px;font-size:20px;}
  .results .score{font-size:16px;margin:0 0 4px;} .results .score b{color:var(--accent-ink);}
  .results .brow{display:flex;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid #f0eee9;}
  .results .brow:last-child{border-bottom:none;}
  .results .brow .bs{flex:0 0 64px;font-weight:700;color:var(--accent-ink);}
  .selfnote{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.55;}
  .take{background:var(--instr-bg);border:1px solid var(--instr-line);color:var(--instr-ink);border-radius:12px;padding:13px 16px;margin-top:14px;font-size:14px;}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Digital Tool Appraisal: Four Invented Tools</h1>
    <p class="sub">Apply five questions to four invented digital tools, judge each claim against its evidence, and choose for three invented users.</p>
  </div>
  <div id="root"></div>
</div>
<script>
var STEPS = [
 {
  "type": "mcq",
  "title": "Wrenmarrow",
  "short": "Wrenmarrow",
  "tag": "Chat companion",
  "case": {
   "title": "Invented app sheet: Wrenmarrow (chat companion for stress and low mood)",
   "text": "<div style=\"margin:3px 0\"><b>Claims.<\/b> “Clinically proven to reduce anxiety.” “Therapist-grade support, any time of day.” “Over 800,000 downloads.”<\/div><div style=\"margin:3px 0\"><b>Study summary.<\/b> A pilot run by the company. 62 people who chose to join used the app for 4 weeks, with no comparison group. Among the 27 who finished all 4 weeks, the average score on the company’s own mood quiz fell from 14 to 10.<\/div><div style=\"margin:3px 0\"><b>Privacy terms.<\/b> Conversations are stored and used to improve the product. Data may be shared with “trusted partners” for marketing and analytics. Deleting an account removes the name and leaves the messages.<\/div><div style=\"margin:3px 0\"><b>Crisis handling.<\/b> If a message contains certain words, the chat shows a hotline link. No person reviews messages. The terms say the app is “not for emergencies.”<\/div><div style=\"margin:3px 0\"><b>Who built it and who pays.<\/b> A startup funded by investors. A free tier, a paid upgrade, and income from data partners.<\/div><div style=\"margin-top:6px;font-size:12.5px\">All four programs, their names, and every number on these sheets are invented for practice. Any resemblance to a real product is unintended.<\/div>"
  },
  "intro": "<b>Step 1 of 5.<\/b> You will apply five questions to four invented tools. The five questions are evidence, privacy and data, safety and crisis handling, usability and engagement, and who built it and who pays. They are a teaching synthesis built from the reading and are not a published instrument. If anything in this activity affects you, you can call or text 988 at any hour, or call 911 in an emergency.",
  "doThis": "Read the sheet, then choose the best answer. Each option explains its reasoning after you answer.",
  "revisit": "Reread “Appraising a Digital Tool” and “Generative AI Chatbots and Wellness Apps.”",
  "items": [
   {
    "prompt": "Tavita is an invented adult with low mood for several months. Some nights she has thoughts that life is not worth living. She is thinking of using Wrenmarrow as her only support. Which question most changes whether Wrenmarrow is a reasonable choice for her?",
    "bloom": "analyze",
    "src": "Module 15, Appraising a Digital Tool",
    "correct": "c",
    "why": "",
    "options": [
     {
      "id": "a",
      "text": "Who built it and who pays, because the app makes money from partners who receive the data",
      "fb": "Income from data partners is a reason for caution about her messages, and it belongs in the appraisal. It does not change what the app can do for her on a night of distress, so it ranks behind the crisis question for this user."
     },
     {
      "id": "b",
      "text": "Evidence, because the company’s pilot had no comparison group and most users did not finish",
      "fb": "The evidence is thin, and 35 of 62 users did not finish the pilot. For Tavita that argues against relying on the app. It says little about a night when she is in distress, and the response of the app on that night is what could turn a poor choice into an unsafe one."
     },
     {
      "id": "c",
      "text": "Safety and crisis handling, because she may be at risk and no person reviews messages",
      "fb": "This matches the sheet. Tavita has some thoughts that life is not worth living, and Wrenmarrow responds only when certain words appear, shows a link, and has no reviewer. For a person who may be at risk, how a tool responds in a crisis decides whether it is safe to rely on. The evidence and privacy answers are also poor, and they limit the tool without deciding whether it is safe as her only support."
     },
     {
      "id": "d",
      "text": "Usability and engagement, because she needs something she will keep using every single day",
      "fb": "Easy chat at any hour is a real strength, and it decides whether she keeps using the app. It does not decide whether the app is safe or suitable as her only support when she has some thoughts of not wanting to live."
     }
    ]
   },
   {
    "prompt": "The Wrenmarrow page says the app is “clinically proven to reduce anxiety.” Which appraisal of that claim does the sheet support best?",
    "bloom": "evaluate",
    "src": "Module 15, Mobile Apps: Wide Reach, Thin Evidence",
    "correct": "a",
    "why": "",
    "options": [
     {
      "id": "a",
      "text": "The pilot has no comparison group, so it cannot support proven, though it shows people will try the app",
      "fb": "The pilot has no comparison group, uses the company’s own quiz, and only 27 of 62 people finished, so the fall from 14 to 10 could reflect many things besides the app. It still gives a modest early look at whether people will try the app. Proven needs a controlled comparison."
     },
     {
      "id": "b",
      "text": "The score fell from 14 to 10, so the app is proven to reduce anxiety even though the pilot was brief",
      "fb": "A fall in a score shows that scores fell. Without a comparison group, nothing separates the effect of the app from time, expectation, or the choice to stop among people who felt worse. The 27 who finished may also differ from the 35 who did not."
     },
     {
      "id": "c",
      "text": "The pilot says nothing, because a study with 62 people cannot show anything about an app",
      "fb": "A small uncontrolled pilot cannot show effectiveness, and it can show whether people will try and finish an app. Setting it aside entirely overcorrects. The better step is to match the claim to what the design can show."
     },
     {
      "id": "d",
      "text": "More than 800,000 downloads show that the claim is true, because people would not keep a tool that failed",
      "fb": "Downloads count installs. They say nothing about outcomes or about how many people kept using the app. Popularity and effectiveness are separate questions."
     }
    ]
   },
   {
    "prompt": "Which privacy term on the Wrenmarrow sheet is most likely to differ from what a user would expect?",
    "bloom": "analyze",
    "src": "Module 15, Appraising a Digital Tool",
    "correct": "d",
    "why": "",
    "options": [
     {
      "id": "a",
      "text": "The terms say the app is “not for emergencies” while the marketing offers support any time",
      "fb": "This sentence is a plain safety disclosure and works in the user’s favor. It belongs to the crisis question and is not a privacy gap. The weakness is that the app’s marketing promises support at any hour."
     },
     {
      "id": "b",
      "text": "Conversations are stored and used to improve the product",
      "fb": "Storage for product improvement is a common term and many users expect it. It matters most when combined with the sharing and deletion terms, and on its own it departs less from expectation than the deletion term does."
     },
     {
      "id": "c",
      "text": "A free tier with a paid upgrade, which sets the price users pay for the app",
      "fb": "A pricing model belongs to the who-pays question, and it does not describe what happens to a user’s data. The privacy gap lies in the terms about sharing and deletion."
     },
     {
      "id": "d",
      "text": "Deleting an account keeps the messages, which may already have gone to partners",
      "fb": "Most users expect deletion to remove what they wrote. Here the messages remain, and the sharing term means they may already be with partners. The gap between the assumed and the actual outcome is the largest on the sheet."
     }
    ]
   }
  ]
 },
 {
  "type": "mcq",
  "title": "Pennywhorl",
  "short": "Pennywhorl",
  "tag": "Guided internet CBT",
  "case": {
   "title": "Invented program sheet: Pennywhorl (guided internet CBT for depression)",
   "text": "<div style=\"margin:3px 0\"><b>Claims.<\/b> “Built on cognitive behavioral therapy, with a coach.” “Shown to reduce depression in a randomized trial.”<\/div><div style=\"margin:3px 0\"><b>Study summary.<\/b> A randomized trial through one university. 140 adults with moderate depressive symptoms were assigned to the program or to a waitlist for 8 weeks. Average checklist score fell 9 points with the program and 3 points on the waitlist. 38 percent of the program group did not finish all modules. Two of the authors developed the program. No follow-up after week 8.<\/div><div style=\"margin:3px 0\"><b>Privacy terms.<\/b> Data are encrypted and shared with the coach and a supervising clinician. The employer that offers the program sees group totals only. Data are deleted within 30 days of a request, and de-identified totals are kept for research.<\/div><div style=\"margin:3px 0\"><b>Crisis handling.<\/b> A weekly check-in asks about thoughts of self-harm. A positive answer shows 988 and 911 on screen and prompts a coach call within one business day. Coaches have a supervising clinician. The terms say the program is not for emergencies.<\/div><div style=\"margin:3px 0\"><b>Who built it and who pays.<\/b> A university team and a company. Employers and insurers pay per member.<\/div><div style=\"margin-top:6px;font-size:12.5px\">All four programs, their names, and every number on these sheets are invented for practice. Any resemblance to a real product is unintended.<\/div>"
  },
  "intro": "<b>Step 2 of 5.<\/b> Pennywhorl has the strongest evidence of the four, and the sheet still holds limits. Match each claim to what the design shows.",
  "doThis": "Read the sheet, then choose the best answer.",
  "revisit": "Reread “Internet-Based CBT and the Role of Guidance” and “Safety, Consent, and Crisis Routing in Digital Programs.”",
  "items": [
   {
    "prompt": "The Pennywhorl page says the program was “shown to reduce depression in a randomized trial.” Which statement best matches the trial summary?",
    "bloom": "evaluate",
    "src": "Module 15, Internet-Based CBT and the Role of Guidance",
    "correct": "d",
    "why": "",
    "options": [
     {
      "id": "a",
      "text": "Developer authorship makes the trial uninformative, so the claim should wait for independent authors",
      "fb": "Developer authorship is a reason to look harder, and it does not make a randomized trial uninformative. The reader can still use the design, the numbers, and the comparison, while holding the conclusions with more caution."
     },
     {
      "id": "b",
      "text": "The randomized design settles whether the program works for working adults, so the claim is fully supported",
      "fb": "Random assignment protects the comparison inside the trial. It does not extend the result to working adults in general, since the sample came through one university, follow-up ended at week 8, and 38 percent did not finish."
     },
     {
      "id": "c",
      "text": "A waitlist comparison shows nothing, because people on a waitlist often improve by themselves",
      "fb": "Some people on a waitlist do improve, and that is why the comparison is informative. The 3-point fall in the waitlist group sets the baseline and the program group’s 9-point fall exceeded it. Waiting is a weak comparison, and the result still counts."
     },
     {
      "id": "d",
      "text": "It supports a benefit over waiting at one site for 8 weeks, and not yet over other treatments",
      "fb": "This keeps each limit attached to the claim. Random assignment supports a benefit over waiting. One site, 8 weeks, no follow-up, and developer authorship limit how far the result travels, and a waitlist comparison does not say how the program compares with other care."
     }
    ]
   },
   {
    "prompt": "Brannigan is an invented adult who works rotating night shifts and has about 20 minutes on a good day. His main barrier is time, so the question is whether he could complete the program. Which fact on the sheet speaks most directly to that?",
    "bloom": "analyze",
    "src": "Module 15, Internet-Based CBT and the Role of Guidance",
    "correct": "d",
    "why": "",
    "options": [
     {
      "id": "a",
      "text": "The comparison group was a waitlist and not another treatment",
      "fb": "The waitlist limits what the trial says about how Pennywhorl compares with other care. Brannigan’s question is different. He needs to know whether someone with little time can finish, and the waitlist says nothing about that."
     },
     {
      "id": "b",
      "text": "Two of the authors developed the program",
      "fb": "Developer authorship is an allegiance concern about how results were reported. It does not tell Brannigan whether a person with 20 minutes can finish the modules."
     },
     {
      "id": "c",
      "text": "The trial took place through one university",
      "fb": "A single site limits how far the result travels, and a campus sample may have more flexible schedules than a night shift worker. The sheet gives no schedule data, and the completion figure addresses his barrier more directly."
     },
     {
      "id": "d",
      "text": "38 percent of the program group did not finish all modules",
      "fb": "Completion is the outcome closest to Brannigan’s barrier. More than a third of people in a trial, a setting that usually supports completion, did not finish. In a busier life the share may be larger, and the benefit seen in the trial came from the people who did the work."
     }
    ]
   },
   {
    "prompt": "Last Saturday night a Pennywhorl user gave a high answer to the weekly check-in item about thoughts of self-harm. Which statement about the crisis handling does the sheet support best?",
    "bloom": "evaluate",
    "src": "Module 15, Safety, Consent, and Crisis Routing in Digital Programs",
    "correct": "a",
    "why": "",
    "options": [
     {
      "id": "a",
      "text": "It suits a weekly screen but leaves a gap for danger that night, which 988 or 911 must cover",
      "fb": "A screen with 988 and 911 on screen, a coach call within one business day, and clinical supervision covers the usual case. A call within one business day cannot reach a person in danger on Saturday night, so the on-screen numbers and the statement that the program is not for emergencies carry that gap."
     },
     {
      "id": "b",
      "text": "It is not relevant, because a weekly check-in item is only a screen and users give complete answers",
      "fb": "Screens miss danger that arises between check-ins, and answers can be incomplete or change quickly. Crisis handling is appraised because a screen does not replace a response."
     },
     {
      "id": "c",
      "text": "It is inadequate in full, because coaches are not licensed therapists and cannot assess risk",
      "fb": "Coaches work under a supervising clinician, and the design routes concerns upward. Criticizing the license of the coach skips over what the design does address, and the timing gap is the real limit."
     },
     {
      "id": "d",
      "text": "It is adequate in full, because a coach follows up and a clinician supervises the coaches",
      "fb": "The structure is a strength. The timing is the limit, since the call comes within one business day. A coach call on the next working day does not answer danger the same night."
     }
    ]
   }
  ]
 },
 {
  "type": "mcq",
  "title": "Tallowbee",
  "short": "Tallowbee",
  "tag": "Mood diary",
  "case": {
   "title": "Invented app sheet: Tallowbee (mood diary with streak badges)",
   "text": "<div style=\"margin:3px 0\"><b>Claims.<\/b> “4.8 stars from 61,000 ratings.” “Millions of people keep their streaks going.” “Science-based mood tracking.”<\/div><div style=\"margin:3px 0\"><b>Study summary.<\/b> None published. The website says “research shows that tracking mood helps people feel better” and names no study.<\/div><div style=\"margin:3px 0\"><b>Privacy terms.<\/b> Free to use. The policy says mood entries, device ID, and approximate location may be shared with advertising networks. A settings page lets users limit location.<\/div><div style=\"margin:3px 0\"><b>Crisis handling.<\/b> No crisis feature. A line in the settings page tells users to contact local emergency services in an emergency.<\/div><div style=\"margin:3px 0\"><b>Usability and engagement.<\/b> Takes about 30 seconds a day. Reminders and streak badges. Reviewers call it easy to use.<\/div><div style=\"margin:3px 0\"><b>Who built it and who pays.<\/b> A small company funded by advertising and by selling summaries of user data.<\/div><div style=\"margin-top:6px;font-size:12.5px\">All four programs, their names, and every number on these sheets are invented for practice. Any resemblance to a real product is unintended.<\/div>"
  },
  "intro": "<b>Step 3 of 5.<\/b> Tallowbee is popular and easy to use. Keep apart what popularity shows and what it leaves unanswered.",
  "doThis": "Read the sheet, then choose the best answer.",
  "revisit": "Reread “Mobile Apps: Wide Reach, Thin Evidence” and “Appraising a Digital Tool.”",
  "items": [
   {
    "prompt": "A friend says, “It has 4.8 stars from 61,000 ratings, so it must work and it must be safe with your data.” Which response is best supported?",
    "bloom": "evaluate",
    "src": "Module 15, Mobile Apps: Wide Reach, Thin Evidence",
    "correct": "c",
    "why": "",
    "options": [
     {
      "id": "a",
      "text": "Star ratings are worthless, so popularity should carry no weight when choosing a tool",
      "fb": "Ratings tell you something real about ease of use and appeal, which matter for whether anyone keeps using a tool. They are weak evidence for effect and for privacy, and the right move is to give them the weight they deserve."
     },
     {
      "id": "b",
      "text": "That many raters shows the privacy policy must be acceptable, because users would have complained",
      "fb": "Most users never read a privacy policy, and a rating reflects the experience of using the app. A published review of 578 apps found privacy scores did not correlate with star ratings. Complaints do not check a policy."
     },
     {

  h+='<ol class="seq">';
  for(var p=0;p<st.correct.length;p++){
    var id=chosen[p], node=id?nodeById(st,id):null, cls="";
    if(node){ cls="filled"; if(full||done){ cls+= (id===st.correct[p])?" right":" bad"; } }
    var shown=node?node.text:"";
    if(S.revealed && !node){ shown=nodeById(st,st.correct[p]).text; }
    h+='<li class="'+cls+'"><span class="n">'+(p+1)+'</span><span>'+(shown?shown:'<span style="color:var(--muted)">…</span>')+'</span></li>';
  }
  h+='</ol>';
  if(!full && !S.revealed){
    h+='<div class="pool">';
    st.nodes.forEach(function(n){ if(chosen.indexOf(n.id)<0) h+='<button class="node" type="button" data-act="ord" data-val="'+n.id+'">'+n.text+'</button>'; });
    h+='</div><div class="foot"><span></span>'+(chosen.length?'<button class="btn secondary" type="button" data-act="undo">Undo last</button>':'')+'</div>';
  } else if(full && !S.orderOk && !S.revealed){
    h+='<p class="verdict no">Not quite. Green rows are in the right place and red rows are not.</p><p class="explain">'+st.hintWrong+'</p>';
    h+='<div class="foot"><button class="btn secondary" type="button" data-act="reveal">Show me the sequence</button><button class="btn" type="button" data-act="retry">Try again</button></div>';
  } else {
    h+='<p class="verdict '+(S.orderOk?"ok":"no")+'">'+(S.orderOk?"Correct.":"The sequence is complete.")+'</p><div class="explain">'+st.why+(st.src?'<div class="src">Reading: '+esc(st.src)+'</div>':'')+'</div>'+nextBtn(advanceLabel(st));
  }
  return h;
}
function nodeById(st,id){ for(var i=0;i<st.nodes.length;i++) if(st.nodes[i].id===id) return st.nodes[i]; return null; }
/* ---- mcq (per-option feedback) ---- */
function rMcq(st){
  var it=curItems(st)[S.i], ans=S.picked!==null;
  var h=retryBanner()+'<div class="qtop"><span class="qn">'+esc(st.title)+', '+(S.retry?'second look ':'question ')+(S.i+1)+' of '+curItems(st).length+'</span><span class="tag">'+esc(st.tag||"")+'</span></div>';
  h+='<p class="qprompt">'+it.prompt+'</p>';
  if(st.doThis) h+='<div class="do"><b>Do this:</b> '+st.doThis+'</div>';
  h+='<div class="options">';
  var list=(S.retry?S.order[S.i]:it.options);
  list.forEach(function(o,oi){
    var cls="opt", tag="";
    if(ans){ if(o.id===it.correct){ cls+=" correct"; tag=' <b>(best answer)</b>'; } else if(o.id===S.picked){ cls+=" wrong"; tag=' <b>(your choice)</b>'; } else cls+=" dim"; }
    h+='<button class="'+cls+'" type="button" data-act="pick" data-val="'+o.id+'"'+(ans?" disabled":"")+'><span class="k">'+String.fromCharCode(65+oi)+'.</span><span>'+o.text+tag+'</span></button>';
  });
  h+='</div>';
  if(ans){
    var ok=S.picked===it.correct, po=null, ko=null;
    it.options.forEach(function(o){ if(o.id===S.picked) po=o; if(o.id===it.correct) ko=o; });
    h+='<p class="verdict '+(ok?"ok":"no")+'">'+(ok?"Best answer.":"Not the best answer.")+'</p><div class="explain"><p><b>Your reasoning.</b> '+po.fb+'</p>';
    if(!ok) h+='<p><b>The best answer.</b> '+ko.fb+'</p>';
    if(it.why) h+='<p>'+it.why+'</p>';
    h+=((it.src||st.src)?'<div class="src">Reading: '+esc(it.src||st.src)+'</div>':'')+'</div>'+nextBtn(advanceLabel(st));
  }
  return h;
}
/* ---- multi ---- */
function rMulti(st){
  var h='<div class="qtop"><span class="qn">'+esc(st.title)+'</span><span class="tag">'+esc(st.tag||"")+'</span></div>';
  h+='<p class="qprompt">'+st.prompt+'</p><div class="do"><b>Do this:</b> '+st.doThis+'</div><div class="chips">';
  st.options.forEach(function(o){
    var on=!!S.sel[o.id], truth=st.truth.indexOf(o.id)>=0, cls="chip";
    if(S.checked){ if(on&&truth) cls+=" right"; else if(!on&&truth) cls+=" miss"; else if(on&&!truth) cls+=" extra"; }
    h+='<button class="'+cls+'" type="button" aria-pressed="'+(on?"true":"false")+'" data-act="tog" data-val="'+o.id+'"'+(S.checked?" disabled":"")+'>'+esc(o.label)+'</button>';
  });
  h+='</div>';
  if(!S.checked){
    var n=Object.keys(S.sel).filter(function(k){return S.sel[k];}).length;
    h+='<div class="foot"><span class="qn" style="font-size:13px;color:var(--muted)">'+n+' selected</span><button class="btn" type="button" data-act="chk"'+(n?"":" disabled")+'>Check my answer</button></div>';
  } else {
    var tp=0,fp=0; st.options.forEach(function(o){ var on=!!S.sel[o.id], t=st.truth.indexOf(o.id)>=0; if(on&&t) tp++; if(on&&!t) fp++; });
    var sc=Math.max(0,(tp-fp))/st.truth.length;
    h+='<p class="verdict '+(sc>=1?"ok":"no")+'">'+(sc>=1?"You found every process, with nothing extra.":"Green marks a correct selection, amber a missed process, and red a process that is not present in this case.")+'</p>';
    h+='<div class="explain ex"><ul>'+st.options.filter(function(o){ var on=!!S.sel[o.id], t=st.truth.indexOf(o.id)>=0; return t||on; }).map(function(o){ var t=st.truth.indexOf(o.id)>=0; return '<li><b>'+esc(o.label)+'.</b> '+(st.reasons[o.id]||(t?"Present.":"Not present in this case."))+'</li>'; }).join("")+'</ul>'+(st.src?'<div class="src">Reading: '+esc(st.src)+'</div>':'')+'</div>'+nextBtn(advanceLabel(st));
  }
  return h;
}
/* ---- summary ---- */
function renderSummary(){
  var tot=0,max=0; S.res.forEach(function(r){ tot+=r.score; max+=r.max; });
  var h=bar()+'<section class="panel results"><h2>'+esc(SUMMARY.title)+'</h2><p class="score">You earned <b>'+(Math.round(tot*10)/10)+' of '+max+'</b> points on the scored items. Items answered correctly on the second look count for half a point.</p><div>';
  STEPS.forEach(function(st,ix){ var r=S.res[ix]; h+='<div class="brow"><span class="bs">'+(Math.round(r.score*10)/10)+' / '+r.max+'</span><span><b>'+esc(st.title)+'.</b> '+(r.score>=r.max?"Full marks.":esc(st.revisit||"Revisit this step."))+'</span></div>'; });
  h+='</div><div class="take">'+SUMMARY.takeaway+'</div><div class="foot"><span></span><button class="btn secondary" type="button" data-act="again">Start over</button></div><p class="selfnote">'+SUMMARY.note+'</p></section>';
  root.innerHTML=h; post();
}
/* ---- actions ---- */
function act(a,v){
  var st=STEPS[S.k];
  if(a==="cls"){ if(S.picked!==null) return; S.picked=v; var it=curItems(st)[S.i]; if(v===it.answer) S.res[S.k].score+=(S.retry?0.5:1); else if(!S.retry) S.miss.push(S.i); render(); return; }
  if(a==="pick"){ if(S.picked!==null) return; S.picked=v; var q=curItems(st)[S.i]; if(v===q.correct) S.res[S.k].score+=(S.retry?0.5:1); else if(!S.retry) S.miss.push(S.i); render(); return; }
  if(a==="ord"){ if(S.seq.length>=st.correct.length||S.revealed) return; S.seq.push(v); if(S.seq.length===st.correct.length){ S.tries++; var ok=S.seq.every(function(x,i){return x===st.correct[i];}); if(ok){ S.orderOk=true; S.res[S.k].score=(S.tries===1)?1:0.5; S.res[S.k].done=true; } } render(); return; }
  if(a==="undo"){ S.seq.pop(); render(); return; }
  if(a==="retry"){ S.seq=[]; render(); return; }
  if(a==="reveal"){ S.revealed=true; S.res[S.k].done=true; render(); return; }
  if(a==="tog"){ if(S.checked) return; S.sel[v]=!S.sel[v]; render(); return; }
  if(a==="chk"){ var tp=0,fp=0; st.options.forEach(function(o){ var on=!!S.sel[o.id], t=st.truth.indexOf(o.id)>=0; if(on&&t) tp++; if(on&&!t) fp++; }); S.res[S.k].score=Math.max(0,(tp-fp))/st.truth.length; S.checked=true; S.res[S.k].done=true; render(); return; }
  if(a==="next"){
    var multiItem=(st.type==="classify"||st.type==="mcq");
    if(multiItem && S.i<lastIdx(st)){ S.i++; S.picked=null; render(); toTop(); return; }
    if(multiItem && !S.retry && S.miss.length){ S.retry=true; S.rq=S.miss.slice(); S.miss=[]; S.i=0; S.picked=null; if(st.type==="mcq"){ S.order=S.rq.map(function(ix){ return shuffled(st.items[ix].options); }); } render(); toTop(); return; }
    S.res[S.k].done=true; S.k++; S.i=0; S.retry=false; S.rq=[]; S.miss=[]; S.order=[]; S.picked=null; S.seq=[]; S.tries=0; S.revealed=false; S.orderOk=false; S.sel={}; S.checked=false; render(); toTop(); return;
  }
  if(a==="again"){ reset(); toTop(); return; }
}
root.addEventListener("click",function(e){ var t=e.target.closest("[data-act]"); if(!t||t.disabled) return; act(t.getAttribute("data-act"),t.getAttribute("data-val")); });
reset();

</script>
</body>
