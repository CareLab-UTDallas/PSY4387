];
var TAKE = "In this module’s model, a program that flags a risk answer needs a human response that explains consent and its limits at the start, confirms where the client is and how to reach him, asks open and direct questions about the answer, chooses a route that fits what is known, tells him what happens with his information, and hands off with a named follow-up and a short safety plan. The tiers in this activity are an example design. Real programs set their own rules, and defensible options can differ, such as a same-day clinician call or a close review by the reviewer and clinician together.";
var NOTE = "This practice conversation is invented and scores only the choices shown. The tiered routing in it is an example design for teaching and is not a validated protocol. Limits of confidentiality differ by place and by program. Many programs and clinicians may contact others when a person appears to be in serious and immediate danger, and some situations carry reporting duties. The details depend on the law where the person lives and on the program’s written terms, so those have to be checked, and nothing here is legal advice. Standards 3.10(a) and 4.02(c) of the APA Ethics Code apply to psychologists. Halvard’s situation is his alone and does not describe any group of people. It is not a way to assess or treat yourself or anyone you know. If you or someone you know is thinking about suicide, call or text 988 at any hour, or call 911 in an emergency.";


function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var root=document.getElementById("root"), S;
var LABEL={2:"Skilled response",1:"Acceptable, with a gap",0:"Missed the skill"};
function fresh(){ S={t:0,branch:"start",pick:null,retried:false,first:null,log:[],done:false}; render(); }
function post(){ try{ parent.postMessage(JSON.stringify({subject:"lti.frameResize",height:document.documentElement.scrollHeight}),"*"); }catch(e){} }
function pills(){ return '<div class="pills" aria-hidden="true">'+TURNS.map(function(t,i){ return '<span class="pill'+(i===S.t&&!S.done?" on":(i<S.log.length?" done":""))+'">'+(i+1)+'. '+esc(SKILLS[t.skill])+'</span>'; }).join("")+'</div>'; }
function clientLine(t){ return t.client[S.branch]||t.client.start||t.client.m; }
function render(){
  if(S.done){ return summary(); }
  var t=TURNS[S.t], h=pills()+'<div class="case"><b class="t">Case: Halvard</b>'+esc(SCENARIO)+'</div><section class="panel" id="panel" tabindex="-1" aria-live="polite">';
  h+='<p class="skill">Turn '+(S.t+1)+' of '+TURNS.length+'. Skill practiced: '+esc(SKILLS[t.skill])+'</p>';
  h+='<p class="quote"><span class="who">Halvard</span>'+esc(clientLine(t))+'</p>';
  h+='<div class="do"><b>Do this:</b> Choose the response you would say next. Each choice changes how Halvard answers.</div><div class="options">';
  t.order.forEach(function(ix,pos){
    var o=t.options[ix], cls="opt";
    if(S.pick!==null){ cls+=" r"+o.r; if(S.pick===ix) cls+=" pick"; else cls+=" dim"; }
    h+='<button type="button" class="'+cls+'" data-ix="'+ix+'"'+(S.pick!==null?" disabled":"")+'><span class="k">'+String.fromCharCode(65+pos)+'.</span><span>'+esc(o.t)+'</span></button>';
  });
  h+='</div>';
  if(S.pick!==null){
    var o=t.options[S.pick], best=t.options.filter(function(x){return x.r===2;})[0], eff=(S.retried?Math.min(o.r,1):o.r);
    h+='<p class="verdict r'+o.r+'">'+LABEL[o.r]+(S.retried?" (second try, scored at most 1 of 2)":"")+'</p>';
    h+='<p class="quote"><span class="who">Halvard</span>'+esc(o.reply)+'</p><p class="explain">'+esc(o.why)+'</p>';
    if(o.r<2) h+='<div class="better"><b>A stronger response:</b> '+esc(best.t)+'</div>';
    h+='<div class="foot">'+((o.r===0&&!S.retried)?'<button class="btn secondary" type="button" data-act="retry">Try this turn again</button>':'<span></span>')+'<button class="btn" type="button" data-act="next">'+(S.t>=TURNS.length-1?"See your results":"Continue the conversation")+'</button></div>';
  }
  h+='</section>'; root.innerHTML=h; post();
  var p=document.getElementById("panel"); if(p&&S.pick!==null){ try{p.focus();}catch(e){} }
}
function commit(){
  var t=TURNS[S.t], o=t.options[S.pick], sc=(S.retried?Math.min(o.r,1):o.r);
  S.log.push({skill:t.skill,r:o.r,score:sc,retried:S.retried,first:S.first});
  S.branch=(o.r===2?"g":(o.r===1?"m":"p"));
}
function summary(){
  var tot=0; S.log.forEach(function(l){tot+=l.score;});
  var worst=S.log.slice().sort(function(a,b){return a.score-b.score;})[0];
  var h=pills()+'<section class="panel" id="panel" tabindex="-1"><h2 style="margin:0 0 4px;font-size:20px;">Your conversation with Halvard</h2><p>You scored <b>'+tot+' of '+(TURNS.length*2)+'</b> across the five skills. A retried turn counts for at most 1 point.</p><div>';
  S.log.forEach(function(l){ h+='<div class="brow"><span class="bs">'+l.score+' / 2</span><span><b>'+esc(SKILLS[l.skill])+'.</b> '+(l.score===2?"Skilled response.":esc(REVISIT[l.skill]))+'</span></div>'; });
  h+='</div>';
  if(tot<TURNS.length*2){ h+='<div class="take"><b>Where to look again:</b> '+esc(REVISIT[worst.skill])+'</div>'; }
  h+='<div class="take"><b>What carries forward:</b> '+esc(TAKE)+'</div><div class="foot"><span></span><button class="btn secondary" type="button" data-act="again">Start over</button></div><p class="note">'+esc(NOTE)+'</p></section>';
  root.innerHTML=h; post();
}
root.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b||b.disabled) return;
  if(b.hasAttribute("data-ix")){ if(S.pick!==null) return; S.pick=parseInt(b.getAttribute("data-ix"),10); if(!S.retried) S.first=S.pick; render(); return; }
  var a=b.getAttribute("data-act");
  if(a==="retry"){ S.retried=true; S.pick=null; render(); return; }
  if(a==="next"){ commit(); S.pick=null; S.retried=false; S.first=null; if(S.t>=TURNS.length-1){ S.done=true; } else { S.t++; } render(); try{window.scrollTo({top:0,behavior:"smooth"});}catch(x){} return; }
  if(a==="again"){ fresh(); return; }
});
fresh();

</script>
</body>
</html>
