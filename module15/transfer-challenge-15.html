<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer Challenge: A County Clinic Chooses a Delivery Plan</title>
<style>
  :root{
    --bg:#faf9f7; --ink:#1f1e1c; --muted:#6b6862; --line:#e7e4de; --line2:#eceae4;
    --panel:#ffffff; --panel-shadow:0 1px 2px rgba(28,27,25,.04),0 6px 20px rgba(28,27,25,.05);
    --accent:#8a5a25; --accent-ink:#6f4a20;
    --level-bg:#fbe7e0; --level-ink:#b0472a;
    --do-bg:#f3f1ec; --do-ink:#57544e;
    --correct-bg:#eef5ee; --correct-line:#bcd6bd; --correct-ink:#3c6b3e;
    --wrong-bg:#fbecec; --wrong-line:#e3b9b9; --wrong-ink:#a23b34;
    --sel-line:#c9d3c2;
    --focus:#2f6f4f; --radius:16px; --r-sm:11px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55;}
  .wrap{max-width:920px;margin:0 auto;padding:24px 20px 60px;}

  .head{display:flex;align-items:flex-start;gap:14px;margin-bottom:8px;}
  .back-ic{flex:0 0 auto;margin-top:4px;opacity:.6;}
  .head h1{margin:0;font-size:24px;letter-spacing:-.01em;font-weight:700;}
  .tabrow{display:flex;flex-wrap:wrap;gap:16px;margin:10px 0 22px;padding-left:38px;font-size:14px;}
  .lvl{background:var(--level-bg);color:var(--level-ink);font-weight:700;border-radius:8px;padding:4px 12px;}
  .tabrow .t{color:var(--muted);padding:4px 0;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--panel-shadow);padding:22px 24px;margin-bottom:20px;}
  .panel h2{margin:0 0 14px;font-size:17px;font-weight:700;}
  .panel p{margin:0 0 14px;font-size:15.5px;line-height:1.6;}
  .panel p:last-child{margin-bottom:0;}
  .scenario p.quote{color:#3a3833;}
  .blk{margin:0 0 18px;}
  .blabel{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;}
  .scenario blockquote{margin:0 0 8px;padding:12px 16px;background:#f3f1ea;border-left:4px solid #b9b4a5;border-radius:6px;font-size:15.5px;line-height:1.6;color:#3a3833;}
  .tw{overflow-x:auto;}
  table.dt{border-collapse:collapse;width:100%;font-size:14.5px;background:#fff;}
  table.dt th,table.dt td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;line-height:1.45;}
  table.dt thead th{background:#eceae4;font-weight:700;}
  table.dt tbody th{font-weight:600;background:#faf9f5;}

  .qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;}
  .qhead h2{margin:0;font-size:17px;font-weight:700;}
  .qtype{flex:0 0 auto;font-size:12.5px;color:var(--muted);background:#eceae4;border-radius:7px;padding:5px 10px;}
  .qprompt{font-size:15.5px;margin:0 0 14px;line-height:1.55;}

  .do{background:var(--do-bg);color:var(--do-ink);border-radius:10px;padding:11px 14px;font-size:13.5px;line-height:1.5;margin-bottom:18px;}
  .do b{color:var(--ink);font-weight:700;}

  .options{display:flex;flex-direction:column;gap:11px;}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    font:inherit;font-size:15px;line-height:1.5;cursor:pointer;transition:border-color .12s,background .12s;color:var(--ink);}
  .opt:hover:not(:disabled){border-color:#cfc9bf;}
  .opt:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);min-width:14px;}
  .opt .txt{flex:1 1 auto;}
  .opt .mark{flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center;}
  .opt:disabled{cursor:default;}
  /* answered states */
  .opt.correct{background:var(--correct-bg);border-color:var(--correct-line);}
  .opt.correct .k{color:var(--correct-ink);}
  .opt.wrong{background:var(--wrong-bg);border-color:var(--wrong-line);}
  .opt.wrong .k{color:var(--wrong-ink);}
  .opt.dim{opacity:.62;}

  .verdict{margin:16px 0 0;font-size:15px;font-weight:600;}
  .verdict.ok{color:var(--correct-ink);}
  .verdict.no{color:var(--wrong-ink);}
  .explain{margin:8px 0 0;font-size:14.5px;color:#44413b;line-height:1.6;}

  .qfoot{display:flex;justify-content:flex-end;margin-top:20px;}
  .btn{display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:#fff;border:none;
    border-radius:10px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;transition:.12s;}
  .btn:hover{filter:brightness(1.05);}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .results h2{display:flex;align-items:center;gap:9px;}
  .results .score{font-size:15.5px;margin:0;}
  .ea-sub{color:var(--muted);font-size:14px;margin:-6px 0 14px;}
  .book{flex:0 0 auto;opacity:.7;}

  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
  @media(max-width:560px){ .wrap{padding:18px 14px 44px;} .tabrow{padding-left:0;} .head h1{font-size:20px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <svg class="back-ic" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12 5l-5 5 5 5" stroke="#1f1e1c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1 id="title"></h1>
  </div>
  <div class="tabrow" id="tabrow"></div>

  <!-- Scenario (persistent) -->
  <section class="panel scenario" id="scenario"></section>

  <!-- Question area -->
  <section class="panel" id="qpanel" aria-live="polite"></section>

  <!-- Results + Expert Analysis (hidden until finished) -->
  <section class="panel results hidden" id="resultsPanel"></section>
  <section class="panel hidden" id="eaPanel"></section>
</div>

<script>
// Challenge data. Scenario, questions, and expert analysis are original and grounded in the module reading.
const CHALLENGE = {
 "title": "A County Clinic Chooses a Delivery Plan",
 "level": "Level 5: Evaluate",
 "tabs": [
  "The County and the Pitch",
  "Measures and a Safety Route",
  "Your Plan"
 ],
 "scenario": {
  "heading": "Clinical Scenario",
  "paras": [
   {
    "label": "Invented case",
    "text": "Everything in this case is invented, including the county, the towns, the vendor, and every number. Calista is the director of the Lowmoor County Clinic. She has a grant to choose a delivery plan for adults with depression and anxiety. The clinic has three clinicians, and a first visit takes about eight weeks to schedule. If anything in this case affects you personally, you can call or text 988 at any hour, and in an emergency you can call 911."
   },
   {
    "label": "The county (invented)",
    "table": {
     "head": [
      "Town",
      "Adults",
      "Households without home internet",
      "Distance to the clinic",
      "Referrals last year"
     ],
     "rows": [
      [
       "Dunmere",
       "31,000",
       "9%",
       "4 miles",
       "420"
      ],
      [
       "Alder Flats",
       "12,000",
       "31%",
       "46 miles",
       "36"
      ]
     ]
    }
   },
   {
    "label": "The vendor’s pitch (invented)",
    "quote": "Orrowby cuts depression scores by 40 percent and ends your waitlist.",
    "text": "The supporting trial recruited 300 volunteers through social media ads. It excluded anyone who reported thoughts of self-harm, paid participants for each survey, and compared the app with a six-week waitlist. Symptoms were measured at week 6 with no later follow-up. Orrowby funded the trial. The app includes a chatbot, and no person reviews the chatbot’s conversations."
   },
   {
    "label": "The pathway under discussion (invented)",
    "text": "Step 1 is a guided self-help app with a 15-minute weekly call from a trained coach. Step 2 is eight sessions with a clinician by video or in person. Step 3 is psychiatric consultation and longer-term care. The clinic would use the PHQ-9 and the GAD-7. On the PHQ-9 in this invented example, the standard error of the difference is 3.4 points, so a change must reach 6.7 points (1.96 times 3.4) to count as reliable. The example step-up rule is a score of 10 or more at week 4. Item 9 of the PHQ-9 asks about thoughts of being better off dead or of hurting oneself. This example uses a stricter rule than the program in the safety conversation activity."
   },
   {
    "label": "Ezekiel’s record (invented)",
    "text": "Ezekiel lives in Alder Flats and is in Step 1. His PHQ-9 total was 14 at week 0, 14 at week 2, and 13 at week 4. His answer to item 9 was 0 at weeks 0 and 2 and 1 (several days) at week 4."
   }
  ]
 },
 "doThis": "Pick the best option. After you answer, read whether you were correct and why before advancing.",
 "questions": [
  {
   "id": "q1",
   "bloom": "analyze",
   "prompt": "Calista reads the county table. Which statement does the table support best?",
   "options": [
    {
     "id": "a",
     "text": "Alder Flats has far less need than Dunmere, because its residents sent far fewer referrals to the clinic last year than Dunmere’s did"
    },
    {
     "id": "b",
     "text": "Referrals per 1,000 adults are about 13.5 in Dunmere and 3.0 in Alder Flats, which fits a reach problem, though need is not measured"
    },
    {
     "id": "c",
     "text": "Video visits alone would close the gap, because the distance to the clinic is the only barrier the table shows for Alder Flats"
    },
    {
     "id": "d",
     "text": "Dunmere should get the new resources first, because it has more than twice as many adults and so more people to help"
    }
   ],
   "correct": "b",
   "explanation": "Referrals divided by adults give about 13.5 per 1,000 in Dunmere (420 of 31,000) and 3.0 per 1,000 in Alder Flats (36 of 12,000). A much lower rate is what a reach problem looks like, and the table says nothing about how much need each town has, so the plan should track who is reached by town. Reading low referrals as low need treats a count of people who reached the clinic as a count of people who needed it. Population size matters, though a rate shows which town is underserved relative to its size. Distance is one barrier, and the 31 percent of households without home internet is another that video visits would not solve."
  },
  {
   "id": "q2",
   "bloom": "evaluate",
   "prompt": "Calista must decide whether the trial’s result will hold for her clinic’s clients. Which limit of the trial bears most directly on that decision?",
   "options": [
    {
     "id": "a",
     "text": "Volunteers answered online ads and excluded anyone reporting self-harm thoughts, so they may differ from the clinic’s clients in ways that matter"
    },
    {
     "id": "b",
     "text": "The comparison was a six-week waitlist, and a waitlist comparison can never show that a program has any effect on depression symptoms in adult volunteers"
    },
    {
     "id": "c",
     "text": "Orrowby funded the trial, and a trial paid for by the company that sells the product cannot be informative about whether it helps, whatever its design"
    },
    {
     "id": "d",
     "text": "There was no follow-up after week 6, and results that are not followed for a year cannot be applied to any clinic’s clients"
    }
   ],
   "correct": "a",
   "explanation": "The question is whether the result travels. The trial enrolled people who answered social media ads, who needed a connection to take part, and it excluded people who reported thoughts of self-harm. Lowmoor’s clients include many with weak connections, and some will report those thoughts, so the trial says little about the people the clinic serves. Company funding is a reason to want independent confirmation and does not make a result uninformative. A waitlist shows whether the app beats waiting, which is a narrower claim than superiority over care. Short follow-up limits claims about lasting benefit, and those are separate from whether the result applies here."
  },
  {
   "id": "q3",
   "bloom": "evaluate",
   "prompt": "Calista has to give the board one sentence about the pitch. Which sentence states what the evidence supports?",
   "options": [
    {
     "id": "a",
     "text": "The pitch shows that the app cuts depression scores by 40 percent, so the remaining questions are about cost and how our staff will use it, since the effect is established."
    },
    {
     "id": "b",
     "text": "The pitch is unreliable because the company paid for the trial, so we should consider only vendors that have no financial interest in the results of their own studies."
    },
    {
     "id": "c",
     "text": "The pitch shows that volunteers using the app for six weeks scored lower than a waiting group, and it does not yet show results for our residents or crisis safety."
    },
    {
     "id": "d",
     "text": "The pitch cannot be used because the study was small, so we should wait for a trial with several thousand participants before deciding."
    }
   ],
   "correct": "c",
   "explanation": "A good sentence says what the evidence shows, for whom, and what it leaves open. The trial compared the app with a waitlist for six weeks among volunteers, and it did not cover people with self-harm thoughts or the clinic’s residents. Dismissing a trial because of its funder replaces appraisal with suspicion, since funding is a reason to seek independent confirmation. Repeating the vendor’s number as settled treats a six-week waitlist comparison as proof of the headline. A sample of 300 is small, and the larger problems are who was included and what was compared."
  },
  {
   "id": "q4",
   "bloom": "evaluate",
   "prompt": "Calista chooses the measures. Which measurement plan fits a stepped pathway best?",
   "options": [
    {
     "id": "a",
     "text": "PHQ-9 and GAD-7 at every contact, a reliable-change threshold from the instrument’s noise, item 9 reviewed by a person each time, and referrals counted by town"
    },
    {
     "id": "b",
     "text": "The PHQ-9 and GAD-7 at every contact, a drop of 5 points counted as improvement in every step, and item 9 reviewed by the clinician at therapy visits only"
    },
    {
     "id": "c",
     "text": "The PHQ-9 at entry and at discharge for every client, with the average change across all clients reported to the board each year as the main result of the program"
    },
    {
     "id": "d",
     "text": "App log-ins and weekly minutes of use in Step 1, the PHQ-9 at the end of each step, and a satisfaction rating and a short comment when a client leaves the pathway"
    }
   ],
   "correct": "a",
   "explanation": "A stepped pathway needs scores at each contact so that a step-up rule has information to work with, a threshold that accounts for measurement noise, a person who sees item 9 at every step, and a count of who is reached. Usage and satisfaction describe engagement and leave symptoms and safety unmeasured. Scores at entry and discharge give no information when a decision is due, and an average hides the people who did not improve. A fixed drop of 5 points ignores the instrument’s noise, which sets the threshold at 6.7 here, and reviewing item 9 only at therapy visits leaves Step 1 clients without a person watching."
  },
  {
   "id": "q5",
   "bloom": "analyze",
   "prompt": "At the week-4 review, what should the pathway do for Ezekiel?",
   "options": [
    {
     "id": "a",
     "text": "Keep him in Step 1 because his 1-point drop shows slow progress, and review the item 9 answer at week 6 alongside his other scores and the coach’s notes"
    },
    {
     "id": "b",
     "text": "Step him up under the rule, and have a clinician contact him the same day about the item 9 answer, asking directly and reviewing his safety plan"
    },
    {
     "id": "c",
     "text": "Send an automated message with 988 and keep him in Step 1 until the week 6 review, because a 1 on item 9 means thoughts on only several days"
    },
    {
     "id": "d",
     "text": "Step him up to therapy and have the therapist raise item 9 at the first session, because the step-up already puts a clinician in contact"
    }
   ],
   "correct": "b",
   "explanation": "Two things happened at week 4. His score of 13 is above the step-up line of 10, and a 1-point change is far inside the 6.7-point noise threshold, so nothing shows he is responding. His item 9 answer rose from 0 to 1, and that calls for a person to ask directly the same day, in addition to the step-up. In a large outpatient study, one-year attempt risk rose from 0.4 percent among people answering item 9 “not at all” to 4 percent among those answering “nearly every day” (Simon et al., 2013), so any positive answer matters even when it is low. An automated message alone, or waiting for week 6, leaves the answer without a person. A small change within noise is a reason to step up and gives no ground for staying. Waiting for the first therapy session leaves an unknown interval before anyone asks. The routing here is an example design, and no validated protocol stands behind it. If you or someone you know is in distress, call or text 988, or call 911 in an emergency."
  },
  {
   "id": "q6",
   "bloom": "evaluate",
   "prompt": "Calista drafts the pathway for the board. Which draft is the strongest plan for Lowmoor County?",
   "options": [
    {
     "id": "a",
     "text": "Step 1 in-person visits at the clinic for everyone, Step 2 added sessions, Step 3 psychiatric consultation. Step up when a clinician judges it necessary. Item 9 is reviewed at each visit. Reach is tracked by waitlist length at the clinic."
    },
    {
     "id": "b",
     "text": "Step 1 the vendor’s app and chatbot for everyone, Step 2 clinician visits at the Dunmere clinic. Step up when a user asks. Crisis words in the chatbot trigger an automatic 988 message. Reach is tracked by total enrollment across the county."
    },
    {
     "id": "c",
     "text": "Step 1 the app alone for Alder Flats and visits for Dunmere, Step 2 video visits. Step up when a town’s average score stays above 10. Any item 9 answer gets an automatic 988 message. Reach is tracked by town and month."
    },
    {
     "id": "d",
     "text": "Step 1 guided app with a weekly coach call, Step 2 clinician visits by video or in person, Step 3 psychiatric consultation. Step up at 10 or more at week 4. Any positive item 9 brings same-day clinician contact. Reach is tracked by town."
    }
   ],
   "correct": "d",
   "explanation": "The strongest plan has each part the pathway needs. It starts with a guided option that puts a person in contact, and it has a rule tied to a score and to reliable change. It sends any positive item 9 answer to a clinician the same day, and it counts reach by town so the gap in Alder Flats stays visible. The vendor-centered plan builds on a trial that excluded people with self-harm thoughts and relies on an automatic message for crisis, with no person reviewing. The all-in-person plan keeps the long wait and the 46-mile trip and has no stated step-up rule, and its reach measure shows only length of waitlist. The town-by-town plan gives Alder Flats an unguided option without a person, steps up on an average that hides individuals, and meets every item 9 answer with a message alone."
  }
 ],
 "expertAnalysis": {
  "heading": "Expert Analysis",
  "subhead": "Model answer and clinical reasoning walkthrough",
  "paras": [
   "The first decision is how to read the county table. A referral rate of about 13.5 per 1,000 adults in Dunmere and 3.0 in Alder Flats fits a reach problem, and the table cannot say how much need each town has. Calista therefore plans to count who is reached by town, to look for the reasons behind the gap, and to treat the 31 percent of Alder Flats households without home internet as a design condition. A video-only plan would leave out the people the data say are least reached.",
   "The second decision is how to weigh the pitch. The trial compared the app with a six-week waitlist among volunteers who answered social media ads, excluded anyone who reported thoughts of self-harm, and was funded by the vendor. It supports a narrow statement about volunteers over six weeks. It leaves open whether the result holds for Lowmoor’s clients and whether a chatbot with no human review can handle messages at intermediate levels of risk, an area where a published evaluation of chatbots found inconsistent responses. Calista tells the board what the evidence supports and asks for an independent evaluation or a local pilot before relying on the headline number.",
   "The third decision is a pathway with measures, rules, and a route for safety. Scores at every contact give the step-up rule something to work with, and a reliable-change threshold keeps the clinic from treating noise as progress, as with Ezekiel’s 1-point change. His item 9 answer rose from 0 to 1, so a clinician contacts him the same day, asks directly, confirms where he is, and reviews his safety plan, in addition to stepping him up. The routing in this case is an example design and not a validated protocol. Reach counted by town shows whether the pathway closes the gap or widens it. Write your own version before you compare it with the plan in question 6. Name the steps, a measure for each, the step-up rule, the safety route, and how you would track reach. If you or someone you know is in distress, call or text 988, or call 911 in an emergency."
  ]
 }
};

var idx = 0;            // current question index
var answered = [];      // answered[i] = chosen option id or null
var correctCount = 0;

function el(t,c,h){var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

var CHECK = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#3c6b3e" stroke-width="1.4"/><path d="M6.4 10.2l2.3 2.3 4.7-4.9" stroke="#3c6b3e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var CROSS = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8.2" stroke="#a23b34" stroke-width="1.4"/><path d="M7.2 7.2l5.6 5.6M12.8 7.2l-5.6 5.6" stroke="#a23b34" stroke-width="1.6" stroke-linecap="round"/></svg>';
var BOOK = '<svg class="book" width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 4.5h5.5c.8 0 1.5.7 1.5 1.5v9c0-.8-.7-1.5-1.5-1.5H3v-9Z" stroke="#6f6c66" stroke-width="1.3"/><path d="M17 4.5h-5.5c-.8 0-1.5.7-1.5 1.5v9c0-.8.7-1.5 1.5-1.5H17v-9Z" stroke="#6f6c66" stroke-width="1.3"/></svg>';

function renderStatic(){
  document.getElementById("title").textContent = CHALLENGE.title;
  var tr = document.getElementById("tabrow");
  tr.appendChild(el("span","lvl", esc(CHALLENGE.level)));
  CHALLENGE.tabs.forEach(function(t){ tr.appendChild(el("span","t", esc(t))); });

  var sc = document.getElementById("scenario");
  sc.appendChild(el("h2",null, esc(CHALLENGE.scenario.heading)));
  CHALLENGE.scenario.paras.forEach(function(p){
    if (typeof p === "string") { sc.appendChild(el("p", null, esc(p))); return; }
    var box = el("div","blk");
    box.appendChild(el("div","blabel", esc(p.label)));
    if (p.quote) box.appendChild(el("blockquote",null, esc(p.quote)));
    if (p.text) box.appendChild(el("p",null, esc(p.text)));
    if (p.table) {
      var tb = el("table","dt"), th = el("thead"), hr = el("tr");
      p.table.head.forEach(function(h){ hr.appendChild(el("th",null, esc(h))); });
      th.appendChild(hr); tb.appendChild(th);
      var bd = el("tbody");
      p.table.rows.forEach(function(r){ var tr2 = el("tr"); r.forEach(function(c,ci){ tr2.appendChild(el(ci===0?"th":"td",null, esc(c))); }); bd.appendChild(tr2); });
      tb.appendChild(bd);
      var wrap = el("div","tw"); wrap.appendChild(tb); box.appendChild(wrap);
    }
    sc.appendChild(box);
  });
  answered = CHALLENGE.questions.map(function(){ return null; });
}

function renderQuestion(){
  var q = CHALLENGE.questions[idx];
  var panel = document.getElementById("qpanel");
  panel.innerHTML = "";
  var chosen = answered[idx];
  var isAnswered = chosen !== null;

  var head = el("div","qhead");
  head.appendChild(el("h2",null,"Question " + (idx+1) + " of " + CHALLENGE.questions.length));
  head.appendChild(el("span","qtype","Multiple Choice"));
  panel.appendChild(head);

  panel.appendChild(el("p","qprompt", esc(q.prompt)));
  panel.appendChild(el("div","do","<b>Do this:</b> " + esc(CHALLENGE.doThis)));

  var opts = el("div","options");
  q.options.forEach(function(o){
    var cls = "opt";
    if(isAnswered){
      if(o.id === q.correct) cls += " correct";
      else if(o.id === chosen) cls += " wrong";
      else cls += " dim";
    }
    var btn = el("button", cls);
    btn.type = "button";
    if(isAnswered) btn.disabled = true;
    var mark = "";
    if(isAnswered && o.id === q.correct) mark = CHECK;
    else if(isAnswered && o.id === chosen) mark = CROSS;
    btn.innerHTML = '<span class="k">'+o.id.toUpperCase()+'.</span>' +
                    '<span class="txt">'+esc(o.text)+'</span>' +
                    '<span class="mark">'+mark+'</span>';
    if(!isAnswered){
      btn.addEventListener("click", function(){ choose(o.id); });
    }
    opts.appendChild(btn);
  });
  panel.appendChild(opts);

  if(isAnswered){
    var right = chosen === q.correct;
    if(right){
      panel.appendChild(el("p","verdict ok","Correct!"));
    } else {
      var correctText = "";
      q.options.forEach(function(o){ if(o.id===q.correct) correctText = o.text; });
      panel.appendChild(el("p","verdict no","Incorrect. The correct answer is: " + esc(correctText)));
    }
    panel.appendChild(el("p","explain", esc(q.explanation)));

    var foot = el("div","qfoot");
    var last = idx === CHALLENGE.questions.length - 1;
    var b = el("button","btn");
    if(last){
      b.innerHTML = 'View Expert Analysis ' + BOOK.replace('class="book" ','');
      b.addEventListener("click", finish);
    } else {
      b.innerHTML = 'Next Question <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M4 10h11M11 6l4 4-4 4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      b.addEventListener("click", function(){ idx++; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); });
    }
    foot.appendChild(b);
    panel.appendChild(foot);
  }
}

function choose(optId){
  if(answered[idx] !== null) return;
  answered[idx] = optId;
  if(optId === CHALLENGE.questions[idx].correct) correctCount++;
  renderQuestion();
}

function finish(){
  document.getElementById("qpanel").classList.add("hidden");

  var rp = document.getElementById("resultsPanel");
  rp.classList.remove("hidden");
  rp.innerHTML = "";
  rp.appendChild(el("h2",null, BOOK + "<span>Your Results</span>"));
  rp.appendChild(el("p","score","Multiple Choice: " + correctCount + " / " + CHALLENGE.questions.length + " correct"));

  var ea = document.getElementById("eaPanel");
  ea.classList.remove("hidden");
  ea.innerHTML = "";
  ea.appendChild(el("h2",null, BOOK + "<span>" + esc(CHALLENGE.expertAnalysis.heading) + "</span>"));
  ea.appendChild(el("p","ea-sub", esc(CHALLENGE.expertAnalysis.subhead)));
  CHALLENGE.expertAnalysis.paras.forEach(function(p){ ea.appendChild(el("p",null, esc(p))); });

  window.scrollTo({top:0,behavior:"smooth"});
}

renderStatic();
renderQuestion();
</script>
</body>
</html>
