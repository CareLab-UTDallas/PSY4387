<script>
// ===========================================================================
// MI Practice Coach (Module 5) — reflective-listening practice
// Assigned scenario (from inspo directions): "Practice reflective listening with
// an AI-simulated friend considering changing majors — learning communication
// skills, not clinical technique."
//
// STATIC write-then-compare build (no backend): the student reads what the friend
// says, writes a response, then reveals a model response + the MITI/MI skill it
// illustrates and a short "why." Three modes (Free Practice, OARS Focus, Change
// Talk Evocation) each present a different set of friend turns tuned to that skill.
//
// The clinical patients from the platform roster are shown but LOCKED ("Not part
// of this week's activity"), so the interface looks complete and the state reads
// as intentional rather than broken.
//
// MITI explainer + sample transcript reproduced from instructor screenshots.
// All practice content grounded in the Module 5 reading (reflective listening,
// OARS, MI spirit, change vs. sustain talk, the righting reflex).
// ===========================================================================

  active: {
    id: "jordan-major",
    name: "Jordan, 20",

    { name: "Erica, 35", tag: "Weight Management" },
    { name: "Derek, 29", tag: "Alcohol Use" },
    { name: "Latisha, 58", tag: "Diabetes Management" },
    { name: "Miguel, 42", tag: "Exercise Adherence" },
    { name: "Samantha, 34", tag: "Opioid Use" },
    { name: "Tyler, 17", tag: "Adolescent Vaping" },
    { name: "Mrs. Wu, 72", tag: "Medication Adherence" },
    { name: "Brandon, 38", tag: "Substance Use Recovery" }
  ],
  lockedNote: "Not part of this week's activity"

// ---- MITI framework explainer (verbatim from screenshots) ----
const MITI = {
  intro: "The Motivational Interviewing Treatment Integrity (MITI) coding system measures how well a clinician delivers MI. Your practice sessions are evaluated on five dimensions informed by this validated framework.",
  categories: [
    { name: "MI Spirit", tag: "The foundational stance",
      body: "Collaboration, evocation, and autonomy support. Rather than directing, the clinician partners with the client, draws out their own motivations, and honors their right to choose.",
      example: "\"What matters most to you about your health?\" (evocation)" },
    { name: "Open Questions", tag: "Invitations to elaborate",
      body: "Questions that cannot be answered with \"yes\" or \"no.\" They invite the client to explore and express their thoughts, feelings, and experiences in their own words.",
      example: "\"What would your life look like if you made this change?\" vs. \"Do you want to quit?\"" },
    { name: "Reflections", tag: "Mirroring meaning",
      body: "Statements that demonstrate understanding by rephrasing or deepening what the client said. Simple reflections restate content; complex reflections add meaning, feeling, or connection the client hasn't explicitly stated.",
      example: "Client: \"I know I should exercise, but I just can't find the time.\" Clinician: \"Part of you wants to prioritize your health, and another part is overwhelmed by everything else demanding your attention.\" (complex reflection)" },
    { name: "Change Talk Evocation", tag: "Eliciting the client's own arguments for change",
      body: "Recognizing and strategically reinforcing client statements that favor change (DARN-CAT: Desire, Ability, Reasons, Need, Commitment, Activation, Taking steps). The clinician listens for and amplifies these signals.",
      example: "Client: \"I guess I'm tired of feeling this way.\" Clinician: \"You've reached a point where something needs to be different.\" (reinforcing Desire)" },
    { name: "Overall MI Fidelity", tag: "Putting it all together",
      body: "Global adherence to MI principles across the session: maintaining a collaborative stance, using a favorable ratio of open-to-closed questions, offering more reflections than questions, and consistently evoking rather than imposing.",
      example: "A high-fidelity session features mostly open questions, more reflections than questions, affirmations that highlight client strengths, and summaries that tie key themes together — all within sustained MI Spirit." }
  ],
  oarsNote: "OARS stands for Open questions, Affirmations, Reflections, and Summaries — the four core MI microskills. Open Questions and Reflections each have dedicated scoring dimensions above. Affirmations and Summaries are evaluated as part of Overall MI Fidelity."
};

// ---- Sample annotated transcript (verbatim from screenshots) ----
const SAMPLE = {
  intro: "A brief exchange with Derek (29, alcohol use concerns). Annotations highlight the MITI behaviors in action. This is orientation only — you are not expected to replicate these skills yet.",
  turns: [
    { who: "clinician", text: "Thanks for coming in today, Derek. I'd like to understand what's been going on from your perspective. What brought you here?", tags: ["Open Question", "MI Spirit — autonomy, collaboration"] },
    { who: "client", text: "My wife made me come. She says I drink too much, but honestly, I think she's overreacting. I work hard, I come home, I have a few beers. What's the big deal?", tags: ["Sustain talk — minimizing"] },
    { who: "clinician", text: "So from your point of view, the drinking is just a normal part of winding down, and it feels like your wife is making it into something bigger than it is.", tags: ["Complex Reflection — captures the client's frame without challenging it"] },
    { who: "client", text: "Exactly. I mean, I'm not like those guys who can't function. I go to work every day. I take care of my kids.", tags: ["Sustain talk — defending current behavior"] },
    { who: "clinician", text: "Being a responsible father and provider matters a lot to you.", tags: ["Complex Reflection — affirming a core value that could connect to change motivation"] },
    { who: "client", text: "Yeah, it does. I don't want my kids to... I mean, my dad drank a lot, and it wasn't great for us growing up.", tags: ["Change Talk (Reason) — connecting to personal values and family history"] },
    { who: "clinician", text: "You don't want your kids to go through what you went through. What would it mean for them if things were different with the drinking?", tags: ["Complex Reflection + Open Question — evoking deeper Change Talk"] },
    { who: "client", text: "I guess... I'd be more present. Like, sometimes by the third or fourth beer I'm just checked out. My daughter asks me to read to her and I'm too tired.", tags: ["Change Talk (Desire, Reasons) — acknowledging impact on family"] },
    { who: "clinician", text: "On one hand, the beer helps you unwind from a tough day. On the other hand, it's taking something away from those moments with your daughter that really matter to you.", tags: ["Double-sided Reflection — honoring ambivalence while highlighting the discrepancy"] }
  ],
  notice: [
    "The clinician never argues or corrects — they reflect and explore (MI Spirit)",
    "Open questions invite Derek to share his perspective, not defend it",
    "Reflections go beyond parroting — they surface values and feelings Derek hasn't fully articulated",
    "Change Talk emerges naturally when the client feels understood, not pressured",
    "The double-sided reflection honors ambivalence while highlighting the discrepancy between values and behavior"
  ]
};

// ---- Practice: three modes, each a set of friend turns for the majors scenario ----
// Each item: what the friend says, plus a MODEL response and the skill + why.
const PRACTICE = {
  scenarioIntro: "Jordan is a close friend, halfway through a pre-med track, who has started wondering aloud about switching majors. Your job is not to advise or fix — it's to listen and reflect, so Jordan can hear their own thinking more clearly. Read what Jordan says, write how you'd respond, then compare with a model response.",
  modes: {
    free: {
      label: "Free Practice",
      blurb: "Open reflective listening. Read what Jordan says and respond however feels natural — then compare with a reflection that captures the meaning underneath.",
      items: [
        { friend: "I don't know, I've been on this pre-med thing since freshman year and lately I just... dread my orgo lectures. But everyone's told me I'd make a great doctor.",
          model: "So there's a real pull in two directions — the day-to-day of the pre-med track is draining you, and at the same time there's this weight of everyone's expectations that you'd be good at it.",
          skill: "Complex reflection (double-sided)",
          why: "It captures both sides of the ambivalence — the dread and the expectations — without taking a side or jumping to advice. Jordan hears their own conflict laid out clearly." },
        { friend: "It's not that I hate medicine. I just don't feel like myself in it. Does that even make sense?",
          model: "It sounds like this isn't really about whether medicine is good or bad — it's that it doesn't fit who you feel you are.",
          skill: "Complex reflection (meaning)",
          why: "It reflects the meaning underneath ('don't feel like myself') rather than parroting the words, and reassures Jordan they've been understood — which invites them to keep exploring." },
        { friend: "My parents gave up a lot to put me through school. I feel like switching would be throwing that away.",
          model: "You carry a real sense of what your parents sacrificed, and part of what makes this hard is not wanting that to be for nothing.",
          skill: "Complex reflection (value + feeling)",
          why: "It names the value (honoring the sacrifice) and the feeling (guilt) without arguing Jordan out of it. Reflecting it back lets Jordan examine it rather than defend it." }
      ]
    },
    oars: {
      label: "OARS Focus",
      blurb: "Practice the four microskills: Open questions, Affirmations, Reflections, Summaries. Each Jordan turn is a chance to use a specific OARS skill; the model shows which one and how.",
      items: [
        { friend: "I've been thinking about switching to something like public health, but I keep going back and forth.",
          model: "What draws you toward public health when you picture it?",
          skill: "Open question",
          why: "An open question (not answerable yes/no) invites Jordan to explore and articulate the appeal in their own words, which surfaces more than a closed question would." },
        { friend: "I actually spent all weekend reading about it instead of studying for my MCAT.",
          model: "That says something — you found the energy to dig into public health on your own, without anyone assigning it.",
          skill: "Affirmation",
          why: "An affirmation genuinely acknowledges Jordan's effort and self-directed curiosity, treating them as capable and resourceful, which is a condition under which people explore change more openly." },
        { friend: "I guess I'm scared that if I switch and it's also hard, I'll realize the problem was me all along.",
          model: "So underneath the major question is a scarier one — whether changing would prove something about you rather than about the fit.",
          skill: "Reflection",
          why: "A complex reflection names the deeper fear Jordan only half-stated, showing real understanding and holding it up so Jordan can look at it." },
        { friend: "Yeah. It's the expectations, and not wanting to waste my parents' money, and dreading the classes, and this feeling that it's just not me.",
          model: "Let me make sure I've got the whole picture: there's the weight of expectations, the worry about your parents' investment, the daily dread of the classes, and this core sense that medicine isn't quite you — and somewhere in there, a real curiosity about public health.",
          skill: "Summary",
          why: "A summary pulls the threads together, shows Jordan you've tracked everything, and helps you both see the shape of the decision — often prompting the next honest step." }
      ]
    },
    changetalk: {
      label: "Change Talk Evocation",
      blurb: "Listen for the flickers of change talk (Desire, Ability, Reasons, Need) in what Jordan says, and reflect them back so Jordan hears their own motivation grow louder — rather than arguing for a side.",
      items: [
        { friend: "Honestly? When I imagine switching, I feel relieved. Lighter. That probably tells me something.",
          model: "You noticed that just picturing the change lifts a weight off you — and you're taking that feeling as real information.",
          skill: "Reflecting change talk (Desire)",
          why: "It amplifies the change talk ('relieved, lighter') Jordan voiced, so they hear their own desire reflected back, rather than the helper supplying reasons." },
        { friend: "I think I could actually be good at the public health stuff. The one class I took, I got it in a way I never got chemistry.",

          skill: "Reflecting change talk (Ability)",
          why: "It strengthens the ability statement using Jordan's own evidence, letting their confidence build from something they said, not from reassurance." },

      ]

var LOCK='<svg width="12" height="12" viewBox="0 0 20 20" fill="none"><rect x="4.5" y="9" width="11" height="7.5" rx="1.5" stroke="#8a857c" stroke-width="1.4"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9" stroke="#8a857c" stroke-width="1.4"/></svg>';
var CLIN_AV='<svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M6 3v4a3 3 0 0 0 6 0V3" stroke="#8a5a25" stroke-width="1.4" stroke-linecap="round"/><path d="M9 10v2a4 4 0 0 0 8 0v-1" stroke="#8a5a25" stroke-width="1.4"/><circle cx="17" cy="9.5" r="1.6" stroke="#8a5a25" stroke-width="1.4"/></svg>';
var USER_AV='<svg width="16" height="16" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="#6f6c66" stroke-width="1.4"/><path d="M4 16c0-3 2.7-5 6-5s6 2 6 5" stroke="#6f6c66" stroke-width="1.4" stroke-linecap="round"/></svg>';

function renderModes(){
  var box=document.getElementById("modes"); box.innerHTML="";
  [["free",PRACTICE.modes.free.label],["oars",PRACTICE.modes.oars.label],["changetalk",PRACTICE.modes.changetalk.label]].forEach(function(m){
    var b=el("button","mode-btn",esc(m[1])); b.setAttribute("aria-pressed",String(mode===m[0]));
    b.addEventListener("click",function(){ mode=m[0]; pIdx=0; renderModes(); renderMain(); });
    box.appendChild(b);
  });
}

function renderRoster(){
  var box=document.getElementById("roster"); box.innerHTML="";
  var a=ROSTER.active;
  var ac=el("div","pcard active"); ac.tabIndex=0; ac.setAttribute("role","button");
  ac.innerHTML='<div class="pn">'+esc(a.name)+'</div><span class="pt">'+esc(a.tag)+'</span><p class="pb">'+esc(a.blurb)+'</p>';
  function pick(){ selected=a.id; pIdx=0; renderMain(); }
  ac.addEventListener("click",pick);
  ac.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();} });
  box.appendChild(ac);
  ROSTER.locked.forEach(function(p){
    var c=el("div","pcard locked");
    c.setAttribute("aria-disabled","true"); c.title=ROSTER.lockedNote;
    c.innerHTML='<div class="pn">'+esc(p.name)+'</div><span class="pt">'+esc(p.tag)+'</span><div class="lockrow">'+LOCK+'<span>'+esc(ROSTER.lockedNote)+'</span></div>';
    box.appendChild(c);
  });
}

function accordion(name, tag, body, ex){
  var acc=el("div","acc"); acc.setAttribute("data-open","false");
  var btn=el("button","acc-btn");
  btn.setAttribute("aria-expanded","false");
  btn.innerHTML='<span class="lbl">'+esc(name)+'<span class="tg">'+esc(tag)+'</span></span><svg class="chev" width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="#1f1e1c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var panel=el("div","acc-panel");
  var inner=el("div","inner",esc(body));
  if(ex){ inner.appendChild(el("div","ex","<b>Example</b><br>"+esc(ex))); }
  panel.appendChild(inner);
  btn.addEventListener("click",function(){
    var open=acc.getAttribute("data-open")==="true";
    acc.setAttribute("data-open",String(!open)); btn.setAttribute("aria-expanded",String(!open));
    panel.style.maxHeight=open?"0px":(inner.scrollHeight+4)+"px";
  });
  acc.appendChild(btn); acc.appendChild(panel);
  return acc;
}

function renderOrientation(){
  var main=document.getElementById("main"); main.innerHTML="";
  // centered intro
  var intro=el("div","card");
  intro.innerHTML='<div class="center-intro">'+CHAT+'<span class="big">MI Practice Coach</span>Select the practice partner on the left to begin. Before your first session, review the MITI framework below to understand the skills you\'ll practice.</div>';
  main.appendChild(intro);
  // MITI explainer
  var mc=el("div","card");
  mc.appendChild(el("div","sec-h",BOOK+"<span>MITI Behavior Categories</span>"));
  mc.appendChild(el("p","sec-sub",esc(MITI.intro)));
  MITI.categories.forEach(function(c){ mc.appendChild(accordion(c.name,c.tag,c.body,c.example)); });
  mc.appendChild(el("p","note-line",esc(MITI.oarsNote)));
  main.appendChild(mc);
  // sample transcript
  var sc=el("div","card");
  sc.appendChild(el("div","sec-h",'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 5.5h16v10H9l-4 3.5v-3.5H4z" stroke="#8a6d2f" stroke-width="1.5" stroke-linejoin="round"/></svg><span>Sample Session Transcript</span>'));
  sc.appendChild(el("p","sec-sub",esc(SAMPLE.intro)));
  var chat=el("div","chat");
  SAMPLE.turns.forEach(function(t){
    var row=el("div","row "+(t.who==="clinician"?"cl":"pt"));
    var av=el("div","av"); av.innerHTML=t.who==="clinician"?CLIN_AV:USER_AV;
    var stk=el("div","stk");
    stk.appendChild(el("div","who",t.who==="clinician"?"Clinician":"Client"));
    stk.appendChild(el("div","bub",esc(t.text)));
    if(t.tags&&t.tags.length){ var tgs=el("div","tgs"); t.tags.forEach(function(g){ tgs.appendChild(el("span","tg2",esc(g))); }); stk.appendChild(tgs); }
    row.appendChild(av); row.appendChild(stk); chat.appendChild(row);
  });
  sc.appendChild(chat);
  var nt=el("div","notice"); nt.appendChild(el("h4",null,"What to notice"));
  var ul=el("ul"); SAMPLE.notice.forEach(function(n){ ul.appendChild(el("li",null,esc(n))); }); nt.appendChild(ul);
  sc.appendChild(nt);
  main.appendChild(sc);
}

function renderPractice(){
  var main=document.getElementById("main"); main.innerHTML="";
  var m=PRACTICE.modes[mode];
  var items=m.items;
  var card=el("div","card");
  card.appendChild(el("div","sec-h",'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 5.5h16v10H9l-4 3.5v-3.5H4z" stroke="#8a6d2f" stroke-width="1.5" stroke-linejoin="round"/></svg><span>'+esc(ROSTER.active.name)+' — '+esc(m.label)+'</span>'));
  card.appendChild(el("p","sec-sub",esc(PRACTICE.scenarioIntro)));
  card.appendChild(el("div","do","<b>This mode:</b> "+esc(m.blurb)));
  card.appendChild(el("p","prog","Turn "+(pIdx+1)+" of "+items.length));

  var it=items[pIdx];
  var ft=el("div","friend-turn");
  var av=el("div","av"); av.innerHTML=USER_AV; ft.appendChild(av);
  var fb=el("div"); fb.innerHTML='<div class="who" style="margin-bottom:4px">'+esc(ROSTER.active.name)+'</div><div class="fb">'+esc(it.friend)+'</div>';
  ft.appendChild(fb); card.appendChild(ft);

  var key=mode+":"+pIdx;
  var st=answers[key]||(answers[key]={text:"",revealed:false});
  var ta=el("textarea","resp-ta"+(st.revealed?" locked":""));
  ta.placeholder="Write how you'd respond to "+ROSTER.active.name+"...";
  ta.value=st.text; if(st.revealed) ta.readOnly=true;
  card.appendChild(ta);

  if(!st.revealed){
    var pr=el("div","prow");
    var sub=el("button","btn","Reveal model response");
    sub.disabled=st.text.trim().length===0;
    ta.addEventListener("input",function(){ st.text=ta.value; sub.disabled=ta.value.trim().length===0; });
    sub.addEventListener("click",function(){ st.revealed=true; renderPractice(); });
    pr.appendChild(sub); card.appendChild(pr);
  } else {
    if(st.text.trim()){ var yr=el("div","yourresp"); yr.innerHTML='<div class="lab">Your response</div>'+esc(st.text); card.appendChild(yr); }
    var mo=el("div","model");
    mo.innerHTML='<div class="lab">Model response</div>'+esc(it.model)+
      '<div class="skill"><b>Skill:</b> '+esc(it.skill)+'</div>'+
      '<div class="skill"><b>Why it works:</b> '+esc(it.why)+'</div>';
    card.appendChild(mo);
    card.appendChild(el("p","selfnote","Compare your response with the model — there's no single right answer. A strong reflection captures the meaning underneath what "+ROSTER.active.name+" said and hands the conversation back, rather than advising or fixing."));
    var pr2=el("div","prow");
    if(pIdx>0){ var pv=el("button","btn secondary","Previous"); pv.addEventListener("click",function(){ pIdx--; renderPractice(); }); pr2.appendChild(pv); }
    if(pIdx<items.length-1){ var nx=el("button","btn","Next turn"); nx.addEventListener("click",function(){ pIdx++; renderPractice(); }); pr2.appendChild(nx); }
    card.appendChild(pr2);
    if(pIdx===items.length-1){
      card.appendChild(el("div","done-banner","<b>You've completed "+esc(m.label)+".</b> Try another practice mode on the left, or switch back to the orientation by reviewing the MITI framework. Remember: the goal is reflective listening that opens the conversation, not advice."));
    }
  }
  main.appendChild(card);

  // keep the MITI framework available below practice, collapsed by default
  var ref=el("div","card");
  ref.appendChild(el("div","sec-h",BOOK+"<span>MITI Framework (reference)</span>"));
  MITI.categories.forEach(function(c){ ref.appendChild(accordion(c.name,c.tag,c.body,c.example)); });
  main.appendChild(ref);
}

function renderMain(){ if(selected) renderPractice(); else renderOrientation(); }

renderModes(); renderRoster(); renderMain();
</script>
</body>
</html>
